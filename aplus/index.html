 {q:"A traveler needs to get a laptop online using their phone's cellular plan over Wi-Fi. What feature is this?",o:["Tethering","Hotspot","Airplane mode","NFC"],a:1,e:"A mobile hotspot shares cellular data over Wi-Fi. Tethering does it over USB or Bluetooth."},
 {q:"Which feature shares a phone's cellular connection with a laptop over a USB cable?",o:["Hotspot","Tethering","eSIM","Location services"],a:1,e:"Tethering uses a cable or Bluetooth. A hotspot uses Wi-Fi."},
 {q:"An employee wants a personal and a business phone number on one phone without a second physical card. What allows this?",o:["eSIM","IMEI","NFC","MAM"],a:0,e:"An eSIM can hold multiple carrier profiles alongside or instead of a physical SIM."},
 {q:"Which number identifies the phone hardware itself, even if the SIM is changed?",o:["IMSI","IMEI","ICCID","MAC"],a:1,e:"The IMEI identifies the device. The IMSI on the SIM identifies the subscriber."},
 {q:"A flight attendant asks passengers to disable all wireless radios at once. Which setting does that?",o:["Do Not Disturb","Airplane mode","Battery saver","Location off"],a:1,e:"Airplane mode turns off cellular, Wi-Fi and Bluetooth together (Wi-Fi and Bluetooth can be re-enabled)."},
 {q:"A company wants to push Wi-Fi settings, require passcodes and remotely wipe company phones. What should it use?",o:["MAM","MDM","VPN","SSO"],a:1,e:"Mobile device management controls the whole device, including policies and remote wipe."},
 {q:"Staff use personal phones and object to the company controlling their whole device. What fits best?",o:["MDM with full wipe","MAM","Disable BYOD","Airplane mode"],a:1,e:"MAM manages only corporate apps and data, so a wipe removes company data and leaves personal data alone."},
 {q:"A user's company phone was stolen. What should IT do immediately?",o:["Change the SSID","Remote wipe it through MDM","Disable Bluetooth","Order a new SIM only"],a:1,e:"A remote wipe protects company data on the stolen device."},
 {q:"Which information is needed to set up corporate email manually on a phone?",o:["IMEI and IMSI","Server address, port and security type","MAC address and SSID","GPS coordinates"],a:1,e:"Manual setup needs the mail server, port, SSL/TLS setting and the user's credentials."},
 {q:"A user's contacts and calendar on a new phone should match their Microsoft 365 account. What should be configured?",o:["Bluetooth sync","The work account (Exchange ActiveSync)","NFC","A hotspot"],a:1,e:"Adding the Microsoft 365 work account syncs email, contacts and calendar."},
 {q:"A delivery app shows the driver's location accurately on the highway but poorly inside a warehouse. Why?",o:["GPS needs a clear view of satellites","Bluetooth is off","The phone has no eSIM","NFC is disabled"],a:0,e:"GPS works best outdoors. Indoors, phones rely on less precise Wi-Fi and cell location."},
 {q:"After entering a password, a user must also enter a code from an app on their phone. What is this?",o:["Single sign-on","Two-factor authentication","Biometrics","MAM"],a:1,e:"Something you know (password) plus something you have (phone app) is two-factor authentication."},
 {q:"Which is a biometric authentication method on a laptop?",o:["PIN","Smart card","Fingerprint reader","Cable lock"],a:2,e:"Fingerprint and facial recognition are biometric factors."},
 {q:"What is typically the maximum range of NFC?",o:["About 4 cm","About 1 m","About 10 m","About 100 m"],a:0,e:"NFC works at a few centimeters, which helps prevent accidental or remote reads."},
 {q:"Which component in a laptop display assembly is usually in the top bezel?",o:["Inverter","Webcam and microphone","Hard drive","Battery"],a:1,e:"The webcam and microphones sit in the top bezel, with the Wi-Fi antennas."},
 {q:"A laptop owner wants to add a second internal SSD. The board has an empty M.2 slot. What else should be checked?",o:["Whether the slot supports NVMe or SATA","The inverter voltage","The SIM type","The display panel type"],a:0,e:"M.2 slots can support NVMe, SATA or both. The drive must match the slot."},
 {q:"A thin laptop has 8 GB of RAM and the user wants 16 GB. There are no SODIMM slots. What is the likely reason?",o:["The RAM is soldered to the motherboard","The BIOS is locked","The battery is too small","It uses DDR2"],a:0,e:"Many thin laptops solder RAM to the board, so it can't be upgraded."},
 {q:"Which accessory lets a user write notes directly on a tablet screen?",o:["Trackpad","Stylus","Webcam","Port replicator"],a:1,e:"A stylus (touch pen) works with the digitizer for handwriting and drawing."},

 {q:"A Bluetooth mouse disconnects often when the user is across the room. What is the most likely cause?",o:["It's beyond the typical 10 m range or blocked","NFC is off","The eSIM is inactive","The digitizer needs calibration"],a:0,e:"Common Bluetooth devices reach about 10 m, and walls or bodies shorten that."},
 {q:"Why do technicians organize laptop screws by location during disassembly?",o:["Screws are magnetic","Screws come in different lengths, and the wrong one can damage parts","It speeds up the CPU","CompTIA requires color coding"],a:1,e:"A long screw in a short hole can puncture the board or battery."},
 {q:"Which MDM policy protects data if a phone is lost and someone removes its storage?",o:["Require device encryption","Enable Bluetooth","Allow unknown apps","Disable updates"],a:0,e:"Encryption makes stored data unreadable without the passcode or key."},
 {q:"Which should be disabled on a company phone to block apps from outside the official store?",o:["Location services","Install from unknown sources","Airplane mode","NFC"],a:1,e:"Blocking unknown sources (sideloading) keeps out unvetted, possibly malicious apps."},
 {q:"A user's phone runs out of storage. Which setting moves photos off the device but keeps them available?",o:["Factory reset","Cloud photo sync with optimize storage","Airplane mode","Clearing the IMEI"],a:1,e:"Cloud sync stores originals online and keeps smaller copies on the phone."}
];

registerModule({
  id:"mob",slug:"mobile-devices",title:"Mobile Devices",
  lessons:LESSONS,
  decks:[["laptop","Laptops"],["display","Displays"],["ports","Ports and wireless"],["connect","Connectivity and MDM"]],
  cards:CARDS,quiz:QUIZ,
  vizKeys:["teardown","display","mports","range","viz-pair","viz-mdm"],
  viz(){
/* ---- Laptop teardown ---- */
(function(){
  const el=$("#viz-teardown");if(!el)return;
  const P=[
    ["bat",40,150,245,90,"Battery","Internal lithium-ion battery","<b>Battery.</b> Disconnect its cable from the board before touching anything else. Replace it if it swells or holds little charge."],
    ["ram",300,40,130,44,"SODIMM RAM","Upgradable","<b>SODIMM slot.</b> Laptop RAM. Release the side clips and the stick pops up at an angle. Thin laptops often solder RAM instead."],
    ["ssd",300,96,130,26,"M.2 SSD","NVMe or SATA","<b>M.2 SSD.</b> Held by one small screw at the end. Check whether the slot supports NVMe, SATA or both."],
    ["wifi",445,40,100,44,"Wi-Fi card","Two antenna leads","<b>Wi-Fi card.</b> An M.2 card with two tiny antenna leads (often black and white) that run up into the display. Note which goes where."],
    ["fan",40,40,120,90,"Fan and heat sink","Cooling","<b>Fan and heat pipe.</b> Moves heat from the CPU and GPU out of the vents. Clean dust out with compressed air. Replace paste when the heat sink is removed."],
    ["cpu",175,40,110,90,"CPU and GPU","Soldered","<b>CPU and GPU.</b> Almost always soldered (BGA) in laptops, so they can't be swapped. Overheating shows up as fan noise and throttling."],
    ["cmos",445,96,100,40,"CMOS battery","Coin cell","<b>CMOS/RTC battery.</b> Keeps the clock and firmware settings. Sometimes a coin cell on a short cable."],
    ["spk",300,150,245,40,"Speakers","Bottom corners","<b>Speakers.</b> Usually in the bottom corners, connected by a small cable."],
    ["kb",300,205,245,35,"Keyboard ribbon","Top case","<b>Keyboard and touchpad.</b> Connect with flat ribbon cables. Lift the connector latch before pulling a ribbon out."]
  ];
  const seen=new Set();
  el.innerHTML=`<div class="viz-title">Take the bottom cover off a laptop</div>
  <div class="viz-scroll"><svg viewBox="0 0 585 280" style="min-width:440px" role="group" aria-label="Inside a laptop">
    <rect x="20" y="20" width="545" height="240" rx="18" class="lt-case"/>
    ${P.map(([id,x,y,w,h,name,sub])=>`<g class="m-node mb" data-c="${id}" tabindex="0" role="button" aria-label="${name}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5"/><text x="${x+w/2}" y="${y+h/2+(h>34?-2:4)}" text-anchor="middle" class="s-b" style="font-size:12px">${name}</text>${h>34?`<text x="${x+w/2}" y="${y+h/2+13}" text-anchor="middle" class="s-small" style="font-size:10px">${sub}</text>`:""}</g>`).join("")}
  </svg></div>
  <div class="caption" aria-live="polite">Click each part. Find all ${P.length} to complete this diagram.</div>
  <div class="viz-controls"><span class="grow">0 of ${P.length} found</span></div>`;
  const svg=$("svg",el);
  const pick=id=>{const p=P.find(x=>x[0]===id);seen.add(id);svg.querySelectorAll(".mb").forEach(g=>g.classList.toggle("sel",g.dataset.c===id));svg.querySelector(`[data-c="${id}"]`).classList.add("on");
    $(".caption",el).innerHTML=p[7];$(".grow",el).textContent=`${seen.size} of ${P.length} found`;if(seen.size===P.length)award("viz:teardown",30,"Explored a laptop teardown")};
  svg.addEventListener("click",e=>{const g=e.target.closest("[data-c]");if(g)pick(g.dataset.c)});
  svg.addEventListener("keydown",e=>{const g=e.target.closest("[data-c]");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();pick(g.dataset.c)}});
})();

/* ---- Display technology layers ---- */
(function(){
  const el=$("#viz-display");if(!el)return;
  const T={
    lcd:{name:"LCD (IPS, TN, VA)",layers:[["Glass and touch digitizer","#7d8bb0"],["Color filter","#a495ff"],["Liquid crystal","#56e0ff"],["Polarizer","#8f9bbb"],["LED backlight (always on)","#ffd27a"]],black:"gray",
      note:"A white LED backlight shines through liquid crystals that twist to block or pass light. Black pixels still leak a little backlight, so blacks look dark gray. <b>IPS</b> has the best color and angles, <b>TN</b> is fastest and cheapest, and <b>VA</b> has the best contrast."},
    mini:{name:"Mini-LED",layers:[["Glass and touch digitizer","#7d8bb0"],["Color filter","#a495ff"],["Liquid crystal","#56e0ff"],["Polarizer","#8f9bbb"],["Thousands of dimming zones","#ffd27a"]],black:"zones",
      note:"Still an LCD, but the backlight is split into thousands of zones that dim separately. Blacks get much deeper, with slight glow (blooming) around bright objects."},
    oled:{name:"OLED",layers:[["Glass and touch digitizer","#7d8bb0"],["Encapsulation","#8f9bbb"],["Self-lit organic pixels","#5fe3a1"],["Substrate","#4a5675"]],black:"off",
      note:"No backlight at all: each pixel makes its own light and turns fully off for black. Thin, true blacks and great contrast, but static images can cause <b>burn-in</b>."}
  };
  const seen=new Set();let cur="lcd";
  el.innerHTML=`<div class="viz-title">Compare display technologies layer by layer</div>
  <div class="viz-controls">${Object.entries(T).map(([k,t])=>`<button class="chip" data-t="${k}">${t.name}</button>`).join("")}</div>
  <div class="disp"><div class="disp-stack"></div><div class="disp-demo"><div class="disp-screen"><span class="moon"></span></div><em>A white moon on a black sky</em></div></div>
  <div class="caption" aria-live="polite"></div>`;
  function draw(){
    const t=T[cur];seen.add(cur);
    el.querySelectorAll("[data-t]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===cur));
    $(".disp-stack",el).innerHTML=t.layers.map(([n,c],i)=>`<div class="layer" style="--c:${c};--i:${i}"><span>${n}</span></div>`).join("");
    $(".disp-screen",el).className="disp-screen black-"+t.black;
    $(".caption",el).innerHTML=t.note;
    if(seen.size===3)award("viz:display",20,"Compared display technologies");
  }
  el.addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(b){cur=b.dataset.t;draw()}});
  draw();
})();

/* ---- Mobile connectors ---- */
(function(){
  const el=$("#viz-mports");if(!el)return;
  const P=[
    ["usbc","USB-C",(x,y)=>`<rect x="${x}" y="${y}" width="70" height="26" rx="13" class="pt-body"/><rect x="${x+14}" y="${y+10}" width="42" height="6" rx="3" class="pt-in"/>`,"<b>USB-C.</b> Oval and reversible. The standard on new phones (including iPhone since the iPhone 15), tablets and laptops. Carries data, video and fast charging."],
    ["light","Lightning",(x,y)=>`<rect x="${x}" y="${y}" width="56" height="20" rx="10" class="pt-body"/><rect x="${x+8}" y="${y+7}" width="40" height="6" rx="3" class="pt-in"/>`,"<b>Lightning.</b> Apple's older 8-pin reversible connector, on iPhones up to the iPhone 14 and older iPads."],
    ["micro","Micro-USB",(x,y)=>`<polygon points="${x},${y} ${x+60},${y} ${x+52},${y+18} ${x+8},${y+18}" class="pt-body"/><rect x="${x+12}" y="${y+6}" width="36" height="5" class="pt-in"/>`,"<b>Micro-USB.</b> A small trapezoid that only fits one way. Common on older Android phones and cheap accessories."],
    ["mini","Mini-USB",(x,y)=>`<polygon points="${x},${y} ${x+56},${y} ${x+56},${y+14} ${x+48},${y+24} ${x+8},${y+24} ${x},${y+14}" class="pt-body"/><rect x="${x+10}" y="${y+8}" width="36" height="6" class="pt-in"/>`,"<b>Mini-USB.</b> Older and chunkier than micro-USB. Found on old cameras, GPS units and game controllers."]
  ];
  const seen=new Set();
  el.innerHTML=`<div class="viz-title">Name that mobile connector</div>
  <div class="viz-scroll"><svg viewBox="0 0 440 90" style="min-width:380px" role="group" aria-label="Mobile connectors">
    ${P.map(([id,n,d],i)=>`<g class="pt" data-p="${id}" tabindex="0" role="button" aria-label="${n}">${d(20+i*108,24)}<rect x="${14+i*108}" y="16" width="${id==="usbc"?82:70}" height="44" rx="6" class="pt-hit"/><text x="${50+i*108}" y="80" text-anchor="middle" class="s-small">${n}</text></g>`).join("")}
  </svg></div>
  <div class="caption" aria-live="polite">Click each connector to learn where you'll see it.</div>`;
  const svg=$("svg",el);
  const pick=id=>{const p=P.find(x=>x[0]===id);seen.add(id);svg.querySelectorAll(".pt").forEach(g=>g.classList.toggle("sel",g.dataset.p===id));svg.querySelector(`[data-p="${id}"]`).classList.add("seen");$(".caption",el).innerHTML=p[3];if(seen.size===P.length)award("viz:mports",20,"Identified every mobile connector")};
  svg.addEventListener("click",e=>{const g=e.target.closest("[data-p]");if(g)pick(g.dataset.p)});
  svg.addEventListener("keydown",e=>{const g=e.target.closest("[data-p]");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();pick(g.dataset.p)}});
})();

/* ---- Wireless range ruler ---- */
(function(){
  const el=$("#viz-range");if(!el)return;
  /* log scale from 1 cm to 10 km */
  const TECH=[["NFC",0.04,"Tap to pay, badge readers, quick pairing"],["Bluetooth",10,"Headsets, mice, watches"],["Wi-Fi",50,"Typical indoor range from one access point"],["Cellular (4G/5G)",5000,"Kilometers from a tower"]];
  const toX=m=>40+(Math.log10(m)+2)/6*560,fromV=v=>Math.pow(10,v/100*6-2);
  el.innerHTML=`<div class="viz-title">How far does each wireless technology reach?</div>
  <div class="viz-scroll"><svg viewBox="0 0 640 190" style="min-width:460px" role="img" aria-label="Wireless range chart, log scale"></svg></div>
  <label class="rf"><span>Distance between devices</span><input type="range" id="range-d" min="0" max="100" value="45" aria-label="Distance"></label>
  <div class="caption" aria-live="polite"></div>`;
  const svg=$("svg",el),r=$("#range-d",el);
  function fmtM(m){return m<1?Math.round(m*100)+" cm":m<1000?(m<10?m.toFixed(1):Math.round(m))+" m":(m/1000).toFixed(1)+" km"}
  function draw(){
    const d=fromV(+r.value);
    let s=TECH.map(([n,max],i)=>{const y=24+i*32,ok=d<=max;return `<rect x="40" y="${y}" width="${toX(max)-40}" height="20" rx="10" class="rg-bar${ok?" ok":""}"/><text x="48" y="${y+14}" style="font-size:12px" class="s-b">${n}</text><text x="${toX(max)+6}" y="${y+14}" class="s-small">${fmtM(max)}</text>`}).join("");
    [0.01,0.1,1,10,100,1000,10000].forEach(m=>{s+=`<line x1="${toX(m)}" y1="152" x2="${toX(m)}" y2="158" class="ch-axis"/><text x="${toX(m)}" y="172" text-anchor="middle" class="s-small">${fmtM(m)}</text>`});
    s+=`<line x1="40" y1="152" x2="600" y2="152" class="ch-axis"/><line x1="${toX(d)}" y1="16" x2="${toX(d)}" y2="152" class="rg-mark"/><text x="${toX(d)}" y="12" text-anchor="middle" class="s-b" style="font-size:12px">${fmtM(d)}</text>`;
    svg.innerHTML=s;
    const works=TECH.filter(t=>d<=t[1]).map(t=>t[0]);
    $(".caption",el).innerHTML=`At <b>${fmtM(d)}</b>: ${works.length?works.join(", ")+" can connect.":"none of these reach that far."} ${d<=0.04?"Close enough to tap.":d<=10?"Same room.":d<=50?"Same floor.":"Different building or across town."} <span class="s-note">Log scale. Real ranges vary with walls and interference.</span>`;
  }
  r.addEventListener("input",()=>{draw();award("viz:range",20,"Explored wireless ranges")});draw();
})();

  },

      success:"The laptop boots with the new drive and nothing was damaged or lost."},
    {id:"needs",type:"match",title:"Match the technology to the need",

      items:[["NFC","pay"],["Bluetooth","buds"],["Hotspot","share"],["Docking station","desk"],["eSIM","lines"],["MDM","wipe"],["Stylus","notes"],["GPS","nav"]],
      slots:[["pay","Pay at checkout","Tap the phone on a reader"],["buds","Wireless earbuds","Audio within a few meters"],["share","Laptop online in a taxi","Share cellular data over Wi-Fi"],["desk","One-cable desk setup","Power, monitors, network, USB"],["lines","Work and personal numbers","Two lines, one physical phone"],["wipe","Erase if stolen","Company-controlled policies"],["notes","Handwritten notes","Write on the tablet screen"],["nav","Turn-by-turn directions","Satellite positioning"]],
      success:"The rep is connected everywhere they go."},
    {id:"corp",title:"Set up a corporate smartphone",mount(el,api,sim){
      const F={lock:"Swipe",encrypt:false,mdm:false,acct:"IMAP",server:"",mfa:false,unknown:true,update:false};let R={...F},graded=null;
      const CHECKS=[
        ["Screen lock is a 6+ digit PIN with biometrics",()=>R.lock==="PIN6bio","Company policy requires a strong lock. Swipe and 4-digit PINs are too easy to bypass."],
        ["Device encryption is on",()=>R.encrypt,"Encryption keeps data unreadable if the phone is lost."],

      function draw(){

        <div class="scenario"><p>A new hire's company phone just arrived. Company policy says:</p>

        <div class="router"><div class="router-bar"><span>Settings</span><span class="mono">Phone · Android</span></div><div class="router-body">
          <label class="rf"><span>Screen lock</span><select id="c-lock" data-f="lock">${[["Swipe","Swipe"],["PIN4","4-digit PIN"],["PIN6bio","6-digit PIN + fingerprint"],["Pattern","Pattern"]].map(([v,l])=>`<option value="${v}" ${R.lock===v?"selected":""}>${l}</option>`).join("")}</select></label>

        <div class="caption" aria-live="polite">${graded?(graded.every(Boolean)?`<span class="status-good">All ${CHECKS.length} requirements met.</span> The phone is ready for the new hire.`:`<b>${graded.filter(Boolean).length} of ${CHECKS.length}</b> requirements met. Fix the ones marked ✗ and check again.`):"Changes save as you go. Press <b>Check setup</b> when you're done."}</div>

const LESSONS=[
{id:"ports",num:"2.1",title:"TCP and UDP ports and protocols",html:`
<p><b>TCP</b> is connection-oriented: it sets up a session with a three-way handshake (SYN, SYN-ACK, ACK), numbers every segment and resends anything lost. <b>UDP</b> is connectionless: it just sends, with no guarantee of delivery, which makes it faster for things like DNS lookups, streaming and VoIP.</p>
<div class="viz" id="viz-tcp"></div>
<p>A port number tells the receiving computer which service should get the traffic. Expect several exam questions that name a port and ask for the protocol, or the reverse.</p>
<div class="scroll"><table><thead><tr><th>Port</th><th>Protocol</th><th>Uses</th><th>What it does</th></tr></thead><tbody>${portRows}</tbody></table></div>
<div class="tip"><b>Memory trick.</b> Secure versions sit higher: HTTP 80 becomes HTTPS 443, Telnet 23 is replaced by SSH 22, and RDP 3389 is the only common port above 1023 you need here.</div>`},
{id:"wireless",num:"2.2",title:"Wireless networking technologies",html:`
<p>Wi-Fi standards come from IEEE 802.11. Newer generations add speed, bands and better handling of crowded networks.</p>
<div class="scroll"><table><thead><tr><th>Standard</th><th>Name</th><th>Bands</th><th>Notes</th></tr></thead><tbody>
<tr><td class="port">802.11a</td><td>—</td><td>5 GHz</td><td>Up to 54 Mbps</td></tr>
<tr><td class="port">802.11b</td><td>—</td><td>2.4 GHz</td><td>Up to 11 Mbps</td></tr>
<tr><td class="port">802.11g</td><td>—</td><td>2.4 GHz</td><td>Up to 54 Mbps</td></tr>
<tr><td class="port">802.11n</td><td>Wi-Fi 4</td><td>2.4 / 5 GHz</td><td>Introduced MIMO (multiple antennas)</td></tr>
<tr><td class="port">802.11ac</td><td>Wi-Fi 5</td><td>5 GHz</td><td>MU-MIMO for downloads, wider channels</td></tr>
<tr><td class="port">802.11ax</td><td>Wi-Fi 6 / 6E</td><td>2.4 / 5 GHz (6E adds 6 GHz)</td><td>OFDMA, better in crowded spaces</td></tr>
<tr><td class="port">802.11be</td><td>Wi-Fi 7</td><td>2.4 / 5 / 6 GHz</td><td>Multi-link operation, 320 MHz channels</td></tr>
</tbody></table></div>
<h3>Bands and channels</h3>
<ul><li><b>2.4 GHz</b> reaches farther and passes through walls better, but is crowded. Only channels <b>1, 6 and 11</b> don't overlap (in the US).</li>
<li><b>5 GHz and 6 GHz</b> are faster with many more channels, but have shorter range.</li></ul>
<div class="viz" id="viz-chan"></div>
<h3>Short-range wireless</h3>
<ul><li><b>Bluetooth</b>: personal area network for headsets, keyboards and phones. Devices pair first.</li>
<li><b>NFC</b>: a few centimeters. Tap-to-pay and quick pairing.</li>
<li><b>RFID</b>: tags read by a scanner, used for badges and inventory.</li></ul>`},
{id:"services",num:"2.3",title:"Services hosted on a network",html:`
<p>Servers and appliances provide services to clients. Know what each one is for.</p>
<ul>
<li><b>DNS server</b>: turns names like comptia.org into IP addresses.</li>
<li><b>DHCP server</b>: automatically assigns IP address, subnet mask, gateway and DNS server.</li>
<li><b>File share and print servers</b>: central storage and shared printers.</li>
<li><b>Mail server</b>: sends and stores email (SMTP, IMAP, POP3).</li>
<li><b>Syslog server</b>: collects logs from many devices in one place.</li>
<li><b>Web server</b>: hosts websites over HTTP and HTTPS.</li>
<li><b>AAA (authentication, authorization, accounting)</b>: confirms who you are, what you may do, and records what you did. RADIUS and TACACS+ are common.</li>
<li><b>Proxy server</b>: makes requests on behalf of clients, which allows caching and content filtering.</li>
<li><b>Load balancer</b>: spreads traffic across several servers.</li>
<li><b>Spam gateway</b> and <b>UTM (unified threat management)</b>: filter email, or combine firewall, antivirus and intrusion prevention in one box.</li>
<li><b>Legacy and embedded systems</b> (such as SCADA controlling industrial equipment) and <b>IoT devices</b> (cameras, thermostats) often can't be patched easily, so they are isolated on their own network segment.</li>
</ul>`},
{id:"dnsdhcp",num:"2.4",title:"DNS records and DHCP concepts",html:`
<h3>Common DNS records</h3>
<div class="scroll"><table><thead><tr><th>Record</th><th>Purpose</th></tr></thead><tbody>
<tr><td class="port">A</td><td>Name to IPv4 address</td></tr>
<tr><td class="port">AAAA</td><td>Name to IPv6 address</td></tr>
<tr><td class="port">CNAME</td><td>An alias that points one name at another name</td></tr>
<tr><td class="port">MX</td><td>Which server receives email for the domain</td></tr>
<tr><td class="port">TXT</td><td>Free text, used for email security: SPF (allowed senders), DKIM (signing key) and DMARC (what to do with failures)</td></tr>
</tbody></table></div>
<h3>How DHCP works: DORA</h3>
<ol><li><b>Discover</b>: the client broadcasts, looking for a DHCP server.</li>
<li><b>Offer</b>: a server offers an address.</li>
<li><b>Request</b>: the client asks to use that address.</li>
<li><b>Acknowledge</b>: the server confirms, and the lease begins.</li></ol>
<div class="viz" id="viz-dora"></div>
<h3>DHCP terms</h3>
<ul><li><b>Scope</b>: the range of addresses the server can hand out.</li>
<li><b>Lease</b>: how long a client may keep its address before renewing.</li>
<li><b>Reservation</b>: always give the same address to a specific MAC address (good for printers).</li>
<li><b>Exclusion</b>: addresses inside the scope that are never handed out, often kept for static devices.</li></ul>
<div class="tip"><b>Exam favorite.</b> A computer with a 169.254.x.x address could not reach a DHCP server and gave itself an APIPA address. Check the cable, the Wi-Fi connection, or the DHCP server.</div>
<h3>VLANs and VPNs</h3>
<p>A <b>VLAN</b> splits one physical switch into separate logical networks, for example keeping guest or IoT traffic apart from office PCs. A <b>VPN</b> creates an encrypted tunnel across the internet so a remote user can reach the office network safely.</p>`},
{id:"hardware",num:"2.5",title:"Networking hardware",html:`
<div class="viz" id="viz-map"></div>
<ul>
<li><b>Router</b>: connects different networks and forwards traffic between them using IP addresses. Your home router links your LAN to the internet.</li>
<li><b>Switch</b>: connects devices inside one network and forwards frames using MAC addresses. <b>Unmanaged</b> switches are plug-and-play. <b>Managed</b> switches can be configured with VLANs, port settings and monitoring.</li>
<li><b>Access point</b>: lets wireless devices join a wired network.</li>
<li><b>Patch panel</b>: a panel of ports where wall cabling terminates, so connections can be changed with short patch cables.</li>
<li><b>Firewall</b>: allows or blocks traffic based on rules.</li>
<li><b>Cable modem, DSL modem and ONT</b>: the box that connects to your provider's cable, phone line or fiber (ONT is for fiber).</li>
<li><b>NIC</b>: network interface card, the port in the computer itself.</li>
<li><b>SDN (software-defined networking)</b>: network devices controlled centrally by software instead of one at a time.</li>
</ul>
<h3>Power over Ethernet</h3>
<p>PoE sends power over the network cable to devices like phones, cameras and access points. A <b>PoE switch</b> provides it on its ports, and a <b>PoE injector</b> adds it to a single cable.</p>
<div class="scroll"><table><thead><tr><th>Standard</th><th>Name</th><th>Max power per port</th></tr></thead><tbody>
<tr><td class="port">802.3af</td><td>PoE</td><td>15.4 W</td></tr>
<tr><td class="port">802.3at</td><td>PoE+</td><td>30 W</td></tr>
<tr><td class="port">802.3bt</td><td>PoE++</td><td>60 W (Type 3) or 100 W (Type 4)</td></tr>
</tbody></table></div>`},
{id:"soho",num:"2.6",title:"Configuring a small office or home network",html:`
<p>Every device needs four settings to talk on the network and reach the internet: an <b>IP address</b>, a <b>subnet mask</b>, a <b>default gateway</b> (the router) and a <b>DNS server</b>. They can be set by hand (static) or received from DHCP (dynamic).</p>
<h3>Private IPv4 ranges</h3>
<p>These addresses are used inside networks and are not routed on the internet. The router uses NAT to share one public address.</p>
<div class="scroll"><table><thead><tr><th>Range</th><th>CIDR</th></tr></thead><tbody>
<tr><td class="port">10.0.0.0 – 10.255.255.255</td><td class="mono">10.0.0.0/8</td></tr>
<tr><td class="port">172.16.0.0 – 172.31.255.255</td><td class="mono">172.16.0.0/12</td></tr>
<tr><td class="port">192.168.0.0 – 192.168.255.255</td><td class="mono">192.168.0.0/16</td></tr>
</tbody></table></div>
<h3>IPv6 in brief</h3>
<p>IPv6 addresses are 128 bits written in hexadecimal, like <code>2001:db8::1</code>. Leading zeros can be dropped, and one run of all-zero groups can be shortened to <code>::</code>. Addresses starting with <code>fe80</code> are link-local, the IPv6 version of APIPA.</p>
<p>The subnet mask (or CIDR prefix like /24) says how many bits of the address name the network. The rest identify hosts on that network.</p>
<div class="viz" id="viz-subnet"></div>`},
{id:"internet",num:"2.7",title:"Internet connection and network types",html:`
<h3>Connection types</h3>
<ul>
<li><b>Fiber</b>: light over glass. The fastest and most reliable option.</li>
<li><b>Cable</b>: uses the coaxial TV cable. Fast, but bandwidth is shared with neighbors.</li>
<li><b>DSL</b>: uses the telephone line. Speed drops the farther you are from the provider's office.</li>
<li><b>Cellular</b>: 4G or 5G from a phone carrier, sometimes through a hotspot.</li>
<li><b>Satellite</b>: works almost anywhere. Traditional satellites have high latency, while low-orbit services have much less.</li>
<li><b>WISP</b>: wireless internet service provider, using point-to-point radio links, often in rural areas.</li>
</ul>
<h3>Network types by size</h3>
<div class="scroll"><table><thead><tr><th>Type</th><th>Covers</th></tr></thead><tbody>
<tr><td class="port">PAN</td><td>One person's devices, such as Bluetooth</td></tr>
<tr><td class="port">LAN / WLAN</td><td>One building or home, wired or wireless</td></tr>
<tr><td class="port">MAN</td><td>A city or campus</td></tr>
<tr><td class="port">WAN</td><td>Large distances, linking sites. The internet is the largest WAN.</td></tr>
<tr><td class="port">SAN</td><td>A dedicated network for shared storage</td></tr>
</tbody></table></div>`},
{id:"tools",num:"2.8",title:"Networking tools",html:`
<ul>
<li><b>Cable stripper</b>: removes the outer jacket.</li>
<li><b>Crimper</b>: attaches an RJ45 connector to the end of a cable.</li>
<li><b>Punchdown tool</b>: seats wires into a patch panel or keystone jack.</li>
<li><b>Cable tester</b>: checks that each wire connects correctly end to end.</li>
<li><b>Toner probe</b>: one end sends a tone, the probe finds which cable carries it. Used to trace an unlabeled cable.</li>
<li><b>Loopback plug</b>: sends a port's signal back to itself to test the port.</li>
<li><b>Wi-Fi analyzer</b>: shows nearby networks, signal strength and channel use.</li>
<li><b>Network tap</b>: copies traffic from a link so it can be monitored.</li>
</ul>
<h3>T568B wiring order</h3>
<p>Most new installations use T568B. Hold the RJ45 plug with the clip facing away from you and read pins 1 to 8 from left to right.</p>
<div class="viz" id="viz-rj45"></div>
<div class="tip"><b>Remember.</b> T568A swaps the orange and green pairs. A cable with T568A on one end and T568B on the other is a crossover cable.</div>`}
];

/* ---- 3. 2.4 GHz channel overlap ---- */
(function(){
  const el=$("#viz-chan");let picked=[3,5,9];
  const X=f=>30+(f-2399)*(580/76),cf=c=>2407+5*c;
  el.innerHTML=`<div class="viz-title">See why only channels 1, 6 and 11 work together</div>
  <div class="viz-scroll"><svg viewBox="0 0 640 215" style="min-width:420px" role="img" aria-label="2.4 GHz channel overlap chart"></svg></div>
  <div class="chips" role="group" aria-label="Pick up to three channels">${Array.from({length:11},(_,i)=>`<button class="chip" data-c="${i+1}">${i+1}</button>`).join("")}</div>
  <div class="caption" aria-live="polite"></div>
  <div class="viz-controls"><button class="btn primary" data-p="1,6,11">Use 1, 6 and 11</button><button class="btn" data-p="3,5,9">Show a crowded office</button><span class="grow">Pick up to 3 channels</span></div>`;
  const svg=$("svg",el),cap=$(".caption",el);
  function draw(){
    let s="";
    const bad=new Set();const pairs=[];
    for(let i=0;i<picked.length;i++)for(let j=i+1;j<picked.length;j++)if(Math.abs(picked[i]-picked[j])<5){bad.add(i);bad.add(j);pairs.push([picked[i],picked[j]].sort((a,b)=>a-b))}
    picked.forEach((c,i)=>{const x1=X(cf(c)-11),x2=X(cf(c)+11),w=x2-x1;
      s+=`<path class="ch-hump ch-h${i}${bad.has(i)?" ch-bad":""}" d="M${x1},170 C${x1+w*.18},28 ${x2-w*.18},28 ${x2},170 Z"/>
          <text x="${X(cf(c))}" y="62" text-anchor="middle" class="s-b">Ch ${c}</text>`});
    s+=`<line x1="20" y1="170" x2="620" y2="170" class="ch-axis"/>`;
    for(let c=1;c<=11;c++){const x=X(cf(c));s+=`<line x1="${x}" y1="170" x2="${x}" y2="176" class="ch-axis"/><text x="${x}" y="192" text-anchor="middle" style="font-size:12px">${c}</text>`}
    s+=`<text x="320" y="210" text-anchor="middle" class="s-small">Channel (each is 22 MHz wide, but centers are only 5 MHz apart)</text>`;
    svg.innerHTML=s;
    el.querySelectorAll("[data-c]").forEach(b=>b.setAttribute("aria-pressed",picked.includes(+b.dataset.c)));
    cap.innerHTML=!picked.length?"Pick a channel to see how much of the band it covers."
      :pairs.length?`<span class="status-bad">Overlap:</span> ${pairs.map(p=>`channels ${p[0]} and ${p[1]}`).join(", ")}. Overlapping access points interfere with each other, so both slow down. Channels need to be at least 5 apart.`
      :(picked.length===3&&award("viz:chan",20,"Found three clear channels"),`<span class="status-good">No overlap.</span> ${picked.length===3?"These three access points can sit side by side without interfering.":"Add another channel to compare."}`);
  }
  el.addEventListener("click",e=>{
    const c=e.target.closest("[data-c]"),p=e.target.closest("[data-p]");
    if(c){const n=+c.dataset.c;picked=picked.includes(n)?picked.filter(x=>x!==n):[...picked,n].slice(-3);draw()}
    if(p){picked=p.dataset.p.split(",").map(Number);draw()}
  });
  draw();
})();

  const toggle=(id,label)=>`<label class="rf rf-tog"><span>${label}</span><input type="checkbox" id="r-${id}" data-f="${id}" ${R[id]?"checked":""}></label>`;

    if(tab==="wifi")return field("ssid","Network name (SSID)",R.ssid)+`<label class="rf"><span>Security</span><select id="r-sec" data-f="sec">${["Open","WEP","WPA2-Personal","WPA3-Personal"].map(o=>`<option ${R.sec===o?"selected":""}>${o}</option>`).join("")}</select></label>`+toggle("wps","WPS (push-button / PIN)");
    return field("pass","Admin password",R.pass,'type="text"')+toggle("remote","Remote management (WAN access)")+
      `<div class="rf"><span>Firmware</span><div class="fwline"><b class="mono">v${R.fw}</b>${R.fw==="1.0.2"?'<button class="btn" data-a="fw">Install update v1.1.4</button>':'<span class="status-good">Up to date</span>'}</div></div>`;
  }
  function d2(){
    e2.innerHTML=`<div class="sim-head"><span class="sim-tag">Simulation ${sim.n}</span><h2>Set up a dental office router</h2>${api.passed()?'<span class="pill-good">Passed</span>':""}</div>
    <div class="scenario"><p>A small dental office just unboxed a new wireless router. Configure it to meet every requirement:</p>
    <ol><li>The office network is <b>192.168.10.0/24</b>, and the router is <b>.1</b>.</li><li>Staff devices get addresses automatically from <b>.100 to .199</b>.</li><li>The front-desk printer must always be at <b>192.168.10.50</b>.</li><li>Wi-Fi must use the <b>strongest security</b> available.</li><li>Fix the risky settings left over from the factory.</li></ol></div>
    <div class="router">
      <div class="router-bar"><span class="mono">http://${R.lanip}</span><span>Router admin</span></div>
      <div class="router-tabs" role="tablist">${[["lan","LAN"],["dhcp","DHCP"],["wifi","Wireless"],["admin","Administration"]].map(([k,l])=>`<button role="tab" data-t="${k}" aria-selected="${tab===k}">${l}</button>`).join("")}</div>
      <div class="router-body">${panel()}</div>
    </div>
    ${graded?`<div class="grade">${CHECKS.map((c,i)=>`<div class="${graded[i]?"g-ok":"g-no"}"><b>${graded[i]?"✓":"✗"} ${c[0]}</b>${graded[i]?"":`<span>${c[2]}</span>`}</div>`).join("")}</div>`:""}
    <div class="caption" aria-live="polite">${graded?(graded.every(Boolean)?`<span class="status-good">All 8 requirements met.</span> This router is ready for the office.`:`<b>${graded.filter(Boolean).length} of 8</b> requirements met. Fix the ones marked ✗ and check again.`):"Every change saves as you type. Press <b>Check configuration</b> when you're done."}</div>
    <div class="viz-controls"><button class="btn primary" data-a="grade">Check configuration</button><button class="btn" data-a="factory">Factory reset</button></div>`;
  }
  e2.addEventListener("input",e=>{const f=e.target.dataset.f;if(!f)return;R[f]=e.target.type==="checkbox"?e.target.checked:e.target.value;if(f==="lanip")e2.querySelector(".router-bar .mono").textContent="http://"+R.lanip});

    if(a==="grade"){graded=CHECKS.map(c=>c[1]());if(graded.every(Boolean))api.pass();d2()}
  });
  d2();

    }}

<script>
/* ================= Module 3: Hardware (Core 1, 220-1201) ================= */
(function(){
const LESSONS=[
{id:"cables",num:"3.1",title:"Cables and connectors",short:"Cables and connectors",html:`
<p>Most hardware questions start with "which cable or port is this?" Learn each one by its shape, its speed and what it carries.</p>
<div class="viz" id="viz-panel"></div>
<h3>USB versions</h3>
<div class="scroll"><table><thead><tr><th>Version</th><th>Max speed</th><th>Notes</th></tr></thead><tbody>
<tr><td class="port">USB 2.0</td><td>480 Mbps</td><td>Hi-Speed. Usually a black port.</td></tr>
<tr><td class="port">USB 3.2 Gen 1</td><td>5 Gbps</td><td>Formerly USB 3.0. Often a blue port.</td></tr>
<tr><td class="port">USB 3.2 Gen 2</td><td>10 Gbps</td><td>Formerly USB 3.1 Gen 2.</td></tr>
<tr><td class="port">USB 3.2 Gen 2x2</td><td>20 Gbps</td><td>USB-C only.</td></tr>
<tr><td class="port">USB4</td><td>40 Gbps</td><td>USB-C only. Based on Thunderbolt 3.</td></tr>
<tr><td class="port">Thunderbolt 3 / 4</td><td>40 Gbps</td><td>USB-C connector. Carries data, video and power.</td></tr>
</tbody></table></div>
<h3>Video</h3>
<ul><li><b>HDMI</b>: digital video and audio on one cable. TVs, monitors and projectors.</li>
<li><b>DisplayPort</b>: digital video and audio, common on PCs. One corner is cut off. Can daisy-chain monitors.</li>
<li><b>DVI</b>: digital (DVI-D), analog (DVI-A) or both (DVI-I). Video only.</li>
<li><b>VGA</b>: analog, 15 pins in three rows, usually blue. Legacy.</li></ul>
<h3>Network and storage cables</h3>
<div class="scroll"><table><thead><tr><th>Cable</th><th>Speed and distance</th></tr></thead><tbody>
<tr><td class="port">Cat 5e</td><td>1 Gbps up to 100 m</td></tr>
<tr><td class="port">Cat 6</td><td>10 Gbps up to 55 m (1 Gbps at 100 m)</td></tr>
<tr><td class="port">Cat 6a</td><td>10 Gbps up to 100 m</td></tr>
<tr><td class="port">Coaxial (RG-6)</td><td>Cable TV and cable modems. F-type screw-on connector.</td></tr>
<tr><td class="port">Fiber</td><td>Long distance, immune to interference. Connectors: LC (small, square), SC (square, push-pull), ST (round, twist-lock).</td></tr>
<tr><td class="port">SATA</td><td>Internal drives, 6 Gbps. eSATA is the external version.</td></tr>
</tbody></table></div>
<div class="tip"><b>Plenum vs PVC.</b> Plenum-rated cable has a fire-resistant jacket and must be used in air-handling spaces such as drop ceilings. Shielded twisted pair (STP) resists interference near motors and lights.</div>`},
{id:"ram",num:"3.2",title:"RAM types and configurations",short:"RAM",html:`
<p>RAM holds whatever the CPU is working on right now. It is volatile, so its contents disappear when power is lost.</p>
<ul><li><b>DIMM</b> sticks go in desktops. <b>SODIMM</b> sticks are the smaller laptop version.</li>
<li><b>DDR4</b> and <b>DDR5</b> desktop DIMMs both have 288 pins, but the notch is in a different place, so they can't be swapped. Each motherboard supports only one generation.</li>
<li><b>ECC</b> RAM detects and corrects memory errors. Used in servers and needs a board and CPU that support it.</li>
<li><b>Virtual memory</b> is disk space (the page file) used when RAM runs out. It is much slower.</li></ul>
<div class="viz" id="viz-ram"></div>
<div class="tip"><b>Matched pairs.</b> For dual-channel, install identical sticks in matching slots (usually the same color). Mixed sizes or speeds run at the slowest stick's speed.</div>`},
{id:"storage",num:"3.3",title:"Storage devices and RAID",short:"Storage and RAID",html:`
<h3>Drive types</h3>
<ul><li><b>Hard disk drive (HDD)</b>: spinning platters at 5,400, 7,200, 10,000 or 15,000 rpm. Cheap per terabyte, but slow and fragile. Sizes are 3.5 inch (desktop) and 2.5 inch (laptop).</li>
<li><b>SATA SSD</b>: flash memory with no moving parts, limited by the 6 Gbps SATA link.</li>
<li><b>NVMe SSD</b>: flash memory on the PCIe bus, usually in an <b>M.2</b> slot. Several times faster than SATA.</li>
<li><b>M.2</b> is a form factor, not a speed. An M.2 drive can be NVMe (M key) or SATA (B+M key), so check what the slot supports.</li>
<li><b>Removable</b>: USB flash drives, SD and microSD cards, and optical discs (CD 700 MB, DVD 4.7 GB, Blu-ray 25 GB per layer).</li></ul>
<div class="viz" id="viz-race"></div>
<h3>RAID</h3>
<p>RAID combines drives for speed, fault tolerance or both. Fault tolerance is not a backup: deleted or encrypted files are gone from every drive at once.</p>
<div class="viz" id="viz-raid"></div>`},
{id:"board",num:"3.4",title:"Motherboards, CPUs and add-on cards",short:"Motherboards and CPUs",html:`
<div class="viz" id="viz-board"></div>
<h3>Form factors</h3>
<div class="scroll"><table><thead><tr><th>Form factor</th><th>Size</th><th>Typical use</th></tr></thead><tbody>
<tr><td class="port">ATX</td><td>12 × 9.6 in</td><td>Full desktops with many expansion slots</td></tr>
<tr><td class="port">microATX</td><td>9.6 × 9.6 in</td><td>Smaller desktops, fewer slots</td></tr>
<tr><td class="port">Mini-ITX</td><td>6.7 × 6.7 in</td><td>Small form factor PCs, one slot</td></tr>
</tbody></table></div>
<h3>BIOS and UEFI settings</h3>
<ul><li><b>UEFI</b> replaced the legacy BIOS. It supports GPT drives over 2 TB, a mouse-driven interface and <b>Secure Boot</b>, which only loads signed operating systems.</li>
<li><b>TPM</b> (Trusted Platform Module) stores encryption keys in hardware, used by BitLocker and Windows 11.</li>
<li>Other settings: boot order, BIOS passwords, fan curves, enabling virtualization (Intel VT-x or AMD-V), and USB permissions.</li>
<li>A dead <b>CMOS battery</b> (usually a CR2032) makes the clock and settings reset every time the PC is unplugged.</li></ul>
<h3>CPUs and cooling</h3>
<ul><li>x86-64 CPUs (Intel, AMD) run most PCs. <b>ARM</b> CPUs use less power and run phones, tablets and some laptops.</li>
<li>More <b>cores</b> run more tasks at once. Hyperthreading (SMT) lets each core run two threads.</li>
<li>Cooling: a heat sink with <b>thermal paste</b> between it and the CPU, plus fans or liquid cooling. Reapply paste whenever the cooler is removed.</li></ul>
<h3>Expansion cards</h3>
<p>Graphics, sound, network, capture and storage controller cards go in PCIe slots. A graphics card uses an x16 slot. Small cards use x1.</p>`},
{id:"power",num:"3.5",title:"Power supplies",short:"Power supplies",html:`
<p>The power supply unit (PSU) turns wall AC into the DC voltages components use: <b>+3.3 V, +5 V and +12 V</b>. The 12 V rail powers the hungriest parts, the CPU and GPU.</p>
<div class="scroll"><table><thead><tr><th>Connector</th><th>Powers</th></tr></thead><tbody>
<tr><td class="port">24-pin ATX</td><td>The motherboard</td></tr>
<tr><td class="port">4+4 / 8-pin EPS</td><td>The CPU, near the socket</td></tr>
<tr><td class="port">6+2-pin PCIe</td><td>Graphics cards. Newer high-end cards use the 16-pin 12V-2x6 (12VHPWR).</td></tr>
<tr><td class="port">15-pin SATA</td><td>SATA drives (3.3, 5 and 12 V)</td></tr>
<tr><td class="port">4-pin Molex</td><td>Older drives and fans (5 and 12 V)</td></tr>
</tbody></table></div>
<ul><li>Input voltage: 120 V in North America, 230 V in much of the world. Most PSUs switch automatically.</li>
<li><b>Modular</b> PSUs let you attach only the cables you need. <b>Redundant</b> PSUs in servers keep running if one fails.</li>
<li><b>80 Plus</b> ratings (Bronze, Gold, Platinum, Titanium) show efficiency: less power wasted as heat.</li></ul>
<div class="viz" id="viz-psu"></div>`},
{id:"printers",num:"3.6",title:"Printers and multifunction devices",short:"Printer setup",html:`
<ul><li><b>Connections</b>: USB, Ethernet, Wi-Fi, or a shared print server.</li>
<li><b>Drivers</b>: PCL (common for laser printers) or PostScript (better for graphics and design work). Install the right 32- or 64-bit driver.</li>
<li><b>Settings</b>: duplex (two-sided), orientation, tray selection, quality, and collation.</li>
<li><b>Security</b>: badge or PIN release so jobs print only when the user is at the device, audit logs, and user permissions.</li>
<li><b>Scanning</b>: scan to email, to a network folder (SMB), or to the cloud. An ADF (automatic document feeder) scans many pages at once.</li></ul>
<div class="tip"><b>Unbox carefully.</b> Remove all packing tape and locks, let a printer reach room temperature if it was delivered cold, and lift heavy printers with two people.</div>`},
{id:"printtech",num:"3.7",title:"Printer types and maintenance",short:"Printer types",html:`
<h3>Laser printers</h3>
<p>Laser printers use static electricity, toner powder and heat. CompTIA tests the seven-step imaging process in order.</p>
<div class="viz" id="viz-laser"></div>
<p>Maintenance: replace the toner, drum and fuser on schedule using a <b>maintenance kit</b>, and clean with a toner-safe vacuum. The fuser gets very hot, so let it cool first.</p>
<h3>Other printer types</h3>
<div class="scroll"><table><thead><tr><th>Type</th><th>How it works</th><th>Maintenance</th></tr></thead><tbody>
<tr><td class="port">Inkjet</td><td>Sprays ink through tiny nozzles (thermal bubble or piezoelectric)</td><td>Replace cartridges, clean and calibrate print heads</td></tr>
<tr><td class="port">Thermal</td><td>A heating element darkens special heat-sensitive paper. Receipts and labels.</td><td>Replace paper, clean the heating element with isopropyl alcohol</td></tr>
<tr><td class="port">Impact</td><td>Pins strike an inked ribbon. Prints multipart (carbon copy) forms on tractor-fed paper.</td><td>Replace ribbon, print head and paper</td></tr>
<tr><td class="port">3D</td><td>Builds objects layer by layer from plastic filament or liquid resin</td><td>Replace filament or resin, level and clean the bed</td></tr>
</tbody></table></div>`}
];

 {q:"Which voltages does a standard ATX power supply provide?",o:["+1.5, +3.3, +5 V","+3.3, +5, +12 V","+5, +12, +24 V","+12, +24, +48 V"],a:1,e:"ATX PSUs supply +3.3 V, +5 V and +12 V DC."},
 {q:"A server must keep running even if a power supply fails. What should it have?",o:["A modular PSU","Redundant PSUs","An 80 Plus Gold PSU","A higher-wattage PSU"],a:1,e:"Redundant power supplies share the load, so one can fail (and be hot-swapped) without downtime."},
 {q:"What does an 80 Plus Gold rating describe?",o:["Maximum wattage","Efficiency","Number of rails","Cable length"],a:1,e:"80 Plus tiers describe how efficiently the PSU converts AC to DC."},

 {q:"Printed pages from a laser printer smudge when touched. Which part is most likely failing?",o:["Drum","Fuser","Transfer roller","Pickup roller"],a:1,e:"The fuser melts toner onto the paper. If it's failing, toner sits loose and smears."},
 {q:"In which laser printing step does toner move onto the drum?",o:["Charging","Exposing","Developing","Transferring"],a:2,e:"In developing, toner sticks to the areas of the drum that the laser exposed."},

 {q:"Inkjet output has missing lines and streaks. What should be done first?",o:["Replace the fuser","Clean the print heads","Replace the drum","Install a PostScript driver"],a:1,e:"Clogged nozzles cause streaks. Run the print head cleaning routine, then calibrate."},
 {q:"A design studio needs accurate printing of complex graphics. Which driver type is best?",o:["PCL","PostScript","Generic text","XPS"],a:1,e:"PostScript is device-independent and handles complex graphics and fonts precisely."},

 {q:"Which connection carries data, video and power over a USB-C connector at 40 Gbps?",o:["eSATA","Thunderbolt 4","HDMI","DVI"],a:1,e:"Thunderbolt 3 and 4 run at 40 Gbps over USB-C and carry data, video and power."},
 {q:"A workstation shuts off when a demanding game starts. A new high-end GPU was just installed. What is most likely?",o:["Bad RAM","The power supply wattage is too low","The CMOS battery is dead","The monitor cable is loose"],a:1,e:"A GPU raises power draw. If the PSU can't supply it, the system shuts down under load."},
 {q:"A tech replaces a CPU cooler. What must be done before reinstalling it?",o:["Update the BIOS","Clean off and reapply thermal paste","Replace the CMOS battery","Reset the boot order"],a:1,e:"Old paste should be cleaned off and fresh paste applied for good heat transfer."}

/* ---- Rear I/O panel: identify ports ---- */
(function(){

    {id:"dp",x:120,y:80,w:42,h:18,draw:(x,y)=>`<polygon points="${x},${y} ${x+42},${y} ${x+42},${y+12} ${x+36},${y+18} ${x},${y+18}" class="pt-body"/><rect x="${x+6}" y="${y+5}" width="28" height="5" class="pt-in"/>`,name:"DisplayPort",info:"<b>DisplayPort.</b> Digital video and audio with one corner cut off. Supports high refresh rates and daisy-chaining monitors."},
    {id:"vga",x:200,y:36,w:60,h:26,draw:(x,y)=>`<polygon points="${x},${y} ${x+60},${y} ${x+54},${y+26} ${x+6},${y+26}" class="pt-vga"/>`+[0,1,2].map(r=>[0,1,2,3,4].map(c=>`<circle cx="${x+13+c*8.5-(r===1?0:0)}" cy="${y+6+r*7}" r="1.8" class="pt-pin"/>`).join("")).join(""),name:"VGA",info:"<b>VGA.</b> Analog video, 15 pins in three rows, usually blue. Legacy, but still found on projectors."},
    {id:"dvi",x:200,y:78,w:74,h:24,draw:(x,y)=>`<rect x="${x}" y="${y}" width="74" height="24" rx="3" class="pt-dvi"/>`+[0,1,2].map(r=>[0,1,2,3,4,5,6,7].map(c=>`<rect x="${x+6+c*6}" y="${y+5+r*6}" width="3" height="3" class="pt-pin"/>`).join("")).join("")+`<rect x="${x+58}" y="${y+10}" width="11" height="3" class="pt-pin"/>`,name:"DVI",info:"<b>DVI.</b> Video only. DVI-D is digital, DVI-A is analog, DVI-I carries both. Look for the flat blade on the side."},
    {id:"rj45",x:300,y:36,w:34,h:30,draw:(x,y)=>`<rect x="${x}" y="${y}" width="34" height="30" rx="2" class="pt-body"/><rect x="${x+5}" y="${y+5}" width="24" height="16" class="pt-in"/><rect x="${x+12}" y="${y+21}" width="10" height="5" class="pt-in"/>`,name:"RJ45 Ethernet",info:"<b>RJ45.</b> Wired networking with 8 pins, for twisted pair cable such as Cat 6. Wider than the 4- or 6-pin RJ11 phone jack."},
    {id:"audio",x:300,y:80,w:70,h:22,draw:(x,y)=>[["#4cae4f",0],["#e86fa6",24],["#5aa6e8",48]].map(([c,o])=>`<circle cx="${x+11+o}" cy="${y+11}" r="10" fill="${c}" opacity=".85"/><circle cx="${x+11+o}" cy="${y+11}" r="4" class="pt-in"/>`).join(""),name:"3.5 mm audio",info:"<b>3.5 mm audio jacks.</b> Green is line out for speakers or headphones, pink is microphone in, and blue is line in."},
    {id:"ps2",x:400,y:38,w:28,h:28,draw:(x,y)=>`<circle cx="${x+14}" cy="${y+14}" r="13" fill="#8a6bd1" opacity=".8"/><circle cx="${x+14}" cy="${y+14}" r="6" class="pt-in"/>`,name:"PS/2",info:"<b>PS/2.</b> Legacy round port for keyboards (purple) and mice (green). Not hot-swappable."},
    {id:"esata",x:400,y:82,w:40,h:16,draw:(x,y)=>`<polygon points="${x+4},${y} ${x+36},${y} ${x+40},${y+4} ${x+40},${y+16} ${x},${y+16} ${x},${y+4}" class="pt-body"/><polygon points="${x+6},${y+6} ${x+34},${y+6} ${x+34},${y+12} ${x+6},${y+12}" class="pt-in"/>`,name:"eSATA",info:"<b>eSATA.</b> External SATA for drives, up to 6 Gbps. A flat port with angled top corners, so a USB plug won't fit. Largely replaced by USB-C."}

/* ---- RAM slot configurator ---- */
(function(){
  const el=$("#viz-ram");if(!el)return;
  const slots=["A1","A2","B1","B2"];let fill={A1:false,A2:false,B1:false,B2:false};
  el.innerHTML=`<div class="viz-title">Install RAM for dual-channel</div>
  <div class="ram-board"><div class="ram-cpu">CPU</div><div class="ram-slots"></div></div>
  <div class="caption" aria-live="polite"></div>
  <div class="viz-controls"><button class="btn" data-r="one">1 stick</button><button class="btn" data-r="bad">2 sticks, same channel</button><button class="btn primary" data-r="good">2 sticks, dual-channel</button><button class="btn" data-r="four">4 sticks</button></div>`;
  function draw(){
    $(".ram-slots",el).innerHTML=slots.map(s=>`<button class="ram-slot ch${s[0]}${fill[s]?" on":""}" data-s="${s}" aria-pressed="${fill[s]}"><span class="ram-stick">${fill[s]?"16 GB":""}</span><b>${s}</b></button>`).join("");
    const a=+fill.A1+ +fill.A2,b=+fill.B1+ +fill.B2,n=a+b,gb=n*16;
    let msg;
    if(!n)msg="Tap a slot to install a 16 GB stick. Slots A1 and A2 share channel A, and B1 and B2 share channel B.";
    else if(!a||!b)msg=`<span class="status-bad">Single-channel, ${gb} GB.</span> All sticks are on one channel, so the CPU reads memory over one 64-bit path. Move a stick to the other channel.`;
    else if(a===b){msg=`<span class="status-good">Dual-channel, ${gb} GB.</span> Both channels have equal memory, so the CPU reads from both at once and memory bandwidth doubles.`;award("viz:ram",20,"Configured dual-channel RAM")}
    else msg=`<span class="status-bad">Flex mode, ${gb} GB.</span> Channels have different amounts. Only the matched part runs dual-channel. Add a stick to balance them.`;
    $(".caption",el).innerHTML=msg;
  }
  el.addEventListener("click",e=>{const s=e.target.closest("[data-s]"),r=e.target.closest("[data-r]")?.dataset.r;
    if(s){fill[s.dataset.s]=!fill[s.dataset.s];draw()}
    if(r){fill={one:{A1:0,A2:1,B1:0,B2:0},bad:{A1:1,A2:1,B1:0,B2:0},good:{A1:0,A2:1,B1:0,B2:1},four:{A1:1,A2:1,B1:1,B2:1}}[r];for(const k in fill)fill[k]=!!fill[k];draw()}});
  draw();
})();

/* ---- Storage speed race ---- */
(function(){
  const el=$("#viz-race");if(!el)return;
  const D=[["7,200 rpm HDD",160],["SATA SSD",550],["NVMe SSD (PCIe 3.0)",3500],["NVMe SSD (PCIe 4.0)",7000]];
  const MB=10240;let raf=null;
  el.innerHTML=`<div class="viz-title">Race four drives copying a 10 GB file</div>
  <div class="race">${D.map(([n,s],i)=>`<div class="race-row"><span class="race-name">${n}<em>~${fmt(s)} MB/s</em></span><div class="race-track"><i id="rb${i}"></i></div><span class="race-time mono" id="rt${i}">—</span></div>`).join("")}</div>
  <div class="caption" aria-live="polite">Typical sequential read speeds. Real results vary by model. Press <b>Start the race</b>. The animation runs 8 times faster than real life.</div>
  <div class="viz-controls"><button class="btn primary" data-a="go">Start the race</button></div>`;
  $('[data-a="go"]',el).onclick=()=>{
    cancelAnimationFrame(raf);const t0=performance.now(),SPEED=8;
    const tick=now=>{if(!el.isConnected)return;const t=(now-t0)/1000*SPEED;let done=true;
      D.forEach(([,s],i)=>{const need=MB/s,p=Math.min(t/need,1);$("#rb"+i).style.width=(p*100)+"%";$("#rt"+i).textContent=p>=1?need.toFixed(1)+" s":(t).toFixed(1)+" s";if(p<1)done=false});
      if(!done&&!REDUCED)raf=requestAnimationFrame(tick);
      else{D.forEach(([,s],i)=>{$("#rb"+i).style.width="100%";$("#rt"+i).textContent=(MB/s).toFixed(1)+" s"});
        $(".caption",el).innerHTML="The HDD needs over a minute. A PCIe 4.0 NVMe drive finishes in about 1.5 seconds, more than 40 times faster.";award("viz:race",20,"Raced the storage drives")}};
    raf=requestAnimationFrame(tick);
  };
})();

/* ---- RAID builder ---- */
(function(){
  const el=$("#viz-raid");if(!el)return;
  const L={0:{min:2,ft:0,cap:n=>n,d:"Striping. Data is split across every drive, so reads and writes are fast. One failure loses everything."},
           1:{min:2,max:2,ft:1,cap:()=>1,d:"Mirroring. Both drives hold identical copies. Half the raw capacity is used for the copy."},
           5:{min:3,ft:1,cap:n=>n-1,d:"Striping with parity spread across all drives. Any one drive can fail, and its data is rebuilt from parity."},
           6:{min:4,ft:2,cap:n=>n-2,d:"Striping with two sets of parity. Any two drives can fail at the same time."},
           10:{min:4,even:true,ft:"1 per pair",cap:n=>n/2,d:"Drives are mirrored in pairs, then the pairs are striped. Fast, and survives one failure in each pair."}};
  let lv=5,n=4,failed=new Set();const SZ=4;
  el.innerHTML=`<div class="viz-title">Build a RAID array, then fail some drives</div>
  <div class="viz-controls"><span>Level:</span>${Object.keys(L).map(k=>`<button class="chip" data-l="${k}">RAID ${k}</button>`).join("")}</div>
  <div class="viz-controls"><span>Drives:</span><button class="btn" data-n="-1" aria-label="Remove a drive">−</button><b class="mono" id="raid-n"></b><button class="btn" data-n="1" aria-label="Add a drive">+</button><span class="grow">Each drive is ${SZ} TB</span></div>
  <div class="raid-drives"></div>
  <div class="sn-grid raid-stats"></div>
  <div class="caption" aria-live="polite"></div>
  <div class="viz-controls"><button class="btn bad" data-a="fail">Fail a random drive</button><button class="btn" data-a="fix">Replace failed drives</button></div>`;
  function lost(){
    if(lv==0)return failed.size>0;if(lv==1)return failed.size>=2;if(lv==5)return failed.size>1;if(lv==6)return failed.size>2;
    for(let i=0;i<n;i+=2)if(failed.has(i)&&failed.has(i+1))return true;return false;
  }
  function draw(){
    const c=L[lv];
    el.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l==lv));
    $("#raid-n").textContent=n;
    const dead=lost();
    $(".raid-drives",el).innerHTML=Array.from({length:n},(_,i)=>`<button class="drive${failed.has(i)?" failed":""}${lv==10?(i%2?" pair-b":" pair-a"):""}" data-d="${i}" aria-label="Drive ${i+1}${failed.has(i)?", failed":""}"><span class="led"></span><b>Disk ${i+1}</b><em>${failed.has(i)?"FAILED":lv==0?"stripe":lv==1?"mirror":lv==5?"data + parity":lv==6?"data + 2× parity":"pair "+(Math.floor(i/2)+1)}</em></button>`).join("");
    $(".raid-stats",el).innerHTML=[["Minimum drives",c.min],["Usable capacity",c.cap(n)*SZ+" TB of "+n*SZ],["Survives",typeof c.ft==="number"?c.ft+" failure"+(c.ft===1?"":"s"):c.ft],["Array status",dead?"DATA LOST":failed.size?"Degraded":"Healthy"]].map(([k,v])=>`<div><span>${k}</span><b class="${k==="Array status"?(dead?"status-bad":failed.size?"":"status-good"):""}">${v}</b></div>`).join("");
    $(".caption",el).innerHTML=dead?`<span class="status-bad">The array has failed and its data is gone.</span> ${lv==0?"RAID 0 has no redundancy.":"Too many drives failed for this level."} Restore from backup.`:failed.size?`<span class="status-good">Still running, but degraded.</span> Replace the failed drive so the array can rebuild before another one fails.`:c.d;
  }
  el.addEventListener("click",e=>{
    const l=e.target.closest("[data-l]"),d=e.target.closest("[data-n]"),dr=e.target.closest("[data-d]"),a=e.target.closest("[data-a]")?.dataset.a;
    if(l){lv=+l.dataset.l;const c=L[lv];n=Math.max(c.min,c.max?Math.min(n,c.max):n);if(c.even&&n%2)n++;failed.clear();draw()}
    if(d){const c=L[lv];let m=n+(+d.dataset.n)*(c.even?2:1);m=Math.max(c.min,Math.min(c.max||8,m));n=m;failed.clear();draw()}
    if(dr){const i=+dr.dataset.d;failed.has(i)?failed.delete(i):failed.add(i);draw();award("viz:raid",30,"Stress-tested a RAID array")}
    if(a==="fail"){const ok=[...Array(n).keys()].filter(i=>!failed.has(i));if(ok.length){failed.add(ok[Math.floor(Math.random()*ok.length)]);draw();award("viz:raid",30,"Stress-tested a RAID array")}}
    if(a==="fix"){failed.clear();draw()}
  });
  draw();
})();

(function(){
const LESSONS=[
{id:"why",num:"4.1",title:"Why virtualize",short:"Why virtualize",html:`
<p>Virtualization runs several operating systems on one physical computer. Each <b>virtual machine (VM)</b> believes it has its own hardware, but it is sharing the host's CPU, RAM, storage and network.</p>
<ul><li><b>Sandboxing</b>: open suspicious files or test changes where they can't hurt the real system.</li>
<li><b>Test and development</b>: try a new OS, an update or a script, then roll back with a <b>snapshot</b>.</li>
<li><b>Legacy software</b>: run an old app on the old OS it needs.</li>
<li><b>Cross-platform</b>: run Linux on a Windows PC, or Windows on a Mac.</li>
<li><b>Server consolidation</b>: many lightly used servers become VMs on one host, saving power and space.</li></ul>
<h3>Resource requirements</h3>
<ul><li>CPU support for virtualization, <b>Intel VT-x or AMD-V</b>, enabled in UEFI.</li>
<li>Enough <b>RAM</b> for the host plus every running VM. RAM is usually the first limit you hit.</li>
<li>Disk space for each VM's virtual disk, and for snapshots, which grow over time.</li>
<li>Network: each VM gets a virtual NIC connected to a virtual switch.</li></ul>
<div class="viz" id="viz-alloc"></div>
<h3>Security concerns</h3>
<ul><li><b>VM escape</b>: an attack that breaks out of a VM to reach the host or other VMs. Keep hypervisors patched.</li>
<li><b>VM sprawl</b>: forgotten, unpatched VMs pile up. Track and remove what isn't needed.</li>
<li>Each VM needs its own updates, antivirus and firewall, just like a physical PC.</li></ul>`},
{id:"hyper",num:"4.2",title:"Hypervisors, containers and VDI",short:"Hypervisors and containers",html:`
<div class="viz" id="viz-stack"></div>
<div class="scroll"><table><thead><tr><th>Type</th><th>Runs on</th><th>Examples</th><th>Typical use</th></tr></thead><tbody>
<tr><td class="port">Type 1</td><td>Directly on hardware (bare metal)</td><td>VMware ESXi, Microsoft Hyper-V, Proxmox, KVM</td><td>Servers and data centers</td></tr>
<tr><td class="port">Type 2</td><td>As an app on a host OS</td><td>Oracle VirtualBox, VMware Workstation, Parallels</td><td>Desktops and labs</td></tr>
<tr><td class="port">Containers</td><td>A container engine on a host OS, sharing its kernel</td><td>Docker, Podman</td><td>Packaging and running apps</td></tr>
</tbody></table></div>
<h3>VM network modes</h3>
<ul><li><b>NAT</b>: the VM shares the host's IP address to reach outside networks. The default in most Type 2 hypervisors.</li>
<li><b>Bridged</b>: the VM gets its own address on the physical network, like a separate PC.</li>
<li><b>Host-only (internal)</b>: the VM talks only to the host and other VMs. Good for isolated testing.</li></ul>
<h3>Desktop virtualization</h3>
<p><b>VDI</b> (virtual desktop infrastructure) runs users' desktops as VMs in a data center or the cloud. Users connect from any device, and data never leaves the server. <b>Application virtualization</b> streams a single app instead of a whole desktop.</p>`},
{id:"models",num:"4.3",title:"Cloud deployment models",short:"Deployment models",html:`
<div class="viz" id="viz-deploy"></div>
<div class="scroll"><table><thead><tr><th>Model</th><th>Who uses it</th><th>Key point</th></tr></thead><tbody>
<tr><td class="port">Public</td><td>Anyone who pays, sharing the provider's hardware</td><td>No hardware to buy. Scales on demand.</td></tr>
<tr><td class="port">Private</td><td>One organization</td><td>Full control, on-site or hosted. Costs more.</td></tr>
<tr><td class="port">Hybrid</td><td>A mix of private and public</td><td>Sensitive data stays private. Overflow goes public.</td></tr>
<tr><td class="port">Community</td><td>Several organizations with shared needs</td><td>Shared costs, shared compliance rules (for example, hospitals).</td></tr>
</tbody></table></div>`},
{id:"services",num:"4.4",title:"Cloud service models and characteristics",short:"Service models",html:`
<p>Service models describe how much the provider manages for you. Click a column to see who is responsible for each layer.</p>
<div class="viz" id="viz-resp"></div>
<ul><li><b>IaaS</b> (infrastructure): rent virtual servers, storage and networks. You manage the OS and up. Example: Amazon EC2, Azure VMs.</li>
<li><b>PaaS</b> (platform): deploy your code. The provider runs the OS and runtime. Example: Azure App Service, Google App Engine.</li>
<li><b>SaaS</b> (software): just use the app in a browser. Example: Microsoft 365, Gmail, Salesforce.</li></ul>
<h3>Cloud characteristics</h3>
<ul><li><b>Shared resources</b> and <b>multitenancy</b>: many customers share the same hardware, kept separate by software.</li>
<li><b>Metered utilization</b>: pay for what you use, like a utility bill.</li>
<li><b>Rapid elasticity</b>: resources scale up and down automatically with demand.</li>
<li><b>High availability</b>: services keep running through failures, often across several data centers.</li>
<li><b>File synchronization</b>: files stay the same across every device (OneDrive, Google Drive, Dropbox).</li>
<li><b>Ingress and egress</b>: data going into the cloud is usually free. Data coming out (egress) is often billed.</li></ul>
<div class="viz" id="viz-elastic"></div>`}
];

    $("svg",el).innerHTML=s;

    $(".el-out",el).innerHTML=[["Time",String(hour).padStart(2,"0")+":00"],["Servers running",servers(hour)],["Hours overloaded",over],["Server-hours billed",hrs]].map(([k,v])=>`<div><span>${k}</span><b class="${k==="Hours overloaded"&&over?"status-bad":""}">${v}</b></div>`).join("");

})();

<script>
/* ================= Module 5: Hardware and Network Troubleshooting (Core 1, 220-1201) ================= */
(function(){
const LESSONS=[
{id:"method",num:"5.1",title:"The troubleshooting methodology",short:"Methodology",html:`
<p>CompTIA expects you to follow the same six steps in the same order every time, and exam questions often ask "what should the technician do <b>next</b>?"</p>
<div class="viz" id="viz-method"></div>
<ol>
<li><b>Identify the problem.</b> Gather information from the user, identify recent changes, and inquire about environmental or infrastructure changes. Back up data before making changes.</li>
<li><b>Establish a theory of probable cause.</b> Question the obvious. Research knowledge bases and the internet if needed.</li>
<li><b>Test the theory to determine the cause.</b> If confirmed, decide the next steps. If not, establish a new theory or escalate.</li>
<li><b>Establish a plan of action and implement the solution.</b> Follow vendor instructions and company change policies.</li>
<li><b>Verify full system functionality</b> and, if applicable, implement preventive measures.</li>
<li><b>Document</b> findings, actions and outcomes.</li></ol>
<div class="tip"><b>Exam trap.</b> Documenting comes last, after verifying. And backing up data belongs in step 1, before you change anything.</div>`},
{id:"board",num:"5.2",title:"Motherboard, RAM, CPU and power problems",short:"Boot and power",html:`
<p>Watch where the boot process stops. Each stage depends on the one before it, so the point of failure narrows the cause.</p>
<div class="viz" id="viz-boot"></div>
<div class="scroll"><table><thead><tr><th>Symptom</th><th>Likely causes</th></tr></thead><tbody>
<tr><td>No power, no fans, no lights</td><td>Wall outlet, power cable, PSU switch, failed PSU</td></tr>
<tr><td>Fans spin, blank screen, beeps</td><td>POST failure: RAM, GPU or CPU. Beep codes vary by firmware maker.</td></tr>
<tr><td>Blue screen (BSOD) or kernel panic</td><td>Bad driver, failing RAM, overheating, corrupted system files</td></tr>
<tr><td>Random shutdowns</td><td>Overheating (dust, failed fan, old thermal paste) or a failing PSU</td></tr>
<tr><td>Burning smell or smoke</td><td>Power off and unplug immediately. Inspect the PSU and board.</td></tr>
<tr><td>Swollen or leaking capacitors</td><td>Failing motherboard or PSU. Replace it.</td></tr>
<tr><td>Wrong date and time after power loss</td><td>Dead CMOS battery</td></tr>
<tr><td>Sluggish performance, loud fans</td><td>Thermal throttling, not enough RAM, failing drive</td></tr>
</tbody></table></div>`},
{id:"storage",num:"5.3",title:"Storage and RAID problems",short:"Storage",html:`
<ul><li><b>Clicking or grinding</b> from an HDD: mechanical failure is coming. Back up immediately and replace the drive.</li>
<li><b>"Bootable device not found"</b>: wrong boot order, a disconnected drive, or a corrupted boot sector.</li>
<li><b>S.M.A.R.T. warnings</b>: the drive is reporting its own health problems. Plan a replacement.</li>
<li><b>Extended read/write times and low IOPS</b>: a failing or full drive, or an HDD where an SSD is needed.</li>
<li><b>Drive missing in the OS</b>: check cables and power, then Disk Management (it may need initializing).</li>
<li><b>RAID degraded or missing</b>: check the RAID controller utility and status LEDs. Replace the failed drive and let the array rebuild.</li>
<li><b>Data loss or corruption</b>: restore from backup. Fault tolerance is not a backup.</li></ul>`},
{id:"display",num:"5.4",title:"Video, projector and display problems",short:"Displays",html:`
<ul><li><b>No image</b>: check the input source selected on the display, then cables and power.</li>
<li><b>Dim image</b>: brightness setting, or a failing backlight or projector bulb.</li>
<li><b>Fuzzy image</b>: wrong (non-native) resolution, or projector focus.</li>
<li><b>Flickering</b>: loose cable, wrong refresh rate, or a failing backlight.</li>
<li><b>Dead pixels</b> stay black. <b>Stuck pixels</b> stay one color. Both may be covered by warranty.</li>
<li><b>Burn-in</b>: ghost of a static image, mostly on OLED and plasma.</li>
<li><b>Wrong colors</b>: color profile, a bent pin in a VGA cable, or a loose connection.</li>
<li><b>Projector shuts off by itself</b>: overheating. Clean the air filter and check the fan.</li>
<li><b>Burned-out projector bulb</b>: replace it and reset the lamp timer. Don't touch the glass.</li></ul>`},
{id:"mobile",num:"5.5",title:"Mobile device problems",short:"Mobile",html:`
<ul><li><b>Poor battery health</b>: check the battery health report. Replace aging batteries.</li>
<li><b>Swollen battery</b>: stop using the device and replace the battery. Never puncture it.</li>
<li><b>Improper charging</b>: try another cable and charger, and clean lint out of the port.</li>
<li><b>Poor or no connectivity</b>: airplane mode, Wi-Fi or Bluetooth toggles, carrier settings, or a damaged antenna.</li>
<li><b>Liquid damage</b>: power off, don't charge it, and check the liquid contact indicator.</li>
<li><b>Overheating</b>: heavy apps, a case trapping heat, a failing battery, or malware.</li>
<li><b>Touch problems</b>: clean the screen, remove the screen protector, recalibrate, or replace the digitizer.</li>
<li><b>Cursor drift</b> on laptops: recalibrate the touchpad or check for a swollen battery pushing on it.</li></ul>`},
{id:"network",num:"5.6",title:"Network problems",short:"Network",html:`
<p>Work from your own computer outward, one hop at a time. Each command tests one more piece of the path.</p>
<div class="viz" id="viz-ping"></div>
<div class="scroll"><table><thead><tr><th>Symptom</th><th>Likely causes</th></tr></thead><tbody>
<tr><td>Intermittent wireless</td><td>Interference, distance, channel overlap, roaming between access points</td></tr>
<tr><td>Slow speeds</td><td>Congestion, bandwidth-hungry apps, a duplex mismatch, a bad cable</td></tr>
<tr><td>Limited connectivity (169.254.x.x)</td><td>DHCP server unreachable</td></tr>
<tr><td>Jitter and poor VoIP quality</td><td>Delay that varies. Fix with QoS to prioritize voice traffic.</td></tr>
<tr><td>High latency</td><td>Congested links, satellite connections, long routes</td></tr>
<tr><td>Port flapping</td><td>A switch port repeatedly going up and down: bad cable or NIC</td></tr>
<tr><td>IP conflict</td><td>Two devices with the same static IP, or a static IP inside the DHCP scope</td></tr>
<tr><td>Authentication failures</td><td>Wrong Wi-Fi password or certificate, expired credentials</td></tr>
</tbody></table></div>`},
{id:"printers",num:"5.7",title:"Printer problems",short:"Printers",html:`
<p>The printout itself is the best clue. Click each sample page to diagnose it.</p>
<div class="viz" id="viz-pages"></div>
<ul><li><b>Paper jams and misfeeds</b>: worn pickup rollers, wrong paper type, humid paper. Multiple sheets feeding at once points to a worn separation pad.</li>
<li><b>Jobs stuck in the queue</b>: restart the <b>Print Spooler</b> service and clear the queue.</li>
<li><b>Grinding noise</b>: a stripped gear or something caught in the paper path.</li>
<li><b>Wrong orientation or finishing</b> (stapling, hole punch): check the print driver settings.</li>
<li><b>Wrong colors</b>: an empty cartridge, or the color profile and calibration.</li></ul>`}
];
