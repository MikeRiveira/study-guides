registerModule({
  id:"ts",slug:"hw-net-troubleshooting",title:"Hardware and Network Troubleshooting",
  lessons:LESSONS,
  decks:[["method","Methodology"],["hw","Hardware"],["net","Network"],["print","Printers and mobile"]],
  cards:CARDS,quiz:QUIZ,
  vizKeys:["method","boot","ping","pages"],
  viz(){
/* ---- Methodology flow with a live ticket ---- */
(function(){
  const el=$("#viz-method");if(!el)return;
  const S=[
    ["Identify the problem","A user says their PC won't connect to the internet since this morning. You ask questions and learn that IT moved her desk last night. You back up her files to be safe."],
    ["Establish a theory","Question the obvious: the network cable may not have been reconnected after the move."],
    ["Test the theory","You check under the desk. The cable is plugged in. Theory not confirmed."],
    ["Establish a new theory","The link light on the NIC is off. New theory: the wall jack was patched to the wrong switch port."],
    ["Test the theory","You plug a laptop into the same jack. No link. Theory confirmed."],
    ["Plan and implement","You get approval, then patch the jack to a live switch port in the wiring closet."],
    ["Verify and prevent","The user browses the web, prints and reaches the file share. You label the patch panel so the next move goes smoothly."],
    ["Document","You record the cause, the fix and the labeling in the ticket, then close it."]
  ];
  const NODE=[[0,"Identify"],[1,"Theory"],[2,"Test"],[3,"Plan and implement"],[4,"Verify and prevent"],[5,"Document"]];
  const MAP=[0,1,2,1,2,3,4,5];
  let i=-1;
  el.innerHTML=`<div class="viz-title">Work a real ticket through the six steps</div>
  <div class="viz-scroll"><svg viewBox="0 0 640 170" style="min-width:520px" role="img" aria-label="Troubleshooting methodology flow">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
    ${NODE.map(([k,n],j)=>`<g class="station" data-n="${k}"><rect x="${10+j*105}" y="40" width="94" height="46" rx="9"/><text x="${57+j*105}" y="${n.length>12?58:68}" text-anchor="middle" style="font-size:12px">${n.length>12?n.split(" ").slice(0,2).join(" "):n}</text>${n.length>12?`<text x="${57+j*105}" y="74" text-anchor="middle" style="font-size:12px">${n.split(" ").slice(2).join(" ")}</text>`:""}<text x="${57+j*105}" y="30" text-anchor="middle" class="s-small">STEP ${j+1}</text></g>`).join("")}
    ${[0,1,2,3,4].map(j=>`<line x1="${104+j*105}" y1="63" x2="${114+j*105}" y2="63" class="m-link" marker-end="url(#ah)"/>`).join("")}
    <path d="M267,86 C267,140 162,140 162,90" class="loop" marker-end="url(#ah)"/><text x="214" y="150" text-anchor="middle" class="s-small">not confirmed: new theory</text>
    <path d="M267,86 L267,120 L330,120" class="esc" /><text x="336" y="124" class="s-small">or escalate</text>
  </svg></div>
  <div class="caption" aria-live="polite">Press <b>Next step</b> to follow a ticket from report to resolution.</div>
  <div class="viz-controls"><button class="btn" data-a="back">Back</button><button class="btn primary" data-a="next">Next step</button><span class="grow"></span></div>`;
  function draw(){
    const cur=i>=0?MAP[i]:-1;
    el.querySelectorAll(".station").forEach((g,j)=>{g.classList.toggle("on",j===cur);g.classList.toggle("done",i>=0&&MAP.slice(0,i).includes(j)&&j!==cur)});
    $(".loop",el).classList.toggle("on",i===3);
    $(".caption",el).innerHTML=i<0?"Press <b>Next step</b> to follow a ticket from report to resolution.":`<b>${S[i][0]}.</b> ${S[i][1]}`;
    $(".grow",el).textContent=i<0?"":`Step ${MAP[i]+1} of 6`;
    $('[data-a="back"]',el).disabled=i<0;$('[data-a="next"]',el).disabled=i>=S.length-1;
    if(i===S.length-1)award("viz:method",30,"Worked a ticket through all six steps");
  }
  el.addEventListener("click",e=>{const a=e.target.closest("[data-a]")?.dataset.a;if(a==="next")i=Math.min(i+1,S.length-1);if(a==="back")i=Math.max(i-1,-1);if(a)draw()});
  draw();
})();

/* ---- Boot sequence: break it ---- */
(function(){
  const el=$("#viz-boot");if(!el)return;
  const ST=["Power","PSU","CPU + firmware","POST: RAM","POST: video","Boot device","OS loads"];
  const F={
    none:[7,"Every stage passes. Windows loads normally."],
    outlet:[0,"<b>Nothing happens.</b> No lights, no fans. Power never reaches the PSU. Check the outlet, power strip, cable and the PSU's rear switch."],
    psu:[1,"<b>No power or random shutdowns.</b> A dead PSU gives no lights or fans. A weak one may spin fans for a second, then die. Test with a PSU tester or a known-good unit."],
    cpu:[2,"<b>Fans spin, but nothing else.</b> No beeps, no video. The CPU or firmware isn't starting. Check the 8-pin CPU power cable, CPU seating and cooler."],
    ram:[3,"<b>Beeps and no video.</b> POST can't find working memory. Reseat or replace the RAM. The beep pattern differs by firmware maker, so check the manual."],
    gpu:[4,"<b>Beeps, or a powered-on PC with a black screen.</b> POST can't find video. Reseat the graphics card, check its power cable, or try onboard video."],
    disk:[5,"<b>\"Bootable device not found.\"</b> POST passed, but firmware can't find an OS. Check the boot order, drive cables and drive health."],
    os:[6,"<b>Boot loop or blue screen during startup.</b> Hardware is fine. Use Windows Recovery: Startup Repair, System Restore, or roll back the last driver or update."]
  };
  const B=[["none","Healthy PC"],["outlet","Dead outlet"],["psu","Failed PSU"],["cpu","CPU not powered"],["ram","Bad RAM"],["gpu","Unseated GPU"],["disk","Disconnected drive"],["os","Corrupted OS"]];
  const seen=new Set();let cur="none",anim=null;
  el.innerHTML=`<div class="viz-title">Break a PC and see where startup stops</div>
  <div class="viz-controls">${B.map(([k,n])=>`<button class="chip" data-f="${k}">${n}</button>`).join("")}</div>
  <div class="boot">${ST.map((s,i)=>`<div class="bt-st" id="bt${i}"><span class="mono">${i+1}</span>${s}</div>`).join("")}</div>
  <div class="caption" aria-live="polite"></div>`;
  function run(){
    clearTimeout(anim);const [stop,msg]=F[cur];seen.add(cur);
    el.querySelectorAll("[data-f]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===cur));
    ST.forEach((_,i)=>$("#bt"+i).className="bt-st");
    $(".caption",el).innerHTML="Starting up…";
    let i=0;const step=()=>{if(!el.isConnected)return;if(i<stop){$("#bt"+i).className="bt-st ok";i++;anim=setTimeout(step,REDUCED?0:260)}else{if(stop<ST.length)$("#bt"+stop).className="bt-st fail";$(".caption",el).innerHTML=msg;if(seen.size>=6)award("viz:boot",30,"Diagnosed boot failures")}};
    step();
  }
  el.addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(b){cur=b.dataset.f;run()}});
  run();
})();

/* ---- Ping ladder terminal ---- */
(function(){
  const el=$("#viz-ping");if(!el)return;
  const STEPS=[["ipconfig","Check your IP settings"],["ping 127.0.0.1","Test the local TCP/IP stack"],["ping 192.168.1.23","Test your own NIC"],["ping 192.168.1.1","Reach the default gateway"],["ping 8.8.8.8","Reach the internet by IP"],["nslookup comptia.org","Test DNS name resolution"]];
  const SC={
    ok:{name:"Everything works",fail:9,ip:"192.168.1.23",note:"Every hop answers. If the user still has a problem, look at the application or the website itself."},
    apipa:{name:"No DHCP",fail:0,ip:"169.254.88.14",note:"<b>APIPA address.</b> The PC never got a lease. Check the cable or Wi-Fi connection, then the DHCP server. Run <code>ipconfig /release</code> and <code>ipconfig /renew</code> after fixing it."},
    gw:{name:"Router down",fail:3,ip:"192.168.1.23",note:"<b>The gateway doesn't answer.</b> The PC's settings are fine, but the router is off, or the switch port or cable between them is bad."},
    isp:{name:"ISP outage",fail:4,ip:"192.168.1.23",note:"<b>The LAN works up to the router, but nothing past it.</b> Check the modem and the ISP's status. Everyone in the office will be affected."},
    dns:{name:"DNS broken",fail:5,ip:"192.168.1.23",note:"<b>Internet works by IP, but names don't resolve.</b> Check the DNS server setting, try another DNS server, or run <code>ipconfig /flushdns</code>."}
  };
  const seen=new Set();let cur="apipa";
  el.innerHTML=`<div class="viz-title">Walk the ping ladder from your PC to the internet</div>
  <div class="viz-controls">${Object.entries(SC).map(([k,s])=>`<button class="chip" data-s="${k}">${s.name}</button>`).join("")}</div>
  <pre class="term" aria-live="polite"></pre>
  <div class="caption"></div>`;
  function out(k,i,s){
    const [cmd]=STEPS[i];const failed=i===s.fail||(s.fail===0&&i>0&&i!==1);
    if(i===0)return `IPv4 Address. . . : ${s.ip}\nSubnet Mask . . . : ${s.fail===0?"255.255.0.0":"255.255.255.0"}\nDefault Gateway . : ${s.fail===0?"":"192.168.1.1"}`;
    if(i===5)return failed?"*** can't find comptia.org: Server failed":"Name:    comptia.org\nAddress: 104.18.12.40";
    if(i===2&&s.fail===0)return "Reply from 169.254.88.14: bytes=32 time<1ms TTL=128";
    return failed?"Request timed out.\nRequest timed out.\nPackets: Sent = 4, Received = 0 (100% loss)":`Reply from ${cmd.split(" ")[1]}: bytes=32 time=${i===4?"14":"<1"}ms\nPackets: Sent = 4, Received = 4 (0% loss)`;
  }
  function draw(){
    const s=SC[cur];seen.add(cur);
    el.querySelectorAll("[data-s]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===cur));
    let t="";for(let i=0;i<STEPS.length;i++){const fail=i===s.fail||(i===0&&s.fail===0);t+=`<span class="t-c">C:\\&gt; ${STEPS[i][0]}</span>   <span class="t-n"># ${STEPS[i][1]}</span>\n<span class="${fail?"t-bad":"t-ok"}">${out(cur,i,s).replace(/</g,"&lt;")}</span>\n\n`;if(fail)break}
    $(".term",el).innerHTML=t.trim();
    $(".caption",el).innerHTML=s.note;
    if(seen.size>=4)award("viz:ping",30,"Walked the ping ladder");
  }
  el.addEventListener("click",e=>{const b=e.target.closest("[data-s]");if(b){cur=b.dataset.s;draw()}});draw();
})();

<script>
/* ================= Module 6: Operating Systems (Core 2, 220-1202) ================= */
(function(){
const LESSONS=[
{id:"types",num:"6.1",title:"OS types, file systems and partitions",short:"File systems",html:`
<p>Workstation OSs include <b>Windows</b>, <b>macOS</b>, <b>Linux</b> and <b>ChromeOS</b>. Mobile OSs include <b>iOS</b>, <b>iPadOS</b> and <b>Android</b>. Each formats drives with its own preferred file system, which decides who can read the drive and how big files can be.</p>
<div class="viz" id="viz-fs"></div>
<p>Before formatting, a drive gets a <b>partition table</b>. Older BIOS systems use <b>MBR</b>. UEFI systems use <b>GPT</b>.</p>
<div class="viz" id="viz-part"></div>
<div class="tip"><b>Exam tip.</b> A 4 GB+ file won't copy to a FAT32 flash drive. Reformat it as exFAT (works on Windows and macOS) or NTFS (Windows).</div>`},
{id:"editions",num:"6.2",title:"Windows editions and requirements",short:"Editions",html:`
<p>Exam questions often describe a business need and ask which edition meets it. The usual answer is: <b>Home</b> can't join a domain, so businesses need <b>Pro</b> or higher.</p>
<div class="viz" id="viz-ed"></div>
<ul><li><b>Windows 11 minimums:</b> 64-bit CPU with 2+ cores at 1 GHz, 4 GB RAM, 64 GB storage, UEFI with Secure Boot, and TPM 2.0.</li>
<li><b>32-bit vs 64-bit:</b> a 32-bit OS can use only about 4 GB of RAM. A 64-bit OS runs 32-bit apps, but a 32-bit OS can't run 64-bit apps. Windows 11 is 64-bit only.</li>
<li><b>Upgrade paths:</b> an in-place upgrade (for example Home to Pro) keeps files and apps. Moving between editions or versions may need a new license key.</li>
<li><b>End of life:</b> once an OS stops getting security updates, it should be upgraded or replaced.</li></ul>`},
{id:"install",num:"6.3",title:"Installing operating systems and apps",short:"Installing",html:`
<ul><li><b>Boot methods:</b> USB drive, optical disc, network boot (<b>PXE</b>), an internet-based install, an external drive, or a recovery partition on the internal drive.</li>
<li><b>Clean install:</b> wipes the drive and starts fresh. Best for new drives or badly broken systems. Back up data first.</li>
<li><b>In-place upgrade:</b> installs over the existing OS, keeping files, settings and apps.</li>
<li><b>Image deployment:</b> copies a prepared image to many PCs at once. Common in businesses.</li>
<li><b>Repair install:</b> reinstalls Windows while keeping files, to fix corrupted system files.</li>
<li><b>Recovery partition:</b> a hidden partition from the manufacturer that restores factory settings.</li></ul>
<h3>Installing applications</h3>
<ul><li>Check the app's <b>requirements</b>: CPU (32 or 64-bit), RAM, storage, and graphics (dedicated card and VRAM vs integrated graphics).</li>
<li><b>Distribution methods:</b> physical media, a downloaded installer, a mountable <b>ISO</b> image, or an app store.</li>
<li>Consider the <b>impact</b>: on the device (compatibility), on the network (bandwidth), on operations (training and support) and on the business (licensing).</li></ul>`},
{id:"tools",num:"6.4",title:"Windows tools and utilities",short:"Windows tools",html:`
<p>Many tools open fastest from the Run box (<kbd>Win</kbd>+<kbd>R</kbd>) by name. Learn the names: the exam uses them.</p>
<div class="scroll"><table><thead><tr><th>Tool</th><th>Run name</th><th>Use it to</th></tr></thead><tbody>
<tr><td>Task Manager</td><td class="mono">taskmgr</td><td>End frozen apps, watch CPU and RAM, disable startup apps, view services and users</td></tr>
<tr><td>Event Viewer</td><td class="mono">eventvwr.msc</td><td>Read System, Application and Security logs</td></tr>
<tr><td>Disk Management</td><td class="mono">diskmgmt.msc</td><td>Initialize, partition, format, extend or shrink volumes</td></tr>
<tr><td>Task Scheduler</td><td class="mono">taskschd.msc</td><td>Run a program or script on a schedule or trigger</td></tr>
<tr><td>Device Manager</td><td class="mono">devmgmt.msc</td><td>Update, roll back or disable drivers</td></tr>
<tr><td>Certificate Manager</td><td class="mono">certmgr.msc</td><td>View and manage certificates</td></tr>
<tr><td>Local Users and Groups</td><td class="mono">lusrmgr.msc</td><td>Create users, reset passwords, set group membership</td></tr>
<tr><td>Performance Monitor</td><td class="mono">perfmon.msc</td><td>Log performance counters over time</td></tr>
<tr><td>Group Policy Editor</td><td class="mono">gpedit.msc</td><td>Set local policies (Pro and higher)</td></tr>
<tr><td>Services</td><td class="mono">services.msc</td><td>Start, stop and set services to automatic</td></tr>
<tr><td>System Information</td><td class="mono">msinfo32</td><td>See hardware, drivers and system details</td></tr>
<tr><td>Resource Monitor</td><td class="mono">resmon</td><td>See which process uses CPU, disk, network or memory</td></tr>
<tr><td>System Configuration</td><td class="mono">msconfig</td><td>Set boot options, including Safe Mode</td></tr>
<tr><td>Disk Cleanup</td><td class="mono">cleanmgr</td><td>Delete temporary and unneeded files</td></tr>
<tr><td>Defragment and Optimize</td><td class="mono">dfrgui</td><td>Defragment HDDs, TRIM SSDs</td></tr>
<tr><td>Registry Editor</td><td class="mono">regedit</td><td>Edit the registry. Back it up first.</td></tr>
</tbody></table></div>
<div class="tip"><b>MMC.</b> Files ending in <span class="mono">.msc</span> are snap-ins for the Microsoft Management Console.</div>`},
{id:"cli",num:"6.5",title:"The command line",short:"Commands",html:`
<p>Click commands to run them. Switch between Windows and Linux to see the matching tools on each.</p>
<div class="viz" id="viz-cli"></div>
<ul><li>Add <b>/?</b> to any Windows command (or run <span class="mono">help</span>) to see its options. On Linux, use <span class="mono">man</span>.</li>
<li>Many commands need an <b>elevated</b> prompt: right-click Command Prompt and choose Run as administrator. On Linux, prefix with <span class="mono">sudo</span>.</li></ul>`},
{id:"settings",num:"6.6",title:"Settings, Control Panel and Windows networking",short:"Settings and networks",html:`
<ul><li><b>Settings</b> is the modern app for System, Bluetooth and devices, Network and internet, Personalization, Apps, Accounts, Time and language, Gaming, Accessibility, Privacy and security, and Windows Update.</li>
<li><b>Control Panel</b> still holds Internet Options, Devices and Printers, Programs and Features, Network and Sharing Center, System, Windows Defender Firewall, Mail, Sound, User Accounts, Device Manager, Indexing Options, Administrative Tools, File Explorer Options (show hidden files and extensions), Power Options and Ease of Access.</li>
<li><b>Power options:</b> sleep saves to RAM, hibernate saves to disk and powers off. Fast startup is a partial hibernate.</li>
<li><b>Workgroup vs domain:</b> a workgroup is peer-to-peer, each PC with its own accounts. A domain uses central Active Directory accounts and Group Policy.</li>
<li><b>Mapped drives:</b> assign a drive letter to a share, such as <span class="mono">net use Z: \\\\fileserver\\finance</span>.</li>
<li>Network settings also cover static IPs, DNS, proxy settings, metered connections, VPNs and firewall rules.</li></ul>`},
{id:"mac",num:"6.7",title:"macOS",short:"macOS",html:`
<div class="scroll"><table><thead><tr><th>Feature</th><th>What it does</th></tr></thead><tbody>
<tr><td>Finder</td><td>The file manager (like File Explorer)</td></tr>
<tr><td>Spotlight</td><td>System-wide search. <kbd>Cmd</kbd>+<kbd>Space</kbd></td></tr>
<tr><td>Mission Control</td><td>See all open windows and desktops (Spaces)</td></tr>
<tr><td>Dock</td><td>Launch and switch apps</td></tr>
<tr><td>Keychain</td><td>Stores passwords, certificates and keys</td></tr>
<tr><td>iCloud</td><td>Syncs files, photos, passwords and backups</td></tr>
<tr><td>Time Machine</td><td>Built-in backups to an external drive</td></tr>
<tr><td>FileVault</td><td>Full-disk encryption</td></tr>
<tr><td>Disk Utility</td><td>Erase, partition, and run First Aid on drives</td></tr>
<tr><td>Terminal</td><td>The command line (zsh shell)</td></tr>
<tr><td>Force Quit</td><td>Close frozen apps. <kbd>Cmd</kbd>+<kbd>Option</kbd>+<kbd>Esc</kbd></td></tr>
<tr><td>Gestures</td><td>Multi-finger trackpad swipes, pinches and taps</td></tr>
<tr><td>Remote Disc</td><td>Use another computer's optical drive</td></tr>
</tbody></table></div>
<ul><li><b>Installing apps:</b> from the App Store, a <span class="mono">.dmg</span> disk image (drag the <span class="mono">.app</span> to Applications) or a <span class="mono">.pkg</span> installer.</li>
<li><b>Uninstalling:</b> drag the app to the Trash, or use its uninstaller.</li>
<li><b>Updates:</b> System Settings, then General, then Software Update.</li></ul>`},
{id:"linux",num:"6.8",title:"Linux",short:"Linux",html:`
<ul><li><b>Root</b> is the all-powerful admin account. Use <span class="mono">sudo</span> to run one command as root, or <span class="mono">su</span> to switch users.</li>
<li><b>Package managers</b> install software from repositories: <span class="mono">apt</span> (Debian, Ubuntu) and <span class="mono">dnf</span> (Red Hat, Fedora).</li>
<li><b>Permissions</b> are read (4), write (2) and execute (1) for the owner, group and others. <span class="mono">chmod 754</span> means owner rwx, group r-x, others r--.</li>
<li><b>Key files:</b> <span class="mono">/etc/passwd</span> (users), <span class="mono">/etc/shadow</span> (password hashes), <span class="mono">/etc/hosts</span> (local name lookups), <span class="mono">/etc/resolv.conf</span> (DNS servers), <span class="mono">/etc/fstab</span> (drives mounted at boot).</li>
<li><b>Common tools:</b> <span class="mono">nano</span> to edit text, <span class="mono">cron</span> to schedule jobs, <span class="mono">Samba</span> to share files with Windows.</li></ul>`}
];

  id:"os",slug:"operating-systems",title:"Operating Systems",

/* ---- File system explorer ---- */
(function(){
  const el=$("#viz-fs");if(!el)return;
  const FS={
    NTFS:{os:{Windows:2,macOS:1,Linux:2},max:"16 TB+",use:"Windows system drives",f:["Permissions","Encryption (EFS)","Compression","Journaling"]},
    FAT32:{os:{Windows:2,macOS:2,Linux:2},max:"4 GB",use:"Old devices, cameras, small USB drives",f:["Works almost everywhere","No permissions"]},
    exFAT:{os:{Windows:2,macOS:2,Linux:2},max:"16 EB",use:"Flash drives and SD cards",f:["Large files","No journaling","No permissions"]},
    ReFS:{os:{Windows:2,macOS:0,Linux:0},max:"35 PB",use:"Windows Server and storage pools",f:["Self-healing","Large volumes","Can't boot Windows clients"]},
    ext4:{os:{Windows:0,macOS:0,Linux:2},max:"16 TB",use:"Most Linux distributions",f:["Journaling","Permissions"]},
    XFS:{os:{Windows:0,macOS:0,Linux:2},max:"8 EB",use:"Red Hat Enterprise Linux default",f:["Journaling","Very large files"]},
    APFS:{os:{Windows:0,macOS:2,Linux:0},max:"8 EB",use:"macOS and iOS",f:["SSD-optimized","Snapshots","Built-in encryption"]}
  };
  const LV=["No native support","Read only","Read and write"];
  const seen=new Set();let cur="FAT32";
  el.innerHTML=`<div class="viz-title">Compare file systems</div>
  <div class="viz-controls">${Object.keys(FS).map(k=>`<button class="chip" data-fs="${k}">${k}</button>`).join("")}</div>
  <div class="fsx"></div>`;
  function draw(){
    const d=FS[cur];seen.add(cur);
    el.querySelectorAll("[data-fs]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.fs===cur));
    $(".fsx",el).innerHTML=`<div class="fsx-os">${Object.entries(d.os).map(([o,l])=>`<div class="fsx-row"><span>${o}</span><span class="fsx-bar"><i class="lv${l}" style="width:${[6,50,100][l]}%"></i></span><b class="lv${l}t">${LV[l]}</b></div>`).join("")}</div>
    <div class="fsx-side"><div class="fsx-max"><span class="s-small">MAX FILE SIZE</span><b class="mono">${d.max}</b></div><p><b>Used for:</b> ${d.use}</p><div class="chips">${d.f.map(x=>`<span class="tag">${x}</span>`).join("")}</div></div>`;
    if(seen.size===Object.keys(FS).length)award("viz:fs",30,"Compared every file system");
  }
  el.addEventListener("click",e=>{const b=e.target.closest("[data-fs]");if(b){cur=b.dataset.fs;draw()}});draw();
})();

/* ---- MBR vs GPT ---- */
(function(){
  const el=$("#viz-part");if(!el)return;
  let style="MBR",tb=4;const tried=new Set();
  el.innerHTML=`<div class="viz-title">Partition a drive: MBR vs GPT</div>
  <div class="viz-controls"><button class="chip" data-st="MBR">MBR (BIOS)</button><button class="chip" data-st="GPT">GPT (UEFI)</button>
  <label class="rng">Drive size <input type="range" min="1" max="8" value="4" data-tb><b class="mono"></b></label></div>
  <div class="disk"></div><div class="caption" aria-live="polite"></div>`;
  function draw(){
    tried.add(style+(tb>2?"big":"small"));
    el.querySelectorAll("[data-st]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.st===style));
    $(".rng b",el).textContent=tb+" TB";
    const usable=style==="MBR"?Math.min(tb,2):tb,pct=usable/tb*100;
    const parts=style==="MBR"?[["System","p1",.05],["C:","p2",.55],["D:","p3",.3],["Recovery","p4",.1]]:[["EFI","p1",.03],["MSR","p4",.02],["C:","p2",.6],["D:","p3",.3],["Recovery","p4",.05]];
    $(".disk",el).innerHTML=`<div class="disk-used" style="width:${pct}%">${parts.map(([n,c,w])=>`<span class="dp ${c}" style="flex:${w}" title="${n}">${w>=.1?n:""}</span>`).join("")}</div>${pct<100?`<div class="disk-lost" style="width:${100-pct}%">${tb-usable} TB unusable</div>`:""}`;
    $(".caption",el).innerHTML=style==="MBR"
      ?`<b>MBR</b> holds the partition table in the first sector. Max <b>4 primary partitions</b> and <b>2 TB</b> per disk. ${tb>2?`<span class="status-bad">${tb-2} TB of this drive is wasted.</span> Switch to GPT.`:"This drive fits."}`
      :`<b>GPT</b> stores a backup copy of the partition table at the end of the disk. Windows allows <b>128 partitions</b> and drives far larger than 8 TB. Booting from GPT requires <b>UEFI</b>.`;
    if(tried.has("MBRbig")&&tried.has("GPTbig"))award("viz:part",20,"Compared MBR and GPT");
  }
  el.addEventListener("click",e=>{const b=e.target.closest("[data-st]");if(b){style=b.dataset.st;draw()}});
  el.addEventListener("input",e=>{if(e.target.matches("[data-tb]")){tb=+e.target.value;draw()}});draw();
})();

/* ---- Edition feature matrix ---- */
(function(){
  const el=$("#viz-ed");if(!el)return;
  const ED=["Home","Pro","Enterprise","Education"];
  const F=[["Join a domain or Entra ID",[0,1,1,1]],["BitLocker drive encryption",[0,1,1,1]],["Group Policy Editor (gpedit)",[0,1,1,1]],["Remote Desktop host",[0,1,1,1]],["Hyper-V",[0,1,1,1]],["Maximum RAM",["128 GB","2 TB","6 TB","2 TB"]],["How it is licensed",["Retail","Retail","Volume","Volume"]],["Remote Desktop client",[1,1,1,1]]];
  const seen=new Set();let cur=-1;
  el.innerHTML=`<div class="viz-title">Which Windows 11 edition does the job?</div>
  <p class="s-small" style="margin:0 0 10px">Click a feature row to see which editions include it.</p>
  <div class="scroll"><table class="edt"><thead><tr><th>Feature</th>${ED.map(e=>`<th>${e}</th>`).join("")}</tr></thead><tbody>
  ${F.map(([n,v],i)=>`<tr data-r="${i}" tabindex="0"><td>${n}</td>${v.map(x=>`<td class="${x===0?"ed-no":x===1?"ed-yes":"ed-val"}">${x===1?"✓":x===0?"✗":x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
  <div class="caption" aria-live="polite">Home is for consumers. Businesses usually need Pro or higher.</div>`;
  const NOTE=["Home can't join a domain. This is the most tested edition difference.","Home has only basic device encryption on some hardware. Full BitLocker with management needs Pro.","Home has no Local Group Policy Editor.","Home can connect out with Remote Desktop, but can't be connected to.","Hyper-V virtualization needs Pro or higher.","Home tops out at 128 GB, so workstations with more RAM need Pro or higher.","Enterprise and Education are sold through volume licensing to organizations and schools.","Every edition can connect out to another computer with Remote Desktop."];
  el.addEventListener("click",e=>{const r=e.target.closest("[data-r]");if(!r)return;cur=+r.dataset.r;seen.add(cur);
    el.querySelectorAll("[data-r]").forEach(x=>x.classList.toggle("sel",+x.dataset.r===cur));
    $(".caption",el).innerHTML=`<b>${F[cur][0]}.</b> ${NOTE[cur]}`;if(seen.size>=5)award("viz:ed",20,"Compared Windows editions")});
})();

  const NOTE={"chkdsk C: /f":"chkdsk can't fix the system drive while Windows is using it, so it schedules a check at the next restart.","df -h":"98% full on / is a problem worth fixing before the server stops writing logs.","ps aux | head -3":"nginx is using 87.5% CPU. top would show this live.","sfc /scannow":"Run it from an elevated prompt.","gpresult /r":"Shows which policies actually applied, handy when a setting isn't taking effect."};
  let os="win";const seen=new Set();
  el.innerHTML=`<div class="viz-title">Command console</div>
  <div class="viz-controls"><button class="chip" data-os="win">Windows</button><button class="chip" data-os="lin">Linux</button></div>

  function tabs(){

    {id:"tools",type:"match",title:"Pick the right Windows tool",

    {id:"build",title:"Install Windows for an accounting firm",mount(el,api,sim){

        ["Edition can join the domain and use BitLocker",()=>R.ed==="Pro","Home can't join a domain or use BitLocker. Enterprise needs a volume license the firm doesn't have."],

<script>
/* ================= Module 7: Security (Core 2, 220-1202) ================= */
(function(){
const LESSONS=[
{id:"physical",num:"7.1",title:"Physical security",short:"Physical",html:`
<p>Attackers who can touch hardware can bypass most software defenses, so security starts at the door.</p>
<div class="scroll"><table><thead><tr><th>Control</th><th>What it stops</th></tr></thead><tbody>
<tr><td>Bollards</td><td>Vehicles driving into buildings</td></tr>
<tr><td>Access control vestibule</td><td>Tailgating. Two doors, and only one opens at a time.</td></tr>
<tr><td>Badge reader, key fob, smart card</td><td>Unauthorized entry, and it logs who went in</td></tr>
<tr><td>Biometrics</td><td>Retina, fingerprint, palm print or face. Hard to share or steal.</td></tr>
<tr><td>Video surveillance and alarms</td><td>Deters intruders and records evidence</td></tr>
<tr><td>Motion sensors, lighting, fences</td><td>Detects and discourages intruders</td></tr>
<tr><td>Security guards</td><td>Verify identity and keep an access list</td></tr>
<tr><td>Door locks, equipment locks</td><td>Theft of laptops and servers (cable locks, locked racks)</td></tr>
<tr><td>Magnetometers</td><td>Metal detectors that screen people for weapons</td></tr>
</tbody></table></div>`},
{id:"logical",num:"7.2",title:"Logical security and authentication",short:"Logical",html:`
<ul><li><b>Principle of least privilege:</b> give users only the access they need for their job.</li>
<li><b>Zero trust:</b> verify every user and device on every request, even inside the network.</li>
<li><b>Access control lists (ACLs):</b> rules that allow or deny traffic or access.</li>
<li><b>Multifactor authentication (MFA)</b> combines different factors: something you <b>know</b> (password, PIN), something you <b>have</b> (hardware token, authenticator app, SMS code), and something you <b>are</b> (fingerprint, face). Two passwords is still one factor.</li>
<li><b>One-time passwords:</b> TOTP codes from an authenticator app change every 30 seconds. SMS, email and voice call codes are weaker because they can be intercepted.</li>
<li><b>SSO</b> lets one login reach many apps. <b>SAML</b> is a common standard for passing that login between systems.</li>
<li><b>Just-in-time (JIT) access</b> and <b>privileged access management (PAM)</b> give admin rights only when needed, then take them away.</li>
<li><b>MDM</b> manages mobile devices. <b>DLP</b> blocks sensitive data from leaving. <b>IAM</b> manages identities and their permissions.</li></ul>
<h3>Active Directory</h3>
<ul><li>A <b>domain</b> holds central user and computer accounts. <b>Organizational units (OUs)</b> group them for management.</li>
<li><b>Group Policy</b> pushes settings. <b>Security groups</b> grant permissions to many users at once.</li>
<li><b>Login scripts</b> run at sign-in (for example, to map drives). <b>Home folders</b> and <b>folder redirection</b> store users' files on a server.</li></ul>`},
{id:"wireless",num:"7.3",title:"Wireless security protocols",short:"Wireless",html:`
<div class="viz" id="viz-wifi"></div>
<ul><li><b>RADIUS:</b> central authentication for Wi-Fi (WPA2/WPA3-Enterprise), VPNs and switches. Uses UDP.</li>
<li><b>TACACS+:</b> Cisco's protocol for authenticating admins to network devices. Uses TCP and encrypts the whole exchange.</li>
<li><b>Kerberos:</b> ticket-based authentication used by Active Directory domains.</li></ul>`},
{id:"malware",num:"7.4",title:"Malware and how to remove it",short:"Malware",html:`
<div class="scroll"><table><thead><tr><th>Type</th><th>What it does</th></tr></thead><tbody>
<tr><td>Virus</td><td>Attaches to files and spreads when they run</td></tr>
<tr><td>Boot sector virus</td><td>Infects the boot sector, so it loads before the OS</td></tr>
<tr><td>Trojan</td><td>Pretends to be useful software</td></tr>
<tr><td>Rootkit</td><td>Hides deep in the OS with admin-level access. Hard to detect.</td></tr>
<tr><td>Ransomware</td><td>Encrypts files and demands payment</td></tr>
<tr><td>Spyware, keylogger</td><td>Watches activity, records keystrokes</td></tr>
<tr><td>Stalkerware</td><td>Spyware secretly installed to track a person</td></tr>
<tr><td>Cryptominer</td><td>Uses your CPU or GPU to mine cryptocurrency</td></tr>
<tr><td>Fileless malware</td><td>Runs only in memory, using built-in tools like PowerShell</td></tr>
<tr><td>Adware, PUP</td><td>Shows ads or installs unwanted extras</td></tr>
</tbody></table></div>
<p>Tools include antivirus, anti-malware, software firewalls, <b>EDR</b> (endpoint detection and response), <b>MDR</b> (managed detection and response, run by a provider), <b>XDR</b> (extended detection across endpoints, network and cloud), email security gateways, the Windows Recovery Environment, user education, and as a last resort, reinstalling the OS.</p>
<p>CompTIA tests a specific seven-step removal process:</p>
<div class="viz" id="viz-mal"></div>`},
{id:"social",num:"7.5",title:"Social engineering and other threats",short:"Threats",html:`
<p>People are the easiest system to hack. Find all the red flags in this message.</p>
<div class="viz" id="viz-phish"></div>
<ul><li><b>Phishing</b> is fake email. <b>Spear phishing</b> targets one person. <b>Whaling</b> targets executives. <b>Vishing</b> uses phone calls, <b>smishing</b> uses text messages, and <b>QR code phishing</b> hides a bad link in a QR code.</li>
<li><b>Business email compromise (BEC):</b> a real or spoofed executive account asks for wire transfers or gift cards.</li>
<li><b>Shoulder surfing</b> (watching a screen), <b>tailgating</b> (following someone through a door), <b>impersonation</b>, and <b>dumpster diving</b>.</li>
<li><b>DoS and DDoS:</b> flooding a service until it fails. <b>Evil twin:</b> a fake access point with a real network's name. <b>On-path:</b> intercepting traffic between two parties.</li>
<li><b>Zero-day:</b> a flaw with no patch yet. <b>Spoofing:</b> faking an address or identity. <b>Brute force</b> and <b>dictionary</b> attacks guess passwords.</li>
<li><b>SQL injection</b> sends database commands through form fields. <b>Cross-site scripting (XSS)</b> injects scripts into websites.</li>
<li><b>Insider threats</b>, <b>supply chain attacks</b>, and risky systems: <b>unpatched</b>, <b>end-of-life</b>, non-compliant, and unmanaged <b>BYOD</b> devices.</li></ul>`},
{id:"windows",num:"7.6",title:"Windows and workstation security",short:"Windows security",html:`
<ul><li><b>Microsoft Defender Antivirus</b> and <b>Windows Defender Firewall</b> are built in. Keep definitions updated.</li>
<li><b>Accounts:</b> Administrator, Standard user and Guest. Use a standard account day to day. <b>UAC</b> prompts before admin-level changes.</li>
<li><b>Sign-in options:</b> password, PIN, Windows Hello (face or fingerprint), passwordless and SSO.</li>
<li><b>BitLocker</b> encrypts whole drives. <b>BitLocker To Go</b> encrypts USB drives. <b>EFS</b> encrypts individual files on NTFS.</li></ul>
<div class="viz" id="viz-perm"></div>
<h3>Workstation best practices</h3>
<ul><li>Encrypt data at rest. Require complex passwords and set expirations where policy demands.</li>
<li>Set BIOS/UEFI passwords so settings and boot order can't be changed.</li>
<li>Lock the screen when you walk away (<kbd>Win</kbd>+<kbd>L</kbd>), use timeout locks, and log off when done.</li>
<li>Restrict login times, lock accounts after failed attempts, disable the Guest account, and rename or disable the default Administrator.</li>
<li>Disable AutoRun and AutoPlay so inserted media can't launch programs.</li>
<li>Secure PII and passwords. Never leave them on sticky notes.</li></ul>`},
{id:"mobile",num:"7.7",title:"Mobile security and data destruction",short:"Mobile and disposal",html:`
<ul><li><b>Screen locks:</b> face, fingerprint, PIN, pattern or swipe (swipe is not secure).</li>
<li><b>Remote wipe</b> and <b>locator apps</b> for lost devices. Limit failed login attempts so the device wipes or locks.</li>
<li>Keep the OS updated, encrypt the device, back up remotely, and consider antivirus and firewall apps.</li>
<li><b>BYOD vs corporate-owned:</b> BYOD devices usually get a separate work profile managed by MDM.</li></ul>
<h3>Data destruction</h3>
<ul><li><b>Physical destruction:</b> drilling, shredding, degaussing (magnetic HDDs and tapes only, not SSDs) and incineration.</li>
<li><b>Reuse:</b> a standard format only removes the file table, so data can be recovered. Use a secure erase or wipe tool to overwrite it.</li>
<li><b>Outsourcing:</b> a third-party vendor destroys the drives and provides a <b>certificate of destruction</b>.</li></ul>`},
{id:"soho",num:"7.8",title:"SOHO routers and browser security",short:"Routers and browsers",html:`
<ul><li><b>Router:</b> change the default admin password, update firmware, and allow management only from the inside network (or over HTTPS).</li>
<li><b>Wireless:</b> use WPA3 (or WPA2 with AES), change the default SSID, disable WPS, and isolate or disable guest access. Change channels to avoid interference.</li>
<li><b>Firewall:</b> close unused ports, forward only what's needed, and disable <b>UPnP</b> so devices can't open ports on their own. Put public servers in a <b>screened subnet</b> (DMZ).</li>
<li><b>Other:</b> IP filtering, content filtering, and placing the router where people can't touch it.</li></ul>
<h3>Browser security</h3>
<ul><li>Download browsers and extensions only from trusted sources. Verify installers with their published <b>hash</b>.</li>
<li>Look for HTTPS and a valid certificate. Certificate warnings mean stop.</li>
<li>Use a <b>password manager</b>, a pop-up blocker and an ad blocker. Remove unknown extensions.</li>
<li>Clear the cache and cookies when troubleshooting. Private browsing doesn't save history, but it doesn't hide you from your employer or ISP.</li>
<li>Browser sync, proxy settings and secure DNS (DNS over HTTPS) are configured in the browser's settings.</li></ul>`}
];

{id:"boot",num:"8.1",title:"Windows boot and stability problems",short:"Boot and stability",html:`
<div class="scroll"><table><thead><tr><th>Symptom</th><th>Common fixes</th></tr></thead><tbody>
<tr><td>Blue screen (BSOD)</td><td>Note the stop code. Roll back the latest driver or update, test RAM, check temperatures.</td></tr>
<tr><td>Won't boot, or boot loops</td><td>Startup Repair, Safe Mode, uninstall the latest update, System Restore</td></tr>
<tr><td>"No OS found"</td><td>Check boot order and remove USB drives, then repair the boot loader</td></tr>
<tr><td>Frequent shutdowns</td><td>Overheating or power (hardware). Check Event Viewer for the reason.</td></tr>
<tr><td>Services fail to start</td><td>Check dependencies and the account it runs as in services.msc. Restart the service.</td></tr>
<tr><td>System instability</td><td>Recent changes, failing RAM or drive, malware, corrupted system files (sfc)</td></tr>
<tr><td>Slow profile load</td><td>Large roaming profile, network problems, or a corrupted profile. Rebuild the profile.</td></tr>
<tr><td>Time drift</td><td>Dead CMOS battery or a time sync (NTP) problem. Wrong time breaks domain logins and certificates.</td></tr>
<tr><td>USB controller resource warnings</td><td>Too many devices on one controller. Move some to another port or controller.</td></tr>
</tbody></table></div>
<p>When Windows fails to start twice, it opens the <b>Windows Recovery Environment (WinRE)</b>. Explore its tools:</p>
<div class="viz" id="viz-winre"></div>`},
{id:"perf",num:"8.2",title:"Performance and application problems",short:"Performance",html:`
<p>Task Manager is where most performance investigations start. Pick a complaint, then click the process causing it.</p>
<div class="viz" id="viz-tm"></div>
<ul><li><b>Degraded performance:</b> too many startup apps, not enough RAM, a full or failing drive, malware, or thermal throttling.</li>
<li><b>Low memory warnings:</b> close apps, check for a memory leak (one app's memory keeps growing), add RAM.</li>
<li><b>App crashes:</b> update, repair or reinstall the app. Check Event Viewer's Application log and the app's requirements.</li>
<li><b>App won't install:</b> check requirements, disk space, permissions (run as administrator), and 32 vs 64-bit.</li></ul>`},
{id:"ladder",num:"8.3",title:"Fixing Windows: from gentle to drastic",short:"Repair ladder",html:`
<p>Always try the least disruptive fix first. Each rung fixes more but risks more data or time.</p>
<div class="viz" id="viz-ladder"></div>
<div class="tip"><b>Exam tip.</b> When a question says a problem began after an update or driver install, the answer is usually to <b>roll back</b> that change. When files must be kept, avoid reimaging.</div>`},
{id:"mobile",num:"8.4",title:"Mobile OS and app problems",short:"Mobile issues",html:`
<p>Tap a symptom on the phone to see the likely cause and fix.</p>
<div class="viz" id="viz-phone"></div>
<ul><li>The usual order: close and reopen the app, restart the device, update the app and OS, clear the app's cache or storage, reinstall the app, and finally factory reset (after a backup).</li>
<li><b>Won't update:</b> check storage space, battery level (updates often need 50%+), Wi-Fi, and whether the device is still supported.</li></ul>`},
{id:"mobsec",num:"8.5",title:"Mobile security problems",short:"Mobile security",html:`
<h3>Risky setups</h3>
<ul><li><b>Sideloading APKs</b> from outside Google Play skips app store security checks.</li>
<li><b>Developer mode</b> left on exposes debugging features.</li>
<li><b>Rooting</b> (Android) or <b>jailbreaking</b> (iOS) removes built-in protections. Many MDM policies block these devices.</li>
<li><b>Bootleg or spoofed apps</b> imitate real apps to steal data.</li></ul>
<h3>Symptoms of compromise</h3>
<ul><li>High network traffic, or a warning about reaching the data limit</li>
<li>Sluggish response and high battery drain</li>
<li>Limited or no internet connectivity</li>
<li>Unexpected app behavior, or apps you didn't install</li>
<li>Leaked personal files or data</li></ul>
<p><b>Response:</b> check for unknown apps and remove them, run an anti-malware scan, update the OS, reset passwords, and factory reset if it persists.</p>`},
{id:"pcsec",num:"8.6",title:"PC and browser security symptoms",short:"PC security",html:`
<ul><li><b>Can't reach the network</b>, often because malware changed proxy or DNS settings, or a firewall blocked it.</li>
<li><b>Desktop alerts</b> and <b>fake antivirus warnings</b> that demand payment (scareware).</li>
<li><b>Altered files:</b> missing, renamed or inaccessible files, a sign of ransomware.</li>
<li><b>Unwanted notifications</b> from websites that were allowed to push alerts.</li>
<li><b>OS update failures</b>: malware often blocks updates and security tools.</li></ul>
<h3>Browser symptoms</h3>
<ul><li><b>Random pop-ups:</b> adware or a malicious extension. Remove unknown extensions and enable the pop-up blocker.</li>
<li><b>Certificate warnings:</b> a wrong system clock, an expired or self-signed certificate, or an on-path attack. Don't click through on unknown sites.</li>
<li><b>Redirection</b> to unexpected sites: a hijacked browser, modified hosts file or DNS settings.</li>
<li><b>Degraded browser performance:</b> too many extensions or tabs, a full cache, or a cryptomining script.</li></ul>`}
];

 {q:"An app won't install, saying it requires a 64-bit OS. What is true?",o:["The PC runs a 32-bit OS","The disk is full","The app is malware","UAC blocked it"],a:0,e:"64-bit apps can't run on a 32-bit OS."},

 {q:"A phone's battery drains quickly after installing a new app. What should be checked?",o:["Battery usage by app in Settings","The SIM card","The case","Screen resolution only"],a:0,e:"Battery settings show which app uses the most power."},

  viz(){

(function(){

    ["Startup Repair","🔧","Automatically fixes problems that stop Windows from loading, such as a damaged boot configuration."],

/* ---- Task Manager detective ---- */
(function(){
  const el=$("#viz-tm");if(!el)return;
  const SC={
    slow:{name:"\"Everything is slow\"",rows:[["Microsoft Edge (38 tabs)",4,"6,912 MB",1,0],["Microsoft Teams",3,"812 MB",0,0],["Antimalware Service",2,"190 MB",1,0],["File Explorer",0,"88 MB",0,0],["Spooler subsystem app",0,"12 MB",0,0]],ans:0,sort:"mem",

      slots:[["drv","BSOD after a new GPU driver",""],["upd","Boot loop after Patch Tuesday",""],["sfc","Windows reports corrupted system files",""],["prof","User gets a temporary profile",""],["svc","Backup service fails after a password change",""],["boot","Four-minute boot, 30 startup apps",""],["time","Clock wrong, domain login fails",""],["nos","\"No OS found\" on Monday morning",""]],

    {id:"tickets",title:"Work the ticket queue",mount(el,api,sim){

<script>
/* ================= Module 9: Operational Procedures (Core 2, 220-1202) ================= */
(function(){
const LESSONS=[
{id:"docs",num:"9.1",title:"Documentation, ticketing and asset management",short:"Documentation",html:`
<h3>Ticketing systems</h3>
<ul><li>A good ticket records <b>user information</b>, <b>device information</b>, a <b>description</b>, a <b>category</b>, a <b>severity</b> and the <b>escalation level</b>.</li>
<li>Write clearly: a <b>problem description</b> anyone can follow, <b>progress notes</b> as you work, and the <b>problem resolution</b> when you close it.</li></ul>
<h3>Asset management</h3>
<ul><li><b>Inventory lists</b> and a <b>configuration management database (CMDB)</b> track every device and how it's set up.</li>
<li><b>Asset tags and IDs</b> link physical devices to records, including the <b>assigned user</b>, <b>warranty</b> and <b>licensing</b>.</li>
<li>The <b>procurement life cycle</b> covers buying, deploying, maintaining and disposing of equipment.</li></ul>
<h3>Document types</h3>
<div class="scroll"><table><thead><tr><th>Document</th><th>Purpose</th></tr></thead><tbody>
<tr><td>Acceptable use policy (AUP)</td><td>What users may and may not do with company systems</td></tr>
<tr><td>Network topology diagram</td><td>Map of how the network is connected</td></tr>
<tr><td>Regulatory compliance requirements</td><td>Rules the company must follow, like HIPAA or PCI DSS</td></tr>
<tr><td>Splash screen</td><td>A login banner warning that use is monitored</td></tr>
<tr><td>Incident report</td><td>Records what happened during a security or safety incident</td></tr>
<tr><td>Standard operating procedure (SOP)</td><td>Step-by-step instructions, like installing a custom software package</td></tr>
<tr><td>New user and offboarding checklists</td><td>Make sure accounts and equipment are set up, and later removed, every time</td></tr>
<tr><td>Service-level agreement (SLA)</td><td>Promised response and resolution times, with internal teams or external vendors</td></tr>
<tr><td>Knowledge base article</td><td>Documented fixes so problems are solved faster next time</td></tr>
</tbody></table></div>`},
{id:"change",num:"9.2",title:"Change management",short:"Change management",html:`
<p>Uncontrolled changes cause outages. Change management makes every change planned, approved, tested and reversible.</p>
<div class="viz" id="viz-change"></div>
<ul><li><b>Request form:</b> the purpose, scope, change type, date and time, affected systems and impact.</li>
<li><b>Risk analysis:</b> assigns a risk level.</li>
<li><b>Change advisory board (CAB):</b> approves or rejects the change.</li>
<li><b>Sandbox testing:</b> try the change in an isolated environment first.</li>
<li>Have a <b>rollback plan</b> and a <b>backup plan</b>, and name the <b>responsible staff member</b>.</li>
<li><b>Peer review</b> checks the work. <b>End-user acceptance</b> confirms it works for the people who use it.</li></ul>`},
{id:"backup",num:"9.3",title:"Backup and recovery",short:"Backups",html:`
<p>Pick a backup scheme, then pick the day the drive fails to see which backups you'd need to restore.</p>
<div class="viz" id="viz-backup"></div>
<ul><li><b>Full:</b> everything. Slowest to back up, fastest to restore.</li>
<li><b>Incremental:</b> changes since the <b>last backup of any kind</b>. Fastest backups, but restore needs the full plus <b>every</b> incremental.</li>
<li><b>Differential:</b> changes since the <b>last full</b>. Grows each day, but restore needs only the full plus the <b>latest</b> differential.</li>
<li><b>Synthetic full:</b> built by combining a full with later incrementals, without re-reading the source.</li>
<li><b>3-2-1 rule:</b> 3 copies of data, on 2 types of media, with 1 offsite.</li>
<li><b>Grandfather-father-son (GFS):</b> a rotation of monthly, weekly and daily backups.</li>
<li><b>Test your backups</b> regularly by actually restoring them. Untested backups may not work.</li></ul>`},
{id:"safety",num:"9.4",title:"Safety and environmental controls",short:"Safety",html:`
<ul><li><b>ESD:</b> wear an antistatic wrist strap, work on an ESD mat, and store parts in antistatic bags.</li>
<li><b>Equipment grounding</b> sends fault current safely to earth. Never remove the ground pin.</li>
<li><b>Disconnect power</b> before working inside equipment. Never open a power supply or CRT: they hold dangerous charges.</li>
<li><b>Lift with your legs</b>, keep your back straight, and get help with heavy items.</li>
<li><b>Electrical fires</b> need a Class C fire extinguisher (CO₂ or dry chemical). Never use water.</li>
<li>Wear <b>safety goggles</b> and an <b>air filtration mask</b> when dealing with dust, toner or chemicals.</li>
<li>Follow government regulations, like OSHA rules.</li></ul>
<h3>Environmental impacts</h3>
<ul><li><b>Safety data sheets (SDS/MSDS)</b> explain how to handle and dispose of materials like toner and batteries.</li>
<li>Control <b>temperature</b>, <b>humidity</b> (too low means static, too high means condensation) and <b>ventilation</b>.</li>
<li>Clean dust with compressed air or an ESD-safe vacuum.</li>
<li><b>Power problems:</b> surges and spikes (surge suppressor), brownouts (sags) and blackouts (UPS). A <b>UPS</b> provides battery power long enough to shut down safely.</li>
<li>Recycle batteries, toner and electronics through proper channels. Never throw them in the trash.</li></ul>`},
{id:"privacy",num:"9.5",title:"Prohibited content, privacy and licensing",short:"Privacy and licensing",html:`
<h3>Incident response</h3>
<ul><li><b>Identify</b> the prohibited content or activity, then <b>report</b> it through proper channels (management, and law enforcement if required).</li>
<li><b>Preserve the data and device.</b> Make a copy of the drive for analysis so the original stays intact.</li>
<li><b>Document</b> everything, and keep a <b>chain of custody</b>: a record of who handled the evidence and when.</li></ul>
<h3>Licensing</h3>
<ul><li><b>EULA:</b> the end-user license agreement you accept when installing software.</li>
<li><b>DRM:</b> digital rights management technology that limits copying.</li>
<li><b>Perpetual vs subscription</b> licenses. <b>Personal vs corporate</b> use. Make sure licenses are valid and not expired.</li>
<li><b>Open-source</b> licenses allow using and modifying the code, under the license's terms.</li></ul>
<h3>Regulated data</h3>
<ul><li><b>PII</b> (personally identifiable information), <b>credit card data</b> (PCI DSS), <b>healthcare data</b> (HIPAA, PHI), and <b>government-issued information</b>.</li>
<li>Follow <b>data retention</b> requirements: keep data as long as required, then dispose of it properly.</li></ul>`},
{id:"pro",num:"9.6",title:"Communication and professionalism",short:"Professionalism",html:`
<ul><li>Use proper language. Avoid jargon, acronyms and slang with users.</li>
<li>Keep a positive attitude and project confidence.</li>
<li><b>Actively listen.</b> Take notes, don't interrupt, and repeat back what you heard.</li>
<li>Be culturally sensitive. Use appropriate titles.</li>
<li>Be on time. If you'll be late, contact the customer.</li>
<li><b>Avoid distractions:</b> no personal calls, texts, social media or personal visits on the job.</li>
<li><b>Difficult customers:</b> don't argue or be defensive, don't dismiss their problem, don't post about it on social media. Clarify by asking open-ended questions.</li>
<li><b>Set and meet expectations:</b> give a timeline, offer repair or replacement options, provide documentation, and follow up to confirm satisfaction.</li>
<li><b>Confidential materials:</b> don't look at or touch the customer's documents, desk, printouts or screen.</li></ul>`},
{id:"script",num:"9.7",title:"Scripting basics",short:"Scripting",html:`
<div class="viz" id="viz-script"></div>
<ul><li><b>Use cases:</b> basic automation, restarting machines, remapping network drives, installing applications, automated backups, gathering information, and starting updates.</li>
<li><b>Risks:</b> accidentally introducing malware (from untrusted scripts), changing system settings unintentionally, and crashing a browser or system by mishandling resources (for example, an endless loop).</li>
<li>Scripts use <b>variables</b>, <b>loops</b>, <b>conditionals</b> (if/else), <b>comments</b> and basic <b>data types</b> like strings and integers.</li></ul>`},
{id:"remote",num:"9.8",title:"Remote access technologies",short:"Remote access",html:`
<div class="viz" id="viz-remote"></div>
<ul><li><b>Third-party tools:</b> screen-sharing, video conferencing, file transfer software and desktop management tools.</li>
<li><b>Security:</b> use MFA, strong encryption and least privilege. Never expose RDP directly to the internet. Always get the user's permission before taking control of their screen.</li></ul>`},
{id:"ai",num:"9.9",title:"Basic AI concepts",short:"AI basics",html:`
<ul><li><b>Application integration:</b> AI features are built into many apps, like email drafting, search and help desk chatbots.</li>
<li><b>Policy:</b> follow your organization's rules on appropriate use. Passing off AI-written work as your own can be plagiarism.</li>
<li><b>Limitations:</b> AI can show <b>bias</b> from its training data, produce <b>hallucinations</b> (confident but false answers) and make accuracy mistakes. Verify important output.</li>
<li><b>Private vs public AI:</b> public tools may store or learn from what you type. Never paste confidential or regulated data into a public AI tool. Private (company-hosted or contracted) AI keeps data under the organization's control.</li>
<li>Consider data security, where the AI's data comes from, and data privacy.</li></ul>`}
];

  viz(){
/* ---- Change management flow ---- */
(function(){
  const el=$("#viz-change");if(!el)return;
  const S=[
    ["Request","Submit a change request: upgrade the file server's firmware. Purpose: fix a security flaw. Scope: one server. Affected systems: shared drives."],
    ["Risk analysis","Risk level: medium. Shared drives will be offline for 20 minutes. If the update fails, the server may not boot."],
    ["CAB approval","The change advisory board approves it for Saturday at 7 a.m., outside business hours."],
    ["Sandbox test","The firmware is tested on an identical spare server first. It works."],
    ["Plans ready","Backup taken. Rollback plan: reflash the old firmware from the saved image. Responsible staff member: Dana."],
    ["Implement","Dana applies the update Saturday at 7 a.m. A peer reviews the result."],
    ["User acceptance","Monday morning, the finance team confirms they can open and save files."],
    ["Document","The change record is closed with notes, and the CMDB is updated with the new firmware version."]
  ];
  let i=-1;
  el.innerHTML=`<div class="viz-title">Follow a change from request to close</div>
  <div class="chg">${S.map((s,j)=>`<div class="chg-st" id="cg${j}"><span class="mono">${j+1}</span>${s[0]}</div>`).join("")}</div>
  <div class="caption" aria-live="polite">Press <b>Next step</b>.</div>
  <div class="viz-controls"><button class="btn" data-a="back">Back</button><button class="btn primary" data-a="next">Next step</button></div>`;
  function draw(){
    S.forEach((_,j)=>$("#cg"+j).className="chg-st"+(j<i?" done":j===i?" on":""));
    $(".caption",el).innerHTML=i<0?"Press <b>Next step</b>.":`<b>${S[i][0]}.</b> ${S[i][1]}`;
    $('[data-a="back"]',el).disabled=i<0;$('[data-a="next"]',el).disabled=i>=S.length-1;
    if(i===S.length-1)award("viz:change",20,"Followed a change through");
  }
  el.addEventListener("click",e=>{const a=e.target.closest("[data-a]")?.dataset.a;if(a==="next")i=Math.min(i+1,S.length-1);if(a==="back")i=Math.max(i-1,-1);if(a)draw()});draw();
})();

/* ---- Backup scheme simulator ---- */
(function(){
  const el=$("#viz-backup");if(!el)return;
  const D=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],CH=[0,8,6,9,7,10,4];
  const SCH={full:"Full every day",inc:"Full Sunday + incremental",diff:"Full Sunday + differential"};
  let sch="inc",fail=4;const seen=new Set();
  el.innerHTML=`<div class="viz-title">Backup scheme simulator</div>
  <div class="viz-controls">${Object.entries(SCH).map(([k,n])=>`<button class="chip" data-sch="${k}">${n}</button>`).join("")}</div>
  <div class="bk"></div>
  <div class="bk-fail"><span class="s-small">DRIVE FAILS ON</span><div class="chips">${D.slice(1).map((d,j)=>`<button class="chip" data-f="${j+1}">${d}</button>`).join("")}</div></div>
  <div class="caption" aria-live="polite"></div>`;
  function draw(){
    seen.add(sch);
    el.querySelectorAll("[data-sch]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.sch===sch));
    el.querySelectorAll("[data-f]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.f===fail));
    const FULL=50;let cum=0;
    const sets=D.map((d,j)=>{let size,type;
      if(j===0||sch==="full"){size=FULL;type="Full";cum=0}
      else if(sch==="inc"){size=CH[j];type="Incr"}
      else{cum+=CH[j];size=cum;type="Diff"}
      return {d,size,type}});
    const last=fail-1;let need;
    if(sch==="full")need=[last];else if(sch==="inc")need=[...Array(last+1).keys()];else need=last===0?[0]:[0,last];
    $(".bk",el).innerHTML=sets.map((s,j)=>`<div class="bk-d ${j>=fail?"future":""} ${need.includes(j)?"need":""}"><div class="bk-bar"><i class="t-${s.type}" style="height:${s.size/FULL*100}%"></i></div><b class="mono">${s.type}</b><span>${s.d}</span><em class="s-small">${s.size} GB</em></div>`).join("");
    const time=sets.slice(0,7).reduce((a,s)=>a+s.size,0);
    $(".caption",el).innerHTML=`To restore after <b>${D[fail]}</b>'s failure you need <b>${need.length} backup set${need.length>1?"s":""}</b>: ${need.map(j=>D[j]+" ("+sets[j].type.replace("Incr","incremental").replace("Diff","differential").replace("Full","full")+")").join(", ")}. `+
      (sch==="full"?"Fastest restore, but the week's backups use "+time+" GB.":sch==="inc"?"The smallest daily backups, but the restore needs every set in order. Lose one and the chain breaks.":"Daily backups grow until the next full, but the restore needs only two sets.");
    if(seen.size===3)award("viz:backup",30,"Compared backup schemes");
  }
  el.addEventListener("click",e=>{const s=e.target.closest("[data-sch]"),f=e.target.closest("[data-f]");if(s)sch=s.dataset.sch;if(f)fail=+f.dataset.f;if(s||f)draw()});draw();
})();

/* ---- Script sampler ---- */
(function(){
  const el=$("#viz-script");if(!el)return;
  const SC={
    ".bat":["Windows batch","Map a drive at login","@echo off\nREM Map the finance share\nnet use Z: \\\\fs01\\finance /persistent:yes\necho Drive mapped."],
    ".ps1":["PowerShell","Restart a stuck service on many PCs","# Restart the print spooler on each PC\n$pcs = Get-Content .\\pcs.txt\nforeach ($pc in $pcs) {\n    Restart-Service -Name Spooler -ComputerName $pc\n}"],
    ".vbs":["VBScript","Legacy Windows automation","' Show a message to the user\nDim msg\nmsg = \"Updates will install tonight.\"\nMsgBox msg"],
    ".sh":["Bash shell (Linux and macOS)","Nightly backup","#!/bin/bash\n# Back up the web folder with today's date\nDATE=$(date +%F)\ntar -czf /backup/web-$DATE.tar.gz /var/www\necho \"Backup done: $DATE\""],
    ".js":["JavaScript","Web pages and automation with Node.js","// Warn when disk space is low\nconst freeGB = 4;\nif (freeGB < 10) {\n  console.log(\"Low disk space!\");\n}"],
    ".py":["Python","Gather information from many systems","# Check which hosts answer\nimport subprocess\nfor host in [\"10.0.0.1\", \"10.0.0.10\"]:\n    r = subprocess.run([\"ping\", \"-c\", \"1\", host])\n    print(host, \"up\" if r.returncode == 0 else \"down\")"]
  };
  const seen=new Set();let cur=".ps1";
  el.innerHTML=`<div class="viz-title">Script types and what they look like</div>
  <div class="viz-controls">${Object.keys(SC).map(k=>`<button class="chip mono" data-x="${k}">${k}</button>`).join("")}</div>
  <div class="scr-h"></div><pre class="term"></pre>
  <p class="s-small">Spot the building blocks: <span class="kw-c">comments</span>, <span class="kw-v">variables</span>, <span class="kw-l">loops and conditionals</span>.</p>`;
  function hl(code,ext){
    const esc=code.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    return esc.split("\n").map(l=>{
      if(/^\s*(REM|#|'|\/\/)/.test(l)&&!/^#!/.test(l))return `<span class="kw-c">${l}</span>`;
      return l.replace(/\b(foreach|for|if|else|in)\b/g,'<span class="kw-l">$1</span>').replace(/(\$[A-Za-z]+|\bDim\b|\bconst\b)/g,'<span class="kw-v">$1</span>');
    }).join("\n");
  }
  function draw(){
    const s=SC[cur];seen.add(cur);
    el.querySelectorAll("[data-x]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.x===cur));
    $(".scr-h",el).innerHTML=`<b>${cur}</b> is a <b>${s[0]}</b> script. Example use: ${s[1]}.`;
    $(".term",el).innerHTML=hl(s[2],cur);
    if(seen.size===6)award("viz:script",20,"Explored every script type");
  }
  el.addEventListener("click",e=>{const b=e.target.closest("[data-x]");if(b){cur=b.dataset.x;draw()}});draw();
})();

  <div class="rmt"><div class="rmt-link"><div class="rmt-pc"><span>Technician</span></div><div class="rmt-wire"><b class="mono"></b><i></i></div><div class="rmt-pc"><span class="rmt-t"></span></div></div><div class="caption" aria-live="polite"></div></div>`;
  function draw(){
    const r=R[cur];seen.add(cur);
    el.querySelectorAll("[data-r]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.r===cur));
    $(".rmt-wire b",el).textContent=cur+" · "+r[0];
    $(".rmt-wire",el).className="rmt-wire k-"+r[3][0];
    $(".rmt-t",el).textContent=r[3][1]==="vm"?"Virtual machine":r[3][0]==="net"?"Office network":r[3][0]==="cli"?"Server (terminal)":r[3][1]==="win"?"Windows desktop":"Remote screen";
    $(".caption",el).innerHTML=`<b>${r[1]}.</b> ${r[2]}`;

})();
  },
  sims:[
    {id:"restore",title:"Restore the file server",mount(el,api,sim){
      const D=["Sun","Mon","Tue","Wed","Thu","Fri"];
      const C=[
        {name:"Server A",scheme:"Full on Sunday, incremental every other night",type:"Incr",fail:"Friday morning",ans:[0,1,2,3,4]},
        {name:"Server B",scheme:"Full on Sunday, differential every other night",type:"Diff",fail:"Friday morning",ans:[0,4]}
      ];
      let pick=[new Set(),new Set()],graded=null;
      function draw(){

        <p class="scenario">Two servers failed on Friday morning before their nightly backup ran. Select <b>only</b> the backup sets you need to restore each one to Thursday night. Using extra sets wastes hours of restore time.</p>
        ${C.map((c,ci)=>`<div class="rst ${graded?(graded[ci]?"ok":"no"):""}"><div class="rst-h"><b>${c.name}</b><span class="s-small">${c.scheme}</span></div>
          <div class="tapes">${D.slice(0,5).map((d,j)=>`<button class="tape ${pick[ci].has(j)?"sel":""}" data-c="${ci}" data-j="${j}"><b class="mono">${j===0?"Full":c.type}</b><span>${d}</span></button>`).join("")}</div>
          ${graded&&!graded[ci]?`<p class="tk-e">${c.type==="Incr"?"Each incremental only holds one day's changes, so you need the full plus every incremental since.":"Each differential holds everything since the full, so you need only the full and the latest differential."}</p>`:""}</div>`).join("")}
        <div class="caption" aria-live="polite">${graded?(graded.every(Boolean)?`<span class="status-good">Both servers restored with the minimum sets.</span>`:"Not quite. Read the notes and try again."):"Tap backup sets to select them."}</div>
        <div class="viz-controls"><button class="btn primary" data-a="grade">Start restore</button><button class="btn" data-a="reset">Clear</button></div>`;
      }
      el.addEventListener("click",e=>{const t=e.target.closest("[data-j]");if(t){const s=pick[+t.dataset.c],j=+t.dataset.j;s.has(j)?s.delete(j):s.add(j);graded=null;draw();return}
        const a=e.target.closest("[data-a]")?.dataset.a;if(a==="reset"){pick=[new Set(),new Set()];graded=null;draw()}
        if(a==="grade"){graded=C.map((c,ci)=>pick[ci].size===c.ans.length&&c.ans.every(j=>pick[ci].has(j)));if(graded.every(Boolean))api.pass();draw()}});
      draw();
    }},

      success:"The evidence is preserved and admissible."},

      slots:[["aup","Can employees stream video at work?",""],["sla","How fast must the vendor respond?",""],["sop","Steps to image a new laptop",""],["sds","How to dispose of toner",""],["kb","Fix for a printer error, saved for next time",""],["cr","Plan to upgrade the firewall Saturday",""],["ir","What happened during last night's breach",""],["eula","Terms you accept installing software",""]],
      success:"Every situation is matched to the right paperwork."}
  ],
  badges:[
    ["reader","OP","Professional","Mark all 9 operational procedures lessons studied",c=>c.allStudied()],
    ["lab","BK","Backup Boss","Complete all 4 operational procedures diagrams",c=>c.vizAll()],
    ["restore","RS","Restorer","Pass the restore simulation",c=>c.passed("restore")],
    ["evidence","CC","Chain of Custody","Pass the prohibited content simulation",c=>c.passed("evidence")],
    ["docsmatch","DX","Documentarian","Pass the documentation simulation",c=>c.passed("docsmatch")],

});
