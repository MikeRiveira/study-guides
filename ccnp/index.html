(function(){
const LESSONS=[
{id:"diag",num:"4.1",title:"Diagnosing problems: debugs, ping, traceroute, syslog and SNMP",html:`
<p>Assurance means knowing the network works, and finding out quickly when it doesn't. The first set of tools is built into every IOS XE device.</p>
<h3>Debugs and conditional debugs</h3>
<ul><li><code>debug</code> prints events as they happen (<code>debug ip ospf adj</code>, <code>debug ip bgp</code>, <code>debug crypto isakmp</code>). Output goes to the console, or to a VTY session after <code>terminal monitor</code>.</li>
<li>Debugs run at high priority and can overload the CPU. <code>debug ip packet</code> on a busy router is the classic outage. Narrow it with an ACL (<code>debug ip packet 101 detail</code>) or a <b>condition</b>.</li>
<li><b>Conditional debugging</b> limits debug output to matching traffic or interfaces: <code>debug condition interface g0/0/1</code> or <code>debug condition ip 10.1.1.10</code>. Check with <code>show debugging</code> and <code>show debug condition</code>.</li>
<li>Always know how to stop: <code>undebug all</code> (or <code>no debug all</code>). Use <code>logging buffered</code> rather than the console so a flood doesn't lock you out.</li></ul>
<div class="viz" id="viz-condebug"></div>
<h3>Extended ping and traceroute</h3>
<ul><li><b>Extended ping</b> (type <code>ping</code> with no address) sets the source address or interface, repeat count, size, DF bit and more. <code>ping 10.9.9.9 source loopback0</code> tests the <b>return path</b> to that source, which a plain ping from the exit interface doesn't.</li>
<li>Ping output: <code>!</code> reply, <code>.</code> timeout, <code>U</code> unreachable, <code>M</code> could not fragment (DF set and the MTU is too small), <code>Q</code> source quench, <code>&amp;</code> TTL exceeded.</li>
<li><b>Traceroute</b> sends probes with TTL 1, 2, 3... Each router that decrements TTL to zero returns an ICMP <b>time exceeded</b>, revealing itself. Cisco traceroute uses UDP to high ports; the destination answers with <b>port unreachable</b>. <code>*</code> means no reply for that probe (often a filter, not a failure).</li></ul>
<div class="viz" id="viz-trace"></div>
<h3>Syslog</h3>
<table><tr><th>Level</th><th>Keyword</th><th>Example</th></tr>
<tr><td>0</td><td>emergencies</td><td>System unusable</td></tr><tr><td>1</td><td>alerts</td><td>Immediate action needed</td></tr><tr><td>2</td><td>critical</td><td>Hardware failure</td></tr><tr><td>3</td><td>errors</td><td>Interface errors</td></tr><tr><td>4</td><td>warnings</td><td>Configuration warnings</td></tr><tr><td>5</td><td>notifications</td><td>Interface up/down, config changes</td></tr><tr><td>6</td><td>informational</td><td>ACL hits, normal events</td></tr><tr><td>7</td><td>debugging</td><td>Debug output</td></tr></table>
<p>A level setting includes everything <b>more severe</b>: <code>logging trap warnings</code> sends levels 0 to 4 to the syslog server. A memory aid: "<b>E</b>very <b>A</b>wesome <b>C</b>isco <b>E</b>ngineer <b>W</b>ill <b>N</b>eed <b>I</b>ce cream <b>D</b>aily". Messages look like <code>%LINEPROTO-5-UPDOWN: Line protocol on Interface Gi0/0/1, changed state to down</code>: facility, severity, mnemonic, text. Syslog uses UDP 514 by default (TCP is possible). Add <code>service timestamps log datetime msec</code> and NTP so the times mean something.</p>
<div class="viz" id="viz-syslog"></div>
<h3>SNMP</h3>
<ul><li>The <b>manager</b> (NMS) polls <b>agents</b> on devices with GET/GETNEXT/GETBULK on UDP 161 and changes values with SET. Agents send <b>traps</b> (unacknowledged) or <b>informs</b> (acknowledged) to UDP 162.</li>
<li>Values live in the <b>MIB</b>, identified by <b>OIDs</b> like 1.3.6.1.2.1.1.5 (sysName).</li>
<li><b>SNMPv1/v2c</b> authenticate with a plain-text community string. v2c adds GETBULK and informs.</li>
<li><b>SNMPv3</b> adds users and three security levels: <b>noAuthNoPriv</b> (username only), <b>authNoPriv</b> (HMAC with SHA), <b>authPriv</b> (authentication plus AES encryption).</li></ul>
<pre class="term">snmp-server group NMS v3 priv
snmp-server user nmsuser NMS v3 auth sha Auth!Pass priv aes 128 Priv!Pass
snmp-server host 10.0.0.50 version 3 priv nmsuser
snmp-server enable traps</pre>
<div class="viz" id="viz-snmpver"></div>
<div class="tip"><b>Exam tip.</b> logging trap N sends N and everything lower (more severe). SNMPv3 authPriv = auth + encryption. Conditional debugs keep debug output (and CPU) under control.</div>`},
{id:"fnf",num:"4.2",title:"NetFlow and Flexible NetFlow",html:`
<p>SNMP tells you <i>how much</i> traffic crossed an interface. <b>NetFlow</b> tells you <i>who was talking to whom</i>: per-flow statistics for capacity planning, billing, troubleshooting and security (spotting scans and data exfiltration).</p>
<ul><li>A <b>flow</b> is a set of packets sharing the same <b>key fields</b>. Traditional NetFlow uses seven: source and destination IP, source and destination port, protocol, ToS byte and input interface.</li>
<li>The router keeps a <b>flow cache</b>. A flow is exported to a <b>collector</b> when it ends (FIN/RST), goes idle (<b>inactive timeout</b>, 15 s default) or has run a long time (<b>active timeout</b>, 30 min default).</li>
<li>Versions: <b>v5</b> fixed format, IPv4 only. <b>v9</b> template-based, so it can carry any fields including IPv6 and MPLS. <b>IPFIX</b> is the IETF standard based on v9 (sometimes called v10).</li></ul>
<h3>Flexible NetFlow (FNF)</h3>
<p>FNF separates the configuration into three reusable pieces, then applies them to an interface:</p>
<ol><li><b>Flow record</b>: which fields are <b>keys</b> (<code>match</code>: they define a flow) and which are <b>non-key</b> data to collect (<code>collect</code>: counters, timestamps).</li>
<li><b>Flow exporter</b>: where to send it (<code>destination</code>, <code>transport udp 2055</code>, <code>source</code>, <code>export-protocol</code>).</li>
<li><b>Flow monitor</b>: ties a record to one or more exporters and holds the cache.</li>
<li>Apply it: <code>ip flow monitor NAME input</code> on the interface.</li></ol>
<pre class="term">flow record APP-REC
 match ipv4 source address
 match ipv4 destination address
 match transport destination-port
 collect counter bytes
 collect counter packets
flow exporter TO-COLLECTOR
 destination 10.0.0.60
 source GigabitEthernet0/0/1
 transport udp 2055
flow monitor APP-MON
 record APP-REC
 exporter TO-COLLECTOR
interface GigabitEthernet0/0/0
 ip flow monitor APP-MON input</pre>
<p>Verify with <code>show flow monitor APP-MON cache</code>, <code>show flow exporter</code> and <code>show flow interface</code>.</p>
<div class="viz" id="viz-fnfparts"></div>
<div class="viz" id="viz-fnfkey"></div>
<div class="tip"><b>Exam tip.</b> match = key field (defines the flow), collect = non-key data. The monitor references the record and exporter and is the thing applied to the interface.</div>`},
{id:"span",num:"4.3",title:"SPAN, RSPAN and ERSPAN",html:`
<p>To capture traffic with Wireshark or an IDS you need a copy of it. Switches make copies with <b>port mirroring</b>.</p>
<table><tr><th></th><th>SPAN</th><th>RSPAN</th><th>ERSPAN</th></tr>
<tr><td>Destination</td><td>A port on the same switch</td><td>A port on another switch in the same Layer 2 domain</td><td>A device anywhere reachable by IP</td></tr>
<tr><td>Transport</td><td>Local copy</td><td>A dedicated <b>RSPAN VLAN</b> carried over trunks</td><td><b>GRE</b> encapsulation across a routed network</td></tr>
<tr><td>Config</td><td><code>monitor session 1 source ...</code> / <code>destination interface ...</code></td><td><code>vlan 999</code> + <code>remote-span</code> on every switch; source session sends to <code>destination remote vlan 999</code>; far switch uses <code>source remote vlan 999</code></td><td><code>monitor session 1 type erspan-source</code> with <code>destination</code>, <code>ip address</code>, <code>erspan-id</code> and <code>origin ip address</code></td></tr></table>
<ul><li>Sources can be ports or VLANs, in direction <code>rx</code>, <code>tx</code> or <code>both</code> (the default).</li>
<li>A SPAN destination port stops acting as a normal switchport: it only sends the copies and doesn't learn addresses or forward normal traffic (unless <code>ingress</code> is enabled).</li>
<li>A port can't be both a source and a destination. Oversubscription happens: mirroring two 10 Gbps ports in both directions to one 10 Gbps port drops copies.</li>
<li>The RSPAN VLAN must be allowed on every trunk in the path and used for nothing else.</li></ul>
<div class="viz" id="viz-spantypes"></div>
<div class="viz" id="viz-spanmini"></div>
<div class="tip"><b>Exam tip.</b> SPAN = same switch. RSPAN = remote-span VLAN over trunks. ERSPAN = GRE over IP, so it can cross routers.</div>`},
{id:"sla",num:"4.4",title:"IP SLA and object tracking",html:`
<p>An interface can be up while the path beyond it is dead: an ISP's router fails behind a media converter, or a provider network loses its upstream. <b>IP SLA</b> sends synthetic probes to measure what users would actually experience.</p>
<ul><li>Operations include <b>icmp-echo</b> (reachability and round-trip time), <b>udp-jitter</b> (jitter, latency and loss for voice; needs an <code>ip sla responder</code> at the far end), <b>http</b>, <b>dns</b> and <b>tcp-connect</b>.</li>
<li>Configure the operation, then <b>schedule</b> it: <code>ip sla schedule 1 life forever start-time now</code>. A configured but unscheduled probe never runs.</li>
<li>Results: <code>show ip sla statistics</code> (return code OK or Timeout, RTT) and <code>show ip sla summary</code>.</li></ul>
<h3>Tracking</h3>
<p>A <b>track object</b> turns something into an up/down state: an interface's line protocol, a route's presence, or an IP SLA result (<code>track 1 ip sla 1 reachability</code>). Other features then react to it:</p>
<ul><li><b>Static routes</b>: <code>ip route 0.0.0.0 0.0.0.0 203.0.113.1 track 1</code> is removed when track 1 goes down, so a floating static (higher AD) takes over.</li>
<li><b>HSRP/VRRP</b>: <code>standby 10 track 1 decrement 20</code>.</li>
<li><b>EEM</b>: <code>event track 1 state down</code>.</li>
<li><code>delay down 10 up 30</code> under the track object stops flapping.</li></ul>
<pre class="term">ip sla 1
 icmp-echo 203.0.113.1 source-interface GigabitEthernet0/0/0
 frequency 10
ip sla schedule 1 life forever start-time now
track 1 ip sla 1 reachability
ip route 0.0.0.0 0.0.0.0 203.0.113.1 track 1
ip route 0.0.0.0 0.0.0.0 198.51.100.1 250</pre>
<div class="viz" id="viz-slaflow"></div>
<div class="tip"><b>Exam tip.</b> The probe needs scheduling. udp-jitter needs a responder. A tracked static plus a floating static (higher AD) gives failover when the interface stays up but the path dies.</div>`},
{id:"catc",num:"4.5",title:"Catalyst Center workflows and AI-driven assurance",html:`
<p><b>Cisco Catalyst Center</b> (formerly DNA Center) is the controller and assurance platform for campus networks. ENCOR asks you to describe its workflows for configuration, monitoring and management.</p>
<h3>The workflow</h3>
<ol><li><b>Design</b>: the network hierarchy (sites, buildings, floors), network settings (DNS, NTP, AAA, syslog, SNMP servers), IP address pools, wireless SSIDs, and the <b>software image repository</b> with golden images.</li>
<li><b>Policy</b>: group-based access policy (security groups and contracts), QoS application policy (business relevant, default, irrelevant), and virtual networks for SD-Access.</li>
<li><b>Provision</b>: discover or <b>Plug and Play</b> onboard devices, assign them to sites, push templates and settings, and build SD-Access fabrics. <b>Template Editor</b> pushes CLI templates (with variables) to many devices; <b>SWIM</b> upgrades images.</li>
<li><b>Assurance</b>: health scores for the network, clients and applications, built from streaming telemetry, syslog, SNMP, NetFlow and wireless data. Issues come with suggested causes and actions.</li>
<li><b>Platform</b>: REST APIs (Intent API), event notifications (webhooks) and integrations with ITSM tools like ServiceNow.</li></ol>
<div class="viz" id="viz-catcflow"></div>
<h3>AI and ML in assurance</h3>
<ul><li><b>Baselining and anomaly detection</b>: machine learning learns what's normal for each site and time of day (onboarding times, roaming, throughput) and flags deviations instead of relying on fixed thresholds.</li>
<li><b>Root cause analysis</b>: correlates events from many devices into one issue ("clients on floor 3 fail DHCP because the relay is unreachable").</li>
<li><b>Network comparisons and trends</b>: compares a site with its peers or with itself over time.</li>
<li><b>Predictive insights</b>: forecasting capacity or AP issues before users notice.</li>
<li><b>AI assistants</b>: natural language questions about health, issues and configuration (the AI Assistant in Catalyst Center and other Cisco platforms).</li>
<li><b>Intelligent capture and sensors</b>: on-demand packet captures from APs and synthetic tests from wireless sensors.</li></ul>
<div class="viz" id="viz-aiops"></div>
<div class="tip"><b>Exam tip.</b> Design (what the network should look like), Policy (who can talk to whom and with what priority), Provision (push it), Assurance (prove it works). AI/ML in assurance = dynamic baselines, anomaly detection and correlated root cause.</div>`},
{id:"yang",num:"4.6",title:"NETCONF and RESTCONF",html:`
<p>CLI scraping is fragile: output formats change between versions. <b>Model-driven programmability</b> uses <b>YANG</b> data models so software can read and change configuration and state as structured data.</p>
<h3>YANG</h3>
<ul><li>A data modeling language (RFC 7950) that describes the structure: <b>containers</b>, <b>lists</b> (with keys), <b>leaves</b> (single values with types) and leaf-lists.</li>
<li><b>Native</b> models (Cisco-IOS-XE-native) map closely to the CLI. <b>IETF</b> models (ietf-interfaces) and <b>OpenConfig</b> models are vendor-neutral.</li></ul>
<h3>NETCONF (RFC 6241)</h3>
<ul><li>Runs over <b>SSH on TCP 830</b>. Encodes data in <b>XML</b>.</li>
<li>Layers: transport (SSH), messages (<code>&lt;rpc&gt;</code> and <code>&lt;rpc-reply&gt;</code>), operations, content (YANG data).</li>
<li>Operations: <code>&lt;get&gt;</code> (config and state), <code>&lt;get-config&gt;</code>, <code>&lt;edit-config&gt;</code>, <code>&lt;copy-config&gt;</code>, <code>&lt;delete-config&gt;</code>, <code>&lt;lock&gt;</code>/<code>&lt;unlock&gt;</code>, <code>&lt;commit&gt;</code>, <code>&lt;close-session&gt;</code>.</li>
<li>Datastores: <b>running</b>, <b>startup</b> and <b>candidate</b> (stage changes, validate, then commit them all at once). Changes are transactional: all or nothing.</li>
<li>The session starts with a <code>&lt;hello&gt;</code> exchange in which each side lists its <b>capabilities</b> (supported models and features).</li></ul>
<h3>RESTCONF (RFC 8040)</h3>
<ul><li>A REST-style interface to the same YANG models over <b>HTTPS (TCP 443)</b>, with <b>JSON or XML</b> encoding.</li>
<li>HTTP methods map to operations: <b>GET</b> (read), <b>POST</b> (create), <b>PUT</b> (create or replace), <b>PATCH</b> (merge/update), <b>DELETE</b> (remove).</li>
<li>URL: <code>https://10.1.1.1/restconf/data/ietf-interfaces:interfaces/interface=GigabitEthernet1</code>. Headers: <code>Accept: application/yang-data+json</code> and <code>Content-Type: application/yang-data+json</code>.</li>
<li>No candidate datastore and no locking; each request is its own change.</li></ul>
<h3>Enabling them on IOS XE</h3>
<pre class="term">aaa new-model
aaa authentication login default local
aaa authorization exec default local
username netadmin privilege 15 secret Str0ng!Pass
netconf-yang
ip http secure-server
ip http authentication local
restconf</pre>
<p>Both need a privilege 15 user (and AAA). Check with <code>show platform software yang-management process</code> (confd, ncsshd and nginx should be Running) and <code>show netconf-yang sessions</code>.</p>
<div class="viz" id="viz-ncvsrc"></div>
<div class="viz" id="viz-ncstack"></div>
<div class="viz" id="viz-rcurl"></div>
<div class="tip"><b>Exam tip.</b> NETCONF: SSH 830, XML, candidate datastore, edit-config. RESTCONF: HTTPS 443, JSON or XML, HTTP verbs. Both use YANG.</div>`}
];

<script>
/* ================= Module 5: Security (350-401 v1.2 Domain 5.0, 20%) ================= */
(function(){
const LESSONS=[
{id:"access",num:"5.1",title:"Device access control: lines, passwords and SSH",html:`
<p>The management plane is the first thing an attacker goes after. Lock down who can log in, how, and from where.</p>
<h3>Passwords and secrets</h3>
<table><tr><th>Type</th><th>How it's stored</th><th>Use?</th></tr>
<tr><td>0</td><td>Plain text</td><td>Never</td></tr>
<tr><td>7</td><td>Vigenère-style obfuscation (<code>service password-encryption</code>)</td><td>Reversible in seconds; only hides passwords from shoulder-surfers</td></tr>
<tr><td>5</td><td>MD5 hash (old <code>enable secret</code> default)</td><td>Weak by today's standards</td></tr>
<tr><td>8</td><td>PBKDF2 with SHA-256</td><td>Good</td></tr>
<tr><td>9</td><td>scrypt</td><td>Best: the current IOS XE default for secrets</td></tr></table>
<ul><li>Use <code>enable secret</code>, never <code>enable password</code>. Use <code>username X secret</code>, never <code>username X password</code>.</li>
<li><code>security passwords min-length 10</code> enforces a minimum length for new passwords.</li>
<li><b>Privilege levels</b> 0 to 15: 1 is user EXEC, 15 is full access. Custom levels can be given specific commands, but AAA command authorization is the scalable way.</li></ul>
<h3>Lines</h3>
<ul><li><b>Console</b> (line con 0), <b>AUX</b>, and <b>VTY</b> (line vty 0 15, for Telnet and SSH).</li>
<li><code>login local</code> uses the local user database. With AAA, <code>login authentication LIST</code> picks a method list.</li>
<li><code>transport input ssh</code> disables Telnet, which sends everything including passwords in clear text.</li>
<li><code>access-class MGMT in</code> applies a standard ACL so only management subnets can open a session.</li>
<li><code>exec-timeout 10 0</code> logs idle sessions out after 10 minutes.</li></ul>
<h3>SSH</h3>
<p>SSH needs a <b>hostname</b>, a <b>domain name</b>, and <b>RSA keys</b> (2048 bits or more), then <code>ip ssh version 2</code>.</p>
<pre class="term">hostname R1
ip domain name corp.local
crypto key generate rsa modulus 2048
ip ssh version 2
username admin privilege 15 secret Adm1n!Secret
ip access-list standard MGMT
 permit 10.99.0.0 0.0.0.255
line vty 0 15
 login local
 transport input ssh
 access-class MGMT in
 exec-timeout 10 0
login block-for 120 attempts 5 within 60</pre>
<p><code>login block-for</code> stops all logins for 120 seconds after 5 failures in 60 seconds (quiet mode), slowing brute-force attacks. <code>login quiet-mode access-class</code> lets a management ACL in even during quiet mode.</p>
<div class="viz" id="viz-pwtypes"></div>
<div class="viz" id="viz-vtycheck"></div>
<div class="tip"><b>Exam tip.</b> Type 7 is reversible, type 9 (scrypt) is strongest. SSH needs hostname + domain + RSA keys. access-class on a VTY line uses a standard ACL to filter who connects.</div>`},
{id:"aaa",num:"5.2",title:"AAA with RADIUS and TACACS+",html:`
<p><b>AAA</b> is <b>Authentication</b> (who are you?), <b>Authorization</b> (what may you do?) and <b>Accounting</b> (what did you do?). Central AAA servers like <b>Cisco ISE</b> give one place to manage administrator accounts and network access.</p>
<table><tr><th></th><th>RADIUS</th><th>TACACS+</th></tr>
<tr><td>Transport</td><td>UDP 1812 (auth) and 1813 (accounting); older 1645/1646</td><td>TCP 49</td></tr>
<tr><td>Encryption</td><td>Only the password</td><td>The whole packet body</td></tr>
<tr><td>AAA functions</td><td>Authentication and authorization combined</td><td>Separates all three</td></tr>
<tr><td>Command authorization</td><td>No</td><td>Yes, per command</td></tr>
<tr><td>Standard</td><td>Open (RFC 2865)</td><td>Cisco origin, published as RFC 8907</td></tr>
<tr><td>Typical use</td><td><b>Network access</b>: 802.1X, VPN, Wi-Fi users</td><td><b>Device administration</b>: admins logging into routers and switches</td></tr></table>
<h3>Method lists</h3>
<p>A method list is an ordered list of ways to authenticate. IOS tries the next method <b>only if the current one gives no answer</b> (server unreachable or not configured). A server that answers "reject" ends the attempt: the user is denied.</p>
<pre class="term">aaa new-model
tacacs server ISE
 address ipv4 10.0.0.20
 key T@cacsK3y
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
aaa authorization commands 15 default group tacacs+ local
aaa accounting commands 15 default start-stop group tacacs+
username admin privilege 15 secret Br3akGl@ss!</pre>
<ul><li>The <b>local</b> user is the break-glass account for when the AAA server is unreachable.</li>
<li>Configure a local user <b>before</b> <code>aaa new-model</code> on a remote device, or a lockout is one typo away. Keep a console session open while you test.</li>
<li><code>test aaa group tacacs+ USER PASS legacy</code> tests the server without logging out. <code>debug aaa authentication</code> and <code>debug tacacs</code> show the details.</li>
<li>A <b>shared key mismatch</b> makes the server unable to decrypt the request; it behaves as if the server failed.</li>
<li>For RADIUS: <code>radius server ISE</code>, <code>address ipv4 10.0.0.20 auth-port 1812 acct-port 1813</code>, <code>key ...</code>, and <code>group radius</code> in the lists.</li></ul>
<div class="viz" id="viz-aaacmp"></div>
<div class="viz" id="viz-aaaflow"></div>
<div class="viz" id="viz-method"></div>
<div class="tip"><b>Exam tip.</b> TACACS+: TCP 49, whole body encrypted, separate AAA, command authorization, device admin. RADIUS: UDP 1812/1813, password only encrypted, network access. A reject doesn't fall through to local; only no response does.</div>`},
{id:"acl",num:"5.3",title:"ACLs and Control Plane Policing",html:`
<h3>ACL types</h3>
<ul><li><b>Standard</b> (1 to 99, 1300 to 1999, or named): matches the <b>source address</b> only. Place it close to the destination.</li>
<li><b>Extended</b> (100 to 199, 2000 to 2699, or named): matches protocol, source, destination and ports. Place it close to the source to drop unwanted traffic early.</li>
<li>Entries are checked <b>top down</b>; the <b>first match wins</b>. Every ACL ends in an invisible <b>implicit deny any</b>.</li>
<li>Named ACLs have <b>sequence numbers</b> (10, 20, 30...) so you can insert (<code>15 permit ...</code>) and delete (<code>no 20</code>) single lines.</li>
<li>One ACL per interface, per direction, per protocol. <code>ip access-group NAME in|out</code>. Direction is from the router's point of view.</li>
<li><b>Wildcard masks</b>: 0 bits must match, 1 bits don't matter. <code>0.0.0.255</code> matches a /24; <code>host 10.1.1.1</code> = <code>10.1.1.1 0.0.0.0</code>; <code>any</code> = <code>0.0.0.0 255.255.255.255</code>.</li>
<li>Outbound ACLs don't filter traffic the router itself generates.</li></ul>
<pre class="term">ip access-list extended SRV-PROTECT
 10 permit tcp 10.1.10.0 0.0.0.255 host 10.1.20.100 eq 443
 20 permit icmp 10.1.10.0 0.0.0.255 host 10.1.20.100 echo
 30 deny   ip any any log
interface GigabitEthernet0/0/2
 ip access-group SRV-PROTECT out</pre>
<div class="viz" id="viz-wildcard"></div>
<div class="viz" id="viz-aclorder"></div>
<h3>Control Plane Policing (CoPP)</h3>
<p>The route processor's CPU handles routing protocols, management sessions and anything addressed to the router. A flood of traffic to it (a ping flood, SSH brute-force, a TTL-expiry attack) can starve OSPF and BGP and bring the network down. <b>CoPP</b> applies a QoS policy to traffic going <b>to the control plane</b>:</p>
<ol><li>ACLs and <b>class-maps</b> classify control plane traffic: routing (BGP, OSPF), management (SSH, SNMP), ICMP, and everything else.</li>
<li>A <b>policy-map</b> <b>polices</b> each class: generous for routing protocols, tight for ICMP, and a low rate for the catch-all.</li>
<li><code>control-plane</code> then <code>service-policy input COPP</code> applies it.</li></ol>
<pre class="term">ip access-list extended ICMP-ACL
 permit icmp any any
class-map match-all COPP-ICMP
 match access-group name ICMP-ACL
policy-map COPP
 class COPP-ICMP
  police cir 64000 conform-action transmit exceed-action drop
control-plane
 service-policy input COPP</pre>
<p>Catalyst 9000 switches ship with a default CoPP policy (<code>system-cpp-policy</code>). Verify with <code>show policy-map control-plane</code>.</p>
<div class="viz" id="viz-copp"></div>
<div class="tip"><b>Exam tip.</b> First match wins, implicit deny at the end. Standard near the destination, extended near the source. CoPP is a QoS policy (police) on the control-plane, always input.</div>`},
{id:"api",num:"5.4",title:"REST API security",html:`
<p>Controllers like Catalyst Center, SD-WAN Manager and Meraki are managed through REST APIs, so those APIs are as sensitive as the CLI.</p>
<ul><li><b>Transport</b>: always <b>HTTPS (TLS)</b>, with valid certificates, so credentials and data can't be read or changed in transit. Don't disable certificate checking in production scripts.</li>
<li><b>Authentication</b> methods:
 <ul><li><b>HTTP Basic</b>: username and password Base64-encoded in each request. Base64 is <i>encoding</i>, not encryption, so it's only safe inside TLS.</li>
 <li><b>Token-based</b>: log in once (often with Basic) to get a token, then send it in a header on every call. Catalyst Center: POST to <code>/dna/system/api/v1/auth/token</code>, then <code>X-Auth-Token</code>. Tokens expire (one hour there).</li>
 <li><b>API keys</b>: a long-lived secret per application (Meraki: <code>Authorization: Bearer KEY</code>). Store them in a vault or environment variable, never in code or Git.</li>
 <li><b>OAuth 2.0</b>: delegated authorization; an app gets a scoped, short-lived access token from an authorization server without seeing the user's password.</li></ul></li>
<li><b>Authorization (RBAC)</b>: give each API account the least privilege it needs, such as read-only for a monitoring script.</li>
<li><b>Rate limiting</b> protects the controller; clients get <b>429 Too Many Requests</b> and must back off.</li>
<li><b>Input validation, logging and auditing</b> of API calls, and <b>CORS</b> rules for browser-based clients.</li></ul>
<div class="viz" id="viz-apiauth"></div>
<div class="tip"><b>Exam tip.</b> Base64 isn't encryption. Tokens go in a header and expire. 401 = not authenticated, 403 = authenticated but not allowed, 429 = slow down.</div>`},
{id:"design",num:"5.5",title:"Network security design: threat defense, NGFW, TrustSec and MACsec",html:`
<p>No single box secures a network. ENCOR expects you to describe the components and where they fit.</p>
<h3>Threat defense and endpoint security</h3>
<ul><li><b>Next-generation firewall (NGFW)</b>, Cisco Secure Firewall: stateful inspection plus <b>application visibility and control</b>, <b>IPS</b>, URL filtering, malware protection and TLS decryption. Classic firewalls only see ports and addresses.</li>
<li><b>Intrusion prevention (IPS)</b>: inline, signature and behavior based; it can drop attacks. An <b>IDS</b> only watches a copy (from SPAN) and alerts.</li>
<li><b>Endpoint security</b>: Cisco <b>Secure Endpoint</b> (AMP) watches files and processes on the host and can retroactively flag a file that turns out to be malicious.</li>
<li><b>DNS-layer security</b>: Cisco <b>Umbrella</b> blocks requests to malicious domains before a connection is made.</li>
<li><b>Network visibility</b>: <b>Secure Network Analytics</b> (Stealthwatch) uses NetFlow to model behavior and spot anomalies like data hoarding.</li>
<li><b>Email and web security</b> gateways stop phishing and malicious downloads.</li></ul>
<p>Identity services such as <b>ISE</b> authenticate endpoints when they connect and return an authorization result, which can include a <b>Security Group Tag</b>.</p>
<h3>Cisco TrustSec</h3>
<ul><li>Users and devices get a <b>Security Group Tag (SGT)</b>, a 16-bit number for their role (Employees = 10, Contractors = 20, Cameras = 30), regardless of IP address or VLAN.</li>
<li>Three phases: <b>classification</b> (assign the SGT at the edge, dynamically via ISE or statically), <b>propagation</b> (carry it inline in a Cisco Meta Data header, or with <b>SXP</b> over TCP to devices that can't tag), and <b>enforcement</b> (<b>SGACLs</b> in a matrix of source group × destination group, applied at egress).</li>
<li>Policy is written in business terms ("Contractors can't reach Finance servers") and doesn't need to change when addresses do. SD-Access uses the same SGTs.</li></ul>
<h3>MACsec</h3>
<ul><li><b>IEEE 802.1AE</b>: hop-by-hop <b>Layer 2 encryption</b> with AES-GCM between two directly connected devices. Each hop decrypts, so the switch can still apply QoS and policy, then re-encrypts.</li>
<li>Keys come from <b>MKA</b> (MACsec Key Agreement, 802.1X-2010), either from 802.1X/ISE (downlink to hosts) or a <b>pre-shared key</b> (switch-to-switch uplinks).</li>
<li>Protects against taps and man-in-the-middle on cables between closets and buildings, at line rate in hardware.</li></ul>
<div class="viz" id="viz-secparts"></div>
<div class="viz" id="viz-trustsec"></div>
<div class="viz" id="viz-secpick"></div>
<div class="tip"><b>Exam tip.</b> SGT = role tag; classify, propagate (inline or SXP), enforce (SGACL). MACsec = 802.1AE, link-layer, hop by hop, keyed by MKA. MAB = 802.1X fallback for devices without a supplicant.</div>`}
];

/* ---- wildcard calculator ---- */
(function(){const el=$("#viz-wildcard");const C=[[24,"10.1.10.0"],[20,"172.16.16.0"],[30,"192.168.1.4"],[26,"10.5.0.64"],[32,"10.9.9.9"],[16,"10.20.0.0"]];let k=0,pick=null;const solved=new Set();
  const wc=l=>{const m=l===0?0:(0xFFFFFFFF<<(32-l))>>>0;const w=(~m)>>>0;return [24,16,8,0].map(s=>(w>>>s)&255).join(".")};
  function opts(l){const r=new Set([wc(l)]);[l-1,l+1,l+8].forEach(x=>{if(x>=8&&x<=32)r.add(wc(x))});r.add([24,16,8,0].map(s=>(((0xFFFFFFFF<<(32-l))>>>0)>>>s)&255).join("."));return [...r].slice(0,4).sort()}
  function draw(){const [l,n]=C[k];const O=opts(l);el.innerHTML=`<div class="viz-title">Wildcard mask trainer</div><p>Match <b>${n}/${l}</b> in an ACL. Which wildcard?</p><div class="chips">${O.map(o=>`<button class="chip" data-o="${o}" ${pick?"disabled":""}>${o}</button>`).join("")}</div>
    <div class="caption" aria-live="polite">${pick?(pick===wc(l)?`<span class="status-good">Right.</span> `:`<span class="status-bad">Not quite.</span> `)+`/${l} has ${32-l} host bits, so the wildcard is ${wc(l)}${l===32?" (or use the 'host' keyword)":""}. Subtract the mask from 255.255.255.255.`:""}</div>
    <div class="viz-controls"><button class="btn" data-n ${pick?"":"disabled"}>Next</button><span class="s-small">${solved.size} of ${C.length} right</span></div>`;}
  el.addEventListener("click",e=>{const o=e.target.closest("[data-o]");if(o&&!pick){pick=o.dataset.o;if(pick===wc(C[k][0]))solved.add(k);if(solved.size>=4)award("viz:wildcard",20,"Calculated wildcard masks");draw();return}
    if(e.target.closest("[data-n]")){k=(k+1)%C.length;pick=null;draw()}});draw()})();

stepViz($("#viz-copp"),{title:"Control Plane Policing during an attack",done:"Watched CoPP defend the CPU",steps:[
  ["Normal day","The router forwards 5 Gbps in hardware. Its CPU only sees routing protocol packets, SSH, SNMP and a few pings: a few hundred packets per second."],
  ["The attack","Someone floods 200,000 pings per second at the router's own address. Every one goes to the CPU."],
  ["Without CoPP","The CPU hits 100%. OSPF hellos are missed, the dead timer expires, adjacencies drop, and traffic for the whole site is lost. SSH times out, so you can't log in to fix it."],
  ["Classify","With CoPP, class-maps sort CPU-bound traffic: ROUTING (OSPF, BGP), MGMT (SSH, SNMP from management subnets), ICMP, and class-default."],
  ["Police","The policy allows ROUTING a generous rate, MGMT a moderate one, ICMP 64 kbps, and class-default a low rate. Excess ICMP is dropped before it reaches the CPU."],
  ["Result","Pings beyond the limit are lost, but OSPF stays up and you can still SSH in. show policy-map control-plane shows the drop counters climbing on COPP-ICMP."]]});

<script>
/* ================= Module 6: Automation and AI (350-401 v1.2 Domain 6.0, 15%) ================= */
(function(){
const LESSONS=[
{id:"python",num:"6.1",title:"Interpreting Python scripts",html:`
<p>ENCOR asks you to <b>read</b> Python and say what a script does, not to write large programs. Know the building blocks.</p>
<h3>Data types</h3>
<table><tr><th>Type</th><th>Example</th><th>Notes</th></tr>
<tr><td>str</td><td><code>"GigabitEthernet1"</code></td><td>Text. f-strings: <code>f"Hello {name}"</code></td></tr>
<tr><td>int / float</td><td><code>1500</code>, <code>99.5</code></td><td></td></tr>
<tr><td>bool</td><td><code>True</code>, <code>False</code></td><td>Capitalized in Python (lowercase in JSON)</td></tr>
<tr><td>list</td><td><code>["R1", "R2", "R3"]</code></td><td>Ordered, indexed from 0, changeable</td></tr>
<tr><td>dict</td><td><code>{"hostname": "R1", "mgmt": "10.0.0.1"}</code></td><td>Key/value pairs; <code>d["hostname"]</code> or <code>d.get("hostname")</code></td></tr>
<tr><td>tuple</td><td><code>("10.0.0.1", 22)</code></td><td>Ordered, unchangeable</td></tr></table>
<h3>Control flow</h3>
<pre class="term">devices = [{"name": "R1", "up": True}, {"name": "R2", "up": False}]
for dev in devices:            # loop over a list
    if dev["up"]:              # indentation defines the block
        print(f"{dev['name']} is reachable")
    else:
        print(f"{dev['name']} is DOWN")

def build_url(host, path="/restconf/data"):   # function with a default argument
    return f"https://{host}{path}"</pre>
<ul><li><b>Indentation</b> (4 spaces) defines blocks; there are no braces.</li>
<li><code>range(3)</code> gives 0, 1, 2. <code>len(x)</code> counts items. <code>x[-1]</code> is the last item.</li>
<li><code>try:</code> / <code>except</code> handles errors, such as a timeout from a device.</li>
<li><code>import</code> brings in libraries: <b>requests</b> (HTTP and REST), <b>json</b> (<code>json.loads</code> text → dict, <code>json.dumps</code> dict → text), <b>ncclient</b> (NETCONF), <b>netmiko</b> (SSH CLI), <b>paramiko</b> (SSH).</li></ul>
<h3>A typical REST script</h3>
<pre class="term">import requests
url = "https://10.10.20.85/restconf/data/ietf-interfaces:interfaces"
headers = {"Accept": "application/yang-data+json"}
resp = requests.get(url, headers=headers, auth=("admin", "C1sco12345"), verify=False)
if resp.status_code == 200:
    for intf in resp.json()["ietf-interfaces:interfaces"]["interface"]:
        print(intf["name"], intf["enabled"])</pre>
<p>Read it as: send an HTTPS GET with Basic authentication (and no certificate check: fine in a lab, not in production), and if it succeeds, turn the JSON body into a dict and print each interface's name and state.</p>
<div class="viz" id="viz-pytypes"></div>
<div class="viz" id="viz-pytrace"></div>
<div class="tip"><b>Exam tip.</b> Lists use [ ], dicts use { } with key: value. resp.json() parses the body. Python's True/False/None become JSON's true/false/null.</div>`},
{id:"json",num:"6.2",title:"Constructing valid JSON",html:`
<p><b>JSON</b> (JavaScript Object Notation) is the most common encoding for REST APIs. It's strict: one wrong character and the whole document is rejected.</p>
<ul><li><b>Objects</b> are in <code>{ }</code> with <code>"key": value</code> pairs separated by commas. Keys are always <b>double-quoted strings</b>.</li>
<li><b>Arrays</b> are in <code>[ ]</code>, values separated by commas.</li>
<li>Values: <b>string</b> (double quotes only), <b>number</b> (no quotes, no leading zeros), <b>true</b>, <b>false</b>, <b>null</b> (all lowercase), object or array.</li>
<li><b>No trailing commas</b>, <b>no comments</b>, no single quotes.</li>
<li>Whitespace doesn't matter.</li></ul>
<pre class="term">{
  "ietf-interfaces:interface": {
    "name": "Loopback100",
    "description": "Managed by automation",
    "type": "iana-if-type:softwareLoopback",
    "enabled": true,
    "ietf-ip:ipv4": {
      "address": [
        { "ip": "10.100.100.1", "netmask": "255.255.255.0" }
      ]
    }
  }
}</pre>
<h3>Same data, other encodings</h3>
<ul><li><b>XML</b>: tags (<code>&lt;name&gt;Loopback100&lt;/name&gt;</code>) and namespaces. NETCONF uses XML.</li>
<li><b>YAML</b>: indentation-based and easy for humans; Ansible playbooks are YAML.</li></ul>
<div class="viz" id="viz-jsonvalid"></div>
<div class="viz" id="viz-encodings"></div>
<div class="tip"><b>Exam tip.</b> Double quotes, lowercase true/false/null, no trailing comma, keys always quoted. A list of items is an array inside an object.</div>`},
{id:"apis",num:"6.3",title:"REST APIs, response codes and the Catalyst Center and SD-WAN Manager APIs",html:`
<h3>REST basics</h3>
<ul><li>A <b>resource</b> is identified by a <b>URI</b>; you act on it with an HTTP <b>method</b>: <b>GET</b> (read), <b>POST</b> (create), <b>PUT</b> (replace), <b>PATCH</b> (update), <b>DELETE</b>.</li>
<li><b>Headers</b> carry metadata: <code>Content-Type</code> (what I'm sending), <code>Accept</code> (what I want back), and authentication (<code>Authorization</code>, <code>X-Auth-Token</code>).</li>
<li>REST is <b>stateless</b>: each request carries everything the server needs.</li></ul>
<h3>Response codes</h3>
<table><tr><th>Code</th><th>Meaning</th></tr>
<tr><td>200 OK</td><td>Success, with a body</td></tr><tr><td>201 Created</td><td>A POST created the resource</td></tr><tr><td>202 Accepted</td><td>Queued for processing (Catalyst Center returns a task ID)</td></tr><tr><td>204 No Content</td><td>Success with no body (common for PUT/PATCH/DELETE)</td></tr>
<tr><td>400 Bad Request</td><td>Malformed request or invalid JSON</td></tr><tr><td>401 Unauthorized</td><td>Not authenticated: missing or expired token</td></tr><tr><td>403 Forbidden</td><td>Authenticated but not allowed</td></tr><tr><td>404 Not Found</td><td>Wrong URI or the resource doesn't exist</td></tr><tr><td>405 Method Not Allowed</td><td>The resource doesn't support that method</td></tr><tr><td>409 Conflict</td><td>Already exists or a state conflict</td></tr><tr><td>415 Unsupported Media Type</td><td>Wrong Content-Type</td></tr><tr><td>429 Too Many Requests</td><td>Rate limited</td></tr>
<tr><td>500 Internal Server Error</td><td>A server bug</td></tr><tr><td>503 Service Unavailable</td><td>Overloaded or down for maintenance</td></tr></table>
<p>2xx = success, 4xx = the client did something wrong, 5xx = the server failed.</p>
<div class="viz" id="viz-codes"></div>
<h3>Catalyst Center Intent API</h3>
<ol><li><b>Authenticate</b>: <code>POST /dna/system/api/v1/auth/token</code> with HTTP Basic credentials. The response is <code>{"Token": "eyJ..."}</code>.</li>
<li><b>Call</b> the Intent API with the header <code>X-Auth-Token: eyJ...</code>, for example <code>GET /dna/intent/api/v1/network-device</code> (inventory), <code>/site</code>, <code>/client-health</code>, <code>/network-health</code>.</li>
<li>Long operations (provisioning, command runner) return <b>202</b> with a <b>taskId</b>; poll <code>/dna/intent/api/v1/task/{taskId}</code> for the result.</li>
<li>Results come in a <code>"response"</code> array. Event notifications can be pushed to you with <b>webhooks</b>.</li></ol>
<h3>SD-WAN Manager (vManage) API</h3>
<ol><li><b>Log in</b>: <code>POST /j_security_check</code> with form fields <code>j_username</code> and <code>j_password</code>. The session cookie <b>JSESSIONID</b> is returned.</li>
<li><b>Get a CSRF token</b>: <code>GET /dataservice/client/token</code>, then send it as <code>X-XSRF-TOKEN</code> on every POST, PUT and DELETE.</li>
<li><b>Call</b> under <code>/dataservice/</code>: <code>/dataservice/device</code> (inventory), <code>/dataservice/device/monitor</code>, <code>/dataservice/template/device</code>, and so on. Results come in a <code>"data"</code> array.</li></ol>
<div class="viz" id="viz-apiflows"></div>
<div class="tip"><b>Exam tip.</b> Catalyst Center: Basic → token → X-Auth-Token. SD-WAN Manager: j_security_check → JSESSIONID cookie + X-XSRF-TOKEN. 401 = authenticate, 403 = permissions, 404 = path.</div>`},
{id:"eem",num:"6.4",title:"Embedded Event Manager applets",html:`
<p><b>EEM</b> is automation that lives on the device: when an <b>event</b> happens, run <b>actions</b>. It works even when the network is down and no controller can reach the box.</p>
<h3>Event detectors</h3>
<ul><li><code>event syslog pattern "REGEX"</code>: a log message matches.</li>
<li><code>event track 1 state down</code>: a track object changes.</li>
<li><code>event cli pattern "REGEX" sync no skip no</code>: someone types a matching command (with <code>skip yes</code>, the command is blocked).</li>
<li><code>event timer cron cron-entry "0 2 * * *"</code> or <code>event timer watchdog time 300</code>: on a schedule.</li>
<li><code>event interface name Gi0/0/0 parameter input_errors ...</code>: a counter crosses a threshold.</li>
<li><code>event none</code>: run manually with <code>event manager run NAME</code>.</li></ul>
<h3>Actions</h3>
<p>Actions run in <b>label order</b> (sorted as strings, so use 1.0, 2.0... or 010, 020). Common ones: <code>cli command "..."</code> (needs <code>cli command "enable"</code> first), <code>syslog msg "..."</code>, <code>mail</code>, <code>wait</code>, <code>puts</code>.</p>
<pre class="term">event manager applet WAN-SELF-HEAL
 event syslog pattern "Interface GigabitEthernet0/0/1, changed state to administratively down"
 action 1.0 cli command "enable"
 action 2.0 cli command "configure terminal"
 action 3.0 cli command "interface g0/0/1"
 action 4.0 cli command "no shutdown"
 action 5.0 syslog msg "EEM re-enabled G0/0/1"</pre>
<ul><li>Verify: <code>show event manager policy registered</code>, <code>show event manager history events</code>, <code>debug event manager action cli</code>.</li>
<li>Beware of applets whose actions trigger themselves (a syslog action that matches its own pattern): that's a loop.</li>
<li>Tcl policies offer more logic than applets; Python on IOS XE (guest shell) goes further still.</li></ul>
<div class="viz" id="viz-eemparts"></div>
<div class="tip"><b>Exam tip.</b> Event + actions, actions in label order, start CLI actions with "enable". event none = run by hand. event cli ... skip yes blocks a command.</div>`},
{id:"orch",num:"6.5",title:"Agent-based and agentless orchestration",html:`
<p>Configuration management tools keep many devices in a known state and make changes repeatable. ENCOR compares <b>agent-based</b> and <b>agentless</b> tools.</p>
<table><tr><th>Tool</th><th>Model</th><th>Language</th><th>Transport</th><th>Push or pull</th></tr>
<tr><td><b>Ansible</b></td><td>Agentless</td><td>YAML playbooks (Python underneath)</td><td>SSH, NETCONF, HTTPS APIs</td><td>Push from a control node</td></tr>
<tr><td><b>Puppet</b></td><td>Agent-based (agentless possible with Bolt or proxy devices)</td><td>Puppet DSL (Ruby-based) manifests</td><td>HTTPS to the Puppet server</td><td>Pull: agents check in (every 30 min by default)</td></tr>
<tr><td><b>Chef</b></td><td>Agent-based</td><td>Ruby recipes and cookbooks</td><td>HTTPS to the Chef server</td><td>Pull</td></tr>
<tr><td><b>SaltStack</b></td><td>Agent-based (minions) or agentless (salt-ssh); proxy minions for network gear</td><td>YAML states (Python)</td><td>ZeroMQ message bus</td><td>Push and pull, event-driven</td></tr></table>
<ul><li><b>Agent-based</b>: software runs on each managed node. Good for continuous enforcement of state on servers. Network devices often can't run agents, so a proxy is used.</li>
<li><b>Agentless</b>: nothing installed; the controller connects over SSH or APIs. Easy to start with and a natural fit for routers and switches.</li>
<li><b>Ansible terms</b>: <b>inventory</b> (devices and groups), <b>playbook</b> (YAML), <b>play</b>, <b>task</b>, <b>module</b> (<code>cisco.ios.ios_config</code>, <code>ios_command</code>), <b>idempotent</b> (running it twice gives the same result).</li>
<li><b>Puppet terms</b>: manifests, modules, Puppet server, agent, facts (Facter). <b>Chef terms</b>: recipes, cookbooks, Chef server, chef-client (agent), knife (CLI). <b>Salt terms</b>: master, minions, grains (facts), pillars (secrets/data), states.</li>
<li><b>Terraform</b> (declarative infrastructure as code with providers and state files) is common for cloud and controllers too.</li></ul>
<pre class="term">- name: Set NTP on all branch routers
  hosts: branch_routers
  gather_facts: no
  tasks:
    - name: Configure NTP server
      cisco.ios.ios_config:
        lines:
          - ntp server 10.0.0.10</pre>
<div class="viz" id="viz-agentsort"></div>
<div class="viz" id="viz-ansible"></div>
<div class="tip"><b>Exam tip.</b> Ansible = agentless, push, YAML, SSH. Puppet and Chef = agent, pull, Ruby-based. Salt = minions over ZeroMQ, or salt-ssh agentless.</div>`},
{id:"ai",num:"6.6",title:"AI and machine learning in network operations",html:`
<p>AI is now built into network platforms. Know the kinds of AI, what they're good at, and how to use them responsibly.</p>
<h3>Kinds of AI</h3>
<ul><li><b>Machine learning (ML)</b> finds patterns in data. <b>Supervised</b> learning trains on labeled examples (traffic labeled as malicious or benign). <b>Unsupervised</b> learning finds structure without labels (clustering, anomaly detection). <b>Reinforcement</b> learning learns by trial and reward.</li>
<li><b>Predictive AI</b> forecasts: link utilization next quarter, an AP about to fail, a likely SLA breach.</li>
<li><b>Generative AI</b> uses large language models (LLMs) to produce text and code: summarize an incident, explain a config, draft a playbook, answer questions in plain language.</li>
<li><b>Agentic AI</b> goes a step further: an AI agent plans steps and calls tools (APIs, CLI, ticketing) to reach a goal, such as gathering diagnostics across devices and proposing a fix.</li></ul>
<h3>Where it's used</h3>
<ul><li><b>AIOps and assurance</b>: dynamic baselines, anomaly detection, event correlation and root cause (Catalyst Center Assurance, ThousandEyes, Meraki).</li>
<li><b>Security</b>: behavioral analytics on NetFlow, encrypted traffic analytics, malware classification.</li>
<li><b>AI assistants</b>: natural language troubleshooting and configuration help in Cisco platforms.</li>
<li><b>Intent-based networking</b>: translating business intent into configuration, then verifying it.</li></ul>
<h3>Using it responsibly</h3>
<ul><li>LLMs can <b>hallucinate</b>: produce confident but wrong commands. <b>Validate</b> generated configs in a lab or with a dry run, and keep a <b>human in the loop</b> for changes to production.</li>
<li><b>Data privacy</b>: don't paste secrets, keys or customer data into public AI tools. Check where prompts and data are sent and stored.</li>
<li><b>Least privilege for agents</b>: give an AI agent read-only access unless a change is approved; log what it does.</li>
<li><b>Quality data</b>: ML is only as good as the telemetry it learns from (accurate time, consistent naming, enough history).</li></ul>
<div class="viz" id="viz-aitypes"></div>
<div class="viz" id="viz-aisafe"></div>
<div class="tip"><b>Exam tip.</b> Predictive = forecast, generative = create text/code, agentic = plan and act through tools. Always validate AI output and keep a human approving production changes.</div>`}
];

function apiSandbox(host,api,s){
  const T="eyJhbGciOiJSUzI1NiJ9.ccnp-lab-token";const done=new Set();let out=null,code=null;
  const tasks=[["tok","Get a token (POST the auth endpoint with Basic credentials)"],["list","List the device inventory with your token"],["one","Get just the unreachable device by its id"]];
  const resp=(m,p,h)=>{const P=p.replace(/^https?:\/\/[^/]+/,"").replace(/\/+$/,"");
    if(/coffee|teapot|brew/i.test(P))return [418,{error:"I'm a teapot",detail:"This server refuses to brew coffee because it is, permanently, a teapot. (RFC 2324)"}];
    if(P==="/dna/system/api/v1/auth/token"){if(m!=="POST")return [405,{error:"Method Not Allowed",detail:"Use POST to get a token."}];if(!h.basic)return [401,{error:"Unauthorized",detail:"Send HTTP Basic credentials (Authorization: Basic ...)."}];return [200,{Token:T}]}
    if(!P.startsWith("/dna/intent/api/v1/"))return [404,{error:"Not Found",detail:"No such resource. Intent API paths start with /dna/intent/api/v1/."}];
    if(h.token!==T)return [401,{error:"Unauthorized",detail:h.token?"Invalid or expired token.":"Missing X-Auth-Token header."}];
    if(P==="/dna/intent/api/v1/network-device"){if(m!=="GET")return [405,{error:"Method Not Allowed"}];return [200,{response:DEV,version:"1.0"}]}
    const one=/^\/dna\/intent\/api\/v1\/network-device\/([\w-]+)$/.exec(P);if(one){const d=DEV.find(x=>x.id===one[1]);if(!d)return [404,{error:"Not Found",detail:"No device with id "+one[1]}];if(m==="DELETE")return [403,{error:"Forbidden",detail:"Your role (OBSERVER) can't delete devices."}];if(m!=="GET")return [405,{error:"Method Not Allowed"}];return [200,{response:d,version:"1.0"}]}
    if(P==="/dna/intent/api/v1/site")return [200,{response:[{id:"s-01",name:"Chicago",siteNameHierarchy:"Global/US/Chicago"}]}];
    return [404,{error:"Not Found"}]};
  function draw(){host.innerHTML=`${simHead(s,api)}<p class="scenario">You're scripting against a Catalyst Center sandbox at https://sandbox.lab. Build each request, send it, and read the response. Credentials: devnet / Cisco123!</p>
    <ul class="pad-tasks">${tasks.map(([k,t])=>`<li class="${done.has(k)?"done":""}">${t}</li>`).join("")}</ul>
    <div class="pad-row"><label class="s-small" for="ap-m">Method</label><select id="ap-m">${["GET","POST","PUT","PATCH","DELETE"].map(x=>`<option>${x}</option>`).join("")}</select><input id="ap-p" aria-label="Path" value="/dna/system/api/v1/auth/token" spellcheck="false" autocomplete="off"></div>
    <div class="pad-hdrs"><label class="check"><input type="checkbox" id="ap-b"> Authorization: Basic ZGV2bmV0OkNpc2NvMTIzIQ== (devnet:Cisco123!)</label>
    <div class="pad-row"><label class="s-small" for="ap-t">X-Auth-Token</label><input id="ap-t" spellcheck="false" autocomplete="off" placeholder="paste the token here"></div></div>
    <div class="viz-controls"><button class="btn primary" id="ap-go">Send</button></div>
    <div aria-live="polite">${code?`<p>Response <span class="pad-code ${code<300?"ok":"err"}">${code}</span></p><div class="term pad-out">${esc(JSON.stringify(out,null,2))}</div>`:""}</div>`;
    const q=x=>host.querySelector(x);
    q("#ap-go").onclick=()=>{const m=q("#ap-m").value,p=q("#ap-p").value.trim(),h={basic:q("#ap-b").checked,token:q("#ap-t").value.trim()};const keep={m,p,b:h.basic,t:h.token};
      [code,out]=resp(m,p,h);if(code===418&&typeof flag==="function")flag("teapot");
      if(code===200&&out.Token)done.add("tok");if(code===200&&Array.isArray(out.response)&&out.response.length===DEV.length)done.add("list");if(code===200&&out.response&&out.response.id==="a1b2-0003")done.add("one");
      draw();q("#ap-m").value=keep.m;q("#ap-p").value=keep.p;q("#ap-b").checked=keep.b;q("#ap-t").value=keep.t;
      if(done.size===tasks.length&&!api.passed())api.pass()}}
  draw()}

function pyPad(host,api,s){const ans={};let line="",res="";
  const run=src=>{const t=src.trim();if(!t)return "";
    if(/^import\s+this\s*$/.test(t)){if(typeof flag==="function")flag("zen");return ZEN}
    let m=/^print\((["'])(.*)\1\)$/.exec(t);if(m)return m[2];
    if(/^[\d\s+\-*()%]+$/.test(t)&&/\d/.test(t)){try{return String(Function('"use strict";return ('+t.replace(/\*\*/g,"**")+")")())}catch(e){return "SyntaxError: invalid syntax"}}
    m=/^len\((.*)\)$/.exec(t);if(m){try{const v=JSON.parse(m[1].replace(/'/g,'"'));return String(v.length??Object.keys(v).length)}catch(e){return "NameError: name is not defined"}}
    if(/^print\(\s*\)$/.test(t))return "";
    return "This pad only runs tiny one-liners: print(\"text\"), arithmetic, len([...]). Try the snippets above, or a famous one-line import.";};
  function draw(){const right=SNIPS.filter((x,i)=>ans[i]===0).length,all=Object.keys(ans).length===SNIPS.length;
    host.innerHTML=`${simHead(s,api)}<p class="scenario">Predict what each script prints. Get at least 5 of 6 right to pass.</p>
    ${SNIPS.map((x,i)=>`<div class="py-q"><div class="term" style="min-height:0">${esc(x[0])}</div><div class="chips">${x[1].map((o,k)=>`<button class="chip" data-q="${i}" data-k="${k}" ${ans[i]!=null?"disabled":""} aria-pressed="${ans[i]===k}">${esc(o)}</button>`).join("")}</div>${ans[i]!=null?`<p class="s-small">${ans[i]===0?'<span class="status-good">Right.</span>':'<span class="status-bad">Not quite:</span> it prints <b>'+esc(x[1][0])+"</b>."}</p>`:""}</div>`).join("")}
    <div class="caption" aria-live="polite">${all?(right>=5?`<span class="status-good">${right} of 6.</span> You read Python like a network automation engineer.`:`${right} of 6. Reset and try again.`):`${Object.keys(ans).length} of 6 answered.`}</div>
    <div class="viz-controls"><button class="btn" id="py-reset">Reset</button></div>
    <h3>Scratch pad</h3><div class="pad-row"><span class="mono">&gt;&gt;&gt;</span><input id="py-in" aria-label="Python one-liner" spellcheck="false" autocomplete="off" value="${esc(line)}"><button class="btn" id="py-run">Run</button></div>${res?`<div class="term pad-out">${esc(res)}</div>`:""}`;
    const q=x=>host.querySelector(x);
    host.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{ans[+b.dataset.q]=+b.dataset.k;const r=SNIPS.filter((x,i)=>ans[i]===0).length;if(Object.keys(ans).length===SNIPS.length&&r>=5&&!api.passed())api.pass();draw()});
    q("#py-reset").onclick=()=>{for(const k in ans)delete ans[k];draw()};
    const go=()=>{line=q("#py-in").value;res=run(line);draw();q("#py-in").focus()};q("#py-run").onclick=go;q("#py-in").onkeydown=e=>{if(e.key==="Enter")go()}}
  draw()}

const BROKEN=`{
  'ietf-interfaces:interface': {
    "name": "Loopback100",
    "description": "Managed by automation",
    "type": "iana-if-type:softwareLoopback",
    "enabled": True,

function jsonFix(host,api,s){let txt=BROKEN,msg="";
  function check(t){let o;try{o=JSON.parse(t)}catch(e){return [false,"Invalid JSON: "+e.message.replace(/^JSON\.parse: /,"")]}
    const i=o&&o["ietf-interfaces:interface"];if(!i)return [false,"Valid JSON, but the top-level key must be \"ietf-interfaces:interface\"."];
    if(i.name!=="Loopback100")return [false,"Valid JSON, but name must be \"Loopback100\"."];
    if(i.enabled!==true)return [false,"Valid JSON, but enabled must be the boolean true (no quotes)."];
    const a=i["ietf-ip:ipv4"]?.address;if(!Array.isArray(a)||!a.some(x=>x.ip==="10.100.100.1"&&x.netmask==="255.255.255.0"))return [false,"Valid JSON, but the ipv4 address list must contain 10.100.100.1 / 255.255.255.0."];
    return [true,"Valid JSON and the payload is correct. A RESTCONF PUT of this body to .../interfaces/interface=Loopback100 would return 201 or 204."]}
  function draw(){host.innerHTML=`${simHead(s,api)}<p class="scenario">A teammate's RESTCONF payload keeps getting <b>400 Bad Request</b>. Fix the JSON so it's valid, without changing what it configures.</p>
    <textarea class="pad-area" id="js-t" spellcheck="false" aria-label="JSON payload">${esc(txt)}</textarea>
    <div class="viz-controls"><button class="btn primary" id="js-go">Validate</button><button class="btn" id="js-r">Start over</button></div><div class="caption" aria-live="polite">${msg}</div>`;
    const q=x=>host.querySelector(x);
    q("#js-go").onclick=()=>{txt=q("#js-t").value;const [ok,m]=check(txt);msg=(ok?'<span class="status-good">Fixed.</span> ':'<span class="status-bad">Not yet.</span> ')+esc(m);if(ok&&!api.passed())api.pass();draw()};
    q("#js-r").onclick=()=>{txt=BROKEN;msg="";draw()}}
  draw()}

<script>
/* ================= Exam-only question bank =================
   These questions appear only in the timed practice exams and domain drills, never in the module quizzes,
   so a full exam always has fresh material. Scenario-style, one best answer, each with an explanation. */

/* ---------- 1.0 Architecture (15) ---------- */
registerExamBank("arch",[
 {q:"A campus has fewer than 10 access switches in one building and limited budget. Which design is most appropriate?",o:["Collapsed core (two-tier) with combined core/distribution","Full three-tier with separate core","Spine-leaf fabric with VXLAN","A single flat Layer 2 network across sites"],a:0,e:"Small campuses combine core and distribution to cut cost while keeping redundancy."},
 {q:"Which benefit does a Layer 3 access (routed access) design have over Layer 2 access with STP?",o:["VLANs can span the whole campus","Faster convergence and no STP blocked links, since routing protocols use all uplinks","No IP addressing needed","Lower routing table size always"],a:1,e:"Routed access uses ECMP on all uplinks and avoids STP. VLANs stay local to each access switch."},
 {q:"In a spine-leaf data center, how many hops separate any two leaf switches?",o:["One","Three or more depending on location","Two (leaf to spine to leaf)","It varies widely"],a:2,e:"Every leaf connects to every spine, so any leaf-to-leaf path is leaf, spine, leaf."},
 {q:"Which SD-WAN component is responsible for authenticating and orchestrating the initial connection of WAN edge routers?",o:["SD-WAN Controller (vSmart)","SD-WAN Manager (vManage)","WAN edge","SD-WAN Validator (vBond)"],a:3,e:"The Validator authenticates devices and helps them find the controllers and Manager. Controllers distribute routes and policy using OMP."},
 {q:"Which protocol do Cisco SD-WAN controllers use to distribute routes and policy to WAN edges?",o:["OMP (Overlay Management Protocol)","OSPF","EIGRP","LISP"],a:0,e:"OMP runs between Controllers and edges inside DTLS or TLS control connections."},
 {q:"In Cisco SD-Access, which protocol provides the control plane (host location mapping)?",o:["OMP","LISP","BGP EVPN","VTP"],a:1,e:"SD-Access uses LISP for the control plane, VXLAN for the data plane and Cisco TrustSec (SGTs) for policy."},
 {q:"Which SD-Access fabric node connects the fabric to external networks?",o:["Edge node","Control plane node","Border node","Extended node"],a:2,e:"Border nodes hand traffic off between the fabric and outside networks."},
 {q:"Which wireless deployment model centralizes all APs to a WLC in the data center with client traffic tunneled there?",o:["FlexConnect with local switching","Autonomous","Mesh only","Centralized (local mode)"],a:3,e:"In local mode, APs tunnel all traffic to the controller over CAPWAP."},
 {q:"Branch APs must keep switching client traffic locally if the WAN to the controller fails. Which mode fits?",o:["FlexConnect","Local mode","Sniffer mode","Monitor mode"],a:0,e:"FlexConnect APs can switch locally and keep serving clients when the controller is unreachable."},
 {q:"What does the QoS trust boundary define?",o:["The maximum bandwidth of a link","The point in the network where markings from devices are accepted or re-marked","The STP root location","The routing protocol AD"],a:1,e:"Put the trust boundary as close to the endpoint as possible, for example trusting Cisco phones."},
 {q:"Which DSCP value is recommended for voice payload traffic?",o:["AF41 (34)","CS3 (24)","EF (46)","Default (0)"],a:2,e:"Voice uses Expedited Forwarding. AF41 is typically interactive video and CS3 is signaling."},
 {q:"Which QoS mechanism drops packets that exceed a rate, while shaping buffers them?",o:["Shaping","Queuing","Classification","Policing"],a:3,e:"Policers drop or re-mark excess traffic. Shapers delay it to smooth bursts."},
 {q:"Which queuing tool gives voice a strict-priority queue while other classes get guaranteed bandwidth?",o:["LLQ (CBWFQ with a priority queue)","FIFO","WRED only","Custom queuing"],a:0,e:"LLQ adds a policed strict-priority queue to CBWFQ."},
 {q:"Which switching method uses the FIB and adjacency table for hardware-accelerated forwarding?",o:["Process switching","CEF","Fast switching only","Flooding"],a:1,e:"Cisco Express Forwarding builds the FIB from the routing table and the adjacency table from ARP and ND."},
 {q:"Which high-availability feature lets a router continue forwarding using existing tables during a supervisor switchover?",o:["HSRP only","STP PortFast","NSF with SSO","BFD only"],a:2,e:"Stateful switchover syncs state to the standby supervisor, and NSF keeps forwarding while routing reconverges."}
]);

/* ---------- 2.0 Virtualization (10) ---------- */
registerExamBank("virt",[
 {q:"A service provider needs to keep several customers' routing tables separate on one router with overlapping IP addresses. What should be used?",o:["VLANs only","ACLs","Port security","VRFs"],a:3,e:"Virtual routing and forwarding instances keep isolated routing tables on one device."},
 {q:"Which command places interface Gi0/1 into VRF CUSTOMER-A on IOS XE?",o:["vrf forwarding CUSTOMER-A (under the interface, then re-add the IP)","ip vrf CUSTOMER-A global","switchport vrf CUSTOMER-A","router vrf CUSTOMER-A"],a:0,e:"Applying vrf forwarding removes the existing IP address, so reconfigure it afterward."},
 {q:"Which command shows the routing table for VRF RED?",o:["show vrf RED route","show ip route vrf RED","show ip route RED","show ip vrf interfaces only"],a:1,e:"Add vrf <name> to show commands to see VRF-specific tables."},
 {q:"What is the main limitation of a GRE tunnel used alone?",o:["It can't carry multicast","It can't carry IPv6","It provides no encryption","It requires MPLS"],a:2,e:"GRE encapsulates traffic, including multicast and routing protocols, but doesn't encrypt it. Pair it with IPsec."},
 {q:"A GRE tunnel interface keeps flapping with 'recursive routing' messages. What is the cause?",o:["The MTU is too large","Keepalives are disabled","IPsec isn't configured","The tunnel destination is being learned through the tunnel itself"],a:3,e:"If the route to the tunnel destination points into the tunnel, the tunnel goes down. Use a static or filtered route for the destination."},

<script>
/* ================= Print & export (shared by every guide) =================

   Adds a #print route (whole guide) and #print-<slug> (one module) with:
   - a printable summary (lessons, flashcards, optional quiz with answer key) for Print / Save as PDF

(function(){

const MASTERED=4;
let PE={lessons:true,cards:true,quiz:false};

/* ---------- styles: on-screen preview and print ---------- */

}`;

/* ---------- printable summary ---------- */
function cleanLesson(html){
  const d=document.createElement("div");d.innerHTML=html;

  d.querySelectorAll(".viz-controls,.viz-title,button,input,select,textarea,script,canvas,[data-sim],.sim").forEach(n=>n.remove());
  d.querySelectorAll("[id]").forEach(n=>n.removeAttribute("id"));
  d.querySelectorAll("[onclick]").forEach(n=>n.removeAttribute("onclick"));
  return d.innerHTML;
}
function modSection(m,num){
  let h=`<section class="p-mod"><h2>${esc(modLabel(m))}</h2>`;
  const o=outlineOf(m);if(o.weight)h+=`<div class="p-meta">${o.weight}% of the exam · ${m.lessons.length} lessons · ${m.cards.length} flashcards</div>`;
  if(PE.lessons)h+=m.lessons.map(l=>`<h3>${esc(l.num?l.num+" ":"")}${esc(l.title)}</h3>${cleanLesson(l.html||"")}`).join("");
  if(PE.cards&&m.cards.length)h+=`<h3>Flashcard review</h3><table class="p-cards"><thead><tr><th>Prompt</th><th>Answer</th></tr></thead><tbody>${m.cards.map(c=>`<tr><td>${c.q}</td><td>${c.a}</td></tr>`).join("")}</tbody></table>`;
  if(PE.quiz&&(m.quiz||[]).length)h+=`<h3>Practice questions</h3>`+m.quiz.map((q,i)=>`<div class="p-q"><b>${num}.${i+1}</b> ${q.q}<ol>${q.o.map(x=>`<li>${x}</li>`).join("")}</ol></div>`).join("");
  return h+"</section>";
}
function answerKeys(mods){
  if(!PE.quiz)return"";
  const ks=mods.filter(m=>(m.quiz||[]).length);if(!ks.length)return"";
  return `<section class="p-keys"><h2>Answer key</h2>`+ks.map(m=>{const n=mods.indexOf(m)+1;
    return `<h3>${esc(modLabel(m))}</h3><ol class="p-key" style="list-style:none;padding:0">${m.quiz.map((q,i)=>`<li><b>${n}.${i+1} ${"ABCDEFGH"[q.a]||""}.</b> ${q.o[q.a]}${q.e?" · "+q.e:""}</li>`).join("")}</ol>`}).join("")+"</section>";
}
function paper(mods){
  const date=new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
  const scope=mods.length===MODULES.length?"Full guide summary":modLabel(mods[0]);
  return `<h1>${esc(GUIDE)}</h1><div class="p-meta">${esc(scope)} · Printed ${date} · mikeriveira.github.io/study-guides</div>`+
    mods.map((m,i)=>modSection(m,i+1)).join("")+answerKeys(mods);
}

/* ---------- Anki export ---------- */
const field=s=>'"'+String(s).replace(/\r?\n|\t/g," ").replace(/"/g,'""')+'"';
function cardsFor(mods,onlyNew){
  const rows=[];
  mods.forEach(m=>{const s=MS(m.id);m.cards.forEach(c=>{if(onlyNew&&(s.box[c.id]||0)>=MASTERED)return;
    const o=outlineOf(m),tags=[TAG,TAG+"::"+(o.slug||m.slug),c.deck?TAG+"::"+(o.slug||m.slug)+"::"+c.deck:""].filter(Boolean).map(t=>t.replace(/\s+/g,"_"));
    rows.push([c.q,c.a,tags.join(" "),TAG+"-"+m.id+"-"+c.id])})});
  return rows;
}
function ankiFile(mods,onlyNew){
  const rows=cardsFor(mods,onlyNew);
  const head=["#separator:tab","#html:true","#notetype:Basic","#deck:"+GUIDE,"#tags column:3","#guid column:4"];
  return {count:rows.length,text:head.join("\n")+"\n"+rows.map(r=>r.map(field).join("\t")).join("\n")+"\n"};
}
function download(name,text){
  const b=new Blob([text],{type:"text/plain;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
}

/* ---------- the page ---------- */
function renderPrint(slug){
  CUR=null;
  const one=slug&&modBySlug(slug);
  $("#head").innerHTML=`<div class="crumbs"><a href="../">Roadmap</a><span>/</span><a href="#home">All modules</a><span>/</span>Print &amp; export</div><h1>Print &amp; export</h1>`;
  $("#nav").hidden=true;$("#stats").hidden=true;
  const opts=`<option value="">Whole guide (${MODULES.length} modules)</option>`+MODULES.map(m=>`<option value="${m.slug}" ${one===m?"selected":""}>${esc(modLabel(m))}</option>`).join("");
  $("#view").innerHTML=`
  <div class="pe-panel">
    <h2>What to include</h2>
    <div class="pe-row"><label for="pe-scope">Scope</label><select id="pe-scope">${opts}</select></div>
    <div class="pe-row">
      <label><input type="checkbox" id="pe-l" ${PE.lessons?"checked":""}> Lessons</label>
      <label><input type="checkbox" id="pe-c" ${PE.cards?"checked":""}> Flashcard table</label>
      <label><input type="checkbox" id="pe-q" ${PE.quiz?"checked":""}> Practice questions with answer key</label>
    </div>
  </div>
  <div class="pe-panel">
    <h2>Printable summary</h2>
    <p>Opens your browser's print dialog. Choose "Save as PDF" as the printer to keep a copy. Interactive diagrams are left out of the printout.</p>
    <div class="pe-actions"><button class="btn" id="pe-print">Print / Save as PDF</button></div>
  </div>
  <div class="pe-panel">
    <h2>Flashcards for Anki</h2>
    <p id="pe-count"></p>
    <div class="pe-row">
      <label><input type="radio" name="pe-a" value="all" checked> All cards</label>
      <label><input type="radio" name="pe-a" value="new"> Only cards I haven't mastered yet</label>
    </div>
    <div class="pe-actions"><button class="btn" id="pe-anki">Download Anki file</button></div>
    <ol class="pe-steps"><li>In Anki, choose File, then Import, and pick the downloaded file.</li><li>Anki reads the settings from the file: Basic cards, deck "${esc(GUIDE)}", tags by module.</li><li>Click Import. Importing again later updates the same cards instead of making copies.</li></ol>
  </div>
  <p class="pe-note">Preview</p>
  <div class="pe-doc" id="pe-paper"></div>`;
  const scope=()=>{const v=$("#pe-scope").value;return v?[modBySlug(v)]:MODULES.slice()};
  const onlyNew=()=>$('input[name="pe-a"]:checked').value==="new";
  const draw=()=>{PE={lessons:$("#pe-l").checked,cards:$("#pe-c").checked,quiz:$("#pe-q").checked};
    const mods=scope();$("#pe-paper").innerHTML=paper(mods);
    const all=ankiFile(mods,false).count,left=ankiFile(mods,true).count;
    $("#pe-count").textContent=`${all} cards in this scope, ${left} not mastered yet. The file imports straight into Anki as Basic cards, tagged by module.`};
  $("#pe-scope").onchange=()=>{const v=$("#pe-scope").value;history.replaceState(null,"","#print"+(v?"-"+v:""));draw()};
  ["#pe-l","#pe-c","#pe-q"].forEach(s=>$(s).onchange=draw);
  $("#pe-print").onclick=()=>window.print();
  $("#pe-anki").onclick=()=>{const mods=scope(),f=ankiFile(mods,onlyNew());
    if(!f.count){alert("Every card in this scope is already mastered. Choose All cards to export them anyway.");return}
    const part=mods.length===MODULES.length?"all":mods[0].slug;
    download(`${TAG}-${part}-anki${onlyNew()?"-unmastered":""}.txt`,f.text)};
  draw();
}

/* ---------- hook into the engine ---------- */
const baseRoute=route,baseHome=renderHome,baseOpen=openModule;
route=function(){
  const h=location.hash.slice(1);
  if(h==="print"||h.startsWith("print-")){clearInterval(examTimer);renderPrint(h.slice(6));window.scrollTo(0,0);return}
  return baseRoute.apply(this,arguments);
};
renderHome=function(){
  const r=baseHome.apply(this,arguments);
  const h=$("#head");if(h&&!h.querySelector(".pe-link"))h.insertAdjacentHTML("beforeend",`<a class="pe-link" href="#print">Print summary &amp; Anki export</a>`);
  return r;
};
openModule=function(m){
  const r=baseOpen.apply(this,arguments);
  const h=$("#head");if(h&&!h.querySelector(".pe-link"))h.insertAdjacentHTML("beforeend",`<a class="pe-link" href="#print-${m.slug}">Print or export this module</a>`);
  return r;
};
window.PrintExport={ankiFile,paper,renderPrint};
})();

</script>
<script>boot();</script>
