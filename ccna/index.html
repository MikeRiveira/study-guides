<script>
/* ================= Exam-only question bank =================
   These questions appear only in the timed practice exams and domain drills, never in the module quizzes,
   so a full exam always has fresh material. Scenario-style, one best answer, each with an explanation. */

/* ---------- 1.0 Network Infrastructure and Connectivity (25) ---------- */
registerExamBank("inf",[
 {q:"An interface shows a rising count of input errors and CRC errors, but no collisions, on a full-duplex link. What is the most likely cause?",o:["Physical layer problems such as a bad cable, connector or interference","A duplex mismatch","An incorrect OSPF area","A missing default route"],a:0,e:"CRC errors on a full-duplex link usually come from corrupted bits on the wire. Late collisions would point to a duplex mismatch instead."},
 {q:"The output of show interfaces shows 'late collisions' increasing. What should the engineer check?",o:["The routing table","Duplex settings on both ends of the link","The VTP domain name","The NTP server"],a:1,e:"Late collisions are the classic sign of a duplex mismatch. One side runs half duplex while the other runs full."},
 {q:"Which subnet mask gives exactly 6 usable host addresses?",o:["255.255.255.240","255.255.255.252","255.255.255.248","255.255.255.224"],a:2,e:"A /29 (255.255.255.248) has 8 addresses and 6 usable hosts."},
 {q:"A host has the address 172.16.45.200/20. What is its network address?",o:["172.16.40.0","172.16.45.0","172.16.48.0","172.16.32.0"],a:3,e:"A /20 has a block size of 16 in the third octet. 45 falls in the 32–47 block, so the network is 172.16.32.0."},
 {q:"Which subnet would you assign to a point-to-point WAN link to waste the fewest IPv4 addresses?",o:["/30 or /31","/24","/28","/26"],a:0,e:"A /30 gives two usable hosts. A /31 (RFC 3021) uses both addresses on point-to-point links."},
 {q:"An interface has the MAC address 00:1A:2B:3C:4D:5E. What is the interface ID that modified EUI-64 creates from it?",o:["001A:2BFF:FE3C:4D5E","021A:2BFF:FE3C:4D5E","021A:2B3C:4D5E:FFFE","FFFE:001A:2B3C:4D5E"],a:1,e:"EUI-64 splits the MAC, inserts FFFE in the middle and flips the 7th bit (00 becomes 02)."},
 {q:"Which IPv6 address type is equivalent to IPv4 private addressing and isn't routed on the internet?",o:["Global unicast (2000::/3)","Link-local (fe80::/10)","Unique local (fc00::/7, in practice fd00::/8)","Anycast"],a:2,e:"Unique local addresses are for internal use. Link-local addresses never leave the link at all."},
 {q:"Which IPv6 multicast address reaches all routers on the local link?",o:["ff02::1","ff02::5","ff02::1:2","ff02::2"],a:3,e:"ff02::1 is all nodes, ff02::2 is all routers, ff02::5 is all OSPFv3 routers and ff02::1:2 is DHCPv6 agents."},
 {q:"How is 2001:0db8:0000:0000:0000:0000:0a00:0001 correctly shortened?",o:["2001:db8::a00:1","2001:db8::a::1","2001:db8:0:0::a00::1","2001:db8::0a00:0001:0"],a:0,e:"Drop leading zeros in each group and replace one run of all-zero groups with ::. The :: can appear only once."},
 {q:"Which cable type is needed for a 10GBASE-SR connection?",o:["Single-mode fiber over 10 km","Multimode fiber","Cat 5e UTP","Coaxial"],a:1,e:"SR (short reach) uses multimode fiber with 850 nm optics. LR uses single-mode."},
 {q:"Which hypervisor type does VMware ESXi represent?",o:["Type 2 (hosted)","Container runtime","Type 1 (bare metal)","Emulator"],a:2,e:"ESXi installs directly on the server hardware."},
 {q:"How do containers differ from virtual machines?",o:["Containers each run their own kernel","VMs are always smaller than containers","Containers need a Type 1 hypervisor","Containers share the host OS kernel; VMs each run a full guest OS"],a:3,e:"Containers are lightweight because they package only the app and its dependencies on a shared kernel."},
 {q:"In a virtualized server, what provides Layer 2 connectivity between VMs and the physical NIC?",o:["A virtual switch (vSwitch)","A Layer 3 router only","A patch panel","A WLC"],a:0,e:"The hypervisor's virtual switch connects VM vNICs to each other and to the uplinks, and it can tag VLANs."},
 {q:"Which 5 GHz channel width combines four 20 MHz channels?",o:["40 MHz","80 MHz","160 MHz","20 MHz"],a:1,e:"Two 20 MHz channels make 40 MHz and four make 80 MHz. 160 MHz combines eight."},
 {q:"Which 802.11 term describes the unique MAC address of an AP radio for one SSID?",o:["SSID","ESSID","BSSID","SSID cloaking"],a:2,e:"The BSSID identifies a basic service set, usually the radio's MAC address. The SSID is the network name."},
 {q:"A wireless LAN uses several APs sharing one SSID so clients can roam. What is this called?",o:["Independent BSS","Mesh only","Repeater mode","Extended service set (ESS)"],a:3,e:"Multiple BSSs with the same SSID connected by a distribution system form an ESS."},
 {q:"Which security protocol does WPA3-Personal use to replace the WPA2 pre-shared key exchange?",o:["SAE (Simultaneous Authentication of Equals)","TKIP","WEP","LEAP"],a:0,e:"SAE resists offline dictionary attacks and provides forward secrecy."},
 {q:"On a Windows client, which command releases and then requests a new DHCP lease?",o:["ipconfig /flushdns","ipconfig /release then ipconfig /renew","arp -d","netsh wlan show"],a:1,e:"/release drops the lease and /renew requests a new one."},
 {q:"On a Linux host, which command shows the IP addresses on each interface?",o:["ipconfig /all","show ip interface brief","ip addr (or ip a)","netsh interface ip"],a:2,e:"The iproute2 command ip addr shows the interfaces and their addresses."},
 {q:"On a macOS client, which command shows the IP address of interface en0?",o:["ipconfig /all","show ip int brief","route print","ipconfig getifaddr en0"],a:3,e:"macOS supports ipconfig getifaddr. ifconfig en0 also works."},
 {q:"A router must forward DHCP requests from VLAN 10 clients to a server at 10.0.0.5. Which command goes on the VLAN 10 SVI or router interface?",o:["ip helper-address 10.0.0.5","ip dhcp pool VLAN10","ip default-gateway 10.0.0.5","ip dhcp excluded-address 10.0.0.5"],a:0,e:"ip helper-address relays the broadcast DHCP DORA messages to the server as unicast."},
 {q:"Which IOS command stops the DHCP server from leasing 192.168.1.1 through .10?",o:["network 192.168.1.0 255.255.255.0","ip dhcp excluded-address 192.168.1.1 192.168.1.10","default-router 192.168.1.1","no ip dhcp pool"],a:1,e:"Excluded addresses are configured globally, outside the pool, to protect statically assigned hosts."},
 {q:"In the DHCP DORA process, which message does the client send to accept an offered address?",o:["DHCPDISCOVER","DHCPOFFER","DHCPREQUEST","DHCPACK"],a:2,e:"The order is Discover, Offer, Request, Acknowledge. The client accepts with a Request, and the server confirms with an ACK."},
 {q:"Which interface status shows the line protocol is down but the interface is enabled, often caused by a keepalive or encapsulation mismatch?",o:["administratively down/down","down/down","up/up","up/down"],a:3,e:"up/down means Layer 1 is working but Layer 2 isn't, for example from mismatched encapsulation."},
 {q:"Which PoE standard can deliver up to about 30 W per port?",o:["802.3at (PoE+)","802.3af","802.3bt Type 4","802.3ad"],a:0,e:"802.3af is about 15.4 W, 802.3at is about 30 W, and 802.3bt reaches 60–100 W. 802.3ad is link aggregation."}
]);

/* ---------- 2.0 Switching and Network Access (25) ---------- */
registerExamBank("sw",[
 {q:"A switch receives a frame whose destination MAC isn't in its MAC address table. What does it do?",o:["Drops the frame","Floods the frame out all ports in that VLAN except the one it came in on","Sends it to the default gateway only","Sends an ARP request"],a:1,e:"Unknown unicast frames are flooded within the VLAN until the switch learns the destination."},
 {q:"What does a switch use to populate its MAC address table?",o:["The destination MAC of each frame","ARP replies only","The source MAC address of frames received on each port","CDP messages"],a:2,e:"Switches learn by recording the source MAC and the incoming port."},
 {q:"A switchport must carry VLANs 10, 20 and 30 to another switch, with VLAN 99 as native. Which configuration fits?",o:["switchport mode access, switchport access vlan 10","switchport voice vlan 99","channel-group 1 mode on","switchport mode trunk, switchport trunk allowed vlan 10,20,30,99, switchport trunk native vlan 99"],a:3,e:"Configure the port as a trunk, restrict the allowed VLANs and set the native VLAN to match on both sides."},
 {q:"Which command shows which VLANs are allowed and active on trunk links?",o:["show interfaces trunk","show vlan brief","show mac address-table","show ip route"],a:0,e:"show interfaces trunk lists trunk ports, the native VLAN, the allowed VLANs and the ones forwarding."},
 {q:"An access port connects a PC and an IP phone. The phone should be in VLAN 150 and the PC in VLAN 50. Which commands are needed?",o:["switchport mode trunk and native vlan 150","switchport access vlan 50 and switchport voice vlan 150","switchport access vlan 150 only","channel-group 150"],a:1,e:"The voice VLAN feature tags phone traffic with 150 while the PC's untagged traffic uses access VLAN 50."},
 {q:"Two switches are configured for EtherChannel, one with 'mode active' and the other with 'mode passive'. What happens?",o:["It fails; both must be active","It forms as PAgP","The LACP EtherChannel forms","It forms as a static channel"],a:2,e:"LACP forms when at least one side is active. Passive with passive doesn't form."},
 {q:"Which EtherChannel mode combination will not form a channel?",o:["active and passive","active and active","on and on","passive and passive"],a:3,e:"Two passive sides both wait for the other to initiate, so LACP never starts."},
 {q:"Which must match on all member ports for an EtherChannel to form?",o:["Speed, duplex, and switchport mode/VLAN settings","Port descriptions","Interface numbers","CDP settings"],a:0,e:"Members need consistent speed, duplex, mode, allowed and native VLANs."},
 {q:"In Rapid PVST+, which switch becomes the root bridge?",o:["The one with the highest priority","The one with the lowest bridge ID (priority, then MAC)","The one with the most ports","The newest switch"],a:1,e:"The lowest bridge ID wins. Priority is compared first, in steps of 4096, then the lowest MAC."},
 {q:"Which command makes a switch the root bridge for VLAN 10 by lowering its priority automatically?",o:["spanning-tree portfast","spanning-tree bpduguard enable","spanning-tree vlan 10 root primary","spanning-tree mode mst"],a:2,e:"root primary sets the priority below the current root, typically to 24576."},
 {q:"Which RSTP port role is the best path to the root bridge on a non-root switch?",o:["Designated port","Alternate port","Backup port","Root port"],a:3,e:"Each non-root switch has one root port with the lowest cost to the root."},
 {q:"Which RSTP port role provides a ready backup path to the root and moves to forwarding quickly if the root port fails?",o:["Alternate port","Designated port","Disabled port","Edge port"],a:0,e:"The alternate port is discarding but takes over fast if the root port fails."},
 {q:"Which feature should be enabled on access ports connected to end hosts so they move to forwarding immediately?",o:["Root guard","PortFast","Loop guard","UDLD"],a:1,e:"PortFast (an edge port) skips listening and learning on host ports. Pair it with BPDU guard."},
 {q:"A user plugs a small switch into a PortFast access port that has BPDU guard enabled. What happens?",o:["The new switch becomes root","Nothing","The port goes err-disabled when it receives a BPDU","The port becomes a trunk"],a:2,e:"BPDU guard shuts down an edge port as soon as a BPDU arrives, which prevents loops and rogue roots."},
 {q:"Which protocol is vendor-neutral and used to discover neighboring devices from different vendors?",o:["CDP","VTP","DTP","LLDP"],a:3,e:"LLDP (802.1AB) is the open standard. CDP is Cisco-proprietary."},
 {q:"Which command shows detailed neighbor information including the neighbor's IP address and platform?",o:["show cdp neighbors detail","show cdp neighbors","show ip interface brief","show version"],a:0,e:"show cdp neighbors detail includes the management address, platform and software version."},
 {q:"Why might an engineer disable CDP on an internet-facing interface?",o:["To speed up routing","To avoid leaking device model, IOS version and addressing to outsiders","To enable PoE","To allow trunking"],a:1,e:"CDP advertises details an attacker could use. Use no cdp enable on untrusted interfaces."},
 {q:"An extended ping is used to test reachability sourced from a router's loopback interface. Why?",o:["To change the MTU","To test the console port","To verify that the destination has a return route to the loopback network","To speed up the ping"],a:2,e:"Sourcing from the loopback proves both the forward and the return routes for that network."},
 {q:"Which SVI configuration allows a Layer 3 switch to route for VLAN 20?",o:["switchport access vlan 20 on a port","vlan 20 name SALES only","spanning-tree vlan 20 root","interface vlan 20, ip address 10.20.0.1 255.255.255.0, no shutdown, and ip routing enabled globally"],a:3,e:"An SVI needs an IP address, must be up, and the switch needs ip routing turned on."},
 {q:"Which interface type on a Layer 3 switch acts like a router port and doesn't belong to any VLAN?",o:["Routed port (no switchport)","Access port","Trunk port","SVI"],a:0,e:"no switchport turns a physical port into a routed interface."},
 {q:"A wireless AP connected to a switch serves several SSIDs mapped to different VLANs. How should the switchport be configured for an autonomous AP?",o:["As an access port in VLAN 1","As an 802.1Q trunk carrying those VLANs","As a routed port","With port security max 1"],a:1,e:"Autonomous APs (and FlexConnect APs with local switching) need a trunk so each SSID's VLAN reaches the switch."},
 {q:"In a split-MAC architecture, lightweight APs tunnel client traffic to the WLC using which protocol?",o:["GRE only","LWAPP over TCP","CAPWAP","SSH"],a:2,e:"CAPWAP carries the control channel (UDP 5246) and the data channel (UDP 5247) between APs and the controller."},
 {q:"Which WLC port type is a logical interface used for client VLAN traffic?",o:["Service port","Redundancy port","Console port","Dynamic interface"],a:3,e:"Dynamic interfaces map WLANs to VLANs on the controller."},

 {q:"A packet capture is needed of traffic on switch port Gi1/0/5 to send to an analyzer on Gi1/0/24. What should be configured?",o:["An ACL on Gi1/0/5","A local SPAN session with Gi1/0/5 as source and Gi1/0/24 as destination","An EtherChannel","A static route"],a:1,e:"SPAN mirrors traffic from source ports to the destination port where the analyzer sits."}
]);

/* ---------- 3.0 IP Routing (20) ---------- */
registerExamBank("rt",[
 {q:"In the routing table, what does the code 'O IA' mean?",o:["OSPF intra-area route","OSPF external type 1","OSPF inter-area route","EIGRP route"],a:2,e:"O is an intra-area OSPF route, O IA is inter-area, and O E1/E2 are external routes."},
 {q:"A route entry reads 'O 10.5.0.0/16 [110/30] via 10.1.1.2'. What are 110 and 30?",o:["Hop count and bandwidth","Delay and load","Area and router ID","Administrative distance and metric (cost)"],a:3,e:"The bracket shows [administrative distance/metric]. OSPF's AD is 110 and the cost here is 30."},

 {q:"A backup static route should be used only if the OSPF route fails. Which configuration achieves this?",o:["ip route 10.9.0.0 255.255.0.0 192.0.2.1 1","ip route 10.9.0.0 255.255.0.0 null0","ip route 0.0.0.0 0.0.0.0 192.0.2.1","ip route 10.9.0.0 255.255.0.0 192.0.2.1 115"],a:3,e:"A floating static route uses an AD higher than OSPF's 110, so it's installed only when OSPF's route disappears."},
 {q:"Which command configures an IPv6 default static route pointing to 2001:db8::1?",o:["ipv6 route ::/0 2001:db8::1","ip route ::/0 2001:db8::1","ipv6 route 0.0.0.0/0 2001:db8::1","ipv6 default-gateway 2001:db8::1"],a:0,e:"IPv6 static routes use ipv6 route, and ::/0 is the default prefix. ipv6 unicast-routing must also be enabled."},
 {q:"Which must match for two OSPFv2 routers to become neighbors on a broadcast segment?",o:["Router ID","Area ID, hello/dead timers, subnet and mask, and authentication","Interface priority","Process ID"],a:1,e:"The area, timers, subnet, authentication and stub flags must match. Router IDs must be unique, and process IDs are local only."},
 {q:"How is the OSPF router ID chosen if none is configured manually?",o:["Lowest MAC address","Lowest IP on any interface","Highest IPv4 address on an up loopback, otherwise the highest active physical interface IP","Random"],a:2,e:"Manual router-id first, then the highest loopback IP, then the highest active interface IP."},

 {q:"What OSPF cost does a 1 Gbps interface get with the default reference bandwidth of 100 Mbps?",o:["10","1","100","0"],a:1,e:"Cost = reference bandwidth / interface bandwidth, rounded up to at least 1. That's why engineers raise the reference bandwidth."},
 {q:"Which command makes OSPF stop sending hellos on a LAN interface while still advertising its subnet?",o:["no network","shutdown","passive-interface","ip ospf priority 0"],a:2,e:"Passive interfaces advertise their network but form no adjacencies."},
 {q:"Which OSPF network type on point-to-point links skips DR/BDR election?",o:["broadcast","non-broadcast","point-to-multipoint non-broadcast","point-to-point"],a:3,e:"Point-to-point links have only two routers, so no DR is elected and adjacency forms faster."},
 {q:"Which command enables OSPFv3 for IPv6 on an interface in area 0, process 1?",o:["ipv6 ospf 1 area 0","network ::/0 area 0","ospf ipv6 area 0","router ospf 1 ipv6"],a:0,e:"OSPFv3 is enabled per interface with ipv6 ospf <process> area <area>."},
 {q:"In HSRP, which router becomes active?",o:["Lowest priority","Highest priority, then highest interface IP","Lowest IP","The one configured first"],a:1,e:"The default priority is 100. The highest wins, and the highest IP breaks ties."},
 {q:"Which HSRP feature lets a higher-priority router take back the active role after it recovers?",o:["track","authentication","preempt","timers"],a:2,e:"Without preempt, a recovered higher-priority router stays standby."},
 {q:"How does VRRP differ from HSRP?",o:["VRRP is Cisco-proprietary","VRRP provides load balancing only","VRRP is used for routing between AS","VRRP is an open standard; HSRP is Cisco-proprietary"],a:3,e:"VRRP (RFC 5798) is vendor-neutral. HSRP is Cisco's. Both provide a virtual gateway."},
 {q:"A router has two equal-cost OSPF paths to a destination. What does it do by default?",o:["Installs both and load-balances (ECMP)","Uses only the first learned","Drops traffic","Uses the one with the lower router ID"],a:0,e:"OSPF installs equal-cost paths, up to 4 by default on IOS, and load-shares across them."},
 {q:"Which command verifies OSPF neighbor states?",o:["show ip route ospf","show ip ospf neighbor","show ip protocols","show ip interface brief"],a:1,e:"show ip ospf neighbor lists each neighbor's router ID, state, priority and interface."}
]);

/* ---------- 4.0 Network Services and Security (20) ---------- */
registerExamBank("svc",[
 {q:"Which commands are required before SSH can be enabled on a Cisco router?",o:["Only enable secret","Only transport input ssh","A hostname, an ip domain-name, and crypto key generate rsa","snmp-server community"],a:2,e:"RSA keys need a hostname and domain name. Then set transport input ssh on the VTY lines and configure local users."},
 {q:"Which command stores the privileged EXEC password using a strong hash?",o:["enable password","service password-encryption only","username admin password","enable secret"],a:3,e:"enable secret uses a strong hash (type 5, 8 or 9). enable password is weak or plain text."},
 {q:"An auditor sees 'service password-encryption' in a router config and asks if the passwords are now safe. What does the command actually do?",o:["Applies weak type 7 obfuscation to plain-text passwords in the configuration","Encrypts SSH sessions","Hashes the enable secret","Encrypts SNMP"],a:0,e:"Type 7 is easily reversible. It only stops shoulder surfing of the config."},
 {q:"Which AAA protocol encrypts the entire packet body and separates authentication, authorization and accounting?",o:["RADIUS","TACACS+","LDAP","Kerberos"],a:1,e:"TACACS+ (TCP 49) encrypts the whole payload and is preferred for device administration. RADIUS encrypts only the password."},
 {q:"Which protocol securely copies files to a router using SSH?",o:["TFTP","FTP","SCP","HTTP"],a:2,e:"SCP (and SFTP) run over SSH. TFTP and FTP are unencrypted."},
 {q:"In NAT terminology, what is the inside global address?",o:["The private address of an inside host","The outside host's real address","The router's loopback","The public address representing an inside host to the outside"],a:3,e:"Inside local is the host's private IP. Inside global is the translated public IP that outsiders see."},
 {q:"Which configuration translates many inside hosts to the router's outside interface address?",o:["ip nat inside source list 1 interface g0/1 overload","ip nat inside source static 10.0.0.5 203.0.113.5","ip nat pool without overload","ip nat outside source static"],a:0,e:"PAT (overload) uses the interface address with unique ports for many hosts."},
 {q:"A web server at 10.1.1.10 must always appear on the internet as 203.0.113.10. Which NAT type is needed?",o:["Dynamic NAT pool","Static NAT","PAT","NAT64"],a:1,e:"Static NAT gives a fixed one-to-one mapping so inbound connections can reach the server."},
 {q:"Which command shows active NAT translations?",o:["show ip nat statistics only","show running-config nat","show ip nat translations","show access-lists"],a:2,e:"show ip nat translations lists the inside and outside, local and global mappings."},
 {q:"Which DNS record type maps a name to an IPv4 address?",o:["AAAA","MX","PTR","A"],a:3,e:"A records map names to IPv4. AAAA maps to IPv6 and PTR does reverse lookups."},
 {q:"Which command on a Cisco router points it to 8.8.8.8 for name resolution?",o:["ip name-server 8.8.8.8","ip domain-lookup 8.8.8.8","ip dns server 8.8.8.8","dns 8.8.8.8"],a:0,e:"ip name-server sets the DNS servers, and ip domain-lookup must be enabled (it is by default)."},
 {q:"Which IPsec protocol provides encryption of the payload?",o:["AH","ESP","IKE","GRE"],a:1,e:"ESP provides confidentiality, integrity and authentication. AH provides integrity only and doesn't encrypt."},
 {q:"Which protocol negotiates the security associations for an IPsec VPN?",o:["ESP","AH","IKE (IKEv1/IKEv2)","SSL"],a:2,e:"IKE handles authentication and key exchange to build the IPsec SAs."},
 {q:"A standard ACL should block 192.168.10.0/24 from reaching a server subnet. Where should it be applied?",o:["As close to the source as possible","On every interface","On the console line","As close to the destination as possible"],a:3,e:"Standard ACLs match only the source, so place them near the destination to avoid blocking other traffic."},
 {q:"Which wildcard mask matches all hosts in 172.16.32.0/20?",o:["0.0.15.255","0.0.31.255","0.0.0.255","255.255.240.0"],a:0,e:"The wildcard is the inverse of the mask: 255.255.255.255 minus 255.255.240.0 gives 0.0.15.255."},
 {q:"An extended ACL line reads 'permit tcp any host 10.1.1.10 eq 443'. What does it allow?",o:["SSH to any host","HTTPS from any source to server 10.1.1.10","All traffic from 10.1.1.10","DNS to 10.1.1.10"],a:1,e:"It permits TCP from any source to destination 10.1.1.10 on port 443."},
 {q:"What happens to traffic that doesn't match any entry in an applied ACL?",o:["It's permitted","It's logged and permitted","It's dropped by the implicit deny any at the end","It's sent to the default route"],a:2,e:"Every ACL ends with an invisible deny any."},
 {q:"Which Layer 2 security feature limits the number of MAC addresses learned on an access port and can shut it down on violation?",o:["DHCP snooping","DAI","Storm control","Port security"],a:3,e:"Port security sets a maximum number of MACs, can make them sticky, and uses shutdown, restrict or protect on a violation."},
 {q:"Which port security violation mode drops offending frames, logs and increments the violation counter, but keeps the port up?",o:["restrict","shutdown","protect","err-disable recovery"],a:0,e:"Protect drops silently, restrict drops and logs, and shutdown err-disables the port."},
 {q:"For DHCP snooping, which ports should be configured as trusted?",o:["All access ports","Uplinks toward the legitimate DHCP server","No ports","Only voice ports"],a:1,e:"Only trusted ports may send server messages such as OFFER and ACK. Access ports stay untrusted."}
]);

 {q:"Why must NTP be configured on network devices before collecting logs for an investigation?",o:["To encrypt logs","To reduce log size","To enable SSH","So timestamps are accurate and consistent across devices for correlation"],a:3,e:"Synchronized clocks let you line up events from many devices."}

<script>
/* ================= Print & export (shared by every guide) =================
   Loaded by each guide's build.py after its engine and modules, before boot().
   Adds a #print route (whole guide) and #print-<slug> (one module) with:
   - a printable summary (lessons, flashcards, optional quiz with answer key) for Print / Save as PDF
   - an Anki import file (tab-separated, with Anki header lines) of the flashcards
   It relies only on the engine globals every guide shares: MODULES, OUTLINE, modNum, modBySlug, MS, KEY, $. */
(function(){
const GUIDE=document.title.replace(/\s+/g," ").trim()||"Study Guide";
const TAG=String(KEY).replace(/-guide.*$/,"").replace(/[^a-z0-9]+/gi,"");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const outlineOf=m=>OUTLINE.find(o=>o.slug===m.slug)||{};
const modLabel=m=>{const o=outlineOf(m),n=o.domain!==undefined?modNum(o):"";return (n!==""?"Module "+n+": ":"")+(o.title||m.title)};
const MASTERED=4;
let PE={lessons:true,cards:true,quiz:false};

/* ---------- styles: on-screen preview and print ---------- */
const css=`
.pe-link{display:inline-flex;align-items:center;gap:8px;margin:10px 0 0;padding:7px 14px;border:1px solid var(--line);border-radius:999px;color:var(--fg);text-decoration:none;font-family:var(--display);font-size:14px;background:var(--surface)}
.pe-link:hover,.pe-link:focus-visible{border-color:var(--accent);color:var(--accent)}
.pe-panel{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px 18px;margin:16px 0}
.pe-panel h2{margin:0 0 6px;font-family:var(--display);font-size:20px}
.pe-panel p{margin:4px 0 12px;color:var(--muted)}
.pe-row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:10px 0}
.pe-row label{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.pe-row select{font:inherit;color:var(--fg);background:var(--surface-solid);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
.pe-row input[type=checkbox],.pe-row input[type=radio]{accent-color:var(--accent);width:18px;height:18px}
.pe-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.pe-note{font-size:14px;color:var(--muted)}
.pe-steps{margin:8px 0 0 20px;padding:0;color:var(--muted);font-size:14.5px}
.pe-doc{background:#fff;color:#16181d;border-radius:10px;padding:28px 32px;margin:18px 0 40px;font-family:var(--body);line-height:1.55;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.pe-doc *{color:inherit!important;background:transparent!important;box-shadow:none!important;text-shadow:none!important;-webkit-text-fill-color:currentColor}
.pe-doc h1{font-family:var(--display);font-size:26px;margin:0 0 4px}
.pe-doc h2{font-family:var(--display);font-size:21px;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid #16181d}
.pe-doc h3{font-family:var(--display);font-size:16.5px;margin:20px 0 6px}
.pe-doc h4{font-size:15px;margin:14px 0 4px}
.pe-doc p,.pe-doc li{font-size:13.5px}
.pe-doc .p-meta{color:#555!important;font-size:13px;margin-bottom:18px}
.pe-doc .p-mod{margin-top:30px}
.pe-doc table{border-collapse:collapse;width:100%;margin:8px 0 12px;font-size:12.5px}
.pe-doc th,.pe-doc td{border:1px solid #b9bec7!important;padding:4px 7px;text-align:left;vertical-align:top}
.pe-doc th{background:#eef0f3!important}
.pe-doc .scroll{overflow:visible}
.pe-doc .tip{border-left:4px solid #16181d!important;background:#f2f3f5!important;border-radius:0;padding:7px 11px;margin:10px 0;font-size:13px}
.pe-doc pre,.pe-doc code,.pe-doc .mono{font-family:var(--mono);font-size:12px}
.pe-doc pre{white-space:pre-wrap;border:1px solid #d4d7dc;padding:7px 9px;border-radius:4px}
.pe-doc svg{max-width:100%;height:auto}
.pe-doc .p-viz{font-size:12px;font-style:italic;color:#666!important;margin:4px 0}
.pe-doc .p-q{margin:10px 0;break-inside:avoid}
.pe-doc .p-q ol{margin:4px 0 0 4px;padding-left:20px;list-style:upper-alpha}
.pe-doc .p-key li{margin:3px 0}
.pe-doc .p-cards td:first-child{width:40%;font-weight:600}
.pe-doc tr,.pe-doc .tip,.pe-doc pre{break-inside:avoid}
@media (max-width:640px){.pe-doc{padding:18px 16px;border-radius:8px}}
@media print{
  @page{margin:14mm 13mm}
  html,body{background:#fff!important;color:#000!important}
  body *{visibility:hidden}
  .pe-doc,.pe-doc *{visibility:visible}
  header,.toasts,.levelup,.pe-panel,.pe-link,nav{display:none!important}
  main,.wrap,#view{margin:0!important;padding:0!important;max-width:none!important;width:auto!important}
  .pe-doc{position:absolute;left:0;top:0;width:100%;margin:0;padding:0;box-shadow:none;border-radius:0}
  .pe-doc .p-mod{break-before:page;margin-top:0}
  .pe-doc .p-mod:first-of-type{break-before:auto}
  .pe-doc .p-keys{break-before:page}
  .pe-doc a{text-decoration:none}
}`;
const st=document.createElement("style");st.textContent=css;document.head.appendChild(st);

/* ---------- printable summary ---------- */
function cleanLesson(html){
  const d=document.createElement("div");d.innerHTML=html;
  d.querySelectorAll(".viz").forEach(n=>{const e=document.createElement("p");e.className="p-viz";e.textContent="Interactive diagram: see the online guide.";n.replaceWith(e)});
  d.querySelectorAll(".viz-controls,.viz-title,button,input,select,textarea,script,canvas,[data-sim],.sim").forEach(n=>n.remove());
  d.querySelectorAll("[id]").forEach(n=>n.removeAttribute("id"));
  d.querySelectorAll("[onclick]").forEach(n=>n.removeAttribute("onclick"));
  return d.innerHTML;
}
function modSection(m,num){
  let h=`<section class="p-mod"><h2>${esc(modLabel(m))}</h2>`;
  const o=outlineOf(m);if(o.weight)h+=`<div class="p-meta">${o.weight}% of the exam · ${m.lessons.length} lessons · ${m.cards.length} flashcards</div>`;
  if(PE.lessons)h+=m.lessons.map(l=>`<h3>${esc(l.num?l.num+" ":"")}${esc(l.title)}</h3>${cleanLesson(l.html||"")}`).join("");
  if(PE.cards&&m.cards.length)h+=`<h3>Flashcard review</h3><table class="p-cards"><thead><tr><th>Prompt</th><th>Answer</th></tr></thead><tbody>${m.cards.map(c=>`<tr><td>${c.q}</td><td>${c.a}</td></tr>`).join("")}</tbody></table>`;
  if(PE.quiz&&(m.quiz||[]).length)h+=`<h3>Practice questions</h3>`+m.quiz.map((q,i)=>`<div class="p-q"><b>${num}.${i+1}</b> ${q.q}<ol>${q.o.map(x=>`<li>${x}</li>`).join("")}</ol></div>`).join("");
  return h+"</section>";
}
function answerKeys(mods){
  if(!PE.quiz)return"";
  const ks=mods.filter(m=>(m.quiz||[]).length);if(!ks.length)return"";
  return `<section class="p-keys"><h2>Answer key</h2>`+ks.map(m=>{const n=mods.indexOf(m)+1;
    return `<h3>${esc(modLabel(m))}</h3><ol class="p-key" style="list-style:none;padding:0">${m.quiz.map((q,i)=>`<li><b>${n}.${i+1} ${"ABCDEFGH"[q.a]||""}.</b> ${q.o[q.a]}${q.e?" · "+q.e:""}</li>`).join("")}</ol>`}).join("")+"</section>";
}
function paper(mods){
  const date=new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
  const scope=mods.length===MODULES.length?"Full guide summary":modLabel(mods[0]);
  return `<h1>${esc(GUIDE)}</h1><div class="p-meta">${esc(scope)} · Printed ${date} · mikeriveira.github.io/study-guides</div>`+
    mods.map((m,i)=>modSection(m,i+1)).join("")+answerKeys(mods);
}

/* ---------- Anki export ---------- */
const field=s=>'"'+String(s).replace(/\r?\n|\t/g," ").replace(/"/g,'""')+'"';
function cardsFor(mods,onlyNew){
  const rows=[];
  mods.forEach(m=>{const s=MS(m.id);m.cards.forEach(c=>{if(onlyNew&&(s.box[c.id]||0)>=MASTERED)return;
    const o=outlineOf(m),tags=[TAG,TAG+"::"+(o.slug||m.slug),c.deck?TAG+"::"+(o.slug||m.slug)+"::"+c.deck:""].filter(Boolean).map(t=>t.replace(/\s+/g,"_"));
    rows.push([c.q,c.a,tags.join(" "),TAG+"-"+m.id+"-"+c.id])})});
  return rows;
}
function ankiFile(mods,onlyNew){
  const rows=cardsFor(mods,onlyNew);
  const head=["#separator:tab","#html:true","#notetype:Basic","#deck:"+GUIDE,"#tags column:3","#guid column:4"];
  return {count:rows.length,text:head.join("\n")+"\n"+rows.map(r=>r.map(field).join("\t")).join("\n")+"\n"};
}
function download(name,text){
  const b=new Blob([text],{type:"text/plain;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
}

/* ---------- the page ---------- */
function renderPrint(slug){
  CUR=null;
  const one=slug&&modBySlug(slug);
  $("#head").innerHTML=`<div class="crumbs"><a href="../">Roadmap</a><span>/</span><a href="#home">All modules</a><span>/</span>Print &amp; export</div><h1>Print &amp; export</h1>`;
  $("#nav").hidden=true;$("#stats").hidden=true;
  const opts=`<option value="">Whole guide (${MODULES.length} modules)</option>`+MODULES.map(m=>`<option value="${m.slug}" ${one===m?"selected":""}>${esc(modLabel(m))}</option>`).join("");
  $("#view").innerHTML=`
  <div class="pe-panel">
    <h2>What to include</h2>
    <div class="pe-row"><label for="pe-scope">Scope</label><select id="pe-scope">${opts}</select></div>
    <div class="pe-row">
      <label><input type="checkbox" id="pe-l" ${PE.lessons?"checked":""}> Lessons</label>
      <label><input type="checkbox" id="pe-c" ${PE.cards?"checked":""}> Flashcard table</label>
      <label><input type="checkbox" id="pe-q" ${PE.quiz?"checked":""}> Practice questions with answer key</label>
    </div>
  </div>
  <div class="pe-panel">
    <h2>Printable summary</h2>
    <p>Opens your browser's print dialog. Choose "Save as PDF" as the printer to keep a copy. Interactive diagrams are left out of the printout.</p>
    <div class="pe-actions"><button class="btn" id="pe-print">Print / Save as PDF</button></div>
  </div>
  <div class="pe-panel">
    <h2>Flashcards for Anki</h2>
    <p id="pe-count"></p>
    <div class="pe-row">
      <label><input type="radio" name="pe-a" value="all" checked> All cards</label>
      <label><input type="radio" name="pe-a" value="new"> Only cards I haven't mastered yet</label>
    </div>
    <div class="pe-actions"><button class="btn" id="pe-anki">Download Anki file</button></div>
    <ol class="pe-steps"><li>In Anki, choose File, then Import, and pick the downloaded file.</li><li>Anki reads the settings from the file: Basic cards, deck "${esc(GUIDE)}", tags by module.</li><li>Click Import. Importing again later updates the same cards instead of making copies.</li></ol>
  </div>
  <p class="pe-note">Preview</p>
  <div class="pe-doc" id="pe-paper"></div>`;
  const scope=()=>{const v=$("#pe-scope").value;return v?[modBySlug(v)]:MODULES.slice()};
  const onlyNew=()=>$('input[name="pe-a"]:checked').value==="new";
  const draw=()=>{PE={lessons:$("#pe-l").checked,cards:$("#pe-c").checked,quiz:$("#pe-q").checked};
    const mods=scope();$("#pe-paper").innerHTML=paper(mods);
    const all=ankiFile(mods,false).count,left=ankiFile(mods,true).count;
    $("#pe-count").textContent=`${all} cards in this scope, ${left} not mastered yet. The file imports straight into Anki as Basic cards, tagged by module.`};
  $("#pe-scope").onchange=()=>{const v=$("#pe-scope").value;history.replaceState(null,"","#print"+(v?"-"+v:""));draw()};
  ["#pe-l","#pe-c","#pe-q"].forEach(s=>$(s).onchange=draw);
  $("#pe-print").onclick=()=>window.print();
  $("#pe-anki").onclick=()=>{const mods=scope(),f=ankiFile(mods,onlyNew());
    if(!f.count){alert("Every card in this scope is already mastered. Choose All cards to export them anyway.");return}
    const part=mods.length===MODULES.length?"all":mods[0].slug;
    download(`${TAG}-${part}-anki${onlyNew()?"-unmastered":""}.txt`,f.text)};
  draw();
}

/* ---------- hook into the engine ---------- */
const baseRoute=route,baseHome=renderHome,baseOpen=openModule;
route=function(){
  const h=location.hash.slice(1);
  if(h==="print"||h.startsWith("print-")){clearInterval(examTimer);renderPrint(h.slice(6));window.scrollTo(0,0);return}
  return baseRoute.apply(this,arguments);
};
renderHome=function(){
  const r=baseHome.apply(this,arguments);
  const h=$("#head");if(h&&!h.querySelector(".pe-link"))h.insertAdjacentHTML("beforeend",`<a class="pe-link" href="#print">Print summary &amp; Anki export</a>`);
  return r;
};
openModule=function(m){
  const r=baseOpen.apply(this,arguments);
  const h=$("#head");if(h&&!h.querySelector(".pe-link"))h.insertAdjacentHTML("beforeend",`<a class="pe-link" href="#print-${m.slug}">Print or export this module</a>`);
  return r;
};
window.PrintExport={ankiFile,paper,renderPrint};
})();

</script>
<script>boot();</script>
