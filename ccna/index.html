  viz(){
/* ---- MAC learning ---- */
(function(){
  const el=$("#viz-maclearn");
  const H={A:["PC-A","aaaa.aaaa.000a",1],B:["PC-B","bbbb.bbbb.000b",2],C:["PC-C","cccc.cccc.000c",3],D:["PC-D","dddd.dddd.000d",4]};
  const F=[["A","B","PC-A sends to PC-B. The switch learns PC-A is on port 1. PC-B is unknown, so it floods out ports 2, 3 and 4."],
    ["B","A","PC-B replies. The switch learns PC-B on port 2. PC-A is known, so the reply goes out port 1 only."],
    ["C","FFFF","PC-C sends an ARP broadcast. The switch learns PC-C on port 3 and floods the broadcast to every other port."],
    ["A","C","PC-A sends to PC-C. Both are known now, so the frame goes out port 3 only."],
    ["D","B","PC-D sends to PC-B. The switch learns PC-D on port 4 and forwards to port 2. The table now has all four hosts."]];
  let n=0;
  el.innerHTML=`<div class="viz-title">MAC learning: watch the table fill</div><div class="viz-scroll"><svg viewBox="0 0 600 220" style="min-width:440px" role="img" aria-label="Switch with four hosts"></svg></div><div class="viz-scroll"><table class="rt ml-t"></table></div><div class="caption" aria-live="polite"></div><div class="viz-controls"><button class="btn primary" data-a="next">Send next frame</button><button class="btn" data-a="reset">Start over</button><span class="grow"></span></div>`;
  const X={1:90,2:240,3:380,4:520};
  function draw(){const learned=new Set();for(let k=0;k<n;k++)learned.add(F[k][0]);const f=n?F[n-1]:null;
    const out=f?(f[1]==="FFFF"||!learned.has(f[1])||(()=>{const before=new Set();for(let k=0;k<n-1;k++)before.add(F[k][0]);return !before.has(f[1])})()?Object.keys(H).filter(k=>k!==f[0]):[f[1]]):[];
    let s=`<rect x="160" y="20" width="280" height="44" rx="8" class="m-node on"/><text x="300" y="48" text-anchor="middle" class="s-b">SW1</text>`;
    Object.entries(H).forEach(([k,h])=>{const x=X[h[2]],act=f&&(f[0]===k||out.includes(k));s+=`<line x1="${x}" y1="140" x2="${Math.max(170,Math.min(430,x))}" y2="64" class="m-link${act?" on":""}" ${f&&out.includes(k)?'stroke-dasharray="6 4"':""}/><rect x="${x-50}" y="140" width="100" height="46" rx="8" class="m-node${f&&f[0]===k?" on":""}"/><text x="${x}" y="160" text-anchor="middle" class="s-b">${h[0]}</text><text x="${x}" y="177" text-anchor="middle" class="mono" style="font-size:9px;fill:var(--muted)">port ${h[2]}</text>`});
    $("svg",el).innerHTML=s;
    $(".ml-t",el).innerHTML=`<tr><th>VLAN</th><th>MAC address</th><th>Type</th><th>Port</th></tr>`+([...learned].map(k=>`<tr class="${f&&f[0]===k?"hit":""}"><td>1</td><td class="mono">${H[k][1]}</td><td>DYNAMIC</td><td>Gi1/0/${H[k][2]}</td></tr>`).join("")||`<tr><td colspan="4" class="s-small">Empty: the switch hasn't heard from anyone yet.</td></tr>`);
    $(".caption",el).innerHTML=f?f[2]:"The switch just booted. Its MAC table is empty. Send the first frame.";$(".grow",el).textContent=`Frame ${n} of ${F.length}`;$('[data-a="next"]',el).disabled=n===F.length;
    if(n===F.length)award("viz:maclearn",20,"Watched a switch learn MAC addresses")}
  el.addEventListener("click",e=>{const a=e.target.closest("[data-a]")?.dataset.a;if(!a)return;n=a==="next"?Math.min(n+1,F.length):0;draw()});draw();
})();

revealViz($("#viz-dot1q"),{title:"Inside the 802.1Q tag",cols:4,done:"Explored the 802.1Q tag",items:[
  ["TPID","16 bits","Tag Protocol Identifier, always 0x8100. It sits where the EtherType would be, so a receiver knows a tag follows."],
  ["PCP","3 bits","Priority Code Point: the Class of Service (0–7) that QoS uses. Voice is usually 5."],
  ["DEI","1 bit","Drop Eligible Indicator: marks frames that can be dropped first under congestion."],
  ["VID","12 bits","VLAN Identifier: 0–4095, with 0 and 4095 reserved, leaving 1–4094."],
  ["Where it goes","after source MAC","The 4-byte tag is inserted between the source MAC and the EtherType, so the frame grows from 1518 to 1522 bytes and the FCS is recalculated."],
  ["Native VLAN","no tag","Frames in the native VLAN are sent without a tag. Both trunk ends must agree on which VLAN that is."],
  ["Q-in-Q","two tags","Service providers can stack a second tag (802.1ad) to carry a customer's VLANs."],
  ["ISL","obsolete","Cisco's old Inter-Switch Link encapsulated the whole frame. Modern switches only do 802.1Q."]]});

/* ---- DTP matrix ---- */
(function(){
  const el=$("#viz-dtp");const M=["access","trunk","dynamic desirable","dynamic auto"];let a=3,b=3;const seen=new Set();
  const res=(x,y)=>{const s=[M[x],M[y]].sort().join("|");const T={"access|access":["Access","Both sides are access ports."],"access|trunk":["Mismatch","One side tags, the other doesn't. Limited, broken connectivity. Don't do this."],"access|dynamic desirable":["Access","The access side refuses to trunk."],"access|dynamic auto":["Access","Neither side will trunk."],"trunk|trunk":["Trunk","Both hard-coded. Best practice, ideally with nonegotiate."],"dynamic desirable|trunk":["Trunk","The trunk side sends DTP and desirable agrees."],"dynamic auto|trunk":["Trunk","The trunk side asks, and auto agrees."],"dynamic desirable|dynamic desirable":["Trunk","Both actively negotiate."],"dynamic auto|dynamic desirable":["Trunk","Desirable asks, and auto agrees."],"dynamic auto|dynamic auto":["Access","Both wait for the other to ask, so no trunk forms. This catches people out."]};return T[s]};
  el.innerHTML=`<div class="viz-title">DTP: what does the link become?</div><div class="dtp-g"><label class="rf"><span>SW1 Gi1/0/12</span><select data-s="a">${M.map((m,i)=>`<option value="${i}">switchport mode ${m}</option>`).join("")}</select></label><label class="rf"><span>SW2 Gi1/0/12</span><select data-s="b">${M.map((m,i)=>`<option value="${i}">switchport mode ${m}</option>`).join("")}</select></label></div><div class="dtp-r"></div><div class="caption" aria-live="polite"></div><div class="rv-prog s-small"></div>`;
  function draw(){const r=res(a,b);$(".dtp-r",el).innerHTML=`<span class="chip ${r[0]==="Trunk"?"ok":r[0]==="Mismatch"?"no":""}">${r[0]}</span>`;$(".caption",el).textContent=r[1];el.querySelector('[data-s="a"]').value=a;el.querySelector('[data-s="b"]').value=b;
    seen.add([a,b].sort().join());$(".rv-prog",el).textContent=`${seen.size} of 10 combinations tried`;if(seen.size>=6)award("viz:dtp",20,"Worked out DTP combinations")}
  el.addEventListener("change",e=>{const s=e.target.dataset.s;if(!s)return;if(s==="a")a=+e.target.value;else b=+e.target.value;draw()});draw();
})();

/* ---- EtherChannel mode matrix ---- */
(function(){
  const el=$("#viz-lacp");const M=["on","active","passive","desirable","auto"];const seen=new Set();
  const res=(x,y)=>{if(x==="on"||y==="on")return x===y?["Channel (static)","No negotiation. Works, but a miscabled link won't be caught."]:["No channel","on doesn't negotiate, and the other side is waiting for LACP or PAgP. Mixing them can even cause a loop."];
    const L=["active","passive"],P=["desirable","auto"];if(L.includes(x)&&L.includes(y))return x==="passive"&&y==="passive"?["No channel","Both sides wait for the other to start LACP."]:["Channel (LACP)","At least one side is active."];
    if(P.includes(x)&&P.includes(y))return x==="auto"&&y==="auto"?["No channel","Both sides wait for the other to start PAgP."]:["Channel (PAgP)","At least one side is desirable."];return ["No channel","LACP and PAgP don't talk to each other."]};
  el.innerHTML=`<div class="viz-title">Will the bundle form?</div><div class="ec-grid"><div><span class="s-small">SW1</span><div class="chips" data-side="a">${M.map(m=>`<button class="chip mono" data-m="${m}">${m}</button>`).join("")}</div></div><div><span class="s-small">SW2</span><div class="chips" data-side="b">${M.map(m=>`<button class="chip mono" data-m="${m}">${m}</button>`).join("")}</div></div></div><div class="dtp-r"></div><div class="caption" aria-live="polite"></div><div class="rv-prog s-small"></div>`;
  let a="active",b="passive";
  function draw(){const r=res(a,b);el.querySelectorAll('[data-side]').forEach(g=>g.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.m===(g.dataset.side==="a"?a:b))));
    $(".dtp-r",el).innerHTML=`<span class="chip ${/^Channel/.test(r[0])?"ok":"no"}">${r[0]}</span>`;$(".caption",el).textContent=r[1];$(".rv-prog",el).textContent=`${seen.size} combinations tried`}
  el.addEventListener("click",e=>{const m=e.target.closest("[data-m]");if(!m)return;if(m.closest("[data-side]").dataset.side==="a")a=m.dataset.m;else b=m.dataset.m;seen.add([a,b].sort().join());draw();if(seen.size>=6)award("viz:lacp",20,"Explored EtherChannel modes")});draw();
})();

(function(){
  const el=$("#viz-stp");const SW=[["SW1","00a1.0000.0011",32768],["SW2","00a1.0000.0022",32768],["SW3","00a1.0000.0033",32768]];let off=false,stormT=null;
  const P=[[300,40],[110,190],[490,190]];const L=[[0,1,"Gi1/0/1","Gi1/0/1"],[0,2,"Gi1/0/2","Gi1/0/1"],[1,2,"Gi1/0/2","Gi1/0/2"]];const roots=new Set();
  el.innerHTML=`<div class="viz-title">Spanning tree election: change the priorities</div><div class="viz-scroll"><svg viewBox="0 0 600 250" style="min-width:440px" role="img" aria-label="Three switches in a triangle"></svg></div>
  <div class="stp-ctl">${SW.map((s,i)=>`<label class="rf"><span>${s[0]} priority</span><select data-i="${i}">${[0,4096,8192,12288,16384,20480,24576,28672,32768,36864,40960,61440].map(p=>`<option ${p===s[2]?"selected":""}>${p}</option>`).join("")}</select></label>`).join("")}</div>
  <div class="caption" aria-live="polite"></div><div class="viz-controls"><button class="btn" data-a="off">Disable spanning tree</button><span class="grow"></span></div>`;
  const bidS=s=>s[2].toString(16).padStart(4,"0")+s[1].replace(/\./g,"");
  function draw(){const r=SW.map((s,i)=>i).sort((a,b)=>bidS(SW[a])<bidS(SW[b])?-1:1)[0];roots.add(r);
    const others=[0,1,2].filter(i=>i!==r);const blocked=L.find(l=>l[0]!==r&&l[1]!==r);const loser=bidS(SW[blocked[0]])<bidS(SW[blocked[1]])?blocked[1]:blocked[0];
    let s="";L.forEach((l,k)=>{const blk=!off&&l===blocked;s+=`<line x1="${P[l[0]][0]}" y1="${P[l[0]][1]}" x2="${P[l[1]][0]}" y2="${P[l[1]][1]}" class="m-link${off?" storm":blk?"":" on"}" ${blk?'stroke-dasharray="6 5"':""}/>`;
      if(!off){const isRoot=i=>i===r;[[l[0],l[1],l[2]],[l[1],l[0],l[3]]].forEach(([a,b,ifn])=>{const role=isRoot(a)?"DP":(l[0]===r||l[1]===r)?"RP":a===loser?"ALT":"DP";const fx=P[a][0]+(P[b][0]-P[a][0])*.24,fy=P[a][1]+(P[b][1]-P[a][1])*.24;
        s+=`<rect x="${fx-20}" y="${fy-10}" width="40" height="19" rx="5" class="${role==="ALT"?"stp-x":"stp-b"}"/><text x="${fx}" y="${fy+4}" text-anchor="middle" class="mono" style="font-size:10px;fill:var(--fg)">${role}</text>`})}});
    SW.forEach((sw,i)=>{s+=`<rect x="${P[i][0]-56}" y="${P[i][1]-20}" width="112" height="44" rx="8" class="m-node${i===r&&!off?" on":""}"/><text x="${P[i][0]}" y="${P[i][1]-2}" text-anchor="middle" class="s-b">${sw[0]}${i===r&&!off?" ★ root":""}</text><text x="${P[i][0]}" y="${P[i][1]+15}" text-anchor="middle" class="mono" style="font-size:9px;fill:var(--muted)">${sw[2]}+1 · ${sw[1]}</text>`});
    $("svg",el).innerHTML=s;
    $(".caption",el).innerHTML=off?`<span class="status-bad">Broadcast storm.</span> With spanning tree off, one ARP broadcast circles the triangle in both directions forever, copying itself at every switch. Links hit 100%, MAC tables flap between ports, and CPUs choke. Turn it back on.`:
      `<b>${SW[r][0]}</b> wins with the lowest bridge ID (${SW[r][2]+1} with VLAN 1 added${SW.filter(x=>x[2]===SW[r][2]).length>1?", tie broken by the lowest MAC":""}). ${others.map(i=>SW[i][0]).join(" and ")} each pick the direct link to the root as their <b>root port</b> (cost 4). On the ${SW[blocked[0]][0]}–${SW[blocked[1]][0]} link, ${SW[loser===blocked[0]?blocked[1]:blocked[0]][0]} has the better bridge ID, so its port is designated and <b>${SW[loser][0]}'s port is the alternate</b> and discards.`;
    $('[data-a="off"]',el).textContent=off?"Re-enable spanning tree":"Disable spanning tree";$(".grow",el).textContent=`${roots.size} of 3 switches have been root`;if(roots.size===3)award("viz:stp",30,"Made every switch the root")}
  el.addEventListener("change",e=>{const i=e.target.dataset.i;if(i===undefined)return;SW[+i][2]=+e.target.value;draw()});
  el.addEventListener("click",e=>{if(e.target.closest('[data-a="off"]')){off=!off;if(off)flag("storm");draw()}});draw();
})();

const LESSONS=[
{id:"table",num:"3.1",title:"Reading the routing table",html:`
<p>Every routing decision comes from the routing table. <code>show ip route</code> lists every route the router knows, and each line has the same parts:</p>
<pre class="term">R1# show ip route
Codes: L - local, C - connected, S - static, O - OSPF, E2 - OSPF external type 2, * - candidate default
Gateway of last resort is 10.0.12.2 to network 0.0.0.0

S*    0.0.0.0/0 [1/0] via 10.0.12.2
      10.0.0.0/8 is variably subnetted, 4 subnets, 2 masks
C        10.0.12.0/30 is directly connected, GigabitEthernet0/0/0
L        10.0.12.1/32 is directly connected, GigabitEthernet0/0/0
O        10.2.2.0/24 [110/2] via 10.0.12.2, 00:14:07, GigabitEthernet0/0/0
S        10.9.0.0/16 [1/0] via 10.0.12.2</pre>
<div class="viz" id="viz-rtparts"></div>
<ul><li><b>Routing protocol code</b>: how the route was learned. <b>C</b> connected and <b>L</b> local (the router's own address, as a /32) appear automatically for every up interface with an address.</li>
<li><b>Prefix and network mask</b>: the destination network, like 10.2.2.0/24.</li>
<li><b>Next hop</b>: the neighbor router's address to send packets to.</li>
<li><b>Administrative distance</b> and <b>metric</b> in brackets: <code>[110/2]</code> means AD 110 (OSPF) and an OSPF cost of 2.</li>
<li><b>Gateway of last resort</b>: the default route used when nothing more specific matches. Without one, unmatched packets are dropped.</li></ul>
<h3>Administrative distance</h3>
<p>When two sources offer a route to the <b>same prefix</b>, the router trusts the one with the lower AD:</p>
<div class="viz" id="viz-ad"></div>`},
{id:"lpm",num:"3.2",title:"How a router picks a route",html:`
<p>A router makes its forwarding decision in this order:</p>
<ol><li><b>Longest prefix match.</b> Among every route that contains the destination, the most specific (longest prefix) wins. A /32 beats a /24, which beats a /16, which beats the /0 default. This comes first, before AD or metric.</li>
<li><b>Administrative distance.</b> Only matters when two sources offer the <b>same prefix and length</b>. Only the lowest-AD route gets into the table.</li>
<li><b>Metric.</b> Within one routing protocol, the lowest metric wins. Equal metrics are installed together for <b>equal-cost multipath</b> (ECMP) load sharing.</li></ol>
<div class="viz" id="viz-lpm"></div>
<div class="tip"><b>Exam trap.</b> A question shows an OSPF /24 and a static /16 for a destination inside both. The static has the better AD, but the /24 is more specific, so the OSPF route is used. AD never beats prefix length.</div>`},
{id:"static",num:"3.3",title:"Static routes for IPv4 and IPv6",html:`
<p>A static route is typed in by hand. It's predictable and uses no bandwidth, but doesn't adapt to failures unless you plan for it.</p>
<table><tr><th>Type</th><th>IPv4 example</th><th>Use</th></tr>
<tr><td>Default</td><td><code>ip route 0.0.0.0 0.0.0.0 203.0.113.1</code></td><td>Send everything unknown to the ISP</td></tr>
<tr><td>Network</td><td><code>ip route 10.20.0.0 255.255.0.0 10.0.12.2</code></td><td>Reach a specific remote network</td></tr>
<tr><td>Host</td><td><code>ip route 10.20.5.5 255.255.255.255 10.0.13.2</code></td><td>Steer one device's traffic a particular way</td></tr>
<tr><td>Floating</td><td><code>ip route 0.0.0.0 0.0.0.0 198.51.100.1 10</code></td><td>Backup with a higher AD, used only if the primary disappears</td></tr></table>
<p>You can give a <b>next-hop IP</b> (recursive lookup), an <b>exit interface</b> (only sensible on point-to-point links), or both (<b>fully specified</b>). IPv6 works the same way with <code>ipv6 route</code>, after <code>ipv6 unicast-routing</code>:</p>
<pre class="term">R1(config)# ipv6 route ::/0 2001:db8:f::2
R1(config)# ipv6 route 2001:db8:20::/64 2001:db8:12::2
R1(config)# ipv6 route ::/0 g0/0/1 fe80::2 10</pre>
<p>When the next hop is a link-local address, the exit interface is required, because every link has the same FE80::/10 range.</p>
<div class="viz" id="viz-staticmini"></div>
<h3>Floating static routes</h3>
<p>A floating static has an AD set higher than the primary route, so it "floats" out of the table. When the primary's next hop becomes unreachable (the interface goes down), the primary is removed and the floating route takes over.</p>
<div class="viz" id="viz-float"></div>
<div class="tip"><b>Watch out.</b> A static route stays in the table as long as its exit interface is up. If the ISP fails somewhere beyond the first hop, the interface stays up and the floating route never kicks in. IP SLA tracking fixes that, but it's beyond the CCNA.</div>`},
{id:"ospf",num:"3.4",title:"OSPF concepts: neighbors, LSAs and areas",html:`
<p><b>OSPF</b> (Open Shortest Path First) is a <b>link-state</b> interior gateway protocol. Every router floods descriptions of its links (<b>LSAs</b>) to the others, so all routers in an area build an identical map, the <b>LSDB</b>. Each then runs Dijkstra's <b>SPF algorithm</b> to find its own shortest path to every network.</p>
<ul><li>OSPF runs directly on IP as <b>protocol 89</b>. Hellos go to multicast <b>224.0.0.5</b> (all OSPF routers); updates to the DR go to <b>224.0.0.6</b>.</li>
<li><b>Hello</b> packets find neighbors and keep them alive: every 10 seconds by default on Ethernet, with a <b>dead interval</b> of 40.</li>
<li>Its metric is <b>cost</b>, based on bandwidth. Its AD is <b>110</b>.</li></ul>
<h3>Neighbor states</h3>
<div class="viz" id="viz-ostates"></div>
<h3>What must match to become neighbors</h3>
<p>Same <b>subnet and mask</b> on the link, same <b>area</b>, same <b>hello and dead timers</b>, same authentication, compatible <b>network type</b>, matching MTU (or they stall in ExStart), and <b>unique router IDs</b>. The interface must not be passive.</p>
<h3>Router ID</h3>
<p>Each router needs a unique 32-bit router ID, chosen in this order: the <code>router-id</code> command; else the highest IPv4 address on an up <b>loopback</b>; else the highest IPv4 address on any up interface. It's picked when the process starts, so a change needs <code>clear ip ospf process</code>.</p>
<div class="viz" id="viz-rid"></div>
<h3>Areas</h3>
<p>Big OSPF networks split into <b>areas</b> so that SPF runs and LSA floods stay local. Every area connects to the <b>backbone, area 0</b>. A router with interfaces in two areas is an <b>ABR</b>; one that brings in external routes (like a default from a static) is an <b>ASBR</b>. The CCNA focuses on <b>single-area OSPFv2</b>: everything in area 0.</p>`},
{id:"dr",num:"3.5",title:"Network types, DR/BDR election and cost",html:`
<h3>Network types</h3>
<ul><li><b>Broadcast</b> (the default on Ethernet): elects a <b>DR</b> and <b>BDR</b>. Hello 10, dead 40.</li>
<li><b>Point-to-point</b> (the default on serial links; set on Ethernet with <code>ip ospf network point-to-point</code>): no DR election, so two routers on a /30 or /31 become FULL faster.</li></ul>
<h3>DR and BDR</h3>
<p>On a shared segment, every router becoming FULL with every other would mean many adjacencies and duplicated floods. Instead, everyone becomes FULL only with the <b>designated router</b> and the <b>backup</b>. The rest stay in <b>2-WAY</b> with each other, and show as DROTHER.</p>
<ol><li>Highest <b>interface priority</b> wins (default 1, range 0–255). Priority <b>0</b> means never DR or BDR.</li>
<li>Tie: highest <b>router ID</b>.</li>
<li>The election is <b>not preemptive</b>. A better router that joins later doesn't take over until the DR fails or the process is cleared.</li></ol>
<div class="viz" id="viz-dr"></div>
<h3>Cost</h3>
<p>OSPF cost = <b>reference bandwidth ÷ interface bandwidth</b>. The default reference is 100 Mbps, so Fast Ethernet, Gigabit and 10 Gigabit all cost <b>1</b>, which makes faster links look no better. Fix it on <b>every</b> router with <code>auto-cost reference-bandwidth 100000</code> (100 Gbps), or set a cost directly with <code>ip ospf cost</code>. A path's cost is the sum of the outgoing interface costs along it.</p>
<div class="viz" id="viz-cost"></div>`},
{id:"ospfcfg",num:"3.6",title:"Configuring and verifying OSPFv2 and OSPFv3",html:`
<h3>Two ways to enable OSPFv2 on interfaces</h3>
<pre class="term">R1(config)# router ospf 1
R1(config-router)# router-id 1.1.1.1
R1(config-router)# network 10.0.12.0 0.0.0.3 area 0
R1(config-router)# network 192.168.1.0 0.0.0.255 area 0
R1(config-router)# passive-interface g0/0/2
R1(config-router)# default-information originate

! or, per interface:
R1(config)# interface g0/0/0
R1(config-if)# ip ospf 1 area 0</pre>
<ul><li>The <code>network</code> statement uses a <b>wildcard mask</b> to match interface addresses. Any interface whose address matches joins that area. <code>network 10.0.12.1 0.0.0.0 area 0</code> matches exactly one interface.</li>
<li><b>Passive interface</b>: the network is still advertised, but no hellos are sent, so no neighbor forms there. Use it on LAN ports facing users.</li>
<li><b>default-information originate</b>: if this router has a default route, it advertises it into OSPF. Other routers see it as <b>O*E2</b>.</li>
<li>The process ID is local and doesn't have to match between routers. The area does.</li></ul>
<div class="viz" id="viz-ospfmini"></div>
<h3>Verification</h3>
<table><tr><th>Command</th><th>Shows</th></tr>
<tr><td><code>show ip ospf neighbor</code></td><td>Neighbor RIDs, state (FULL/DR, 2WAY/DROTHER) and the interface</td></tr>
<tr><td><code>show ip ospf interface brief</code></td><td>Which interfaces run OSPF, area, cost, state and neighbor count</td></tr>
<tr><td><code>show ip ospf interface g0/0/0</code></td><td>Timers, network type, priority, DR and BDR</td></tr>
<tr><td><code>show ip protocols</code></td><td>Router ID, networks, passive interfaces</td></tr>
<tr><td><code>show ip route ospf</code></td><td>Routes learned from OSPF</td></tr></table>
<div class="viz" id="viz-adjfix"></div>
<h3>OSPFv3 for IPv6</h3>
<p>OSPFv3 works the same way but is enabled on interfaces, not with network statements. It still uses a 32-bit router ID, so a router with no IPv4 addresses needs <code>router-id</code> set by hand. Neighbors talk using link-local addresses, and the multicast groups are FF02::5 and FF02::6.</p>
<pre class="term">R1(config)# ipv6 unicast-routing
R1(config)# ipv6 router ospf 1
R1(config-rtr)# router-id 1.1.1.1
R1(config-rtr)# interface g0/0/0
R1(config-if)# ipv6 ospf 1 area 0
R1# show ipv6 ospf neighbor
R1# show ipv6 route ospf</pre>`},
{id:"fhrp",num:"3.7",title:"First hop redundancy: HSRP and VRRP",html:`
<p>Hosts have one default gateway. If that router fails, they're stranded even if a second router sits on the same LAN. A <b>first hop redundancy protocol</b> lets two or more routers share a <b>virtual IP</b> (and virtual MAC) that hosts use as their gateway. One router is <b>active</b> and answers for the virtual IP; the others watch and take over if it stops sending hellos.</p>
<table><tr><th></th><th>HSRP</th><th>VRRP</th><th>GLBP</th></tr>
<tr><td>Standard</td><td>Cisco</td><td>Open (RFC 5798)</td><td>Cisco</td></tr>
<tr><td>Roles</td><td>Active / Standby</td><td>Master / Backup</td><td>AVG / AVFs</td></tr>
<tr><td>Virtual MAC</td><td>0000.0c07.acXX (v1), 0000.0c9f.fXXX (v2)</td><td>0000.5e00.01XX</td><td>0007.b400.XXYY</td></tr>
<tr><td>Preemption</td><td>Off by default</td><td>On by default</td><td>Off by default</td></tr>
<tr><td>Load balancing</td><td>Per group</td><td>Per group</td><td>Built in, per host</td></tr></table>
<pre class="term">R1(config)# interface g0/0/1
R1(config-if)# standby version 2
R1(config-if)# standby 10 ip 192.168.10.254
R1(config-if)# standby 10 priority 110
R1(config-if)# standby 10 preempt
R1# show standby brief</pre>
<p>Highest <b>priority</b> wins (default 100); a tie goes to the highest interface IP. Without <b>preempt</b>, a recovered higher-priority router won't take back the active role.</p>
<div class="viz" id="viz-fhrp"></div>
<div class="viz" id="viz-fhrpcmp"></div>`}

/* ---- longest prefix match ---- */
(function(){
  const el=$("#viz-lpm");const toN=s=>s.split(".").reduce((a,o)=>a*256+ +o,0);
  const RT=[["S*","0.0.0.0",0,"1/0","203.0.113.1"],["O","10.0.0.0",8,"110/20","10.0.12.2"],["S","10.1.0.0",16,"1/0","10.0.13.2"],["O","10.1.1.0",24,"110/3","10.0.12.2"],["O","10.1.1.128",25,"110/4","10.0.14.2"],["S","10.1.1.200",32,"1/0","10.0.13.2"],["O","172.16.0.0",12,"110/12","10.0.14.2"]];
  const tried=new Set();
  el.innerHTML=`<div class="viz-title">Longest prefix match: where does the packet go?</div><label class="rf"><span>Destination IP</span><input class="lpm-in mono" value="10.1.1.77" inputmode="decimal" autocomplete="off"></label><div class="chips">${["10.1.1.77","10.1.1.200","10.1.1.150","10.1.9.9","10.200.0.1","172.20.1.1","8.8.8.8"].map(x=>`<button class="chip mono" data-ip="${x}">${x}</button>`).join("")}</div><div class="viz-scroll"><table class="rt"></table></div><div class="caption" aria-live="polite"></div><div class="rv-prog s-small"></div>`;
  function draw(){const v=$(".lpm-in",el).value.trim();const ok=/^\d{1,3}(\.\d{1,3}){3}$/.test(v)&&v.split(".").every(o=>+o<256);const n=ok?toN(v):null;
    const hit=RT.map(r=>ok&&Math.floor(n/2**(32-r[2]))===Math.floor(toN(r[1])/2**(32-r[2])));let win=-1;hit.forEach((h,i)=>{if(h&&(win<0||RT[i][2]>RT[win][2]))win=i});
    $(".rt",el).innerHTML=`<tr><th>Code</th><th>Prefix</th><th>[AD/metric]</th><th>Next hop</th></tr>`+RT.map((r,i)=>`<tr class="${i===win?"win":hit[i]?"hit":""}"><td>${r[0]}</td><td class="mono">${r[1]}/${r[2]}</td><td class="mono">[${r[3]}]</td><td class="mono">${r[4]}</td></tr>`).join("");
    if(!ok){$(".caption",el).textContent="Type a valid IPv4 address.";return}
    tried.add(win);const matches=hit.filter(Boolean).length;
    $(".caption",el).innerHTML=`${matches} route${matches>1?"s":""} contain ${v}. The longest prefix is <b>/${RT[win][2]}</b>, so the packet goes to <b class="mono">${RT[win][4]}</b>.${win===0?" Nothing more specific matched, so the default route catches it.":""}${matches>2?" AD and metric were never considered: the prefixes were all different lengths.":""}`;
    $(".rv-prog",el).textContent=`${tried.size} of ${RT.length} routes have won`;if(tried.size>=5)award("viz:lpm",30,"Mastered longest prefix match")}
  el.addEventListener("input",e=>{if(e.target.matches(".lpm-in"))draw()});
  el.addEventListener("click",e=>{const b=e.target.closest("[data-ip]");if(!b)return;$(".lpm-in",el).value=b.dataset.ip;draw()});draw();
})();

/* ---- DR/BDR election ---- */
(function(){
  const el=$("#viz-dr");const R=[["R1","1.1.1.1",1],["R2","2.2.2.2",1],["R3","3.3.3.3",1],["R4","4.4.4.4",1]];const seen=new Set();
  const ip=s=>s.split(".").reduce((a,o)=>a*256+ +o,0);
  el.innerHTML=`<div class="viz-title">DR and BDR election on a shared LAN</div><div class="viz-scroll"><svg viewBox="0 0 600 200" style="min-width:440px" role="img" aria-label="Four routers on a switch"></svg></div><div class="stp-ctl">${R.map((r,i)=>`<label class="rf"><span>${r[0]} priority</span><select data-i="${i}">${[0,1,50,100,200,255].map(p=>`<option ${p===r[2]?"selected":""}>${p}</option>`).join("")}</select></label>`).join("")}</div><div class="caption" aria-live="polite"></div>`;
  function draw(){const c=R.map((r,i)=>i).filter(i=>R[i][2]>0).sort((a,b)=>R[b][2]-R[a][2]||ip(R[b][1])-ip(R[a][1]));const dr=c[0],bdr=c[1];
    let s=`<rect x="250" y="20" width="100" height="36" rx="8" class="m-node"/><text x="300" y="43" text-anchor="middle" class="s-b">SW1</text>`;
    R.forEach((r,i)=>{const x=90+i*140;const role=i===dr?"DR":i===bdr?"BDR":"DROTHER";s+=`<line x1="300" y1="56" x2="${x}" y2="130" class="m-link ${role!=="DROTHER"?"on":""}"/><rect x="${x-58}" y="130" width="116" height="56" rx="8" class="m-node ${role!=="DROTHER"?"on":""}"/><text x="${x}" y="151" text-anchor="middle" class="s-b">${r[0]} · ${role}</text><text x="${x}" y="170" text-anchor="middle" class="mono" style="font-size:10px;fill:var(--muted)">pri ${r[2]} · RID ${r[1]}</text>`});
    $("svg",el).innerHTML=s;seen.add(dr);
    $(".caption",el).innerHTML=dr===undefined?`<span class="status-bad">No DR.</span> Every router has priority 0, so nobody can be DR and no FULL adjacencies form on this LAN.`:`<b>${R[dr][0]}</b> is DR ${c.filter(i=>R[i][2]===R[dr][2]).length>1?"(priority tie, so the highest router ID wins)":"(highest priority)"}${bdr!==undefined?`, <b>${R[bdr][0]}</b> is BDR`:""}. ${R.filter(r=>r[2]===0).length?R.filter(r=>r[2]===0).map(r=>r[0]).join(", ")+" opted out with priority 0. ":""}DROTHERs become FULL with the DR and BDR and stay 2-WAY with each other. In a live network the election only happens when the segment first comes up: raising a priority later doesn't preempt.`;
    if(seen.size>=3)award("viz:dr",20,"Ran DR elections")}
  el.addEventListener("change",e=>{const i=e.target.dataset.i;if(i===undefined)return;R[+i][2]=+e.target.value;draw()});draw();
})();

(function(){
  const el=$("#viz-cost");let ref=100;const L=[["FastEthernet","100 Mbps",100],["GigabitEthernet","1 Gbps",1000],["TenGigabitEthernet","10 Gbps",10000],["FortyGig","40 Gbps",40000]];const seen=new Set();
  el.innerHTML=`<div class="viz-title">OSPF cost = reference ÷ bandwidth</div><div class="chips">${[100,1000,10000,100000].map(r=>`<button class="chip mono" data-r="${r}">auto-cost reference-bandwidth ${r}</button>`).join("")}</div><table class="rt"></table><div class="caption" aria-live="polite"></div>`;
  function draw(){el.querySelectorAll("[data-r]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.r===ref));
    $(".rt",el).innerHTML=`<tr><th>Interface</th><th>Bandwidth</th><th>Cost</th></tr>`+L.map(l=>`<tr><td>${l[0]}</td><td>${l[1]}</td><td class="mono">${Math.max(1,Math.floor(ref/l[2]))}</td></tr>`).join("");
    const same=L.filter(l=>Math.max(1,Math.floor(ref/l[2]))===1).length;
    $(".caption",el).innerHTML=same>1?`<span class="status-bad">${same} link speeds all cost 1.</span> OSPF can't tell a 100 Mbps link from a ${L[same-1][1]} link, so it might send traffic the slow way.`:`<span class="status-good">Every speed has a different cost.</span> Remember to set the same reference on every OSPF router.`;
    seen.add(ref);if(seen.size>=3)award("viz:cost",20,"Tuned the OSPF reference bandwidth")}
  el.addEventListener("click",e=>{const b=e.target.closest("[data-r]");if(!b)return;ref=+b.dataset.r;draw()});draw();
})();

    $(".fh-o",el).innerHTML=`<span class="t-c">R2# show standby brief</span>
Interface   Grp  Pri P State   Active          Standby         Virtual IP
Gi0/0/1     10   100   ${active==="R2"?"Active ":"Standby"} ${active==="R2"?"local          ":"192.168.10.1   "} ${st.r1&&active==="R2"?"192.168.10.1   ":active==="R2"?"unknown        ":"local          "} 192.168.10.254`;

    if(!st.r1){active="R2";seen.add("fail");draw(`R1 stopped sending hellos. After the hold time (10 s by default, 3 s hello), R2 becomes <b>active</b> and starts answering ARP for 192.168.10.254 with the same virtual MAC. The PCs never notice.`)}

<script>
/* ================= Module 4: Network Services and Security (200-301 v2.0 Domain 4.0, 20%) ================= */
(function(){
const LESSONS=[
{id:"access",num:"4.1",title:"Securing device access: passwords, SSH and AAA",html:`
<p>A router or switch is only as safe as the way people log in to it. There are three ways in: the <b>console</b> port, the <b>VTY</b> lines (remote Telnet or SSH), and the <b>enable</b> password that guards privileged mode.</p>
<h3>Passwords and how IOS stores them</h3>
<div class="viz" id="viz-pwtypes"></div>
<pre class="term">R1(config)# enable secret Str0ng!Enable
R1(config)# service password-encryption
R1(config)# username admin privilege 15 secret Adm1n!Pass
R1(config)# line console 0
R1(config-line)# login local
R1(config-line)# exec-timeout 5 0
R1(config-line)# logging synchronous</pre>
<h3>SSH instead of Telnet</h3>
<p>Telnet sends everything, passwords included, in clear text on TCP 23. <b>SSH</b> (TCP 22) encrypts the session. IOS needs four things before it will accept SSH:</p>
<ol><li>A <b>hostname</b> other than the default (<code>hostname EDGE1</code>).</li>
<li>A <b>domain name</b> (<code>ip domain name corp.local</code>). Together they name the RSA key.</li>
<li><b>RSA keys</b> (<code>crypto key generate rsa modulus 2048</code>). Version 2 needs at least 768 bits; use 2048.</li>
<li>A way to log in: a <b>local user</b> plus <code>login local</code> on the VTY lines.</li></ol>
<pre class="term">R1(config)# ip ssh version 2
R1(config)# line vty 0 4
R1(config-line)# login local
R1(config-line)# transport input ssh
R1(config-line)# access-class MGMT in
R1# show ip ssh</pre>
<h3>AAA: authentication, authorization and accounting</h3>
<p>Local accounts don't scale to hundreds of devices. <b>AAA</b> sends logins to a central server: <b>authentication</b> (who are you), <b>authorization</b> (what can you do), <b>accounting</b> (what did you do).</p>
<div class="viz" id="viz-aaa"></div>
<pre class="term">R1(config)# aaa new-model
R1(config)# tacacs server ISE1
R1(config-server-tacacs)# address ipv4 10.0.0.20
R1(config-server-tacacs)# key T@cacsKey
R1(config)# aaa authentication login default group tacacs+ local
R1(config)# aaa authorization exec default group tacacs+ local</pre>
<p>The <b>local</b> at the end is the fallback, used only if the server can't be reached. Without it, a dead TACACS+ server locks everyone out.</p>`},
{id:"xfer",num:"4.2",title:"Moving files securely: SFTP and SCP",html:`
<p>Network engineers copy IOS images, configurations and logs all the time. The old ways are unsafe:</p>
<ul><li><b>TFTP</b> (UDP 69): no login and no encryption at all. Only for isolated lab networks.</li>
<li><b>FTP</b> (TCP 20/21): sends the username and password in clear text.</li></ul>
<p>The secure options both run over <b>SSH on TCP 22</b>, so they authenticate the user and encrypt the file:</p>
<ul><li><b>SCP</b> (Secure Copy): a simple one-shot copy. IOS can be an SCP <b>server</b> (<code>ip scp server enable</code>, which needs SSH and AAA) or a client.</li>
<li><b>SFTP</b> (SSH File Transfer Protocol): a full file session that can list, resume and delete. IOS is an SFTP client.</li></ul>
<pre class="term">R1# copy running-config scp://admin@10.0.0.50/backups/r1.cfg
R1# copy sftp://admin@10.0.0.50/images/isr4300-17.12.bin flash:
R1# dir flash:</pre>
<div class="viz" id="viz-xfer"></div>
<div class="tip"><b>Don't confuse FTPS and SFTP.</b> FTPS is regular FTP wrapped in TLS (ports 989/990 or explicit on 21). SFTP is part of SSH. The CCNA blueprint asks for SFTP and SCP.</div>`},
{id:"nat",num:"4.3",title:"NAT and PAT",html:`
<p>Private RFC 1918 addresses can't be routed on the internet. <b>Network Address Translation</b> rewrites them at the edge router. Cisco names four addresses:</p>
<div class="viz" id="viz-natterms"></div>
<h3>Three kinds of inside source NAT</h3>
<ul><li><b>Static NAT</b>: one private address always maps to one public address. Used for servers that must be reachable from outside. <code>ip nat inside source static 192.168.1.100 203.0.113.10</code></li>
<li><b>Dynamic NAT</b>: private addresses borrow public addresses from a pool, one to one, first come first served. When the pool runs out, new hosts fail.</li>
<li><b>PAT (NAT overload)</b>: many private addresses share <b>one</b> public address, told apart by <b>source port</b>. This is what every home router does.</li></ul>
<div class="viz" id="viz-pat"></div>
<pre class="term">R1(config)# interface g0/0/1
R1(config-if)# ip nat inside
R1(config-if)# interface g0/0/0
R1(config-if)# ip nat outside
R1(config)# access-list 1 permit 192.168.1.0 0.0.0.255
R1(config)# ip nat inside source list 1 interface g0/0/0 overload
R1# show ip nat translations
R1# show ip nat statistics
R1# clear ip nat translation *</pre>
<div class="viz" id="viz-natmini"></div>
<div class="tip"><b>Troubleshooting NAT.</b> Inside and outside swapped on the interfaces. The ACL doesn't match the inside subnet. Forgot <code>overload</code>, so only one host at a time gets out. No route to the internet. <code>show ip nat statistics</code> shows which interfaces are inside and outside and how many hits each rule has.</div>`},
{id:"dns",num:"4.4",title:"DNS and name resolution",html:`
<p>DNS turns names into addresses. Clients send queries to their configured DNS server on <b>UDP 53</b> (TCP 53 for large answers and zone transfers).</p>
<h3>How a lookup works</h3>
<div class="viz" id="viz-dnsres"></div>
<h3>Record types</h3>
<table><tr><th>Record</th><th>Maps</th><th>Example</th></tr>
<tr><td>A</td><td>Name to IPv4 address</td><td>www → 203.0.113.80</td></tr>
<tr><td>AAAA</td><td>Name to IPv6 address</td><td>www → 2001:db8::80</td></tr>
<tr><td>CNAME</td><td>Alias to another name</td><td>shop → www.corp.com</td></tr>
<tr><td>MX</td><td>A domain's mail servers, with preference</td><td>corp.com → 10 mail1.corp.com</td></tr>
<tr><td>PTR</td><td>Address back to a name (reverse lookup)</td><td>80.113.0.203.in-addr.arpa → www</td></tr>
<tr><td>NS</td><td>Which servers are authoritative for a zone</td><td>corp.com → ns1.corp.com</td></tr>
<tr><td>SOA</td><td>Start of authority: zone serial and timers</td><td>one per zone</td></tr>
<tr><td>TXT</td><td>Free text, used for SPF, DKIM and domain verification</td><td>"v=spf1 …"</td></tr></table>
<div class="viz" id="viz-dnsrec"></div>
<h3>DNS on IOS</h3>
<pre class="term">R1(config)# ip domain lookup
R1(config)# ip name-server 10.0.0.53 8.8.8.8
R1(config)# ip domain name corp.local</pre>
<p>If you mistype a command in privileged mode with <code>ip domain lookup</code> on and no server, IOS tries to resolve it as a hostname and hangs for a while. That's why many engineers set <code>no ip domain lookup</code> in labs.</p>`},
{id:"vpn",num:"4.5",title:"IPsec VPNs",html:`
<p>A <b>VPN</b> carries private traffic across a public network, protected by encryption. Two shapes:</p>
<ul><li><b>Site-to-site</b>: two routers or firewalls build a permanent tunnel between offices. Users don't run anything; the gateways encrypt and decrypt.</li>
<li><b>Remote access</b>: a user's device runs a VPN client (such as Cisco Secure Client) and builds a tunnel to the company's VPN head-end. Usually TLS-based, or IPsec with IKEv2.</li></ul>
<div class="viz" id="viz-vpntype"></div>
<h3>IPsec building blocks</h3>
<ul><li><b>IKE</b> (Internet Key Exchange, UDP 500, or 4500 with NAT traversal) negotiates the tunnel. Phase 1 builds a secure management channel; phase 2 negotiates the <b>IPsec SAs</b> that protect data.</li>
<li><b>ESP</b> (IP protocol 50) encrypts and authenticates the payload. <b>AH</b> (protocol 51) authenticates only and breaks with NAT, so ESP is used in practice.</li>
<li><b>Tunnel mode</b> encrypts the whole original packet and adds a new IP header (site-to-site). <b>Transport mode</b> protects only the payload.</li>
<li>IPsec alone carries unicast only, so routing protocols can't run over it. <b>GRE over IPsec</b> or a <b>virtual tunnel interface</b> (VTI) fixes that. <b>DMVPN</b> builds hub-and-spoke tunnels automatically.</li></ul>
<div class="viz" id="viz-ike"></div>`},
{id:"acl",num:"4.6",title:"Access control lists",html:`
<p>An ACL is an ordered list of permit and deny statements. The router checks a packet against each line <b>top to bottom</b> and acts on the <b>first match</b>. Every ACL ends with an invisible <b>implicit deny any</b>, so an ACL with only deny lines blocks everything.</p>
<table><tr><th></th><th>Standard</th><th>Extended</th></tr>
<tr><td>Matches on</td><td>Source address only</td><td>Protocol, source, destination, ports</td></tr>
<tr><td>Numbers</td><td>1–99, 1300–1999</td><td>100–199, 2000–2699</td></tr>
<tr><td>Place it</td><td>Close to the <b>destination</b></td><td>Close to the <b>source</b></td></tr></table>
<h3>Wildcard masks</h3>
<p>A wildcard mask says which bits to ignore: <b>0 means must match, 1 means don't care</b>. For a subnet it's the inverse of the subnet mask: /24 is 0.0.0.255, /26 is 0.0.0.63. Shortcuts: <code>host 10.1.1.5</code> means 10.1.1.5 0.0.0.0, and <code>any</code> means 0.0.0.0 255.255.255.255.</p>
<div class="viz" id="viz-wild"></div>
<h3>Writing and applying them</h3>
<pre class="term">R1(config)# ip access-list extended GUEST-IN
R1(config-ext-nacl)# remark Guests can't reach the servers
R1(config-ext-nacl)# deny ip 192.168.20.0 0.0.0.255 10.1.1.0 0.0.0.255
R1(config-ext-nacl)# permit tcp 192.168.20.0 0.0.0.255 any eq 443
R1(config-ext-nacl)# permit udp 192.168.20.0 0.0.0.255 any eq 53
R1(config-ext-nacl)# interface g0/0/2
R1(config-if)# ip access-group GUEST-IN in

R1(config)# access-list 10 permit host 192.168.10.5
R1(config)# line vty 0 4
R1(config-line)# access-class 10 in
R1# show access-lists</pre>
<p>One ACL per interface, per direction, per protocol. <b>In</b> filters packets arriving on the interface, before routing. <b>Out</b> filters packets leaving. Named ACLs can be edited by sequence number (<code>15 permit …</code> inserts between 10 and 20).</p>
<div class="viz" id="viz-aclorder"></div>
<div class="viz" id="viz-aclplace"></div>`},
{id:"l2sec",num:"4.7",title:"Layer 2 security features",html:`
<p>The access layer is where untrusted devices plug in, so most attacks start there. The CCNA covers these defenses:</p>
<h3>DHCP snooping</h3>
<p>Ports are <b>untrusted</b> by default: DHCP server messages (Offer, Ack) arriving on them are dropped, which stops <b>rogue DHCP servers</b>. Only the uplink toward the real server is <b>trusted</b>. Snooping also builds a <b>binding table</b> of MAC, IP, VLAN and port for every lease, which other features use. <code>ip dhcp snooping limit rate</code> stops DHCP starvation floods.</p>
<pre class="term">SW1(config)# ip dhcp snooping
SW1(config)# ip dhcp snooping vlan 10
SW1(config)# no ip dhcp snooping information option
SW1(config)# interface g1/0/1
SW1(config-if)# ip dhcp snooping trust</pre>
<h3>Dynamic ARP Inspection</h3>
<p>DAI checks every ARP on untrusted ports against the snooping binding table and drops lies, which stops <b>ARP spoofing</b> (man-in-the-middle). <code>ip arp inspection vlan 10</code>, with <code>ip arp inspection trust</code> on the uplink.</p>
<div class="viz" id="viz-snoop"></div>
<h3>Port security</h3>
<p>Limits how many MAC addresses a port can learn, and which ones. It stops <b>MAC flooding</b> and unauthorized devices. The port must be a static access (or trunk) port first.</p>
<pre class="term">SW1(config-if)# switchport mode access
SW1(config-if)# switchport port-security
SW1(config-if)# switchport port-security maximum 2
SW1(config-if)# switchport port-security mac-address sticky
SW1(config-if)# switchport port-security violation restrict</pre>
<table><tr><th>Violation mode</th><th>Drops bad frames</th><th>Logs and counts</th><th>Shuts the port</th></tr>
<tr><td>protect</td><td>Yes</td><td>No</td><td>No</td></tr>
<tr><td>restrict</td><td>Yes</td><td>Yes</td><td>No</td></tr>
<tr><td>shutdown (default)</td><td>Yes</td><td>Yes</td><td>Yes: err-disabled</td></tr></table>
<h3>Storm control and RA guard</h3>
<p><b>Storm control</b> drops broadcast, multicast or unknown unicast traffic once it passes a percentage of the link (<code>storm-control broadcast level 1.00</code>), and can shut the port or send a trap. <b>IPv6 RA guard</b> drops Router Advertisements on ports facing hosts, so a rogue device can't become everyone's IPv6 gateway.</p>
<div class="viz" id="viz-l2atk"></div>`}

(function(){
  const el=$("#viz-pat");const H=[["PC1","192.168.1.10"],["PC2","192.168.1.11"],["PC3","192.168.1.12"]];const D=[["93.184.216.34",443,"web"],["8.8.8.8",53,"DNS"],["151.101.1.69",443,"web"]];
  const rows=[];let next=1024;
  el.innerHTML=`<div class="viz-title">PAT in action: three PCs, one public address (203.0.113.2)</div><div class="chips">${H.map((h,i)=>D.map((d,k)=>`<button class="chip" data-h="${i}" data-d="${k}">${h[0]} → ${d[2]} ${d[0]}</button>`).join("")).join("")}</div>
  <div class="viz-scroll"><table class="rt pat-t"></table></div><div class="caption" aria-live="polite"></div><div class="viz-controls"><button class="btn" data-a="clr">clear ip nat translation *</button><span class="grow"></span></div>`;
  function draw(msg){$(".pat-t",el).innerHTML=`<tr><th>Pro</th><th>Inside global</th><th>Inside local</th><th>Outside global</th></tr>`+(rows.map((r,i)=>`<tr class="${i===rows.length-1?"hit":""}"><td>${r.p}</td><td class="mono">203.0.113.2:${r.g}</td><td class="mono">${r.l}:${r.lp}</td><td class="mono">${r.o}:${r.op}</td></tr>`).join("")||`<tr><td colspan="4" class="s-small">No translations yet.</td></tr>`);
    $(".grow",el).textContent=`${rows.length} translations`;if(msg)$(".caption",el).innerHTML=msg}
  el.addEventListener("click",e=>{const b=e.target.closest("[data-h]");if(e.target.closest('[data-a="clr"]')){rows.length=0;draw("Dynamic translations cleared. Existing sessions break and must reconnect.");return}if(!b)return;
    const h=H[+b.dataset.h],d=D[+b.dataset.d];const lp=49152+Math.floor(Math.random()*16000);let g=lp;const clash=rows.some(r=>r.g===g);if(clash)g=next++;
    rows.push({p:d[1]===53?"udp":"tcp",g,l:h[1],lp,o:d[0],op:d[1]});
    draw(`${h[0]} opens a session from port ${lp}. R1 rewrites the source to <b>203.0.113.2:${g}</b>${clash?` (port ${lp} was already in use, so R1 picked a free one)`:" and keeps the original port when it's free"}. Replies to that port are translated back to ${h[1]}:${lp}.`);
    if(new Set(rows.map(r=>r.l)).size===3&&rows.length>=4)award("viz:pat",20,"Watched PAT share one address")});
  draw("Open some connections. Every inside host leaves with the same public IP; the port number tells R1 where each reply belongs.");
})();

/* ---- wildcard calculator ---- */
(function(){
  const el=$("#viz-wild");const seen=new Set();
  const toN=s=>s.split(".").reduce((a,o)=>a*256+ +o,0)>>>0,toS=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join(".");
  el.innerHTML=`<div class="viz-title">Wildcard calculator</div><div class="dtp-g"><label class="rf"><span>Address</span><input class="w-a mono" value="172.16.32.0" autocomplete="off"></label><label class="rf"><span>Wildcard</span><input class="w-w mono" value="0.0.15.255" autocomplete="off"></label></div>
  <div class="chips">${[["172.16.32.0","0.0.15.255"],["10.1.1.5","0.0.0.0"],["192.168.10.0","0.0.0.255"],["192.168.10.64","0.0.0.63"],["10.0.0.0","0.255.255.255"],["192.168.1.1","0.0.0.254"]].map(([a,w])=>`<button class="chip mono" data-a="${a}" data-w="${w}">${a} ${w}</button>`).join("")}</div><div class="kv"></div><div class="caption" aria-live="polite"></div>`;
  function draw(){const a=$(".w-a",el).value.trim(),wc=$(".w-w",el).value.trim();const v=s=>/^\d{1,3}(\.\d{1,3}){3}$/.test(s)&&s.split(".").every(o=>+o<256);if(!v(a)||!v(wc)){$(".caption",el).textContent="Enter an address and a wildcard in dotted decimal.";return}
    const A=toN(a),W=toN(wc);const contig=((W+1)&W)===0;const lo=(A&~W)>>>0,hi=(lo|W)>>>0;const cnt=2**(W.toString(2).split("").filter(x=>x==="1").length);
    $(".kv",el).innerHTML=`<span>Matches</span><b class="mono">${cnt.toLocaleString("en-US")} address${cnt>1?"es":""}</b>${contig?`<span>Range</span><b class="mono">${toS(lo)} – ${toS(hi)}</b><span>Same as</span><b class="mono">${W===0?"host "+a:W===0xffffffff?"any":toS(lo)+"/"+(32-Math.log2(W+1))}</b>`:`<span>Pattern</span><b class="mono">non-contiguous</b>`}`;
    $(".caption",el).innerHTML=contig?(W===0?"A zero wildcard matches exactly one host.":`Inverting the wildcard gives the subnet mask ${toS(~W>>>0)}.`)+(lo!==A?` Note: IOS will store this as <b class="mono">${toS(lo)}</b>, because bits under the wildcard's 1s are ignored.`:""):`The 1 bits aren't contiguous, so this matches a pattern, not a subnet. ${a} ${wc} with a final octet of 254 matches every <b>odd</b> address in the range: a classic exam trick.`;
    seen.add(wc);if(seen.size>=4)award("viz:wild",20,"Calculated wildcard masks")}
  el.addEventListener("input",draw);el.addEventListener("click",e=>{const b=e.target.closest("[data-w]");if(!b)return;$(".w-a",el).value=b.dataset.a;$(".w-w",el).value=b.dataset.w;draw()});draw();
})();

(function(){
  const el=$("#viz-aclorder");
  const ACL=[[10,"permit","tcp","192.168.20.0/24","10.1.1.10/32",443],[20,"deny","ip","192.168.20.0/24","10.1.1.0/24",null],[30,"permit","udp","any","any",53],[40,"permit","tcp","192.168.20.0/24","any",443]];
  const PK=[["Guest → server 10.1.1.10, HTTPS","192.168.20.7","10.1.1.10","tcp",443],["Guest → server 10.1.1.10, SSH","192.168.20.7","10.1.1.10","tcp",22],["Guest → 8.8.8.8, DNS","192.168.20.7","8.8.8.8","udp",53],["Guest → news site, HTTPS","192.168.20.7","151.101.1.69","tcp",443],["Guest → news site, HTTP","192.168.20.7","151.101.1.69","tcp",80],["Guest → printer 10.1.1.40, IPP","192.168.20.7","10.1.1.40","tcp",631]];
  const toN=s=>s.split(".").reduce((a,o)=>a*256+ +o,0)>>>0;const inP=(ip,p)=>{if(p==="any")return true;const [n,l]=p.split("/");const m=l==="0"?0:(0xffffffff<<(32-l))>>>0;return ((toN(ip)&m)>>>0)===((toN(n)&m)>>>0)};
  const seen=new Set();
  el.innerHTML=`<div class="viz-title">Run packets through GUEST-IN</div><table class="rt acl-t"></table><div class="chips">${PK.map((p,i)=>`<button class="chip" data-i="${i}">${p[0]}</button>`).join("")}</div><div class="caption" aria-live="polite">Pick a packet to see which line it hits.</div><div class="rv-prog s-small"></div>`;
  function draw(hit,pi){$(".acl-t",el).innerHTML=`<tr><th>Seq</th><th>Rule</th></tr>`+ACL.map((r,i)=>`<tr class="${hit===i?(r[1]==="permit"?"win":"hit"):""}"><td class="mono">${r[0]}</td><td class="mono">${r[1]} ${r[2]} ${r[3]==="any"?"any":r[3].replace("/24"," 0.0.0.255").replace("/32","").replace(/^/,r[3].endsWith("/32")?"host ":"")} ${r[4]==="any"?"any":(r[4].endsWith("/32")?"host "+r[4].replace("/32",""):r[4].replace("/24"," 0.0.0.255"))}${r[5]?" eq "+r[5]:""}</td></tr>`).join("")+`<tr class="${hit===-1?"hit":""}"><td class="mono">—</td><td class="mono s-small">(implicit) deny ip any any</td></tr>`;
    $(".rv-prog",el).textContent=`${seen.size} of ${PK.length} packets tested`}
  el.addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(!b)return;const p=PK[+b.dataset.i];seen.add(+b.dataset.i);
    const hit=ACL.findIndex(r=>(r[2]==="ip"||r[2]===p[3])&&inP(p[1],r[3])&&inP(p[2],r[4])&&(r[5]==null||r[5]===p[4]));draw(hit);
    $(".caption",el).innerHTML=hit<0?`<span class="status-bad">Denied by the implicit deny.</span> No line matched, so the invisible last line drops it.`:`Line ${ACL[hit][0]} matches first, so the packet is <span class="${ACL[hit][1]==="permit"?"status-good":"status-bad"}">${ACL[hit][1]==="permit"?"permitted":"denied"}</span>.${hit===0?" Line 20 would have denied it, but order matters: line 10 is checked first.":""}${hit===1&&p[4]===22?" Only HTTPS was carved out above it.":""}`;
    if(seen.size===PK.length)award("viz:aclorder",30,"Traced packets through an ACL")});draw();
})();

<script>
/* ================= Module 5: Network Operations and Automation (200-301 v2.0 Domain 5.0, 10%) ================= */
(function(){
const LESSONS=[
{id:"ai",num:"5.1",title:"AI in network operations",html:`
<p>Version 2.0 of the CCNA adds artificial intelligence because network teams now use it every day. You need to know the kinds of AI, what each is good for, and where it goes wrong.</p>
<ul><li><b>Predictive AI / machine learning</b> learns patterns from data. In networking it powers <b>AIOps</b>: baselining normal behavior, spotting anomalies (a link whose errors creep up, a client whose roaming is unusual), and predicting failures before users notice. Cisco's AI-driven assurance in Catalyst Center and Meraki works this way.</li>
<li><b>Generative AI</b> (large language models) produces new text or code from a prompt: explain an unfamiliar <code>show</code> output, draft a configuration, summarize thousands of syslog lines, write an Ansible playbook.</li>
<li><b>Agentic AI</b> goes further: an AI <b>agent</b> is given a goal and tools (run a show command, query a controller API, open a ticket). It plans steps, acts, looks at the results and decides what to do next, looping until the goal is met.</li></ul>
<div class="viz" id="viz-aitypes"></div>
<h3>How an agent works</h3>
<div class="viz" id="viz-agent"></div>
<h3>Risks, and how teams manage them</h3>
<ul><li><b>Hallucination</b>: an LLM can produce a confident, wrong command (a keyword that doesn't exist on that platform, a wrong wildcard). <b>Always verify</b> generated configuration in a lab or with a peer review.</li>
<li><b>Data leakage</b>: whatever you paste into a public AI tool may be stored or used for training. Never paste passwords, keys, SNMP communities, customer data or full configs into an unapproved tool. Sanitize first.</li>
<li><b>Too much autonomy</b>: an agent that can change production should work with <b>least privilege</b> (read-only tools by default), <b>guardrails</b> (allowed commands, change windows) and a <b>human in the loop</b> who approves every change.</li>
<li><b>Accountability</b>: the engineer who applies a change owns it, no matter who or what wrote it. Keep an audit trail.</li></ul>
<div class="viz" id="viz-airisk"></div>`},
{id:"prompt",num:"5.2",title:"Writing effective prompts",html:`
<p>The quality of what an AI gives you depends on what you give it. A good prompt for network work has these parts:</p>
<table><tr><th>Part</th><th>What it does</th><th>Example</th></tr>
<tr><td><b>Role</b></td><td>Sets the expertise and voice</td><td>"You are a senior Cisco network engineer."</td></tr>
<tr><td><b>Context</b></td><td>The facts it can't know</td><td>"Catalyst 9300 running IOS XE 17.12, VLANs 10 and 20, OSPF area 0."</td></tr>
<tr><td><b>Task</b></td><td>One clear request</td><td>"Write the configuration for a new access port for an IP phone."</td></tr>
<tr><td><b>Constraints</b></td><td>Rules the answer must follow</td><td>"Use voice VLAN 150, enable PortFast and BPDU Guard, no deprecated commands."</td></tr>
<tr><td><b>Output format</b></td><td>How to shape the answer</td><td>"Return only the commands in a code block, then a one-line explanation of each."</td></tr>
<tr><td><b>Examples</b></td><td>Show the style you want</td><td>Paste a sanitized existing port config to match.</td></tr></table>
<p>Iterate: if the first answer misses, tell it what was wrong rather than starting over. Ask it to explain its reasoning or list assumptions, which exposes hallucinations.</p>
<div class="viz" id="viz-prompt"></div>
<div class="tip"><b>Sanitize before you paste.</b> Replace real passwords, keys, community strings, public IPs and customer names with placeholders like &lt;SECRET&gt; or 192.0.2.x. Use your organization's approved AI tools for anything internal.</div>`},
{id:"mgmt",num:"5.3",title:"Traditional, controller-based and cloud management",html:`
<h3>The three planes</h3>
<ul><li><b>Data plane</b>: forwards user traffic (switching frames, routing packets, applying ACLs). Usually in hardware (ASICs).</li>
<li><b>Control plane</b>: decides how to forward: OSPF, STP, ARP, building the routing and MAC tables.</li>
<li><b>Management plane</b>: how people and tools configure and monitor the device: SSH, SNMP, syslog, APIs.</li></ul>
<div class="viz" id="viz-planes"></div>
<h3>Ways to manage a network</h3>
<ul><li><b>Traditional (device by device)</b>: an engineer logs in to each box with SSH and types commands. Each device runs its own control plane. Slow and error-prone at scale; configurations drift.</li>
<li><b>Controller-based / SDN</b>: a central <b>controller</b> holds the intended state and pushes it to devices. It talks <b>southbound</b> to devices (NETCONF, RESTCONF, SSH, OpenFlow, SNMP) and offers <b>northbound</b> REST APIs to apps and scripts. <b>Cisco Catalyst Center</b> (formerly DNA Center) manages campus networks this way, with <b>intent-based</b> policy and AI assurance. In <b>SD-Access</b>, an <b>underlay</b> (the physical IP network) carries an <b>overlay</b> (VXLAN tunnels) built over the <b>fabric</b>.</li>
<li><b>Cloud-managed</b>: the controller is a cloud service, as with <b>Meraki</b>. Devices phone home over the internet; you manage everything from a dashboard.</li></ul>
<div class="viz" id="viz-sdn"></div>
<h3>REST APIs and JSON</h3>
<p>Controllers and modern devices expose <b>REST APIs</b> over HTTPS. A client sends a request with an HTTP <b>verb</b> to a URL and usually gets <b>JSON</b> back.</p>
<table><tr><th>Verb</th><th>CRUD action</th></tr><tr><td>POST</td><td>Create</td></tr><tr><td>GET</td><td>Read</td></tr><tr><td>PUT / PATCH</td><td>Update (replace / modify)</td></tr><tr><td>DELETE</td><td>Delete</td></tr></table>
<p>Responses carry a status code: <b>2xx</b> success (200 OK, 201 Created, 204 No Content), <b>4xx</b> client error (400 bad request, 401 unauthorized, 403 forbidden, 404 not found), <b>5xx</b> server error. Requests are authenticated with a token in a header. JSON uses <b>objects</b> in <code>{ }</code> with "key": value pairs, <b>arrays</b> in <code>[ ]</code>, strings in double quotes, and the values true, false and null.</p>
<div class="viz" id="viz-json"></div>`},
{id:"iac",num:"5.4",title:"Infrastructure as code and Ansible",html:`
<p><b>Infrastructure as code (IaC)</b> means describing the network in text files that live in <b>source control</b> (Git), are reviewed like software, and are applied by tools. The benefits: repeatable builds, no configuration drift, a history of every change, and quick rollback.</p>
<ul><li><b>Declarative</b>: you describe the end state ("VLAN 10 exists and is named SALES") and the tool works out how to get there. <b>Imperative</b>: you list the exact steps.</li>
<li><b>Idempotent</b>: running the same automation twice gives the same result and changes nothing the second time.</li></ul>
<h3>The common tools</h3>
<table><tr><th>Tool</th><th>Style</th><th>Notes</th></tr>
<tr><td><b>Ansible</b></td><td>Mostly declarative, push</td><td><b>Agentless</b>: connects over SSH (or APIs). <b>Playbooks</b> in YAML run <b>tasks</b> that call <b>modules</b> against hosts in an <b>inventory</b>.</td></tr>
<tr><td><b>Terraform</b></td><td>Declarative</td><td>HashiCorp Configuration Language, a <b>state file</b> tracks what exists; plan then apply. Strong for cloud and controllers.</td></tr>
<tr><td>Puppet / Chef</td><td>Declarative / imperative, pull</td><td>Agents on managed nodes check in with a server. Less common on network gear.</td></tr></table>
<div class="viz" id="viz-playbook"></div>
<div class="viz" id="viz-iac"></div>`},
{id:"snmp",num:"5.5",title:"SNMP",html:`
<p>The <b>Simple Network Management Protocol</b> lets a <b>manager</b> (an NMS such as SolarWinds or Cisco Prime) monitor <b>agents</b> running on devices. Each value it can read is an <b>object</b>, named by an <b>OID</b> (a dotted number like 1.3.6.1.2.1.1.5.0 for sysName) and described in a <b>MIB</b>.</p>
<ul><li><b>Get</b>, <b>GetNext</b>, <b>GetBulk</b>: the manager reads values. The agent listens on <b>UDP 161</b>.</li>
<li><b>Set</b>: the manager changes a value.</li>
<li><b>Trap</b>: the agent sends an unsolicited alert to the manager on <b>UDP 162</b> (link down, high CPU). An <b>Inform</b> is a trap the manager must acknowledge.</li></ul>
<div class="viz" id="viz-snmpflow"></div>
<h3>Versions</h3>
<div class="viz" id="viz-snmpver"></div>
<pre class="term">R1(config)# no snmp-server community public
R1(config)# snmp-server group NETOPS v3 priv
R1(config)# snmp-server user nms1 NETOPS v3 auth sha Auth!Pass priv aes 128 Priv!Pass
R1(config)# snmp-server host 10.0.99.30 version 3 priv nms1
R1(config)# snmp-server location HQ-Closet-2
R1(config)# snmp-server enable traps</pre>`},
{id:"syslog",num:"5.6",title:"Syslog and NTP",html:`
<p><b>Syslog</b> messages tell you what a device is doing: interfaces changing state, neighbors coming up, configuration changes. Each has a <b>facility</b> (which part of the system) and a <b>severity</b> 0 to 7:</p>
<table><tr><th>Level</th><th>Keyword</th><th>Example</th></tr>
<tr><td>0</td><td>emergencies</td><td>System unusable</td></tr><tr><td>1</td><td>alerts</td><td>Immediate action needed (temperature)</td></tr><tr><td>2</td><td>critical</td><td>Critical condition (port security err-disable)</td></tr><tr><td>3</td><td>errors</td><td>Error conditions (LINK-3-UPDOWN)</td></tr><tr><td>4</td><td>warnings</td><td>Warnings</td></tr><tr><td>5</td><td>notifications</td><td>Normal but significant (LINEPROTO-5-UPDOWN, OSPF-5-ADJCHG)</td></tr><tr><td>6</td><td>informational</td><td>Informational</td></tr><tr><td>7</td><td>debugging</td><td>Debug output</td></tr></table>
<p>A mnemonic: <b>E</b>very <b>A</b>wesome <b>C</b>isco <b>E</b>ngineer <b>W</b>ill <b>N</b>eed <b>I</b>ce-cream <b>D</b>aily. Setting a level sends that level <b>and everything more severe</b> (lower numbers).</p>
<p>Read a message like <code>%LINEPROTO-5-UPDOWN: Line protocol on Interface Gi0/0/1, changed state to down</code> as <b>facility</b> LINEPROTO, <b>severity</b> 5, <b>mnemonic</b> UPDOWN, then the description.</p>
<div class="viz" id="viz-syslog"></div>
<pre class="term">R1(config)# logging host 10.0.99.40
R1(config)# logging trap warnings
R1(config)# logging buffered 16384
R1(config)# service timestamps log datetime msec
R1# show logging</pre>
<h3>NTP</h3>
<p>Logs from different devices are only useful if their clocks agree. <b>NTP</b> (UDP 123) syncs clocks to a reference. <b>Stratum</b> counts the distance from an authoritative clock: an atomic or GPS clock is stratum 0, a server attached to it is stratum 1, and each hop adds one. Lower is more accurate; 16 means unsynchronized.</p>
<pre class="term">R1(config)# ntp server 10.0.99.10
R1(config)# clock timezone EST -5
R1# show ntp status
R1# show ntp associations</pre>
<div class="viz" id="viz-ntp"></div>`}

(function(){
  const el=$("#viz-prompt");
  const P={role:[["You are a senior Cisco network engineer.",1],["You are a helpful assistant.",0]],
    ctx:[["Catalyst 9300 on IOS XE 17.12. Data VLAN 10, voice VLAN 150. Access ports use PortFast and BPDU Guard.",1],["Here's my full running config:\nhostname CORE1\nenable secret 9 $9$Wq…\nsnmp-server community C0rpRW! RW\ntacacs server ISE1\n key T@cacsKey",-1],["It's a switch.",0]],
    task:[["Write the configuration for Gi1/0/14, a new desk with an IP phone and a PC.",1],["Fix my network.",0]],
    con:[["Use only commands valid on IOS XE 17. Don't change any other interface. Include a description.",1],["",0]],
    fmt:[["Return only the commands in a code block, then one line explaining each.",1],["",0]]};
  const N={role:"Role",ctx:"Context",task:"Task",con:"Constraints",fmt:"Output format"};const pick={role:1,ctx:2,task:1,con:1,fmt:1};let best=false;
  el.innerHTML=`<div class="viz-title">Build a prompt</div><div class="pb">${Object.keys(P).map(k=>`<div class="pb-r"><span class="s-small">${N[k]}</span><div class="chips">${P[k].map((o,i)=>`<button class="chip" data-k="${k}" data-i="${i}">${o[0]?esc(o[0].split("\n")[0].slice(0,60))+(o[0].length>60||o[0].includes("\n")?"…":""):"(leave out)"}</button>`).join("")}</div></div>`).join("")}</div>
  <pre class="term pb-o"></pre><div class="meter"><i></i></div><div class="caption" aria-live="polite"></div>`;
  function draw(){el.querySelectorAll("[data-k]").forEach(b=>b.setAttribute("aria-pressed",pick[b.dataset.k]===+b.dataset.i));
    const parts=Object.keys(P).map(k=>P[k][pick[k]]);const txt=parts.map(p=>p[0]).filter(Boolean).join("\n\n");const leak=parts.some(p=>p[1]<0);const score=parts.reduce((a,p)=>a+Math.max(0,p[1]),0);
    $(".pb-o",el).textContent=txt||"(empty prompt)";$(".meter i",el).style.width=(leak?100:score*20)+"%";$(".meter",el).className="meter "+(leak?"b":score>=5?"g":score>=3?"m":"b");
    const miss=Object.keys(P).filter(k=>P[k][pick[k]][1]===0).map(k=>N[k].toLowerCase());
    $(".caption",el).innerHTML=leak?`<span class="status-bad">Stop: this prompt leaks secrets.</span> It contains the enable secret hash, an SNMP read-write community and a TACACS+ key. A public AI tool may store it. Remove them, or replace them with &lt;SECRET&gt; placeholders, and give only the context the task needs.`:score===5?`<span class="status-good">Strong prompt.</span> Role, specific context, one clear task, constraints and an output format. You'll get a precise answer you can verify quickly.`:`Score ${score} of 5. Missing or weak: ${miss.join(", ")}. Vague prompts get generic answers that need more checking.`;
    if(leak)flag("leak");if(score===5&&!leak){best=true;award("viz:prompt",30,"Built a strong, safe prompt")}}
  el.addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b)return;pick[b.dataset.k]=+b.dataset.i;draw()});draw();
})();

/* ---- syslog severity filter ---- */
(function(){
  const el=$("#viz-syslog");const LV=["emergencies","alerts","critical","errors","warnings","notifications","informational","debugging"];let lv=4;const seen=new Set();
  const M=[[2,"%PORT_SECURITY-2-PSECURE_VIOLATION: Security violation occurred, caused by MAC address dead.beef.0001 on port GigabitEthernet1/0/2."],[3,"%LINK-3-UPDOWN: Interface GigabitEthernet0/0/1, changed state to down"],[5,"%LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/0/1, changed state to down"],[5,"%OSPF-5-ADJCHG: Process 1, Nbr 2.2.2.2 on GigabitEthernet0/0/0 from FULL to DOWN"],[4,"%SYS-4-CONFIG_RESOLVE_FAILURE: System config parse from (tftp://255.255.255.255/network-confg) failed"],[1,"%ENVMON-1-FAN_FAILURE: Fan 2 failure detected"],[6,"%SYS-6-LOGGINGHOST_STARTSTOP: Logging to host 10.0.99.40 port 514 started"],[7,"IP: s=10.1.1.5 (Gi0/0/1), d=10.2.2.2, len 100, rcvd 2"],[5,"%SYS-5-CONFIG_I: Configured from console by admin on vty0 (10.0.99.7)"]];
  el.innerHTML=`<div class="viz-title">logging trap: what reaches the syslog server?</div><div class="chips">${LV.map((l,i)=>`<button class="chip mono" data-l="${i}">${i} ${l}</button>`).join("")}</div><pre class="term sl-o"></pre><div class="caption" aria-live="polite"></div>`;
  function draw(){el.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.l===lv));
    $(".sl-o",el).innerHTML=`<span class="t-c">R1(config)# logging trap ${LV[lv]}</span>\n`+M.map(m=>`<span class="${m[0]<=lv?"":"t-n"}" style="${m[0]<=lv?"":"opacity:.35;text-decoration:line-through"}">${esc(m[1])}</span>`).join("\n");
    const n=M.filter(m=>m[0]<=lv).length;$(".caption",el).innerHTML=`Level <b>${lv} (${LV[lv]})</b> sends levels 0 through ${lv}: ${n} of ${M.length} messages. ${lv>=7?"Debugging floods the server and can load the CPU; use it briefly.":lv<=2?"You'd miss interface and OSPF changes.":lv===4?"Warnings is a common choice, but notice it drops the level 5 OSPF and interface messages.":lv===5?"Notifications catches OSPF, line protocol and config changes: often the best balance.":""}`;
    seen.add(lv);if(seen.size>=4)award("viz:syslog",20,"Filtered syslog by severity")}
  el.addEventListener("click",e=>{const b=e.target.closest("[data-l]");if(!b)return;lv=+b.dataset.l;draw()});draw();
})();

    {id:"aireview",title:"Review an AI agent's change request",type:"choice",
      scenario:"Your team's AI agent investigated slow file transfers at branch 4 and opened this change request:<pre class=\"term\">Finding: Gi0/0/0 on BR4-R1 shows 11,402 late collisions; duplex half.\nProposed change (BR4-R1):\n interface GigabitEthernet0/0/0\n  duplex full\n  speed 1000\n  no cdp enable\n  ip ospf cost 1\nRollback: default interface GigabitEthernet0/0/0</pre>",
