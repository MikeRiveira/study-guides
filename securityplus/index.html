/* ================= Module 2: Threats, Vulnerabilities, and Mitigations (SY0-701 Domain 2.0, 22%) ================= */
(function(){
const LESSONS=[
{id:"actors",num:"2.1",title:"Threat actors and motivations",html:`
<p>Who is attacking, and why, tells you what they'll go after and how hard they'll try.</p>
<ul><li><b>Nation-state</b>: government-backed, very well funded, highly sophisticated. They run <b>advanced persistent threats (APTs)</b> that stay hidden for months. Motivation: espionage, disruption, war.</li>
<li><b>Organized crime</b>: professional criminals with money and skill. Motivation: <b>financial gain</b> (ransomware, fraud).</li>
<li><b>Hacktivist</b>: attacks to push a political or social cause. Motivation: <b>philosophical or political beliefs</b>. Often defacement and DDoS.</li>
<li><b>Insider threat</b>: an employee or contractor with legitimate access. Motivation: revenge, money, or simple carelessness.</li>
<li><b>Unskilled attacker</b> (script kiddie): runs tools other people wrote. Low sophistication, often seeking thrills or bragging rights.</li>
<li><b>Shadow IT</b>: staff using unapproved apps and services. Not malicious, but it creates unmanaged risk.</li></ul>
<h3>Attributes</h3>
<p>Compare actors by <b>internal vs external</b>, <b>resources and funding</b>, and <b>level of sophistication</b>. Other motivations on the exam: <b>data exfiltration</b>, <b>service disruption</b>, <b>blackmail</b>, <b>ethical</b> (bug bounty hunters), <b>revenge</b> and <b>espionage</b>.</p>
<div class="viz" id="viz-actors"></div>`},
{id:"vectors",num:"2.2",title:"Threat vectors and attack surfaces",html:`
<p>A <b>threat vector</b> is the path an attacker uses to get in. The <b>attack surface</b> is the sum of all those possible paths. Shrink the surface and you shrink the risk.</p>
<ul><li><b>Message-based</b>: email, SMS, instant messaging. The most common vector.</li>
<li><b>Image-based</b> and <b>file-based</b>: malicious code hidden in images, documents or PDFs.</li>
<li><b>Voice call</b>: vishing.</li>
<li><b>Removable devices</b>: infected USB drives dropped in a parking lot.</li>
<li><b>Vulnerable software</b>: both <b>client-based</b> (an agent you install) and <b>agentless</b> (web apps).</li>
<li><b>Unsupported systems and applications</b>: no more patches, so every new flaw stays open.</li>
<li><b>Unsecure networks</b>: open Wi-Fi, exposed wired ports, Bluetooth.</li>
<li><b>Open service ports</b> and <b>default credentials</b>.</li>
<li><b>Supply chain</b>: a compromised vendor, managed service provider (MSP) or software supplier.</li></ul>
<div class="viz" id="viz-surface"></div>`},
{id:"social",num:"2.3",title:"Social engineering",html:`
<p>Social engineering attacks the person instead of the system. It works through <b>urgency</b>, <b>authority</b>, <b>fear</b>, <b>trust</b> and <b>curiosity</b>.</p>
<ul><li><b>Phishing</b>: fraudulent email. <b>Spear phishing</b> targets a specific person. <b>Whaling</b> targets executives.</li>
<li><b>Vishing</b>: voice phishing over the phone. <b>Smishing</b>: phishing over SMS.</li>
<li><b>Misinformation / disinformation</b>: false information spread on purpose (disinformation) or by accident (misinformation).</li>
<li><b>Impersonation</b>: pretending to be IT, a vendor or an executive. <b>Pretexting</b> is the made-up story that makes it believable.</li>
<li><b>Business email compromise (BEC)</b>: using a real or spoofed executive or vendor mailbox to trick staff into wiring money.</li>
<li><b>Brand impersonation</b>: fake sites and emails dressed as a trusted brand.</li>
<li><b>Typosquatting</b>: registering look-alike domains such as examp1e.com.</li>
<li><b>Watering hole</b>: compromising a website the target group already visits.</li></ul>
<div class="viz" id="viz-phish"></div>
<div class="viz" id="viz-sesort"></div>`},
{id:"appvuln",num:"2.4",title:"Application vulnerabilities and attacks",html:`
<ul><li><b>Injection</b>: untrusted input is treated as code. <b>SQL injection (SQLi)</b> changes a database query. Defense: <b>parameterized queries</b> and input validation.</li>
<li><b>Cross-site scripting (XSS)</b>: the attacker injects script into a page that runs in other users' browsers. Defense: output encoding and input validation.</li>
<li><b>Cross-site request forgery (CSRF)</b>: tricks a logged-in user's browser into sending a request they didn't intend. Defense: anti-CSRF tokens.</li>
<li><b>Buffer overflow</b>: writing more data than a buffer holds, overwriting nearby memory such as the return address. Defense: bounds checking, memory-safe languages, ASLR and DEP.</li>
<li><b>Memory injection</b>: placing malicious code in another process's memory.</li>
<li><b>Race condition</b>: the result depends on timing. <b>Time-of-check to time-of-use (TOCTOU)</b> changes a resource between checking it and using it.</li>
<li><b>Malicious update</b>: a poisoned software update, often through the supply chain.</li>
<li><b>Directory traversal</b>: using <span class="mono">../</span> to reach files outside the web root.</li>
<li><b>Privilege escalation</b>: gaining higher rights than granted, vertical (user to admin) or horizontal (one user to another).</li>
<li><b>Replay attack</b>: capturing valid data, such as a session token, and sending it again.</li>
<li><b>Forgery</b> and <b>request forgery</b>: including server-side request forgery (SSRF), where the server is tricked into making requests for the attacker.</li></ul>
<div class="viz" id="viz-sqli"></div>
<div class="viz" id="viz-bof"></div>`},
{id:"vulns",num:"2.5",title:"System, cloud, supply chain and mobile vulnerabilities",html:`
<ul><li><b>Operating system</b>: unpatched flaws, weak defaults and misconfigurations.</li>
<li><b>Web-based</b>: SQLi and XSS against web apps.</li>
<li><b>Hardware</b>: <b>firmware</b> flaws, <b>end-of-life</b> devices that no longer get updates, and <b>legacy</b> systems that can't run modern security.</li>
<li><b>Virtualization</b>: <b>VM escape</b> (breaking out of a VM to the hypervisor) and <b>resource reuse</b> (leftover data in reallocated memory or disk).</li>
<li><b>Cloud-specific</b>: misconfigured storage buckets, exposed APIs and weak identity settings.</li>
<li><b>Supply chain</b>: a compromised <b>service provider</b>, <b>hardware provider</b> or <b>software provider</b>.</li>
<li><b>Cryptographic</b>: weak algorithms, poor key management, expired certificates.</li>
<li><b>Misconfiguration</b>: open ports, default passwords, overly broad permissions. Very common.</li>
<li><b>Mobile device</b>: <b>side loading</b> (installing apps outside the official store) and <b>jailbreaking</b> or rooting, which removes built-in protections.</li>
<li><b>Zero-day</b>: a flaw the vendor doesn't know about or hasn't patched yet. No signature exists.</li></ul>
<div class="viz" id="viz-vulns"></div>`},
{id:"malware",num:"2.6",title:"Malware",html:`
<ul><li><b>Ransomware</b>: encrypts data and demands payment. Often also steals data first (double extortion).</li>
<li><b>Trojan</b>: pretends to be legitimate software. A <b>remote access Trojan (RAT)</b> gives the attacker control.</li>
<li><b>Worm</b>: spreads across the network on its own, without user action.</li>
<li><b>Virus</b>: attaches to files and needs a user to run it.</li>
<li><b>Spyware</b>: watches and reports activity. <b>Keylogger</b>: records keystrokes.</li>
<li><b>Bloatware</b>: unwanted preinstalled software that adds attack surface.</li>
<li><b>Logic bomb</b>: code that waits for a trigger, such as a date or an employee being removed from payroll.</li>
<li><b>Rootkit</b>: hides deep in the OS or firmware with system-level access, concealing itself and other malware.</li>
<li><b>Fileless malware</b>: lives only in memory or uses built-in tools such as PowerShell, leaving little on disk.</li></ul>
<div class="viz" id="viz-malware"></div>
<div class="viz" id="viz-malid"></div>`},
{id:"attacks",num:"2.7",title:"Network, password and cryptographic attacks",html:`
<h3>Network attacks</h3>
<ul><li><b>DDoS</b>: flooding a target from many sources. <b>Amplified</b> and <b>reflected</b> attacks send small spoofed requests to servers (such as DNS) that send large replies to the victim.</li>
<li><b>DNS attacks</b>: cache poisoning and domain hijacking.</li>
<li><b>Wireless</b>: evil twins, rogue APs, deauthentication.</li>
<li><b>On-path</b> (man-in-the-middle): intercepting traffic between two parties.</li>
<li><b>Credential replay</b>: reusing captured credentials or hashes (pass-the-hash).</li>
<li><b>Malicious code</b> delivered over the network.</li></ul>
<h3>Password attacks</h3>
<ul><li><b>Brute force</b>: try every combination. Defeated by long passwords and lockouts.</li>
<li><b>Dictionary</b>: try common words and leaked passwords.</li>
<li><b>Password spraying</b>: try a few common passwords against many accounts, staying under lockout thresholds.</li>
<li><b>Credential stuffing</b>: reuse username/password pairs leaked from other breaches.</li></ul>
<div class="viz" id="viz-pwlab"></div>
<h3>Cryptographic attacks</h3>
<ul><li><b>Downgrade</b>: forcing a connection to use an older, weaker protocol (such as SSL 3.0).</li>
<li><b>Collision</b>: finding two inputs with the same hash.</li>
<li><b>Birthday attack</b>: uses probability math to find collisions faster than expected.</li></ul>
<h3>Physical attacks</h3>
<p><b>Brute force</b> (forcing a door), <b>RFID cloning</b> (copying a badge) and <b>environmental</b> attacks (cutting power or HVAC).</p>`},
{id:"ioc",num:"2.8",title:"Indicators of compromise",html:`
<p>An <b>indicator of compromise (IoC)</b> is evidence that something has gone wrong. On the exam, look for these:</p>
<ul><li><b>Account lockout</b>: someone is guessing passwords.</li>
<li><b>Concurrent session usage</b>: one account logged in from two places at once.</li>
<li><b>Impossible travel</b>: logins from New York and Singapore ten minutes apart.</li>
<li><b>Blocked content</b>: security tools blocking things they normally don't see.</li>
<li><b>Resource consumption</b>: sudden CPU, disk or bandwidth spikes (crypto miners, exfiltration).</li>
<li><b>Resource inaccessibility</b>: files that suddenly can't be opened (ransomware).</li>
<li><b>Out-of-cycle logging</b>: activity at times nothing should run.</li>
<li><b>Missing logs</b>: an attacker covering their tracks.</li>
<li><b>Published or documented</b>: your data turning up on a leak site.</li></ul>
<div class="viz" id="viz-iocq"></div>`},
{id:"mitigate",num:"2.9",title:"Mitigation techniques",html:`
<ul><li><b>Segmentation</b>: split the network so a compromise can't spread.</li>
<li><b>Access control</b>: <b>access control lists</b> and <b>permissions</b> following <b>least privilege</b>.</li>
<li><b>Application allow list</b>: only approved programs can run.</li>
<li><b>Isolation</b>: quarantine a compromised host or run risky apps in a sandbox.</li>
<li><b>Patching</b>: close known vulnerabilities quickly.</li>
<li><b>Encryption</b>: protect data even if it's stolen.</li>
<li><b>Monitoring</b>: catch what gets through.</li>
<li><b>Configuration enforcement</b>: push a secure baseline and fix drift automatically.</li>
<li><b>Decommissioning</b>: retire and wipe systems you no longer need.</li>
<li><b>Hardening</b>: install <b>endpoint protection</b> and a <b>host-based firewall</b>, use <b>HIPS</b>, <b>disable unused ports and protocols</b>, <b>change default passwords</b> and <b>remove unnecessary software</b>.</li></ul>
<div class="viz" id="viz-outbreak"></div>`}
];

/* ---- buffer overflow stack ---- */
(function(){
  const el=$("#viz-bof");let n=0,prot=false;const seen=new Set();
  el.innerHTML=`<div class="viz-title">Buffer overflow: fill a 16-byte buffer</div>
  <div class="rng-row"><span>Input length</span><input type="range" min="0" max="40" value="0" aria-label="Input length"><b id="bf-n">0 B</b></div>

  <div class="stack-mem" id="bf-s"></div><div class="caption" aria-live="polite"></div>`;
  function draw(){const take=prot?Math.min(n,16):n;$("#bf-n",el).textContent=n+" B";
    const buf="A".repeat(Math.min(take,16)).padEnd(16,"·"),fp=take>16?"A".repeat(Math.min(take-16,8)).padEnd(8,"·"):"0x7ffe8a10",ret=take>24?("A".repeat(Math.min(take-24,8))+"").padEnd(8,"·"):"0x00401a2c";
    $("#bf-s",el).innerHTML=`<div class="buf"><span>buffer[16]</span><b>${buf}</b></div><div class="${take>16?"over":""}"><span>saved frame ptr</span><b>${fp}</b></div><div class="ret ${take>24?"over":""}"><span>return address</span><b>${take>24?(take>=32?"0x41414141 → attacker code":ret):ret}</b></div>`;
    let t;if(prot&&n>16)t='<span class="status-good">Input truncated at 16 bytes.</span> Bounds checking stops the overflow, and ASLR and DEP would make any leftover bug hard to exploit.';
    else if(take<=16)t="The input fits in the buffer. Nothing else is touched.";
    else if(take<=24)t='<span class="status-bad">Overflow.</span> Extra bytes spill into the saved frame pointer. The program will probably crash (a denial of service).';
    else t='<span class="status-bad">Return address overwritten.</span> When the function returns, the CPU jumps wherever the attacker chose. That\'s code execution.';
    $(".caption",el).innerHTML=t;if(!prot&&take>=32)seen.add("pwn");if(prot&&n>16)seen.add("fix");if(seen.size===2)award("viz:bof",30,"Overflowed and protected a buffer")}
  $("input",el).addEventListener("input",e=>{n=+e.target.value;draw()});
  el.addEventListener("click",e=>{const p=e.target.closest("[data-p]");if(!p)return;prot=p.dataset.p==="1";el.querySelectorAll("[data-p]").forEach(x=>x.setAttribute("aria-pressed",x===p));draw()});draw();

(function(){
  const el=$("#viz-pwlab");
  const DICT=["password","123456","qwerty","letmein","welcome","dragon","monkey","summer2024","winter2025","iloveyou","admin","football"];
  const GUESS=1e10;/* offline GPU guesses per second against a fast hash */
  el.innerHTML=`<div class="viz-title">Password attack lab</div><input class="txt-in" id="pw-in" value="summer2024" aria-label="Password to test" autocomplete="off">
  <div class="chips" style="margin-top:8px"><button class="chip" data-h="fast" aria-pressed="true">Stored as fast hash (MD5)</button><button class="chip" data-h="slow">Stored as bcrypt (slow)</button></div>
  <div class="kv" id="pw-kv"></div><div class="meter"><i id="pw-m"></i></div><div class="caption" aria-live="polite"></div>
  <div class="viz-controls"><button class="btn primary" data-a="crack">Run the attack</button></div>`;
  let slow=false,ran=new Set();
  const space=p=>{let s=0;if(/[a-z]/.test(p))s+=26;if(/[A-Z]/.test(p))s+=26;if(/[0-9]/.test(p))s+=10;if(/[^a-zA-Z0-9]/.test(p))s+=33;return s||1};
  const human=s=>s<1?"instantly":s<60?Math.round(s)+" seconds":s<3600?Math.round(s/60)+" minutes":s<86400?Math.round(s/3600)+" hours":s<3.15e7?Math.round(s/86400)+" days":s<3.15e9?Math.round(s/3.15e7)+" years":s<3.15e13?Math.round(s/3.15e9)+" centuries":"longer than the universe has existed";
  function calc(){const p=$("#pw-in",el).value,rate=slow?GUESS/1e6:GUESS,inDict=DICT.includes(p.toLowerCase())||/^[a-z]+\d{1,4}!?$/i.test(p)&&p.length<=12;

/* ================= Module 3: Security Architecture (SY0-701 Domain 3.0, 18%) ================= */
(function(){
const LESSONS=[
{id:"cloud",num:"3.1",title:"Cloud and architecture models",html:`
<h3>Cloud responsibility</h3>
<p>In the cloud, security is shared. The <b>responsibility matrix</b> shows who handles what. The more managed the service, the less you handle, but <b>your data and who can access it are always yours</b>.</p>
<ul><li><b>IaaS</b> (infrastructure as a service): you manage the OS, apps and data. The provider runs the hardware and hypervisor.</li>
<li><b>PaaS</b> (platform as a service): you manage your app and data. The provider runs the OS and runtime.</li>
<li><b>SaaS</b> (software as a service): you manage your data, users and settings. The provider runs everything else.</li></ul>
<div class="viz" id="viz-shared"></div>
<h3>Hybrid and third-party</h3>
<p>A <b>hybrid cloud</b> mixes on-premises and cloud, or several providers. Watch for consistent policies across both. <b>Third-party vendors</b> in the mix add supply chain risk.</p>
<h3>Other models</h3>
<ul><li><b>Infrastructure as code (IaC)</b>: servers and networks defined in files, so builds are repeatable and reviewable. A mistake in the template is copied everywhere.</li>
<li><b>Serverless</b>: you write functions and the provider runs them. No OS to patch, but function permissions matter.</li>
<li><b>Microservices</b>: an app split into small services talking through APIs. Secure the APIs.</li>
<li><b>Network infrastructure</b>: <b>physical isolation</b> (an <b>air gap</b> with no connection at all), <b>logical segmentation</b> (VLANs) and <b>software-defined networking (SDN)</b>, which separates the control plane from the data plane.</li>
<li><b>On-premises</b>: you control everything, and you pay for and secure everything. <b>Centralized</b> vs <b>decentralized</b>: one point of control (and failure) vs control spread across many locations.</li>
<li><b>Containerization</b>: apps packaged with their dependencies sharing one OS kernel. <b>Virtualization</b>: full guest OSes on a hypervisor.</li>
<li><b>IoT</b>: smart devices, often weakly secured. <b>ICS/SCADA</b>: industrial control systems running physical processes; availability and safety come first. <b>RTOS</b>: real-time OS with strict timing, as in cars and medical devices. <b>Embedded systems</b>: dedicated-purpose computers that are often hard to patch.</li>
<li><b>High availability</b>: designs that stay up through failures.</li></ul>
<div class="viz" id="viz-models"></div>
<h3>Considerations</h3>
<p>Weigh <b>availability</b>, <b>resilience</b>, <b>cost</b>, <b>responsiveness</b>, <b>scalability</b>, <b>ease of deployment</b>, <b>risk transference</b>, <b>ease of recovery</b>, <b>patch availability</b>, <b>inability to patch</b>, <b>power</b> and <b>compute</b>. An embedded medical pump may score badly on patch availability, so it needs compensating controls.</p>`},
{id:"infra",num:"3.2",title:"Secure network infrastructure",html:`
<h3>Placement and zones</h3>
<p><b>Device placement</b> decides what each control can see. <b>Security zones</b> group systems by trust, with controls between them. Every connection you add grows the <b>attack surface</b>.</p>
<h3>Failure modes</h3>
<ul><li><b>Fail-open</b>: if the device fails, traffic keeps flowing. Availability wins, security loses.</li>
<li><b>Fail-closed</b>: if the device fails, traffic stops. Security wins, availability loses.</li></ul>
<h3>Device attributes</h3>
<ul><li><b>Active</b> devices can block (IPS). <b>Passive</b> devices only watch (IDS).</li>
<li><b>Inline</b>: traffic passes through the device. <b>Tap/monitor</b>: the device gets a copy from a network tap or SPAN port.</li></ul>
<h3>Appliances</h3>
<ul><li><b>Jump server</b> (jump box): a hardened host admins connect to first, then reach internal systems from it.</li>
<li><b>Proxy server</b>: makes requests on behalf of clients. Forward proxies filter user web traffic. Reverse proxies sit in front of servers.</li>
<li><b>IPS/IDS</b>: inspect traffic for attacks; IPS blocks, IDS alerts.</li>
<li><b>Load balancer</b>: spreads traffic across servers for availability.</li>
<li><b>Sensors</b>: collect traffic or events for monitoring.</li></ul>
<h3>Firewalls</h3>
<ul><li><b>Layer 4</b> firewalls filter by IP address and port. <b>Layer 7</b> firewalls understand applications.</li>
<li><b>Web application firewall (WAF)</b>: protects web apps from SQLi, XSS and similar attacks.</li>
<li><b>Unified threat management (UTM)</b>: firewall, IPS, antivirus, content filter and VPN in one box, often for small offices.</li>
<li><b>Next-generation firewall (NGFW)</b>: application-aware, with IPS and user identity built in.</li></ul>
<h3>Port security</h3>
<p><b>802.1X</b> keeps a switch port closed until the device authenticates through RADIUS, using <b>EAP</b> (Extensible Authentication Protocol) methods such as EAP-TLS.</p>
<div class="viz" id="viz-failmode"></div>
<div class="viz" id="viz-appl"></div>`},
{id:"remote",num:"3.3",title:"Secure communication and access",html:`
<ul><li><b>VPN</b>: an encrypted tunnel across an untrusted network. <b>Remote access VPNs</b> connect users. <b>Site-to-site VPNs</b> connect offices.</li>
<li><b>Tunneling</b>: <b>TLS</b> VPNs work through browsers and port 443. <b>IPsec</b> works at layer 3 and uses <b>AH</b> (integrity and authentication, no encryption) and <b>ESP</b> (encryption plus integrity). <b>Tunnel mode</b> encrypts the whole original packet; <b>transport mode</b> encrypts only the payload.</li>
<li><b>Full tunnel</b> sends all traffic through the VPN. <b>Split tunnel</b> sends only corporate traffic through it.</li>
<li><b>SD-WAN</b>: software-defined WAN that picks the best path across links such as broadband, LTE and MPLS.</li>
<li><b>SASE</b> (secure access service edge): cloud-delivered networking and security (secure web gateway, CASB, zero trust access, firewall) close to users wherever they are.</li></ul>
<div class="viz" id="viz-ipsec"></div>
<h3>Selecting controls</h3>
<p>Choose controls that fit the architecture. A remote-first company leans on SASE and zero trust. A factory leans on segmentation and physical isolation. A small office might use a single UTM.</p>
<div class="viz" id="viz-pickarch"></div>`},
{id:"data",num:"3.4",title:"Protecting data",html:`
<h3>Data types</h3>
<p><b>Regulated</b> (health, payment), <b>trade secrets</b>, <b>intellectual property</b>, <b>legal</b> and <b>financial</b> information. Data can be <b>human-readable</b> or <b>non-human-readable</b> (binary, barcodes, encoded).</p>
<h3>Classifications</h3>
<p>Typical labels: <b>public</b>, <b>private</b>, <b>sensitive</b>, <b>confidential</b>, <b>restricted</b> and <b>critical</b>. The label decides the handling rules.</p>
<div class="viz" id="viz-class"></div>
<h3>Data states</h3>
<ul><li><b>At rest</b>: stored on disk, in a database or backup. Use disk, file and database encryption.</li>
<li><b>In transit</b>: moving across a network. Use TLS, IPsec and VPNs.</li>
<li><b>In use</b>: in memory being processed. The hardest to protect: secure enclaves and careful access control.</li></ul>
<div class="viz" id="viz-states"></div>
<h3>Sovereignty and protection methods</h3>
<p><b>Data sovereignty</b>: data is subject to the laws of the country where it's stored. <b>Geolocation</b> and <b>geographic restrictions</b> control where it can be stored or accessed.</p>
<p>Methods: <b>encryption</b>, <b>hashing</b>, <b>masking</b>, <b>tokenization</b>, <b>obfuscation</b>, <b>segmentation</b> and <b>permission restrictions</b>.</p>`},
{id:"resil",num:"3.5",title:"Resilience and recovery",html:`
<h3>High availability</h3>
<p><b>Load balancing</b> spreads work across active servers. <b>Clustering</b> groups servers so another takes over if one fails. Build redundancy in at every layer.</p>
<h3>Site considerations</h3>
<ul><li><b>Hot site</b>: fully equipped and running, data replicated. Recovery in minutes to hours. Most expensive.</li>
<li><b>Warm site</b>: hardware in place, data needs restoring. Recovery in hours to days.</li>
<li><b>Cold site</b>: space, power and cooling only. Recovery in days to weeks. Cheapest.</li>
<li><b>Geographic dispersion</b>: sites far enough apart that one disaster doesn't hit both.</li></ul>
<div class="viz" id="viz-sites"></div>
<h3>Diversity and continuity</h3>
<p><b>Platform diversity</b> (different OSes or vendors) and <b>multi-cloud</b> avoid a single point of failure. <b>Continuity of operations planning (COOP)</b> keeps essential functions running. <b>Capacity planning</b> covers <b>people</b>, <b>technology</b> and <b>infrastructure</b>.</p>
<h3>Testing</h3>
<p><b>Tabletop exercises</b> (talking through a scenario), <b>failover</b> tests, <b>simulations</b> and <b>parallel processing</b> (running the backup system alongside production to compare).</p>
<h3>Backups</h3>
<ul><li><b>Onsite and offsite</b> copies. Keep at least one offline or immutable copy that ransomware can't reach.</li>
<li><b>Frequency</b> sets your recovery point. <b>Encrypt</b> backups.</li>
<li><b>Snapshots</b>: point-in-time copies of a VM or volume. <b>Replication</b>: continuous copying to another site. <b>Journaling</b>: logging changes so you can replay to a point in time.</li>
<li><b>Recovery</b>: test restores regularly. An untested backup isn't a backup.</li></ul>
<p><b>RPO</b> (recovery point objective) is how much data you can afford to lose, measured back in time. <b>RTO</b> (recovery time objective) is how long you can afford to be down.</p>
<div class="viz" id="viz-rpo"></div>
<h3>Power</h3>
<p>A <b>UPS</b> bridges short outages and gives time to shut down or for <b>generators</b> to start. Generators run for long outages.</p>`}
];

/* ---- shared responsibility ---- */
(function(){
  const el=$("#viz-shared");
  const L=["Data","Identities and access","Applications","Operating system","Runtime / middleware","Virtualization","Network","Physical hosts","Data center"];
  const M={onprem:["On-premises",9],iaas:["IaaS",4],paas:["PaaS",3],saas:["SaaS",2]};
  const ex={onprem:"You own and secure everything, from the building to the data.",iaas:"Rent virtual machines. You patch the OS and everything above it.",paas:"Deploy code to a managed platform. You secure your app, data and access.",saas:"Use finished software like email. You still own your data and who can access it."};
  const seen=new Set();
  el.innerHTML=`<div class="viz-title">Shared responsibility: who secures each layer?</div><div class="chips">${Object.entries(M).map(([k,v])=>`<button class="chip" data-m="${k}">${v[0]}</button>`).join("")}</div><div class="scroll"><table class="sr-tbl" id="sr-t"></table></div><div class="legend"><span><i style="background:var(--accent)"></i>You</span><span><i style="background:var(--blue)"></i>Provider</span></div><div class="caption" aria-live="polite">Pick a service model.</div>`;
  function draw(k){const n=M[k][1];el.querySelectorAll("[data-m]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===k));
    $("#sr-t",el).innerHTML=`<tr><th>Layer</th><th>${M[k][0]}</th></tr>`+L.map((l,i)=>`<tr><td>${l}</td><td class="${i<n?"you":"prov"}">${i<n?"You":"Provider"}</td></tr>`).join("");
    seen.add(k);$(".caption",el).innerHTML=ex[k]+(seen.size===4?' <span class="status-good">Notice that data and access are yours in every model.</span>':"");if(seen.size===4)award("viz:shared",20,"Mapped shared responsibility")}
  el.addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(b)draw(b.dataset.m)});
})();

seqViz($("#viz-ipsec"),{title:"IPsec site-to-site tunnel",left:"Branch firewall",right:"HQ firewall",intro:"Two offices build an IPsec tunnel over the internet.",
  steps:[{dir:"r",label:"IKE phase 1",sub:"Authenticate peers, build a secure channel",text:"The firewalls authenticate each other with certificates or a pre-shared key and agree on a secure management channel."},

/* ---- RPO / RTO timeline ---- */
(function(){
  const el=$("#viz-rpo");const REQ={rpo:4,rto:8};const SITE={hot:[1,"Hot site",3],warm:[12,"Warm site",2],cold:[96,"Cold site",1]};
  let freq=24,site="cold";
  el.innerHTML=`<div class="viz-title">Meet the objectives: RPO 4 hours, RTO 8 hours</div>
  <div class="rng-row"><span>Backup every</span><input type="range" min="1" max="24" value="24" aria-label="Backup interval in hours"><b id="rp-f">24 h</b></div>
  <div class="chips">${Object.entries(SITE).map(([k,v])=>`<button class="chip" data-s="${k}">${v[1]}</button>`).join("")}</div>
  <div class="tl"><div class="ln"></div><div class="seg rpo" id="rp-a"></div><div class="seg rto" id="rp-b"></div><div class="pt dn r" id="rp-p1">last backup</div><div class="pt up" style="left:50%">💥 disaster</div><div class="pt dn l" id="rp-p2">back online</div></div>
  <div class="legend"><span><i style="background:rgba(255,115,147,.6)"></i>Data lost (RPO)</span><span><i style="background:rgba(255,210,122,.6)"></i>Downtime (RTO)</span></div>
  <div class="kv" id="rp-kv"></div><div class="caption" aria-live="polite"></div>`;
  function draw(){const rt=SITE[site][0],scale=h=>Math.min(48,h)/48*50;
    el.querySelectorAll("[data-s]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===site));$("#rp-f",el).textContent=freq+" h";
    const a=scale(freq),b2=scale(rt);$("#rp-a",el).style.cssText=`left:${50-a}%;width:${a}%`;$("#rp-b",el).style.cssText=`left:50%;width:${b2}%`;$("#rp-p1",el).style.left=(50-a)+"%";$("#rp-p2",el).style.left=(50+b2)+"%";$("#rp-p1",el).className="pt dn "+(50-a<22?"l":"r");$("#rp-p2",el).className="pt dn "+(50+b2>78?"r":"l");
    const okP=freq<=REQ.rpo,okT=rt<=REQ.rto;
    $("#rp-kv",el).innerHTML=`<span>Worst-case data loss</span><b class="${okP?"status-good":"status-bad"}">${freq} h ${okP?"✓":"✗ (needs ≤ 4 h)"}</b><span>Time to recover</span><b class="${okT?"status-good":"status-bad"}">${rt} h ${okT?"✓":"✗ (needs ≤ 8 h)"}</b><span>Relative cost</span><b>${"$".repeat(SITE[site][2])}</b>`;
    $(".caption",el).innerHTML=okP&&okT?'<span class="status-good">Both objectives met.</span> Backup frequency controls RPO, and the recovery site controls RTO.':!okP?"Backups aren't frequent enough. The RPO is how far back in time you'd lose data.":"The site takes too long to bring online. The RTO is how long you can be down.";
    if(okP&&okT)award("viz:rpo",30,"Met the RPO and RTO")}
  $("input",el).addEventListener("input",e=>{freq=+e.target.value;draw()});
  el.addEventListener("click",e=>{const b=e.target.closest("[data-s]");if(b){site=b.dataset.s;draw()}});draw();
})();

const LESSONS=[
{id:"baseline",num:"4.1",title:"Secure baselines and hardening targets",html:`
<p>A <b>secure baseline</b> is the approved, hardened configuration for a type of system. You <b>establish</b> it (often from CIS Benchmarks or vendor guides), <b>deploy</b> it with tools like Group Policy or configuration management, and <b>maintain</b> it as threats and software change.</p>
<p>Every <b>hardening target</b> needs its own baseline: <b>mobile devices</b>, <b>workstations</b>, <b>switches</b>, <b>routers</b>, <b>cloud infrastructure</b>, <b>servers</b>, <b>ICS/SCADA</b>, <b>embedded systems</b>, <b>RTOS</b> and <b>IoT devices</b>.</p>
<div class="viz" id="viz-baselines"></div>`},
{id:"wireless",num:"4.2",title:"Wireless, mobile and application security",html:`
<h3>Wireless installation</h3>
<p>A <b>site survey</b> maps coverage and interference before APs go in. A <b>heat map</b> shows signal strength across the floor plan, so you avoid dead spots and signal leaking into the parking lot.</p>
<h3>Mobile deployment models</h3>
<ul><li><b>BYOD</b> (bring your own device): employee-owned. Cheap for the company, hardest to control.</li>
<li><b>COPE</b> (corporate-owned, personally enabled): company-owned, personal use allowed. Full control.</li>
<li><b>CYOD</b> (choose your own device): the employee picks from an approved list, and the company owns it.</li></ul>
<p><b>Mobile device management (MDM)</b> enforces passcodes, encryption, app rules and remote wipe. Connection methods include <b>cellular</b>, <b>Wi-Fi</b> and <b>Bluetooth</b>, each with its own risks.</p>
<div class="viz" id="viz-deploy"></div>
<h3>Wireless security settings</h3>
<ul><li><b>WPA3</b>: replaces WPA2. Uses <b>SAE</b> (Simultaneous Authentication of Equals) instead of a pre-shared key handshake, which resists offline password cracking.</li>
<li><b>WPA3-Enterprise</b> uses <b>802.1X</b> with a <b>RADIUS</b> server for per-user authentication (AAA).</li>
<li>Avoid WEP and WPA/TKIP entirely.</li></ul>
<h3>Application security</h3>
<ul><li><b>Input validation</b>: accept only what's expected, on the server.</li>
<li><b>Secure cookies</b>: the <b>Secure</b> flag (HTTPS only) and <b>HttpOnly</b> (no JavaScript access).</li>
<li><b>Static code analysis</b> (SAST): scans source code without running it. <b>Dynamic analysis</b> (DAST) tests the running app.</li>
<li><b>Code signing</b>: proves who published the code and that it wasn't altered.</li>
<li><b>Sandboxing</b>: runs untrusted code in an isolated environment.</li></ul>`},
{id:"assets",num:"4.3",title:"Asset management",html:`
<p>You can't protect what you don't know you have. Asset management tracks every device, license and data store through its life.</p>
<ul><li><b>Acquisition and procurement</b>: buy from approved vendors with security requirements in the contract.</li>
<li><b>Assignment and accounting</b>: every asset has an <b>owner</b> and a <b>classification</b>.</li>
<li><b>Monitoring and asset tracking</b>: keep an <b>inventory</b> and use <b>enumeration</b> (network discovery) to find devices nobody registered.</li>
<li><b>Disposal and decommissioning</b>: <b>sanitization</b> (secure wipe so data can't be recovered), <b>destruction</b> (shredding, degaussing, incineration), <b>certification</b> (a certificate of destruction from the vendor) and <b>data retention</b> (keep what the law requires, delete the rest).</li></ul>
<div class="viz" id="viz-assetlc"></div>`},
{id:"vuln",num:"4.4",title:"Vulnerability management",html:`
<h3>Identification</h3>
<ul><li><b>Vulnerability scans</b>: credentialed (logs in, sees more) or non-credentialed (outside view).</li>
<li><b>Application security</b>: static analysis, dynamic analysis and <b>package monitoring</b> (tracking vulnerable libraries in your software).</li>
<li><b>Threat feeds</b>: <b>OSINT</b> (open-source intelligence), <b>proprietary</b> third-party feeds, <b>ISACs</b> (information sharing and analysis centers for each industry) and the <b>dark web</b>.</li>
<li><b>Penetration testing</b>, <b>responsible disclosure programs</b>, <b>bug bounty programs</b> and <b>system and process audits</b>.</li></ul>
<h3>Analysis</h3>
<ul><li><b>Confirmation</b>: a <b>false positive</b> reports a problem that isn't there. A <b>false negative</b> misses one that is. False negatives are more dangerous.</li>
<li><b>CVE</b>: a unique ID for a public vulnerability. <b>CVSS</b>: a 0 to 10 severity score.</li>
<li><b>Prioritize</b> using CVSS plus <b>exposure factor</b>, <b>environmental variables</b> (is it internet-facing?), <b>industry and organizational impact</b> and <b>risk tolerance</b>.</li></ul>
<div class="viz" id="viz-cvss"></div>
<h3>Response, validation and reporting</h3>
<p><b>Remediate</b> by <b>patching</b>. If you can't, use <b>segmentation</b>, <b>compensating controls</b>, <b>insurance</b>, or a documented <b>exception or exemption</b>. Then <b>validate</b>: <b>rescan</b>, <b>audit</b> and <b>verify</b> the fix. Finally, <b>report</b> to stakeholders.</p>
<div class="viz" id="viz-fpfn"></div>`},
{id:"monitor",num:"4.5",title:"Security monitoring and alerting",html:`
<p>Monitor <b>systems</b>, <b>applications</b> and <b>infrastructure</b>. The activities: <b>log aggregation</b>, <b>alerting</b>, <b>scanning</b>, <b>reporting</b> and <b>archiving</b>. When an alert fires, respond: <b>quarantine</b> the threat, and use <b>alert tuning</b> to cut false positives so real alerts aren't buried.</p>
<h3>Tools</h3>
<ul><li><b>SIEM</b> (security information and event management): collects and correlates logs from everything, then alerts.</li>
<li><b>SCAP</b> (Security Content Automation Protocol): standard formats for checking configurations against <b>benchmarks</b> such as CIS.</li>
<li><b>Agents vs agentless</b>: software on each host, or remote collection.</li>
<li><b>Antivirus</b>, <b>DLP</b> (data loss prevention), <b>vulnerability scanners</b>.</li>
<li><b>SNMP traps</b>: devices push alerts to a management server.</li>
<li><b>NetFlow</b>: records who talked to whom, when and how much. Great for spotting exfiltration.</li></ul>
<div class="viz" id="viz-siem"></div>`},
{id:"enterprise",num:"4.6",title:"Firewalls, filtering and email security",html:`
<h3>Firewalls and IDS/IPS</h3>
<p>Firewall <b>rules</b> and <b>access lists</b> are checked top-down, first match wins, with an implicit deny at the end. Only open the <b>ports and protocols</b> you need, and put public servers in a <b>screened subnet</b>. IDS/IPS use <b>signatures</b> (known patterns) and <b>trends</b> (anomalies over time).</p>
<div class="viz" id="viz-fwrules"></div>
<h3>Web and DNS filtering</h3>
<p><b>Web filters</b> can be <b>agent-based</b> (follows the laptop anywhere) or a <b>centralized proxy</b>. They use <b>URL scanning</b>, <b>content categorization</b>, <b>block rules</b> and <b>reputation</b>. <b>DNS filtering</b> refuses to resolve known-bad domains.</p>
<h3>Email security</h3>
<ul><li><b>SPF</b>: a DNS record listing which servers may send mail for your domain.</li>
<li><b>DKIM</b>: the sending server signs each message. Receivers check the signature with a public key in DNS.</li>
<li><b>DMARC</b>: tells receivers what to do when SPF or DKIM fail, and that the visible From domain must align: <span class="mono">p=none</span>, <span class="mono">p=quarantine</span> or <span class="mono">p=reject</span>. It also sends reports.</li>
<li>An <b>email gateway</b> filters spam, malware and phishing before it reaches mailboxes.</li></ul>
<div class="viz" id="viz-mail"></div>
<h3>More capabilities</h3>
<ul><li><b>OS security</b>: <b>Group Policy</b> (Windows) and <b>SELinux</b> (mandatory access control on Linux).</li>
<li><b>Secure protocols</b>: choose the protocol, the port and the transport method (for example SFTP on 22, not FTP on 21).</li>
<li><b>File integrity monitoring (FIM)</b>: alerts when critical files change.</li>
<li><b>DLP</b>: blocks sensitive data from leaving.</li>
<li><b>NAC</b>: checks devices before letting them on the network.</li>
<li><b>EDR</b> (endpoint detection and response) and <b>XDR</b> (extended, across endpoints, network, cloud and email).</li>
<li><b>User behavior analytics (UBA)</b>: flags users acting unlike themselves.</li></ul>`},
{id:"iam",num:"4.7",title:"Identity and access management",html:`
<h3>Account life cycle</h3>
<p><b>Provisioning and deprovisioning</b> accounts, <b>permission assignments</b>, and <b>identity proofing</b> (verifying someone is who they claim before creating their account). <b>Attestation</b> is a periodic review where managers confirm their staff's access is still needed.</p>
<h3>Federation and SSO</h3>
<ul><li><b>Federation</b>: trust between organizations, so one identity provider vouches for users at another's apps.</li>
<li><b>SSO</b>: sign in once, reach many apps. Built on <b>SAML</b> (XML assertions for web SSO), <b>OAuth</b> (delegated authorization, letting an app act for you without your password; OpenID Connect adds authentication on top) and <b>LDAP</b> (directory lookups).</li>
<li><b>Interoperability</b>: standards let different vendors' systems work together.</li></ul>
<div class="viz" id="viz-saml"></div>
<h3>Access control models</h3>
<ul><li><b>Mandatory (MAC)</b>: labels and clearances set by the system. Users can't change them. Military style.</li>
<li><b>Discretionary (DAC)</b>: the owner decides who gets access.</li>
<li><b>Role-based (RBAC)</b>: permissions attach to job roles.</li>
<li><b>Rule-based</b>: system-wide rules, such as a firewall ACL.</li>
<li><b>Attribute-based (ABAC)</b>: decisions from many attributes (department, location, device, time).</li>
<li><b>Time-of-day restrictions</b> and <b>least privilege</b>.</li></ul>
<div class="viz" id="viz-acmodels"></div>
<h3>MFA and passwords</h3>
<p>MFA factors: <b>something you know</b>, <b>have</b>, <b>are</b> and <b>somewhere you are</b>. Implementations: <b>biometrics</b>, <b>hard tokens</b>, <b>soft tokens</b> (authenticator apps) and <b>security keys</b> (FIDO2). Password best practices: favor <b>length</b>, check against breached lists, avoid <b>reuse</b>, and use <b>password managers</b>. <b>Passwordless</b> sign-in with passkeys removes the password entirely.</p>
<h3>Privileged access management (PAM)</h3>
<p><b>Just-in-time permissions</b> grant admin rights only when needed and remove them after. <b>Password vaulting</b> stores and rotates privileged passwords. <b>Ephemeral credentials</b> exist only for one session.</p>`},
{id:"auto",num:"4.8",title:"Automation and orchestration",html:`
<p>Scripts and orchestration platforms (often called SOAR) take repetitive work off people.</p>
<ul><li><b>Use cases</b>: user and resource provisioning, <b>guardrails</b> (blocking non-compliant deployments), <b>security groups</b>, <b>ticket creation</b>, <b>escalation</b>, <b>enabling and disabling services and access</b>, <b>continuous integration and testing</b>, and <b>integrations and APIs</b>.</li>
<li><b>Benefits</b>: efficiency and time saved, enforced baselines, standard infrastructure configurations, scaling securely, employee retention (less tedious work), faster reaction time and a <b>workforce multiplier</b>.</li>
<li><b>Other considerations</b>: complexity, cost, a <b>single point of failure</b>, <b>technical debt</b> and ongoing supportability.</li></ul>
<div class="viz" id="viz-auto"></div>`},
{id:"ir",num:"4.9",title:"Incident response and digital forensics",html:`
<h3>The process</h3>
<ol><li><b>Preparation</b>: plans, tools, training, contact lists.</li><li><b>Detection</b>: alerts and reports reveal something wrong.</li><li><b>Analysis</b>: confirm it's real, find the scope.</li><li><b>Containment</b>: stop the spread (isolate hosts, block accounts).</li><li><b>Eradication</b>: remove the cause (malware, attacker accounts).</li><li><b>Recovery</b>: restore systems and watch for return.</li><li><b>Lessons learned</b>: what to improve next time.</li></ol>
<div class="viz" id="viz-ir"></div>
<h3>Supporting activities</h3>
<p><b>Training</b>, <b>testing</b> (tabletop exercises and simulations), <b>root cause analysis</b> and <b>threat hunting</b> (proactively searching for attackers who slipped past alerts).</p>
<h3>Digital forensics</h3>
<ul><li><b>Legal hold</b>: preserve all relevant data when litigation is expected. Normal deletion stops.</li>
<li><b>Chain of custody</b>: a record of who handled evidence, when and why. Without it, evidence may be thrown out.</li>
<li><b>Acquisition</b>: collect the most volatile data first (CPU cache and RAM before disk). Make forensic images and hash them.</li>
<li><b>Preservation</b>: keep originals untouched; work on verified copies.</li>
<li><b>E-discovery</b>: finding and producing electronic data for legal cases.</li>
<li><b>Reporting</b>: document findings clearly for management or court.</li></ul>`},
{id:"sources",num:"4.10",title:"Investigation data sources",html:`
<h3>Log data</h3>
<p><b>Firewall logs</b>, <b>application logs</b>, <b>endpoint logs</b>, <b>OS-specific security logs</b> (like Windows Security event IDs), <b>IPS/IDS logs</b>, <b>network logs</b> and <b>metadata</b> (email headers, file properties, timestamps).</p>
<h3>Other data sources</h3>
<p><b>Vulnerability scans</b>, <b>automated reports</b>, <b>dashboards</b> and <b>packet captures</b> (full content of network traffic).</p>
<div class="viz" id="viz-cli"></div>`}

/* ---- CVSS calculator ---- */
(function(){
  const el=$("#viz-cvss");
  const M={AV:["Attack vector",[["N","Network",.85],["A","Adjacent",.62],["L","Local",.55],["P","Physical",.2]]],AC:["Attack complexity",[["L","Low",.77],["H","High",.44]]],PR:["Privileges required",[["N","None",.85],["L","Low",.62],["H","High",.27]]],UI:["User interaction",[["N","None",.85],["R","Required",.62]]],S:["Scope",[["U","Unchanged",0],["C","Changed",1]]],C:["Confidentiality",[["H","High",.56],["L","Low",.22],["N","None",0]]],I:["Integrity",[["H","High",.56],["L","Low",.22],["N","None",0]]],A:["Availability",[["H","High",.56],["L","Low",.22],["N","None",0]]]};
  const v={AV:"L",AC:"H",PR:"H",UI:"R",S:"U",C:"L",I:"N",A:"N"};const sevSeen=new Set();
  const ru=x=>{const i=Math.round(x*1e5);return i%1e4===0?i/1e5:(Math.floor(i/1e4)+1)/10};
  function score(){const g=(k)=>M[k][1].find(o=>o[0]===v[k])[2];const ch=v.S==="C";let pr=g("PR");if(ch&&v.PR==="L")pr=.68;if(ch&&v.PR==="H")pr=.5;
    const iss=1-(1-g("C"))*(1-g("I"))*(1-g("A")),imp=ch?7.52*(iss-.029)-3.25*Math.pow(iss-.02,15):6.42*iss,ex=8.22*g("AV")*g("AC")*pr*g("UI");
    if(imp<=0)return 0;return ch?ru(Math.min(1.08*(imp+ex),10)):ru(Math.min(imp+ex,10))}
  const sev=s=>s===0?["None","good"]:s<4?["Low","good"]:s<7?["Medium","warn"]:s<9?["High","bad"]:["Critical","bad"];
  el.innerHTML=`<div class="viz-title">CVSS 3.1 base score calculator</div><div id="cv-rows"></div><div style="display:flex;gap:16px;align-items:baseline;margin-top:8px"><div class="big-num" id="cv-s"></div><b id="cv-l"></b></div><div class="meter"><i id="cv-m"></i></div><div class="s-small mono" id="cv-v"></div><div class="caption" aria-live="polite">Set the metrics for a vulnerability. Try to build a Low, a Medium, a High and a Critical.</div>`;
  function draw(){const s=score(),[l,c]=sev(s);
    $("#cv-rows",el).innerHTML=Object.entries(M).map(([k,[n,opts]])=>`<div class="rng-row" style="grid-template-columns:150px 1fr"><span>${n}</span><span class="seg-row" style="margin:0">${opts.map(o=>`<button class="chip" data-k="${k}" data-v="${o[0]}" aria-pressed="${v[k]===o[0]}">${o[1]}</button>`).join("")}</span></div>`).join("");
    $("#cv-s",el).textContent=s.toFixed(1);$("#cv-s",el).className="big-num "+c;$("#cv-l",el).textContent=l;$("#cv-m",el).style.width=s*10+"%";
    $("#cv-v",el).textContent="CVSS:3.1/"+Object.entries(v).map(([k,x])=>k+":"+x).join("/");
    if(l!=="None")sevSeen.add(l);if(sevSeen.size>=4){award("viz:cvss",30,"Built every CVSS severity");$(".caption",el).innerHTML='<span class="status-good">All four severities built.</span> Network vector, no privileges, no user interaction and high impact push a score to critical. Remember the base score ignores your environment, so prioritize with context too.'}}
  el.addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b)return;v[b.dataset.k]=b.dataset.v;draw()});draw();
})();

/* ---- SIEM triage ---- */
(function(){
  const el=$("#viz-siem");
  const A=[["crit","03:12","EDR: ransomware behavior on FIN-PC07, mass file renames","esc","Real and spreading. Escalate and isolate the host now."],["low","03:14","Antivirus: EICAR test file detected on QA-LAB2","close","The EICAR file is a harmless test string the QA team uses. Close it as benign."],["high","03:20","Impossible travel: cfo@ from Ohio then Lagos within 9 minutes","esc","A strong sign of stolen credentials on a high-value account. Escalate, reset and revoke sessions."],["med","03:25","Port scan from 10.0.9.15 (the vulnerability scanner) against the server VLAN","tune","An approved scanner on its normal schedule. Tune the rule to exclude it so it stops creating noise."],["high","03:31","DLP: 4,200 card numbers in an outbound email to a personal Gmail","esc","Possible data exfiltration. Escalate and block the message."],["med","03:40","One IP tried the same password once against 200 different accounts","esc","Password spraying. Escalate, block the source and check whether any login succeeded."]];
  const ACT={esc:"Escalate",close:"Close as benign",tune:"Tune the rule"};const done={};let sel=null;
  el.innerHTML=`<div class="viz-title">SIEM console: triage the night shift queue</div><div class="siem" id="si-l"></div><div class="seg-row" id="si-a"></div><div class="caption" aria-live="polite">Pick an alert, then choose an action.</div><div class="rv-prog s-small"></div>`;
  function draw(msg){$("#si-l",el).innerHTML=A.map((a,i)=>`<button class="siem-r ${sel===i?"sel":""} ${done[i]?"done":""}" data-i="${i}"><span class="sev ${a[0]}">${a[0].toUpperCase()}</span><span>${a[1]}</span><span>${done[i]?"✓ ":""}${a[2]}</span></button>`).join("");
    $("#si-a",el).innerHTML=sel===null?"":Object.entries(ACT).map(([k,l])=>`<button class="btn" data-act="${k}">${l}</button>`).join("");
    if(msg)$(".caption",el).innerHTML=msg;$(".rv-prog",el).textContent=`${Object.keys(done).length} of ${A.length} alerts handled`;
    if(Object.keys(done).length===A.length){award("viz:siem",30,"Cleared the SIEM queue");$(".caption",el).innerHTML+='<br><br><span class="status-good">Queue cleared.</span> Tuning out known noise is how analysts keep real alerts visible.'}}
  el.addEventListener("click",e=>{const r=e.target.closest("[data-i]"),a=e.target.closest("[data-act]");
    if(r){sel=+r.dataset.i;draw(done[sel]?A[sel][4]:"Choose an action for this alert.");return}
    if(a&&sel!==null){const x=A[sel];if(a.dataset.act===x[3]){done[sel]=1;const m=`<span class="status-good">${ACT[x[3]]}: correct.</span> ${x[4]}`;sel=null;draw(m)}else draw(`<span class="status-bad">Not the best call.</span> Look at the source and what's normal for it.`)}});
  draw();
})();

/* ---- firewall rule order ---- */
(function(){
  const el=$("#viz-fwrules");
  let R=[["deny","any","any","any","Block everything (cleanup)"],["permit","any","172.16.1.10","443","Web server HTTPS"],["deny","203.0.113.66","any","any","Known attacker IP"],["permit","10.0.0.0/8","172.16.1.20","22","Admins SSH to jump box"]];
  const P=[["203.0.113.66","172.16.1.10","443","deny","Attacker → web"],["198.51.100.7","172.16.1.10","443","permit","Customer → web"],["10.1.4.9","172.16.1.20","22","permit","Admin → jump box"],["198.51.100.7","172.16.1.20","22","deny","Internet → SSH"]];
  const m=(ip,r)=>{if(r==="any")return true;if(!r.includes("/"))return ip===r;return ip.split(".")[0]===r.split(".")[0]};
  const ev=p=>{for(let i=0;i<R.length;i++){const r=R[i];if(m(p[0],r[1])&&m(p[1],r[2])&&(r[3]==="any"||r[3]===p[2]))return [r[0],i]}return ["deny",-1]};
  el.innerHTML=`<div class="viz-title">Fix the rule order (first match wins)</div><div class="hd-list" id="fr-r"></div><div class="atk"><div class="atk-t"><div class="s-small">TEST PACKETS</div><div id="fr-t"></div></div></div><div class="caption" aria-live="polite"></div>`;
  function draw(){
    $("#fr-r",el).innerHTML=R.map((r,i)=>`<div class="hd-i" style="align-items:center;cursor:default"><b class="mono" style="min-width:28px">${(i+1)*10}</b><span style="flex:1"><b class="${r[0]==="permit"?"status-good":"status-bad"}">${r[0]}</b> <span class="mono">${r[1]} → ${r[2]} : ${r[3]}</span><br><span class="s-small">${r[4]}</span></span><button class="btn" data-u="${i}" ${i===0?"disabled":""} aria-label="Move up">↑</button><button class="btn" data-d="${i}" ${i===R.length-1?"disabled":""} aria-label="Move down">↓</button></div>`).join("");
    const res=P.map(p=>{const [a,i]=ev(p);return {p,a,i,ok:a===p[3]}});
    $("#fr-t",el).innerHTML=res.map(r=>`<div class="atk-r ${r.ok?"":"bad"}"><span>${r.p[4]} <span class="mono">${r.p[0]} → ${r.p[1]}:${r.p[2]}</span></span><b>${r.a} (rule ${r.i<0?"implicit":(r.i+1)*10}) ${r.ok?"✓":"✗"}</b></div>`).join("");
    const all=res.every(r=>r.ok);
    $(".caption",el).innerHTML=all?'<span class="status-good">All four packets handled correctly.</span> Specific rules first, the attacker block above the web permit, and the broad deny last. You could even delete it: the implicit deny does the same job.':"The firewall stops at the first matching rule. Move rules until every test packet gets the right result.";
    if(all)award("viz:fwrules",30,"Fixed a firewall rule order")}
  el.addEventListener("click",e=>{const u=e.target.closest("[data-u]"),d=e.target.closest("[data-d]");if(u){const i=+u.dataset.u;[R[i-1],R[i]]=[R[i],R[i-1]];draw()}if(d){const i=+d.dataset.d;[R[i+1],R[i]]=[R[i],R[i+1]];draw()}});draw();
})();

/* ---- SPF / DKIM / DMARC ---- */
(function(){
  const el=$("#viz-mail");
  const SC={legit:["Real invoice from billing@acme.com",{spf:1,dkim:1,align:1},"Sent from Acme's own mail server, signed with Acme's DKIM key."],
    spoof:["Spoofed \"From: ceo@acme.com\" sent from a random VPS",{spf:0,dkim:0,align:0},"The sending IP isn't in Acme's SPF record and there's no valid Acme signature."],
    alter:["Real message altered in transit",{spf:1,dkim:0,align:1},"The server was authorized, but the body changed after signing, so DKIM fails. DMARC passes if either SPF or DKIM passes and aligns."]};
  let sc="legit",pol="none";const seen=new Set();
  el.innerHTML=`<div class="viz-title">Email authentication at the receiving server</div><div class="chips">${Object.entries(SC).map(([k,v])=>`<button class="chip" data-s="${k}">${v[0]}</button>`).join("")}</div>
  <div class="s-small" style="margin-top:10px">ACME'S DMARC POLICY</div><div class="chips"><button class="chip mono" data-p="none">p=none</button><button class="chip mono" data-p="quarantine">p=quarantine</button><button class="chip mono" data-p="reject">p=reject</button></div>
  <div class="mailflow" id="mf"></div><div class="caption" aria-live="polite"></div>`;
  function draw(){const s=SC[sc][1],dm=(s.spf||s.dkim)&&s.align;el.querySelectorAll("[data-s]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===sc));el.querySelectorAll("[data-p]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.p===pol));
    const out=dm?"Delivered to inbox":pol==="none"?"Delivered (DMARC only reports)":pol==="quarantine"?"Sent to spam / quarantine":"Rejected at the gateway";
    $("#mf",el).innerHTML=`<div class="mf-r ${s.spf?"ok":"no"}"><span>SPF: is the sending IP authorized?</span><b>${s.spf?"pass":"fail"}</b></div><div class="mf-r ${s.dkim?"ok":"no"}"><span>DKIM: is the signature valid?</span><b>${s.dkim?"pass":"fail"}</b></div><div class="mf-r ${dm?"ok":"no"}"><span>DMARC: aligned pass, else apply policy</span><b>${dm?"pass":"fail → "+pol}</b></div><div class="mf-r ${dm?"ok":pol==="none"?"no":"ok"}"><span>Result</span><b>${out}</b></div>`;
    $(".caption",el).innerHTML=SC[sc][2]+(sc==="spoof"&&pol==="none"?' <span class="status-bad">With p=none, the spoofed CEO email still lands in the inbox.</span>':sc==="spoof"&&pol==="reject"?' <span class="status-good">p=reject blocks the spoof outright.</span>':"");
    seen.add(sc+pol);if(seen.has("spoofreject")&&seen.has("spoofnone")&&seen.has("alter"+pol))award("viz:mail",30,"Configured SPF, DKIM and DMARC")}
  el.addEventListener("click",e=>{const s=e.target.closest("[data-s]"),p=e.target.closest("[data-p]");if(s)sc=s.dataset.s;if(p)pol=p.dataset.p;if(s||p)draw()});draw();
})();

seqViz($("#viz-saml"),{title:"SAML single sign-on",left:"User's browser",right:"Identity provider",intro:"A user opens the company's HR app (the service provider), which trusts the corporate identity provider.",
  steps:[{dir:"r",label:"Redirected with a SAML request",sub:"From the HR app",text:"The HR app doesn't handle passwords. It redirects the browser to the identity provider (IdP) with a SAML authentication request."},

/* ================= Module 5: Security Program Management and Oversight (SY0-701 Domain 5.0, 20%) ================= */
(function(){
const LESSONS=[
{id:"gov",num:"5.1",title:"Security governance",html:`
<h3>The document hierarchy</h3>
<ul><li><b>Policies</b>: high-level statements of intent approved by leadership. Examples: <b>acceptable use policy (AUP)</b>, information security policy, <b>business continuity</b>, <b>disaster recovery</b>, <b>incident response</b>, <b>software development life cycle (SDLC)</b> and <b>change management</b> policies.</li>
<li><b>Standards</b>: mandatory specifics that support a policy. Examples: password, access control, physical security and encryption standards ("AES-256 for data at rest").</li>
<li><b>Procedures</b>: step-by-step instructions. Examples: change management steps, <b>onboarding and offboarding</b>, and <b>playbooks</b> for incident types.</li>
<li><b>Guidelines</b>: recommendations, not mandatory.</li></ul>
<div class="viz" id="viz-docs"></div>
<h3>External considerations</h3>
<p>Governance must account for <b>regulatory</b>, <b>legal</b> and <b>industry</b> requirements at <b>local/regional</b>, <b>national</b> and <b>global</b> levels. Documents need regular <b>monitoring and revision</b>.</p>
<h3>Governance structures</h3>
<p><b>Boards</b>, <b>committees</b> and <b>government entities</b> provide oversight. Governance can be <b>centralized</b> (one group sets rules for all) or <b>decentralized</b> (business units decide).</p>
<h3>Data roles</h3>
<ul><li><b>Owner</b>: a senior person accountable for the data, who decides its classification.</li>
<li><b>Controller</b>: decides why and how personal data is processed.</li>
<li><b>Processor</b>: processes data on the controller's behalf, such as a payroll provider.</li>
<li><b>Custodian / steward</b>: handles day-to-day care: backups, access, quality.</li></ul>
<div class="viz" id="viz-roles"></div>`},
{id:"risk",num:"5.2",title:"Risk management",html:`
<h3>The process</h3>
<p><b>Identify</b> risks, <b>assess</b> them (<b>ad hoc</b>, <b>recurring</b>, <b>one-time</b> or <b>continuous</b>), <b>analyze</b> them, record them, respond and report.</p>
<h3>Analysis</h3>
<ul><li><b>Qualitative</b>: ratings like low/medium/high, often on a heat map of <b>likelihood</b> and <b>impact</b>.</li>
<li><b>Quantitative</b>: money and numbers.
<ul><li><b>SLE</b> (single loss expectancy) = asset value × <b>exposure factor</b> (the percent lost in one event).</li>
<li><b>ARO</b> (annualized rate of occurrence) = how many times a year it's expected.</li>
<li><b>ALE</b> (annualized loss expectancy) = SLE × ARO.</li></ul></li></ul>
<div class="viz" id="viz-ale"></div>
<h3>The risk register</h3>
<p>A <b>risk register</b> lists each risk with its <b>risk owner</b>, ratings, response and <b>key risk indicators (KRIs)</b>, which are metrics that warn a risk is growing. A <b>risk threshold</b> marks the level that triggers action.</p>
<h3>Tolerance and appetite</h3>
<p><b>Risk appetite</b> is how much risk the organization is willing to take on to pursue its goals: <b>expansionary</b> (willing to take more), <b>neutral</b> or <b>conservative</b>. <b>Risk tolerance</b> is the acceptable variation around that.</p>
<h3>Responses</h3>
<ul><li><b>Mitigate</b>: add controls to reduce likelihood or impact.</li>
<li><b>Transfer</b>: shift the financial impact to someone else, such as with cyber insurance.</li>
<li><b>Avoid</b>: stop the risky activity entirely.</li>
<li><b>Accept</b>: live with it, often through a documented <b>exemption</b> or <b>exception</b>.</li></ul>
<div class="viz" id="viz-heat"></div>
<h3>Business impact analysis (BIA)</h3>
<p>A <b>BIA</b> finds the critical processes and what an outage costs. Its key numbers: <b>RTO</b> (maximum downtime), <b>RPO</b> (maximum data loss), <b>MTTR</b> (mean time to repair, average time to fix) and <b>MTBF</b> (mean time between failures, average time a system runs before failing; higher is better).</p>`},
{id:"vendor",num:"5.3",title:"Third-party risk management",html:`
<h3>Assess and select vendors</h3>
<ul><li><b>Vendor assessment</b>: their <b>penetration test</b> results, a <b>right-to-audit clause</b> in the contract, <b>evidence of internal audits</b>, <b>independent assessments</b> (like SOC 2 reports) and <b>supply chain analysis</b>.</li>
<li><b>Vendor selection</b>: <b>due diligence</b> on security, finances and reputation, plus checks for <b>conflicts of interest</b>.</li>
<li><b>Questionnaires</b> collect security details. <b>Vendor monitoring</b> continues after signing.</li>
<li><b>Rules of engagement</b>: what a vendor (or pen tester) may and may not do.</li></ul>
<h3>Agreement types</h3>
<ul><li><b>SLA</b> (service-level agreement): measurable service commitments, like 99.9% uptime and 4-hour response.</li>
<li><b>MOA</b> (memorandum of agreement): a more formal, often binding, agreement on specific responsibilities.</li>
<li><b>MOU</b> (memorandum of understanding): a statement of shared intent, usually not legally binding.</li>
<li><b>MSA</b> (master service agreement): the umbrella terms for an ongoing relationship.</li>
<li><b>SOW / WO</b> (statement of work / work order): the specific project, deliverables and timeline under an MSA.</li>
<li><b>NDA</b> (non-disclosure agreement): keeps shared information confidential.</li>
<li><b>BPA</b> (business partners agreement): how partners share profits, duties and decisions.</li></ul>
<div class="viz" id="viz-agree"></div>`},
{id:"comply",num:"5.4",title:"Compliance and privacy",html:`
<h3>Compliance</h3>
<p><b>Compliance reporting</b> can be <b>internal</b> (to leadership) or <b>external</b> (to regulators). <b>Consequences of non-compliance</b>: <b>fines</b>, <b>sanctions</b>, <b>reputational damage</b>, <b>loss of license</b> and <b>contractual impacts</b>.</p>
<p><b>Compliance monitoring</b> includes <b>due diligence</b> (investigating and understanding risks) and <b>due care</b> (acting on that knowledge with reasonable controls), <b>attestation and acknowledgement</b> (people sign that they follow policy), internal and external checks, and <b>automation</b>.</p>
<h3>Privacy</h3>
<ul><li><b>Legal implications</b> at local/regional, national and global levels, such as GDPR in the EU.</li>
<li><b>Data subject</b>: the person the data is about.</li>
<li><b>Controller vs processor</b>: the controller decides purpose; the processor acts on instructions.</li>
<li><b>Ownership</b>, a <b>data inventory</b> (what personal data you hold and where) and <b>data retention</b> rules.</li>
<li><b>Right to be forgotten</b>: under GDPR, data subjects can ask for their data to be erased.</li></ul>
<div class="viz" id="viz-privacy"></div>`},
{id:"audit",num:"5.5",title:"Audits, assessments and penetration testing",html:`
<h3>Audits and assessments</h3>
<ul><li><b>Attestation</b>: a formal statement, often by an auditor, that controls are in place and working.</li>
<li><b>Internal</b>: compliance checks, an <b>audit committee</b>, and <b>self-assessments</b>.</li>
<li><b>External</b>: <b>regulatory</b> examinations, <b>assessments</b> and <b>independent third-party audits</b>.</li></ul>
<h3>Penetration testing</h3>
<ul><li>Types: <b>physical</b>, <b>offensive</b> (red team attacks), <b>defensive</b> (blue team defends), and <b>integrated</b> (purple team: both working together).</li>
<li><b>Known environment</b> (white box): testers get full details. <b>Partially known</b> (gray box): some details. <b>Unknown environment</b> (black box): no details, like a real outsider.</li>
<li><b>Reconnaissance</b>: <b>passive</b> (public sources, no contact with the target) or <b>active</b> (scanning and probing the target directly).</li></ul>
<div class="viz" id="viz-pentest"></div>
<div class="viz" id="viz-box"></div>`},
{id:"aware",num:"5.6",title:"Security awareness",html:`
<h3>Phishing</h3>
<p>Run <b>phishing campaigns</b> (simulated phishing), teach people to <b>recognize phishing attempts</b>, and have a fast way to <b>respond to reported suspicious messages</b>.</p>
<h3>Anomalous behavior recognition</h3>
<ul><li><b>Risky</b>: deliberately bypassing controls, like disabling antivirus.</li>
<li><b>Unexpected</b>: unusual for that person, like logging in at 3 a.m. from abroad.</li>
<li><b>Unintentional</b>: honest mistakes, like emailing the wrong person.</li></ul>
<div class="viz" id="viz-anom"></div>
<h3>User guidance and training</h3>
<p>Topics: <b>policy and handbooks</b>, <b>situational awareness</b>, <b>insider threat</b>, <b>password management</b>, <b>removable media and cables</b> (malicious USB cables exist), <b>social engineering</b>, <b>operational security</b> (not oversharing on social media) and <b>hybrid/remote work environments</b>.</p>
<h3>Reporting and monitoring</h3>
<p>Track <b>initial</b> and <b>recurring</b> results, such as click rates and report rates over time. Then <b>develop</b> and <b>execute</b> the program: set goals, build content, deliver it, measure it and improve.</p>
<div class="viz" id="viz-program"></div>`}
];

/* ---- ALE calculator ---- */
(function(){
  const el=$("#viz-ale");const seen=new Set();
  const V={av:200000,ef:50,aro:0.5,red:80,cost:30000};
  const R=[["av","Asset value",10000,1000000,10000,v=>"$"+fmt(v)],["ef","Exposure factor",5,100,5,v=>v+"%"],["aro","Times per year (ARO)",0.05,4,0.05,v=>v],["red","Control cuts ARO by",0,100,5,v=>v+"%"],["cost","Control cost per year",0,200000,5000,v=>"$"+fmt(v)]];
  el.innerHTML=`<div class="viz-title">ALE calculator: is the control worth it?</div><div class="s-small">SCENARIO: RANSOMWARE ON THE ORDER SYSTEM · CONTROL: EDR + IMMUTABLE BACKUPS</div>${R.map(r=>`<div class="rng-row"><span>${r[1]}</span><input type="range" data-k="${r[0]}" min="${r[2]}" max="${r[3]}" step="${r[4]}" value="${V[r[0]]}" aria-label="${r[1]}"><b data-o="${r[0]}"></b></div>`).join("")}<div class="kv" id="al-kv"></div><div class="caption" aria-live="polite"></div>`;
  function draw(){R.forEach(r=>$(`[data-o="${r[0]}"]`,el).textContent=r[5](V[r[0]]));
    const sle=V.av*V.ef/100,ale=sle*V.aro,aro2=V.aro*(1-V.red/100),ale2=sle*aro2,net=ale-ale2-V.cost;
    $("#al-kv",el).innerHTML=`<span>SLE = AV × EF</span><b class="mono">$${fmt(Math.round(sle))}</b><span>ALE = SLE × ARO</span><b class="mono">$${fmt(Math.round(ale))} / year</b><span>ALE with control</span><b class="mono">$${fmt(Math.round(ale2))} / year</b><span>Net benefit</span><b class="mono ${net>=0?"status-good":"status-bad"}">${net>=0?"+":"−"}$${fmt(Math.abs(Math.round(net)))} / year</b>`;
    $(".caption",el).innerHTML=net>=0?`<span class="status-good">Worth it.</span> The control saves $${fmt(Math.round(ale-ale2))} a year in expected losses and costs $${fmt(V.cost)}.`:`<span class="status-bad">Not worth it on cost alone.</span> The control costs more than the losses it prevents. Consider a cheaper control, transferring the risk, or accepting it.`;
    seen.add(net>=0?"y":"n");if(seen.size===2)award("viz:ale",30,"Ran a cost-benefit analysis")}
  el.addEventListener("input",e=>{const k=e.target.dataset.k;if(!k)return;V[k]=+e.target.value;draw()});draw();
})();

/* ---- risk heat map + response ---- */
(function(){
  const el=$("#viz-heat");
  const RK=[["Data center in a flood zone",2,5,"transfer","Rare but catastrophic. Insurance shifts the financial hit; also consider moving."],["Phishing leads to account takeover",5,4,"mitigate","Frequent and serious. Add MFA, filtering and training."],["Selling into a country with sanctions risk",3,5,"avoid","Stop the activity and the risk disappears."],["Office printer jams cause short delays",4,1,"accept","Low impact. Fixing it costs more than it's worth."],["Unpatched VPN appliance",4,5,"mitigate","Patch it now. High likelihood and impact."],["Laptop theft with encrypted disks",3,2,"accept","Encryption already limits the impact. Accept the remaining risk and document it."]];
  const RESP={mitigate:"Mitigate",transfer:"Transfer",avoid:"Avoid",accept:"Accept"};const done={};let sel=null;
  const cls=(l,i)=>{const s=l*i;return s>=15?3:s>=8?2:s>=4?1:0};
  el.innerHTML=`<div class="viz-title">Risk heat map: place, then respond</div><div class="chips" id="hm-r"></div><div class="heat" id="hm-g"></div><div class="s-small" style="text-align:center">IMPACT →</div><div class="seg-row" id="hm-a"></div><div class="caption" aria-live="polite">Pick a risk to see where it falls, then choose a response.</div><div class="rv-prog s-small"></div>`;
  function draw(msg){$("#hm-r",el).innerHTML=RK.map((r,i)=>`<button class="chip" data-r="${i}" aria-pressed="${sel===i}">${done[i]?"✓ ":""}${r[0]}</button>`).join("");
    let g="";for(let l=5;l>=1;l--){g+=`<div class="ax">${l}</div>`;for(let i=1;i<=5;i++){const here=RK.map((r,k)=>r[1]===l&&r[2]===i?k:-1).filter(k=>k>=0);g+=`<button class="hc${cls(l,i)} ${sel!==null&&here.includes(sel)?"sel":""}" tabindex="-1">${here.map(k=>done[k]||k===sel?"●":"").join("")}</button>`}}
    g+=`<div></div>`+[1,2,3,4,5].map(i=>`<div class="ax">${i}</div>`).join("");$("#hm-g",el).innerHTML=g;
    $("#hm-a",el).innerHTML=sel===null?"":Object.entries(RESP).map(([k,v])=>`<button class="btn" data-x="${k}">${v}</button>`).join("");
    if(msg)$(".caption",el).innerHTML=msg;$(".rv-prog",el).textContent=`↑ likelihood · ${Object.keys(done).length} of ${RK.length} risks handled`;
    if(Object.keys(done).length===RK.length){award("viz:heat",30,"Chose a response for every risk")}}
  el.addEventListener("click",e=>{const r=e.target.closest("[data-r]"),x=e.target.closest("[data-x]");
    if(r){sel=+r.dataset.r;const k=RK[sel];draw(`<b>${k[0]}</b>: likelihood ${k[1]}, impact ${k[2]}. Which response?`)}
    if(x&&sel!==null){const k=RK[sel];if(x.dataset.x===k[3]){done[sel]=1;const m=`<span class="status-good">${RESP[k[3]]}.</span> ${k[4]}`;sel=null;draw(m)}else draw(`<span class="status-bad">Not the best fit.</span> Think about cost, likelihood and whether the activity is worth keeping.`)}});
  draw();
})();
