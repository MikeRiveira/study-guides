cmd("account set",{d:"Set the active subscription.",r:"subscription",al:"s:subscription",run:(w,a)=>{const v=a.get("subscription");const s=w.subs.find(x=>lc(x.name)===lc(v)||x.id===v);if(!s)U(`The subscription of '${v}' doesn't exist in cloud 'AzureCloud'.`);w.sub=s.id;return null}});
cmd("account management-group create",{d:"Create a management group.",r:"name",o:"display-name parent",run:(w,a)=>{const n=a.get("name");if(w.mgs[n])E("Conflict",`Management group '${n}' already exists.`);
  const par=a.get("parent");if(par&&!w.mgs[par])E("NotFound",`Parent management group '${par}' not found.`);
  let depth=1,p=par;while(p){depth++;p=w.mgs[p].parent}if(depth>6)E("BadRequest","Management group trees support up to six levels of depth, not counting the root level or the subscription level.");
  w.mgs[n]={name:n,display:a.get("display-name")||n,parent:par||null,subs:[]};return {displayName:w.mgs[n].display,id:"/providers/Microsoft.Management/managementGroups/"+n,name:n,properties:{parent:{id:"/providers/Microsoft.Management/managementGroups/"+(par||"72f988bf-86f1-41af-91ab-2d7cd011db47")}},type:"Microsoft.Management/managementGroups"}}});
cmd("account management-group list",{d:"List management groups.",run:w=>{const rows=Object.values(w.mgs).map(m=>({displayName:m.display,name:m.name,parent:m.parent||"Tenant Root Group",subscriptions:m.subs.length}));return {__json:rows,__table:rows.map(r=>({DisplayName:r.displayName,Name:r.name,Parent:r.parent,Subscriptions:r.subscriptions}))}}});
cmd("account management-group subscription add",{d:"Move a subscription into a management group.",r:"name subscription",run:(w,a)=>{const m=w.mgs[a.get("name")];if(!m)E("NotFound",`Management group '${a.get("name")}' not found.`);const v=a.get("subscription");const s=w.subs.find(x=>lc(x.name)===lc(v)||x.id===v);if(!s)U(`Subscription '${v}' not found.`);
  Object.values(w.mgs).forEach(x=>x.subs=x.subs.filter(i=>i!==s.id));m.subs.push(s.id);return null}});

/* ---------- resource groups ---------- */
cmd("group create",{d:"Create a new resource group.",r:"name location",o:"tags managed-by",al:"g:name",ex:"az group create --name rg-web --location eastus --tags env=prod",run:(w,a)=>{
  const n=a.get("name");if(!/^[-\w._()]{1,90}$/.test(n)||/\.$/.test(n))E("InvalidResourceGroup",`Resource group name '${n}' is invalid. It can include letters, digits, underscores, parentheses, hyphens and periods (not at the end), up to 90 characters.`);
  const loc=locOk(a.get("location"));const tags=AZ.tagsFrom(a.all("tags"));const old=AZ.getRg(w,n);
  if(old){if(old.loc!==loc)E("InvalidResourceGroupLocation",`Invalid resource group location '${loc}'. The Resource group already exists in location '${old.loc}'.`);old.tags=tags;return rgJson(w,old)}
  AZ.policyCheck(w,{isRg:true,name:n,loc,tags});
  const g=w.rgs[n]={name:n,loc,tags};return rgJson(w,g)}});
cmd("group list",{d:"List resource groups.",o:"tag",run:w=>{const rows=Object.values(w.rgs).map(g=>rgJson(w,g));return {__json:rows,__table:rows.map(r=>({Name:r.name,Location:r.location,Status:"Succeeded"}))}}});
cmd("group show",{d:"Get a resource group.",r:"name",al:"g:name",run:(w,a)=>rgJson(w,AZ.needRg(w,a.get("name")))});
cmd("group exists",{d:"Check if a resource group exists.",r:"name",al:"g:name",run:(w,a)=>!!AZ.getRg(w,a.get("name"))});
cmd("group update",{d:"Update a resource group (tags).",r:"name",o:"tags set",al:"g:name",ex:"az group update --name rg-web --set tags.costcenter=1234",run:(w,a)=>{const g=AZ.needRg(w,a.get("name"));AZ.lockCheck(w,g.name,"write");
  if(a.has("tags"))g.tags=AZ.tagsFrom(a.all("tags"));a.all("set").forEach(s=>{const m=/^tags\.([^=]+)=(.*)$/.exec(s);if(!m)U(`Couldn't find '${s.split("=")[0]}' in ''. Only tags can be set in this simulator, for example --set tags.env=prod`);g.tags=Object.assign(g.tags||{},{[m[1]]:m[2].replace(/^["']|["']$/g,"")})});return rgJson(w,g)}});
cmd("group delete",{d:"Delete a resource group and everything in it.",r:"name",al:"g:name",run:(w,a)=>{const g=AZ.needRg(w,a.get("name"));if(!a.has("yes"))U("Are you sure you want to perform this operation? (y/n): cancelled. Add --yes to confirm in a script.");
  AZ.lockCheck(w,g.name,"delete");w.res.filter(r=>lc(r.rg)===lc(g.name)).forEach(r=>AZ.lockCheck(w,g.name,"delete",r));

  const p={};const raw={};const order=[];for(let i=1;i<toks.length;i++){const t=toks[i];if(/^-[A-Za-z]\w*(:.*)?$/.test(t)){let k=t.slice(1),v;if(k.includes(":")){[k,v]=k.split(":");}k=lc(k);order.push(k);
      if(v===undefined&&i+1<toks.length&&!/^-[A-Za-z]/.test(toks[i+1]))v=toks[++i];p[k]=v===undefined?true:v;raw[k]=t.slice(1).split(":")[0]}else return {out:`<span class="t-bad">${esc(titled(name))}: A positional parameter cannot be found that accepts argument '${esc(t)}'.</span>`,err:true}}
  Object.keys(p).forEach(k=>{const v=p[k];if(typeof v==="string"&&/^__ht\d+$/.test(v))p[k]=ht[+v.slice(4)];else if(v==="$true")p[k]=true;else if(v==="$false")p[k]="false";else if(typeof v==="string"&&v.startsWith("$")){const x=w.vars[lc(v.slice(1))];if(x!=null)p[k]=typeof x==="object"&&!Array.isArray(x)?(x.Id||x.ResourceId||x):x}});
  try{
    if(CUSTOM[name]){const r=CUSTOM[name](w,p);if(r&&r.__clear)return {clear:true,out:""};if(asg){w.vars[lc(asg)]=r;return {out:""}}return {out:r&&r.__text||AZ.psFormat(r)}}
    const d=C[name];if(!d){const close=Object.keys(C).find(k=>k.replace(/-az/,"")===name.replace(/-az/,""));return {out:`<span class="t-bad">${esc(toks[0])}: The term '${esc(toks[0])}' is not recognized as a name of a cmdlet, function, script file, or executable program.\nCheck the spelling of the name, or if a path was included, verify that the path is correct and try again.${close?`\nDid you mean ${titled(close)}?`:""}</span>`,err:true}}
    const miss=(d.req||[]).filter(r=>!(lc(r) in p)&&!(r==="Name"&&p.resourcegroupname&&d.p.resourcegroupname==="name"));
    if(name==="new-azroleassignment"&&!p.signinname&&!p.objectid)miss.unshift("SignInName");
    if(miss.length)return {out:`<span class="t-bad">${titled(name)}: Cannot process command because of one or more missing mandatory parameters: ${miss.join(" ")}.</span>`,err:true};
    const args=[];const extra={};
    Object.entries(p).forEach(([k,v])=>{if(d.p&&k in d.p){const az=d.p[k];if(!az)return;if(v&&typeof v==="object"&&!Array.isArray(v))args.push("--"+az,...Object.entries(v).map(([a,b])=>`${a}=${b}`));else args.push("--"+az,String(v===true?"true":v))}
      else if(d.sw&&k in d.sw){if(d.sw[k])args.push("--"+d.sw[k])}
      else if(d.dyn){extra[raw[k]]=v}
      else throw new AZ.Err(`${titled(name)}: A parameter cannot be found that matches parameter name '${raw[k]}'.`)});
    if(d.dyn&&Object.keys(extra).length)args.push("--parameters",...Object.entries(extra).map(([k,v])=>`${k}=${v}`));
    if(d.fixed)Object.entries(d.fixed(p,w)).forEach(([k,v])=>{if(!args.includes("--"+k))args.push("--"+k,v)});
    if(d.confirm&&!p.force&&!args.includes("--yes"))args.push("--yes");
    if(d.pre)d.pre(p,w);
    const path=typeof d.az==="function"?d.az(p):d.az;const q=s=>/[\s"']/.test(s)||s===""?`'${String(s).replace(/'/g,"")}'`:s;
    const r=AZ.exec(w,"az "+path+" "+args.map(q).join(" ")+" -o json",{ps:true});
    if(r.err)return {out:`<span class="t-bad">${titled(name)}: ${r.out.replace(/<[^>]+>/g,"").replace(/^ERROR: /,"").replace(/^\((\w+)\) ([\s\S]*?)\nCode: [\s\S]*$/,"$2\nErrorCode: $1")}</span>`,err:true};
    if(path.includes("what-if"))return {out:r.out};
    const j=AZ.lastJson;if(d.post)d.post(j,p,w);
    let o=d.out?d.out(j,p,w):j;if(asg){w.vars[lc(asg)]=Array.isArray(o)&&o.length===1?o[0]:o;return {out:""}}
    const cols=typeof d.cols==="function"?d.cols(p):d.cols;return {out:AZ.psFormat(o,Array.isArray(o)&&o.length>1?cols:null),ok:true}}
  catch(e){if(e&&e.az)return {out:`<span class="t-bad">${esc(e.message.replace(/^ERROR: /,""))}</span>`,err:true};if(typeof console!=="undefined")console.error(e);return {out:`<span class="t-bad">Simulator error: ${esc(e.message)}</span>`,err:true}}};
AZ.psComplete=line=>{const m=/^(.*?)(\S*)$/.exec(line);const before=m[1],word=m[2];const all=Object.keys(C).concat(Object.keys(CUSTOM));
  if(!before.trim()){const c=all.filter(k=>k.startsWith(lc(word)));if(c.length===1)return titled(c[0])+" ";return c.length?{list:c.map(titled)}:null}
  const name=lc(before.trim().split(/\s+/)[0]);const d=C[name];if(!d||!word.startsWith("-"))return null;
  const ps=Object.keys(d.p||{}).concat(Object.keys(d.sw||{}));const cand=ps.filter(k=>("-"+k).startsWith(lc(word)));const nice=k=>{const o={resourcegroupname:"ResourceGroupName",name:"Name",location:"Location",signinname:"SignInName",roledefinitionname:"RoleDefinitionName",lockname:"LockName",locklevel:"LockLevel",skuname:"SkuName",templatefile:"TemplateFile",force:"Force",status:"Status"};return o[k]||k[0].toUpperCase()+k.slice(1)};
  if(cand.length===1)return before+"-"+nice(cand[0])+" ";return cand.length?{list:cand.map(c=>"-"+nice(c))}:null};
})();

<script>
/* ================= Cloud Shell terminal and lab UI =================
   azLab(el, lab, api). lab = {title, scenario, shell:"bash"|"ps"|"both", setup(w), files:{name:{text,params,res}}, filesData:{name:json|text},
     tasks:[{t, hint, check:w=>bool, sticky}], success, solution:"multi-line", welcome}  */
(function(){
const esc=AZ.escH;const lc=s=>String(s==null?"":s).toLowerCase();
const ICON={vnet:"VNet",nsg:"NSG",asg:"ASG",pip:"PIP",nic:"NIC",vm:"VM",disk:"Disk",avset:"AvSet",vmss:"VMSS",sa:"Storage",plan:"Plan",web:"Web",acr:"ACR",aci:"ACI",cae:"CAE",ca:"App",lb:"LB",rt:"Routes",bas:"Bastion",pe:"PE",dns:"DNS",pdns:"PvtDNS",rsv:"Vault",ag:"AG",alert:"Alert",aalert:"Alert",law:"LAW",kv:"KV",as:"Scale"};
function build(lab){const w=AZ.world(lab);if(lab.setup)lab.setup(w,AZ);w.flags={};return w}
AZ.build=build;
function resView(w){const rgs=Object.values(w.rgs);
  const sub=AZ.subOf(w);const mg=AZ.mgChain(w,w.sub).map(m=>m.name).reverse();
  const head=`<div class="az-sub"><span class="s-small">${mg.length?esc(mg.join(" › "))+" › ":""}SUBSCRIPTION</span> <b>${esc(sub.name)}</b>${w.locks.filter(l=>/^\/subscriptions\/[^/]+$/i.test(l.scope)).map(l=>` <span class="az-lock" title="${l.level} lock">🔒 ${l.level}</span>`).join("")}${w.pols.length?` <span class="az-pol">${w.pols.length} polic${w.pols.length>1?"ies":"y"}</span>`:""}${w.roles.length>1?` <span class="az-pol">${w.roles.length-1} role assignment${w.roles.length>2?"s":""}</span>`:""}</div>`;
  const ids=(w.users.length>1||w.groups.length)?`<div class="az-ids s-small">ENTRA ID · ${w.users.length} user${w.users.length>1?"s":""} · ${w.groups.length} group${w.groups.length===1?"":"s"}</div>`:"";
  if(!rgs.length)return head+ids+`<div class="s-small az-empty">No resource groups yet.</div>`;
  return head+ids+rgs.map(g=>{const rs=w.res.filter(r=>lc(r.rg)===lc(g.name)&&r.t!=="nic"&&r.t!=="disk");const locks=w.locks.filter(l=>lc(l.scope)===lc(AZ.rgId(w,g.name)));const extra=w.res.filter(r=>lc(r.rg)===lc(g.name)&&(r.t==="nic"||r.t==="disk")).length;
    return `<div class="az-rg"><div class="az-rgh"><b>${esc(g.name)}</b><span class="s-small">${esc(g.loc)}</span>${locks.map(l=>`<span class="az-lock" title="${l.level} lock">🔒 ${l.level==="ReadOnly"?"ReadOnly":"Delete"}</span>`).join("")}${Object.entries(g.tags||{}).map(([k,v])=>`<span class="tag">${esc(k)}=${esc(v)}</span>`).join("")}</div>
      <div class="az-res">${rs.map(r=>`<span class="az-r az-${r.t}" title="${esc(AZ.TL[r.t]||r.t)}"><i>${ICON[r.t]||r.t}</i>${esc(r.name)}${r.t==="vm"?`<em class="${r.p.power==="VM running"?"on":"off"}">${r.p.power.replace("VM ","")}</em>`:""}${Object.keys(r.tags||{}).length?`<em class="tg">${Object.keys(r.tags).length} tag${Object.keys(r.tags).length>1?"s":""}</em>`:""}</span>`).join("")||'<span class="s-small">empty</span>'}${extra?`<span class="s-small">+${extra} NIC/disk</span>`:""}</div></div>`}).join("")}
function azLab(el,lab,api){
  let w,S,cur,done;const shells=lab.shell==="both"?["bash","ps"]:[lab.shell||"bash"];
  const prompt=sh=>sh==="ps"?"PS /home/admin> ":"admin [ ~ ]$ ";
  function init(){w=build(lab);S={};shells.forEach(sh=>S[sh]={log:`<span class="t-n">${sh==="ps"?"PowerShell":"Bash"} · Azure Cloud Shell (simulated). You're signed in as ${esc(w.me)}.\n${esc(lab.welcome||(sh==="ps"?"Type Az cmdlets. Tab completes cmdlet and parameter names, ↑ recalls history, Get-Help lists cmdlets.":"Type az commands. Tab completes, ↑ recalls history, az <group> --help shows commands, ls and cat show your files."))}</span>\n\n`,hist:[],hpos:0});cur=shells[0];done=new Set()}
  init();
  el.innerHTML=`${api&&api.head?api.head():""}${lab.scenario?`<p class="scenario">${lab.scenario}</p>`:""}
   ${shells.length>1?`<div class="chips az-tabs">${shells.map(s=>`<button class="chip" data-sh="${s}"></button>`).join("")}</div>`:""}
   <div class="ios-term az-term" tabindex="-1"><pre class="ios-out" aria-live="polite"></pre><label class="ios-line"><span class="ios-p"></span><input class="ios-in" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-label="Command line"></label></div>
   <div class="ios-keys"><button class="chip mono" data-k="tab">Tab</button><button class="chip mono" data-k="up">↑</button><button class="chip mono" data-k="down">↓</button><button class="chip mono" data-k="clear">clear</button></div>
   <details class="az-view" open><summary>Resources in your subscription</summary><div class="az-tree"></div></details>
   ${lab.tasks&&lab.tasks.length?`<div class="ios-tasks"></div>`:""}
   <div class="caption ios-cap" aria-live="polite"></div>
   <div class="viz-controls"><button class="btn" data-a="hints">Show hints</button><button class="btn" data-a="reset">Reset lab</button>${lab.solution?`<button class="btn" data-a="sol">Show a solution</button>`:""}<span class="grow"></span></div>`;
  const out=el.querySelector(".ios-out"),inp=el.querySelector(".ios-in"),pr=el.querySelector(".ios-p");let hints=false;
  function draw(){const x=S[cur];out.innerHTML=x.log;out.scrollTop=out.scrollHeight;pr.textContent=prompt(cur);
    el.querySelectorAll("[data-sh]").forEach(b=>{b.textContent=b.dataset.sh==="ps"?"PowerShell":"Bash";b.setAttribute("aria-pressed",b.dataset.sh===cur)});
    el.querySelector(".az-tree").innerHTML=resView(w);
    if(lab.tasks)el.querySelector(".ios-tasks").innerHTML=`<div class="s-small">TASKS · ${done.size} of ${lab.tasks.length}</div>`+lab.tasks.map((t,i)=>`<div class="ios-t${done.has(i)?" ok":""}"><span class="ios-c">${done.has(i)?"✓":i+1}</span><span>${t.t}${hints&&t.hint?`<code class="ios-h">${esc(cur==="ps"&&t.psHint?t.psHint:t.hint)}</code>`:""}</span></div>`).join("")}
  function check(){["lockedout","denied","frozen","wipe"].forEach(f=>{if(w.flags[f]&&typeof flag==="function")flag(f)});
    if(!lab.tasks)return;const before=done.size;lab.tasks.forEach((t,i)=>{let ok=false;try{ok=!!t.check(w,AZ)}catch(e){ok=false}if(ok)done.add(i);else if(!t.sticky)done.delete(i)});
    const cap=el.querySelector(".ios-cap");if(done.size===lab.tasks.length){cap.innerHTML=`<span class="status-good">All tasks complete.</span> ${lab.success||""}`;if(api&&api.pass)api.pass()}else if(done.size>before)cap.innerHTML=`<span class="status-good">Task complete.</span> ${lab.tasks.length-done.size} to go.`}
  function write(x,s){x.log+=s;if(x.log.length>80000)x.log=x.log.slice(-60000)}
  function exec(line){const x=S[cur];write(x,`<span class="t-c">${esc(prompt(cur))}</span>${esc(line)}\n`);if(line.trim()){x.hist.push(line);x.hpos=x.hist.length}
    const r=cur==="ps"?AZ.psExec(w,line):AZ.exec(w,line);if(r.clear){x.log="";}else if(r.out)write(x,r.out+"\n");
    if(lab.onCmd)lab.onCmd(line,w,r);check();draw()}
  function complete(){const v=inp.value;const c=cur==="ps"?AZ.psComplete(v):AZ.complete(v);if(!c)return;if(typeof c==="string"){inp.value=c;return}const x=S[cur];write(x,`<span class="t-c">${esc(prompt(cur))}</span>${esc(v)}\n<span class="t-n">${esc(c.list.join("  "))}</span>\n`);draw();inp.value=v}
  inp.addEventListener("keydown",e=>{const x=S[cur];
    if(e.key==="Enter"){e.preventDefault();const v=inp.value;inp.value="";exec(v);return}
    if(e.key==="Tab"){e.preventDefault();complete();return}
    if(e.key==="ArrowUp"){e.preventDefault();if(x.hpos>0){x.hpos--;inp.value=x.hist[x.hpos]||""}return}
    if(e.key==="ArrowDown"){e.preventDefault();if(x.hpos<x.hist.length){x.hpos++;inp.value=x.hist[x.hpos]||""}return}
    if(e.ctrlKey&&(e.key==="l"||e.key==="L")){e.preventDefault();x.log="";draw()}
    if(e.ctrlKey&&(e.key==="c"||e.key==="C")&&!window.getSelection().toString()){e.preventDefault();write(x,`<span class="t-c">${esc(prompt(cur))}</span>${esc(inp.value)}^C\n`);inp.value="";draw()}});
  el.addEventListener("click",e=>{const t=e.target;const sh=t.closest("[data-sh]");const k=t.closest("[data-k]")?.dataset.k;const a=t.closest("[data-a]")?.dataset.a;
    if(sh){cur=sh.dataset.sh;draw();inp.focus();return}
    if(k){const x=S[cur];if(k==="tab")complete();if(k==="up"&&x.hpos>0){x.hpos--;inp.value=x.hist[x.hpos]||""}if(k==="down"&&x.hpos<x.hist.length){x.hpos++;inp.value=x.hist[x.hpos]||""}if(k==="clear"){x.log="";draw()}inp.focus();return}
    if(a==="reset"){init();hints=false;const hb=el.querySelector('[data-a="hints"]');if(hb)hb.textContent="Show hints";el.querySelector(".ios-cap").innerHTML="";draw();return}
    if(a==="hints"){hints=!hints;t.textContent=hints?"Hide hints":"Show hints";draw();return}
    if(a==="sol"){const x=S[cur];const sol=cur==="ps"&&lab.psSolution?lab.psSolution:lab.solution;write(x,`<span class="t-n"># One possible solution (you can copy these lines):\n${esc(sol)}</span>\n\n`);draw();return}
    if(t.closest(".ios-term")&&!window.getSelection().toString())inp.focus({preventScroll:true})});
  check();draw();
  return {w:()=>w,run:l=>exec(l),shell:s=>{cur=s;draw()}};
}
window.azLab=azLab;
/* a lab used as a lesson diagram: awards XP like other diagrams */
window.azViz=function(el,lab,key,xp,label){return azLab(el,lab,{head:()=>`<div class="viz-title">${lab.title}</div>`,pass:()=>award("viz:"+key,xp||40,label||"Completed a Cloud Shell drill")})};
})();

</script>
<script>
/* ================= Module 1: Manage Azure Identities and Governance (AZ-104 Domain 1, 20–25%) ================= */
(function(){
const LESSONS=[
{id:"entra",num:"1.1",title:"Microsoft Entra ID: users, groups and licenses",html:`
<p><b>Microsoft Entra ID</b> (formerly Azure Active Directory) is Microsoft's cloud identity service. Each organization gets a <b>tenant</b>: a dedicated, isolated instance of Entra ID with a default domain like <code>contoso.onmicrosoft.com</code>. You can add and verify <b>custom domains</b> (such as <code>contoso.com</code>) by creating a TXT or MX record at your DNS host. Every Azure subscription trusts exactly one tenant for sign-in.</p>
<h3>Users</h3>
<ul><li><b>Cloud identities</b> are created directly in Entra ID (portal, CLI, PowerShell or Microsoft Graph).</li>
<li><b>Directory-synchronized identities</b> come from on-premises Active Directory Domain Services through <b>Microsoft Entra Connect</b> or <b>Cloud Sync</b>. You manage them on-premises.</li>
<li><b>Guest users</b> are people from outside your organization invited with B2B collaboration (lesson 1.2).</li></ul>
<p>Create many users at once with <b>Bulk create</b> (upload a CSV template in the portal) or a script. A deleted user stays in <b>Deleted users</b> for <b>30 days</b> and can be restored with all their group memberships and licenses.</p>
<h3>Groups</h3>
<ul><li><b>Security groups</b> grant access to resources and Azure roles. They can contain users, devices, service principals and other groups.</li>
<li><b>Microsoft 365 groups</b> add a shared mailbox, calendar, SharePoint site and Teams. They contain users only (no devices).</li></ul>
<p>Membership can be <b>Assigned</b> (you add members), <b>Dynamic user</b> or <b>Dynamic device</b> (a rule such as <code>(user.department -eq "Sales")</code> adds and removes members automatically). Dynamic groups need <b>Microsoft Entra ID P1</b> licenses, and you can't add members by hand to a dynamic group.</p>
<div class="viz" id="viz-dyn"></div>
<div class="viz" id="viz-grouptype"></div>
<h3>Licenses</h3>
<p>Licenses (Microsoft 365, Entra ID P1/P2 and others) can be assigned to users directly or through <b>group-based licensing</b>: assign the license to a group and every member gets it, now and in future. Group-based licensing needs Entra ID P1 or a plan that includes it.</p>
<p>A user needs a <b>usage location</b> (country) before a license can be assigned directly, because some services aren't available in every country. With group-based licensing, users without a usage location inherit the directory's location.</p>
<div class="viz" id="viz-license"></div>
<div class="tip"><b>Exam tip.</b> "Users should automatically get or lose access when their department changes" means a <b>dynamic group</b>. "Assign licenses to 500 users and keep new hires covered" means <b>group-based licensing</b>.</div>`},
{id:"external",num:"1.2",title:"External users and self-service password reset",html:`
<h3>B2B collaboration (guest users)</h3>
<p><b>Microsoft Entra B2B collaboration</b> lets you invite people from other organizations (or with personal Microsoft, Google or email one-time passcode accounts) to use your apps and Azure resources. They sign in with <b>their own credentials</b>; you never manage their password. In your directory they appear as users with <b>UserType = Guest</b>.</p>
<ul><li>Invite one guest from the portal (<b>Users → Invite external user</b>), or many with <b>Bulk invite</b> (CSV).</li>
<li><b>External collaboration settings</b> control who can invite guests (for example only admins and the <b>Guest Inviter</b> role) and which domains are allowed or blocked.</li>
<li>Guests have <b>limited directory permissions</b> by default; they can't browse the whole directory.</li>
<li>Assign guests to groups and Azure roles exactly like members.</li></ul>
<div class="viz" id="viz-b2b"></div>
<h3>Self-service password reset (SSPR)</h3>
<p>SSPR lets users reset a forgotten password or unlock their account without calling the help desk. In <b>Entra ID → Password reset</b> you configure:</p>
<ul><li><b>Enabled for</b>: None, <b>Selected</b> (one group, great for a pilot) or All.</li>
<li><b>Number of methods required</b>: 1 or 2.</li>
<li><b>Methods available</b>: Microsoft Authenticator notification or code, email, mobile phone (SMS or call), office phone, security questions.</li>
<li><b>Registration</b>: require users to register when they next sign in, and ask them to reconfirm every N days (default 180).</li>
<li><b>Notifications</b>: tell users when their password is reset; tell all admins when another admin resets theirs.</li>
<li><b>On-premises integration</b>: <b>password writeback</b> (through Entra Connect or Cloud Sync) sends resets back to Active Directory for hybrid users.</li></ul>
<p>Administrator accounts are <b>always</b> enabled for SSPR and use a stronger <b>two-gate</b> policy: two methods, and security questions aren't allowed. Resetting a forgotten password needs <b>Entra ID P1</b> (or a Microsoft 365 business plan that includes it); writeback for hybrid users needs P1 too.</p>
<div class="viz" id="viz-sspr"></div>`},
{id:"rbac",num:"1.3",title:"Azure role-based access control (RBAC)",html:`
<p><b>Azure RBAC</b> controls who can do what to Azure resources. Every <b>role assignment</b> joins three things:</p>
<div class="viz" id="viz-rbac4"></div>
<h3>Built-in roles you must know</h3>
<ul><li><b>Owner</b>: full access to everything, including <b>assigning roles</b> to others.</li>
<li><b>Contributor</b>: create and manage all resources, but <b>can't grant access</b> to anyone.</li>
<li><b>Reader</b>: view everything, change nothing.</li>
<li><b>User Access Administrator</b>: manage access (role assignments) only.</li>
<li><b>Role Based Access Control Administrator</b>: manage role assignments, optionally limited by conditions to specific roles or principals. Safer than User Access Administrator.</li>
<li>Hundreds of <b>service-specific roles</b>, such as Virtual Machine Contributor, Network Contributor, Storage Account Contributor and Backup Operator.</li></ul>
<p>Roles have <b>Actions</b> (management plane, for example <code>Microsoft.Compute/virtualMachines/start/action</code>) and <b>DataActions</b> (data plane, for example reading a blob). Owner and Contributor don't include data actions, so reading blobs with Entra ID sign-in needs a data role such as <b>Storage Blob Data Reader</b>.</p>
<div class="viz" id="viz-roles"></div>
<h3>Custom roles</h3>
<p>When no built-in role fits, create a <b>custom role</b>: a JSON definition with <code>Actions</code>, <code>NotActions</code>, <code>DataActions</code>, <code>NotDataActions</code> and <code>AssignableScopes</code> (where it can be assigned). Start by cloning a built-in role in the portal, or use <code>az role definition create</code> or <code>New-AzRoleDefinition</code>. A tenant can have up to 5,000 custom roles. <code>NotActions</code> isn't a deny: it just subtracts from <code>Actions</code>, and another role assignment can still grant the action.</p>
<h3>Entra roles are different</h3>
<p><b>Microsoft Entra roles</b> (Global Administrator, User Administrator, Billing Administrator…) manage the directory: users, groups, licenses and domains. <b>Azure roles</b> manage Azure resources. A Global Administrator has no Azure resource access by default, but can <b>elevate access</b> to become User Access Administrator at the root scope of every subscription.</p>
<div class="viz" id="viz-entraaz"></div>
<div class="viz" id="viz-rbaccli"></div>`},
{id:"scope",num:"1.4",title:"Interpreting access assignments",html:`
<p>You can assign a role at four <b>scopes</b>: a <b>management group</b>, a <b>subscription</b>, a <b>resource group</b> or a single <b>resource</b>. Assignments are <b>inherited</b> by everything below. Contributor on a subscription means Contributor on every resource group and resource in it.</p>
<div class="viz" id="viz-scope"></div>
<h3>How Azure decides</h3>
<ul><li>RBAC is <b>additive</b>: your effective permissions are the union of every role assigned to you and to every group you belong to, at every scope above the resource.</li>
<li>There's no "deny" role. The only way to block an action that a role allows is a <b>deny assignment</b>, which Azure creates for you (for example for managed applications or deployment stacks). You can't create one directly.</li>
<li>Assign roles to <b>groups</b>, not individuals, and at the <b>narrowest scope</b> that works (least privilege).</li>
<li>Role assignments on a resource don't follow it when you move it to another resource group or subscription.</li></ul>
<p>To find out what someone can do, open the resource's <b>Access control (IAM)</b> blade and use <b>Check access</b>, or run <code>az role assignment list --assignee &lt;user&gt; --all --include-inherited</code>. A subscription supports up to 4,000 role assignments.</p>
<div class="viz" id="viz-effective"></div>
<div class="tip"><b>Exam tip.</b> A user who is Reader on the subscription and Contributor on <code>rg-web</code> can change resources in <code>rg-web</code> and only view everything else. Permissions add up; they never cancel each other out.</div>`},
{id:"policy",num:"1.5",title:"Azure Policy",html:`
<p><b>Azure Policy</b> enforces rules about <b>what resources look like</b>, no matter who creates them. RBAC answers "who can act"; Policy answers "is this configuration allowed".</p>
<ul><li>A <b>policy definition</b> is a JSON rule (<code>if</code> a condition, <code>then</code> an effect). Hundreds are built in: <i>Allowed locations</i>, <i>Allowed virtual machine size SKUs</i>, <i>Not allowed resource types</i>, <i>Require a tag on resources</i>, <i>Inherit a tag from the resource group if missing</i>.</li>
<li>An <b>initiative</b> (policy set) groups related definitions, for example a regulatory compliance standard.</li>
<li>An <b>assignment</b> applies a definition or initiative to a scope (management group, subscription or resource group), with <b>parameters</b>, optional <b>exclusions</b> and an <b>enforcement mode</b>.</li>
<li>An <b>exemption</b> waives a specific resource from an assignment.</li></ul>
<div class="viz" id="viz-poleffect"></div>
<h3>Effects</h3>
<ul><li><b>Deny</b>: block the request. <b>Audit</b>: allow it, but flag the resource as non-compliant.</li>
<li><b>Modify</b>: add, change or remove properties such as tags at create or update time. <b>Append</b>: add fields.</li>
<li><b>DeployIfNotExists</b>: deploy a related resource (for example a diagnostic setting) when it's missing. <b>AuditIfNotExists</b>: flag it.</li>
<li><b>DenyAction</b>: block specific actions such as delete. <b>Disabled</b>: turn the rule off.</li></ul>
<p>Modify and DeployIfNotExists assignments need a <b>managed identity</b> with the right role so Azure can make changes. New and updated resources are handled automatically; <b>existing</b> non-compliant resources are fixed only when you run a <b>remediation task</b>.</p>
<p>Compliance for a new assignment shows up after a short delay (it can take up to about 30 minutes), then resources are re-evaluated every 24 hours or when they change. You can start a scan on demand.</p>
<div class="viz" id="viz-polflow"></div>
<div class="viz" id="viz-poltest"></div>
<div class="tip"><b>Exam tip.</b> <i>Allowed locations</i> doesn't apply to resource groups or global resources. To restrict where resource groups go, also assign <i>Allowed locations for resource groups</i>.</div>`},
{id:"locks",num:"1.6",title:"Resource locks, tags, resource groups and moving resources",html:`
<h3>Resource locks</h3>
<p>Locks protect resources from accidental change, and they apply to <b>everyone</b>, including Owners. Apply them to a subscription, resource group or resource; they're inherited.</p>
<ul><li><b>CanNotDelete</b> (Delete in the portal): read and modify, but not delete.</li>
<li><b>ReadOnly</b>: read only. It blocks every write and delete <b>and</b> operations that use POST, such as listing storage account keys or starting and restarting a VM.</li></ul>
<p>Only roles with <code>Microsoft.Authorization/locks/*</code> (Owner and User Access Administrator) can create or remove locks. Locks protect the <b>management plane</b>: a ReadOnly lock on a storage account doesn't stop someone with a data role from deleting blobs.</p>
<div class="viz" id="viz-lock"></div>
<h3>Tags</h3>
<p>Tags are name/value pairs for organizing, cost reporting and automation. Up to 50 per resource, resource group or subscription. Tag names are case-insensitive; values are case-sensitive. <b>Tags aren't inherited</b>: a tag on a resource group doesn't appear on its resources unless an Azure Policy (Modify effect) copies it. Cost reports only show tags from the time they're applied.</p>
<div class="viz" id="viz-tagq"></div>
<h3>Resource groups and moves</h3>
<p>Every resource lives in exactly one resource group. The group's location only stores metadata; its resources can be in any region. Resource groups can't be nested or renamed, and deleting one deletes everything in it.</p>
<p>You can <b>move</b> resources to another resource group or subscription in the same tenant. The resource keeps its <b>region</b> (only its resource ID changes), dependent resources must move together (a VM with its disks and NICs), and role assignments made directly on the resource don't move. To move to another <b>region</b>, use <b>Azure Resource Mover</b> or redeploy.</p>
<div class="viz" id="viz-move"></div>`},
{id:"cost",num:"1.7",title:"Subscriptions, management groups and costs",html:`
<h3>Subscriptions and management groups</h3>
<p>A <b>subscription</b> is a billing and access boundary. <b>Management groups</b> organize subscriptions so you can apply RBAC and Azure Policy to many at once.</p>
<ul><li>Every tenant has one <b>root management group</b> that can't be moved or deleted.</li>
<li>Up to <b>six levels</b> of depth below the root (not counting subscriptions), and up to 10,000 management groups.</li>
<li>Each management group and subscription has exactly <b>one parent</b>.</li>
<li>Moving a subscription to another management group changes the policies and roles it inherits.</li></ul>
<div class="viz" id="viz-mg"></div>
<h3>Managing costs</h3>
<ul><li><b>Cost analysis</b> shows actual and forecast cost, grouped by service, location, resource group or <b>tag</b>.</li>
<li><b>Budgets</b> set a monthly, quarterly or yearly amount with alert thresholds on <b>actual</b> or <b>forecasted</b> cost. Alerts email people or trigger an <b>action group</b> (which can run automation). A budget <b>doesn't stop</b> resources by itself.</li>
<li><b>Cost alerts</b> include budget alerts, credit alerts, department spending quota alerts and anomaly alerts.</li>
<li><b>Azure Advisor</b> cost recommendations find idle and oversized resources.</li>
<li>Save with <b>reservations</b> (1 or 3 years for a specific resource type), <b>savings plans for compute</b> (an hourly commitment across services), <b>Azure Hybrid Benefit</b> (reuse Windows Server and SQL Server licenses), <b>Spot VMs</b>, autoscale and deallocating idle VMs.</li></ul>
<div class="viz" id="viz-budget"></div>
<div class="viz" id="viz-costsort"></div>`}
];

function vizDyn(){const el=$("#viz-dyn");
  const U=[["Ava Chen","Sales","Account Manager","US","Member"],["Ben Ortiz","Sales","Sales Director","CA","Member"],["Chloe Ward","IT","Helpdesk Technician","US","Member"],["Dev Patel","IT","Helpdesk Lead","GB","Member"],["Eli Moss","Finance","Accountant","US","Member"],["Fatima Noor","Sales","Sales Engineer","US","Member"],["Gus Lind","","Consultant","DE","Guest"],["Hana Sato","Marketing","Designer","JP","Guest"]];
  const P={department:1,jobTitle:2,country:3,userType:4};const T=[["Everyone in the Sales department",u=>u[1]==="Sales"],["All B2B guests",u=>u[4]==="Guest"],["Everyone whose job title starts with Helpdesk",u=>u[2].startsWith("Helpdesk")],["Everyone not in the US",u=>u[3]!=="US"]];
  let prop="department",op="-eq",val="Sales",t=0;const solved=new Set();
  const test=u=>{const v=u[P[prop]],x=val;return op==="-eq"?lc2(v)===lc2(x):op==="-ne"?lc2(v)!==lc2(x):op==="-startsWith"?lc2(v).startsWith(lc2(x)):lc2(v).includes(lc2(x))};
  function lc2(s){return String(s).toLowerCase()}
  function draw(){const m=U.map(test),want=U.map(T[t][1]),ok=m.every((x,i)=>x===want[i]);if(ok)solved.add(t);
    el.innerHTML=`<div class="viz-title">Dynamic membership rule builder</div>
    <div class="seg-row">${T.map((x,i)=>`<button class="chip" data-t="${i}" aria-pressed="${i===t}">${solved.has(i)?"✓ ":""}Goal ${i+1}</button>`).join("")}</div>
    <p class="scenario"><b>Goal:</b> ${T[t][0]}</p>
    <div class="dyn-row"><select class="txt-in" data-k="prop">${Object.keys(P).map(k=>`<option ${k===prop?"selected":""}>${k}</option>`).join("")}</select>
      <select class="txt-in" data-k="op">${["-eq","-ne","-startsWith","-contains"].map(o=>`<option ${o===op?"selected":""}>${o}</option>`).join("")}</select>
      <input class="txt-in" data-k="val" value="${esc(val)}" aria-label="Value"></div>
    <pre class="term" style="min-height:0">(user.${prop} ${op} "${esc(val)}")</pre>
    <div class="tbl-wrap"><table class="tbl"><tr><th>User</th><th>department</th><th>jobTitle</th><th>country</th><th>userType</th><th>In group?</th></tr>${U.map((u,i)=>`<tr><td>${u[0]}</td><td>${u[1]||"—"}</td><td>${u[2]}</td><td>${u[3]}</td><td>${u[4]}</td><td class="${m[i]===want[i]?(m[i]?"ok":"dim"):"no"}">${m[i]?"✓ Member":"—"}${m[i]!==want[i]?(want[i]?" (should be in)":" (shouldn't be)"):""}</td></tr>`).join("")}</table></div>
    <div class="caption" aria-live="polite">${ok?`<span class="status-good">Rule matches the goal.</span> ${solved.size<T.length?"Pick the next goal.":"All four goals solved."}`:"Change the property, operator or value until the group contains exactly the right people."} ${solved.size}/${T.length} goals solved.</div>`;
    if(solved.size===T.length)award("viz:dyn",30,"Built every dynamic group rule")}

<script>
/* ================= Module 2: Implement and Manage Storage (AZ-104 Domain 2, 15–20%) ================= */
(function(){
const LESSONS=[
{id:"accounts",num:"2.1",title:"Storage accounts",html:`
<p>A <b>storage account</b> is the top-level container for Azure Storage data. One account can hold four data services, each with its own endpoint:</p>
<div class="viz" id="viz-svc"></div>
<h3>Account types</h3>
<ul><li><b>Standard general-purpose v2</b> (StorageV2): the default for almost everything. Blobs, files, queues and tables; every redundancy option; Hot, Cool, Cold and Archive tiers.</li>
<li><b>Premium block blobs</b> (BlockBlobStorage): SSD-backed, low latency for high transaction rates. LRS or ZRS only.</li>
<li><b>Premium file shares</b> (FileStorage): SSD-backed Azure Files, the only type that supports <b>NFS</b> shares. LRS or ZRS only.</li>
<li><b>Premium page blobs</b>: for unmanaged disks and page-blob workloads.</li>
<li>General-purpose v1 and BlobStorage are legacy; upgrade them to v2 (one way, no downtime).</li></ul>
<p>The account name becomes part of every endpoint (<code>https://<b>stweb4410</b>.blob.core.windows.net</code>), so it must be <b>globally unique</b>, <b>3–24 characters</b>, and use <b>only lowercase letters and numbers</b>. You can't rename an account; you can't switch an account between Standard and Premium either.</p>
<div class="viz" id="viz-saname"></div>
<h3>Settings to know at creation</h3>
<ul><li><b>Secure transfer required</b> (HTTPS only), on by default. <b>Minimum TLS version</b> 1.2.</li>
<li><b>Allow blob anonymous access</b>: off by default. When off, no container can be made public.</li>
<li><b>Hierarchical namespace</b>: turns the account into <b>Azure Data Lake Storage</b> for analytics (folders, POSIX ACLs).</li>
<li><b>Default access tier</b> for blobs: Hot or Cool (Cold and Archive are set per blob).</li></ul>
<div class="viz" id="viz-satype"></div>`},
{id:"redundancy",num:"2.2",title:"Redundancy",html:`
<p>Azure Storage always keeps <b>multiple copies</b> of your data. You choose how far apart those copies are.</p>
<div class="viz" id="viz-redund"></div>
<ul><li><b>LRS</b> (locally redundant): 3 copies in one datacenter. Survives a disk or rack failure. Cheapest; at least 11 nines of durability.</li>
<li><b>ZRS</b> (zone-redundant): 3 copies across 3 <b>availability zones</b> in the region. Survives a datacenter (zone) outage with no downtime.</li>
<li><b>GRS</b> (geo-redundant): LRS in the primary region, plus 3 more copies (LRS) in the <b>paired secondary region</b>, copied <b>asynchronously</b>. Survives a regional outage.</li>
<li><b>GZRS</b>: ZRS in the primary region plus LRS in the secondary. The most resilient option.</li>
<li><b>RA-GRS / RA-GZRS</b>: the same, but you can <b>read</b> from the secondary endpoint (<code>account-secondary.blob.core.windows.net</code>) at any time.</li></ul>
<p>With GRS or GZRS (no RA), the secondary copy isn't readable until a <b>failover</b>. A <b>customer-managed failover</b> promotes the secondary to primary; afterwards the account is LRS in the new region, and any data not yet replicated (see <b>Last Sync Time</b>) is lost.</p>
<p>You can change redundancy later: LRS↔GRS↔RA-GRS is a simple setting change; moving to or from ZRS needs a <b>conversion</b> (requested in the portal) or a manual migration. Premium accounts support only LRS and ZRS.</p>
<div class="viz" id="viz-redpick"></div>
<div class="tip"><b>Exam tip.</b> "Data must remain available if a datacenter fails" means at least <b>ZRS</b>. "Readable even if the primary region is down, without waiting for failover" means <b>RA-GRS</b> or <b>RA-GZRS</b>.</div>`},
{id:"access",num:"2.3",title:"Access keys, SAS, stored access policies and identity",html:`
<p>Every request to storage data must be authorized. You have four ways to do it:</p>
<div class="viz" id="viz-authsort"></div>
<h3>Account access keys</h3>
<p>Each account has <b>two 512-bit keys</b>. A key gives <b>full access</b> to everything in the account, so treat it like a root password. Two keys let you <b>rotate</b> without downtime: move apps to key2, regenerate key1, move back. Store keys in <b>Azure Key Vault</b>, which can rotate them for you. You can turn off <b>shared key access</b> entirely to force Entra ID.</p>
<h3>Shared access signatures (SAS)</h3>
<p>A SAS is a signed URL token that grants <b>limited</b> access: specific services, resources, permissions (<code>r</code> read, <code>w</code> write, <code>d</code> delete, <code>l</code> list, <code>a</code> add, <code>c</code> create…), a start and expiry time, an allowed <b>IP range</b> and protocol (HTTPS only).</p>
<ul><li><b>User delegation SAS</b>: signed with Entra ID credentials. Blob storage only, at most 7 days. <b>The most secure SAS</b>, recommended by Microsoft.</li>
<li><b>Service SAS</b>: signed with an account key; one service (blob, file, queue or table).</li>
<li><b>Account SAS</b>: signed with an account key; one or more services and service-level operations.</li></ul>
<div class="viz" id="viz-sas"></div>
<h3>Stored access policies and revoking a SAS</h3>
<p>A SAS signed with a key stays valid until it expires, unless you <b>regenerate the key</b> (which breaks every SAS and app that uses that key). A <b>stored access policy</b> on a container (up to 5 per container) holds the permissions and expiry instead of the token itself. Change or delete the policy and every SAS that references it changes or stops working immediately. A user delegation SAS is revoked by revoking the user delegation key.</p>
<div class="viz" id="viz-revoke"></div>
<h3>Identity-based access</h3>
<p>Assign <b>data plane RBAC roles</b> such as <b>Storage Blob Data Reader</b>, <b>Storage Blob Data Contributor</b>, <b>Storage Queue Data Contributor</b> or <b>Storage File Data SMB Share Contributor</b>. Apps use a <b>managed identity</b>, so there are no secrets to store. For Azure Files over SMB, use identity-based authentication with AD DS, Microsoft Entra Domain Services or Microsoft Entra Kerberos, and combine share-level roles with NTFS permissions.</p>
<h3>Encryption</h3>
<p>All data is encrypted at rest with 256-bit AES (Storage Service Encryption), and you can't turn it off. Keys are <b>Microsoft-managed</b> by default; you can use <b>customer-managed keys</b> in Key Vault or Managed HSM. <b>Infrastructure encryption</b> adds a second layer, and <b>encryption scopes</b> let you use different keys per container or blob.</p>`},
{id:"netaccess",num:"2.4",title:"Network access to storage",html:`
<p>By default a storage account accepts connections from any network (it still needs authorization). Lock it down in <b>Networking</b>:</p>
<ul><li><b>Public network access</b>: Enabled from all networks, Enabled from selected virtual networks and IP addresses, or Disabled.</li>
<li><b>IP network rules</b>: allow <b>public</b> IP addresses or ranges (for example your office). Private address ranges aren't allowed in IP rules.</li>
<li><b>Virtual network rules</b>: allow a subnet. The subnet must have a <b>Microsoft.Storage service endpoint</b>; traffic then travels over the Azure backbone with the subnet's identity, but still to the account's public endpoint.</li>
<li><b>Resource instance rules</b> and <b>trusted Microsoft services</b> exceptions (such as Azure Backup or Event Grid).</li>
<li><b>Private endpoints</b>: give the account a <b>private IP address</b> in your VNet. Traffic never touches the public endpoint, it works from peered VNets and on-premises (VPN or ExpressRoute), and you can then disable public access completely. A private DNS zone (<code>privatelink.blob.core.windows.net</code>) makes the normal name resolve to the private IP.</li></ul>
<div class="viz" id="viz-fw"></div>
<div class="viz" id="viz-epvs"></div>
<div class="tip"><b>Exam tip.</b> Service endpoints are free, per subnet, and only work from that VNet. Private endpoints cost a little, are per resource, and work from anywhere that can route to the private IP, including on-premises.</div>`},
{id:"blobs",num:"2.5",title:"Blob storage: containers, tiers and lifecycle",html:`
<p>Blob storage holds unstructured data: documents, images, backups, logs. Blobs live in <b>containers</b> (3–63 lowercase letters, numbers and hyphens). There are three blob types: <b>block</b> blobs (files, up to about 190 TiB), <b>append</b> blobs (logs) and <b>page</b> blobs (VHDs, random access).</p>
<p>A container's <b>anonymous access level</b> can be Private (default), Blob (read single blobs anonymously) or Container (read and list), but only if the account allows anonymous access.</p>
<h3>Access tiers</h3>
<div class="viz" id="viz-tiers"></div>
<ul><li><b>Hot</b>: frequently accessed. Highest storage cost, lowest access cost.</li>
<li><b>Cool</b>: infrequent access, kept at least <b>30 days</b>.</li>
<li><b>Cold</b>: rarely accessed, kept at least <b>90 days</b>.</li>
<li><b>Archive</b>: offline, kept at least <b>180 days</b>. Cheapest storage, but you can't read an archived blob until you <b>rehydrate</b> it to an online tier (Standard priority up to 15 hours, High priority often under an hour for small blobs), or copy it to a new blob.</li></ul>
<p>Deleting or moving a blob out of Cool, Cold or Archive before its minimum period incurs an <b>early deletion charge</b>. Archive is set per blob, and isn't available in ZRS, GZRS or RA-GZRS accounts.</p>
<h3>Lifecycle management</h3>
<p>A <b>lifecycle management policy</b> is a JSON set of rules that moves blobs to cooler tiers or deletes them based on days since they were <b>modified</b>, <b>created</b> or <b>last accessed</b> (needs access tracking). Rules can filter by blob type, <b>prefix</b> (like <code>logs/</code>) and <b>blob index tags</b>, and can also act on old <b>versions</b> and <b>snapshots</b>. Azure runs the policy about once a day.</p>
<div class="viz" id="viz-lifecycle"></div>
<h3>Object replication</h3>
<p><b>Object replication</b> copies block blobs asynchronously from a source container to a destination container in another account (any region). It needs <b>blob versioning</b> on both accounts and <b>change feed</b> on the source. Use it to reduce read latency or to keep a copy in another region with your own rules.</p>`},
{id:"protect",num:"2.6",title:"Data protection for blobs and files",html:`
<p>Redundancy protects against hardware failure. These features protect against <b>people</b>: accidental deletes, overwrites and ransomware.</p>
<div class="viz" id="viz-protsort"></div>
<ul><li><b>Blob soft delete</b>: deleted blobs (and overwritten data, as snapshots) are kept for 1–365 days and can be <b>undeleted</b>.</li>
<li><b>Container soft delete</b>: deleted containers are kept for 1–365 days and can be restored.</li>
<li><b>Blob versioning</b>: every write creates a new version automatically. Restore any previous version. Combine with soft delete.</li>
<li><b>Point-in-time restore</b>: roll block blobs back to an earlier time. Needs soft delete, versioning and change feed, and the restore window must be shorter than the soft delete period.</li>
<li><b>Snapshots</b>: manual read-only copies of a blob at a moment in time.</li>
<li><b>Immutable storage</b> (WORM): <b>time-based retention</b> or <b>legal hold</b> policies stop anyone, including admins, from modifying or deleting data until they expire. Used for compliance.</li>
<li><b>Resource lock</b> on the account: stops the <b>account</b> being deleted, not the data inside.</li>
<li><b>Azure Files</b>: share <b>snapshots</b> (up to 200 per share) and <b>soft delete for shares</b>; protect shares with <b>Azure Backup</b>.</li></ul>
<div class="viz" id="viz-oops"></div>`},
{id:"files",num:"2.7",title:"Azure Files and storage tools",html:`
<p><b>Azure Files</b> provides fully managed file shares in the cloud that you mount with <b>SMB</b> (Windows, Linux, macOS; port <b>445</b>) or <b>NFS</b> (Linux, premium FileStorage accounts only). Use it to replace or extend on-premises file servers, for shared app settings, and for lift-and-shift apps.</p>
<ul><li><b>Tiers</b>: <b>Premium</b> (SSD, in FileStorage accounts), and on standard accounts <b>Transaction optimized</b>, <b>Hot</b> and <b>Cool</b>.</li>
<li>Each share has a <b>quota</b> (size limit) up to 100 TiB.</li>
<li>Port 445 outbound is often blocked by ISPs; use a VPN, ExpressRoute or Azure File Sync instead.</li>
<li><b>Azure File Sync</b> caches shares on on-premises Windows Servers. Its parts: a <b>Storage Sync Service</b>, a <b>sync group</b>, a <b>cloud endpoint</b> (the share; one per sync group), and <b>server endpoints</b> (a path on each registered server). <b>Cloud tiering</b> keeps hot files local and leaves cold files as pointers.</li></ul>
<div class="viz" id="viz-blobfile"></div>
<div class="viz" id="viz-filesync"></div>
<h3>Tools for moving and managing data</h3>
<ul><li><b>Azure Storage Explorer</b>: a free desktop app to browse and manage blobs, files, queues and tables, and to generate SAS tokens.</li>
<li><b>AzCopy</b>: a command-line tool for fast copy and sync (<code>azcopy copy</code>, <code>azcopy sync</code>), authenticated with Entra ID (<code>azcopy login</code>) or a SAS.</li>
<li><b>Azure Data Box</b>: Microsoft ships you a rugged device to move terabytes offline when the network is too slow.</li>
<li><b>Azure Import/Export</b>: ship your own disks to an Azure datacenter.</li>
<li><b>Storage browser</b> in the portal: a lightweight Storage Explorer.</li></ul>
<div class="viz" id="viz-tools"></div>

{id:"arm",num:"3.1",title:"ARM templates and Bicep",html:`
<p><b>Azure Resource Manager (ARM)</b> is the deployment and management layer behind the portal, CLI, PowerShell and REST API. <b>Infrastructure as code</b> describes resources in files you can version, review and redeploy identically.</p>
<h3>ARM templates (JSON)</h3>
<p>An ARM template is a <b>declarative</b> JSON file. Its sections:</p>
<div class="viz" id="viz-armparts"></div>
<p>A separate <b>parameters file</b> (<code>main.parameters.json</code>) supplies values per environment, so the same template deploys dev and prod. Use <code>reference()</code> and <code>dependsOn</code> to order resources, and a <b>Key Vault reference</b> in the parameters file to pass secrets.</p>
<h3>Bicep</h3>
<p><b>Bicep</b> is a simpler language that compiles to ARM JSON. Same capabilities, far less syntax, automatic dependencies from symbolic names, and <b>modules</b> for reuse. Convert with <code>az bicep build</code> (Bicep → JSON) and <code>az bicep decompile</code> (JSON → Bicep).</p>
<pre class="json">param location string = resourceGroup().location
@minLength(3)
@maxLength(24)
param storageName string

resource sa 'Microsoft.Storage/storageAccounts@2023-05-01' = {
  name: storageName
  location: location
  sku: { name: 'Standard_LRS' }
  kind: 'StorageV2'
}
output blobEndpoint string = sa.properties.primaryEndpoints.blob</pre>
<h3>Deploying</h3>
<ul><li><code>az deployment group create -g rg --template-file main.bicep --parameters @main.parameters.json</code> or <code>New-AzResourceGroupDeployment</code>.</li>
<li>Scopes: resource group, subscription (<code>az deployment sub create</code>, for example to create resource groups or assign policy), management group and tenant.</li>
<li><b>What-if</b> (<code>az deployment group what-if</code>, or <code>-WhatIf</code>) previews creates, modifies and deletes before you deploy.</li>
<li><b>Incremental</b> mode (default) adds and updates resources and leaves others alone. <b>Complete</b> mode <b>deletes</b> resources in the group that aren't in the template.</li>
<li><b>Export</b> a template from an existing resource group or a past deployment (Automation → Export template) to capture what's there.</li></ul>
<div class="viz" id="viz-mode"></div>
<div class="viz" id="viz-armq"></div>`},
{id:"vm",num:"3.2",title:"Create and configure virtual machines",html:`
<p>An Azure <b>virtual machine</b> is made of several resources: the VM itself, an <b>OS disk</b>, optional <b>data disks</b>, a <b>network interface</b> (NIC) in a VNet subnet, and usually a <b>network security group</b> and maybe a <b>public IP</b>.</p>
<div class="viz" id="viz-vmparts"></div>
<h3>Choosing a size</h3>
<p>Sizes come in families: <b>B</b> (burstable, cheap for light loads), <b>D</b> (general purpose), <b>E</b> (memory optimized), <b>F</b> (compute optimized), <b>L</b> (storage optimized), <b>N</b> (GPU), <b>M</b> (huge memory, SAP), <b>H</b> (HPC). Resize later; if the new size isn't on the current hardware cluster, <b>deallocate</b> first.</p>
<div class="viz" id="viz-sizes"></div>
<h3>Power states and billing</h3>
<ul><li><b>Running</b>: you pay for compute and storage.</li>
<li><b>Stopped</b> (shut down from inside the OS or <code>az vm stop</code>): still allocated, <b>still billed</b> for compute.</li>
<li><b>Stopped (deallocated)</b>: compute released; you pay only for disks (and static public IPs). Dynamic public IPs are released.</li></ul>
<div class="viz" id="viz-power"></div>
<h3>Other things to know</h3>
<ul><li><b>Authentication</b>: SSH keys (recommended for Linux) or password; Windows needs a complex password and a non-reserved username.</li>
<li><b>Spot VMs</b>: cheap spare capacity that can be evicted (Deallocate or Delete policy). <b>Azure Hybrid Benefit</b>: bring Windows Server or SQL licenses.</li>
<li><b>Extensions</b> run post-deployment tasks: Custom Script Extension, Azure Monitor Agent, DSC, antimalware. <b>Run Command</b> runs a script inside the VM through the agent without network access.</li>
<li><b>Cloud-init</b> (Linux) or custom data configures a VM at first boot.</li>
<li><b>Connect</b> with SSH or RDP over a public IP, or better, through <b>Azure Bastion</b> (module 4) with no public IP at all. <b>Redeploy</b> moves a VM to a new host when it's unreachable.</li></ul>`},
{id:"disks",num:"3.3",title:"VM disks and encryption",html:`
<p>VMs use <b>managed disks</b>: Azure handles the storage account behind them. Each VM has an <b>OS disk</b>, a temporary disk (lost on deallocate or redeploy; never store data there) and optional <b>data disks</b>.</p>
<div class="viz" id="viz-disktype"></div>
<ul><li><b>Ultra Disk</b>: highest performance, adjustable IOPS and throughput, data disks only.</li>
<li><b>Premium SSD v2</b>: flexible performance without resizing, data disks only.</li>
<li><b>Premium SSD</b>: production and performance-sensitive workloads; single-VM SLA of 99.9%.</li>
<li><b>Standard SSD</b>: web servers, light production, dev/test.</li>
<li><b>Standard HDD</b>: backups and non-critical data.</li></ul>
<p>Disks can be <b>LRS</b> or <b>ZRS</b> (Premium and Standard SSD). You can <b>increase</b> a disk's size (never shrink it), and change its type while the VM is deallocated. <b>Snapshots</b> capture a disk at a point in time; <b>images</b> and the <b>Azure Compute Gallery</b> let you reuse a generalized VM.</p>
<h3>Encryption</h3>
<ul><li><b>Server-side encryption</b> (SSE): always on, platform-managed or customer-managed keys (through a <b>disk encryption set</b>).</li>
<li><b>Encryption at host</b>: also encrypts temp disks and caches on the host. Must be enabled on the subscription feature first.</li>
<li><b>Azure Disk Encryption</b> (ADE): encrypts inside the OS with BitLocker (Windows) or DM-Crypt (Linux), keys in <b>Key Vault</b> (the vault must allow disk encryption).</li>
<li><b>Confidential disk encryption</b> for confidential VMs.</li></ul>
<div class="viz" id="viz-encq"></div>`},
{id:"avail",num:"3.4",title:"Availability and moving VMs",html:`
<p>Hardware fails and hosts get patched. Azure offers three ways to keep a workload running, each with its own SLA:</p>
<div class="viz" id="viz-sla"></div>
<ul><li><b>Availability sets</b> spread VMs across <b>fault domains</b> (separate racks with their own power and network; up to 3) and <b>update domains</b> (groups rebooted together during maintenance; up to 20, default 5) in <b>one datacenter</b>. 99.95% SLA with 2+ VMs. You can only add a VM to an availability set when you create it.</li>
<li><b>Availability zones</b> place VMs in physically separate datacenters in the region. 99.99% SLA with VMs in 2+ zones. A VM can't be in both an availability set and a zone.</li>
<li><b>Single VM</b> with Premium SSD or Ultra disks: 99.9%.</li></ul>
<p>Load balancers (module 4) spread traffic across the VMs. For regional disasters, replicate to another region with <b>Azure Site Recovery</b> (module 5).</p>
<h3>Moving VMs</h3>
<ul><li><b>Another resource group or subscription</b>: <code>az resource move</code> or the portal, with the NIC, disks and public IP. The region doesn't change.</li>
<li><b>Another region</b>: <b>Azure Resource Mover</b> (or Site Recovery).</li>
<li><b>Into a zone</b>: for an existing regional VM, use the portal's zone move (Site Recovery-based) or rebuild from snapshots.</li>
<li><b>Into an availability set</b>: you can't add an existing VM; recreate it from its disks.</li></ul>
<div class="viz" id="viz-moveq"></div>`},
{id:"vmss",num:"3.5",title:"Virtual Machine Scale Sets",html:`
<p>A <b>Virtual Machine Scale Set</b> (VMSS) deploys and manages a group of load-balanced VMs from one configuration, and scales the number of instances automatically.</p>
<ul><li><b>Orchestration modes</b>: <b>Flexible</b> (recommended; mix sizes, full VM APIs, spread across zones and fault domains) and <b>Uniform</b> (identical instances, managed as a group).</li>
<li><b>Upgrade policy</b> for model changes: <b>Manual</b>, <b>Automatic</b> or <b>Rolling</b> (batches, with health checks).</li>
<li>Spread instances across <b>availability zones</b> for 99.99%. Up to 1,000 instances (Flexible).</li></ul>
<h3>Autoscale</h3>
<p><b>Autoscale</b> settings (in Azure Monitor) change the instance count:</p>
<ul><li><b>Instance limits</b>: minimum, maximum and default.</li>
<li><b>Metric rules</b>, for example scale out by 1 when average CPU &gt; 70% for 10 minutes, scale in by 1 when &lt; 30%. Always pair a scale-out rule with a scale-in rule.</li>
<li><b>Schedule</b>-based profiles, for example 10 instances on weekdays 8:00–18:00.</li>
<li>A <b>cooldown</b> (default 5 minutes) waits after a scale action before evaluating again.</li>
<li><b>Predictive autoscale</b> forecasts CPU load from history.</li></ul>
<div class="viz" id="viz-autoscale"></div>
<div class="viz" id="viz-vmssdrill"></div>`},
{id:"containers",num:"3.6",title:"Containers: ACR, Container Instances and Container Apps",html:`
<p>Containers package an app with its dependencies. AZ-104 covers three services:</p>
<h3>Azure Container Registry (ACR)</h3>
<ul><li>A private registry for container images and artifacts. Name: 5–50 alphanumeric characters, globally unique (<code>contosoacr.azurecr.io</code>).</li>
<li>Tiers: <b>Basic</b>, <b>Standard</b>, <b>Premium</b>. Only Premium adds <b>geo-replication</b>, private endpoints and content trust.</li>
<li><b>ACR Tasks</b> build images in the cloud (<code>az acr build</code>), no local Docker needed. <code>az acr import</code> copies images from other registries.</li>
<li>Authenticate with Entra ID (<code>az acr login</code>), managed identities with the <b>AcrPull</b> role, or the admin account (off by default; avoid).</li></ul>
<h3>Azure Container Instances (ACI)</h3>
<ul><li>The fastest way to run a container: no VMs or orchestrator. Billed per second for CPU and memory.</li>
<li>A <b>container group</b> shares a host, network and storage (like a Kubernetes pod).</li>
<li>Public IP with a <b>DNS name label</b> (<code>label.region.azurecontainer.io</code>) or private IP in a VNet. Mount Azure Files shares for persistent data.</li>
<li><b>Restart policy</b>: <b>Always</b> (default; web apps), <b>OnFailure</b> or <b>Never</b> (batch jobs that run once).</li></ul>
<h3>Azure Container Apps</h3>
<ul><li>Serverless containers for microservices and APIs, built on Kubernetes with KEDA and Dapr, without managing a cluster.</li>
<li>Apps live in a <b>Container Apps environment</b> (shared network and logging).</li>
<li><b>Ingress</b> (external or internal), <b>revisions</b> with traffic splitting, and <b>scale rules</b> (HTTP, events, CPU). Can <b>scale to zero</b>.</li>
<li>CPU and memory come in fixed pairs (0.25 vCPU / 0.5 GiB up to 4 vCPU / 8 GiB on Consumption).</li></ul>
<div class="viz" id="viz-cpick"></div>
<div class="viz" id="viz-acidrill"></div>`},
{id:"appsvc",num:"3.7",title:"Azure App Service",html:`
<p><b>App Service</b> hosts web apps, REST APIs and mobile back ends (.NET, Java, Node.js, Python, PHP, or a container) on Windows or Linux, fully managed.</p>
<h3>App Service plans</h3>
<p>A <b>plan</b> is the set of VMs (workers) that apps run on: region, OS, tier and instance count. Every app in a plan shares its workers and its cost.</p>
<div class="viz" id="viz-tier"></div>
<ul><li><b>Scale up</b>: change the tier or size (more CPU, memory, features).</li>
<li><b>Scale out</b>: add instances, manually or with <b>autoscale</b> (Standard and higher), or <b>automatic scaling</b> (Premium v2/v3).</li>
<li><b>Zone redundancy</b> (Premium v2/v3 and Isolated v2) needs at least 3 instances.</li></ul>
<h3>Deployment slots</h3>
<p><b>Slots</b> (Standard: 5, Premium: 20) are live copies of the app with their own host names, for example <code>contoso-shop-staging.azurewebsites.net</code>. Deploy to <b>staging</b>, warm it up and test, then <b>swap</b> with production: no downtime, and swapping again rolls back. Settings marked as <b>deployment slot settings</b> ("sticky") stay with their slot; others move with the code.</p>
<div class="viz" id="viz-swap"></div>
<h3>Other configuration</h3>
<ul><li><b>Custom domains</b>: add a <b>CNAME</b> (subdomain) or an <b>A record</b> plus a <b>TXT</b> record <code>asuid.&lt;domain&gt;</code> for verification. Not on Free. Then bind a <b>TLS/SSL certificate</b> (a free App Service managed certificate, an imported one, or one from Key Vault) with SNI SSL.</li>
<li><b>Backup</b>: automatic backups on Basic and higher; custom scheduled backups to a storage account on Standard and higher.</li>
<li><b>Networking</b>: <b>VNet integration</b> for outbound calls into a VNet; <b>private endpoints</b> and <b>access restrictions</b> for inbound.</li>
<li><b>Always On</b> keeps the app loaded (not on Free); <b>HTTPS Only</b>; app settings and connection strings become environment variables.</li></ul>`}
];

  name: storageName

  properties: { minimumTlsVersion: 'TLS1_2', allowBlobPublicAccess: false }
}

resource plan 'Microsoft.Web/serverfarms@2023-12-01' = {
  name: 'plan-\${storageName}'
  location: location
  sku: { name: 'B1' }
}

{id:"vnets",num:"4.1",title:"Virtual networks, subnets and IP addresses",html:`
<p>A <b>virtual network</b> (VNet) is your private network in one Azure region and one subscription. It has one or more <b>address spaces</b> in CIDR notation, usually private ranges from RFC 1918 (<code>10.0.0.0/8</code>, <code>172.16.0.0/12</code>, <code>192.168.0.0/16</code>). Plan address spaces so they <b>don't overlap</b> with other VNets or on-premises networks you'll connect to, because overlapping networks can't be peered or routed.</p>
<h3>Subnets</h3>
<p>Subnets divide a VNet. Every subnet must fit inside the address space and can't overlap another subnet. Azure <b>reserves 5 addresses</b> in every subnet: the network address, <code>.1</code> (default gateway), <code>.2</code> and <code>.3</code> (Azure DNS), and the broadcast address. The smallest subnet is a <b>/29</b> (8 addresses, 3 usable).</p>
<div class="viz" id="viz-cidr"></div>
<p>Some services need a dedicated subnet with a fixed name: <b>GatewaySubnet</b> (VPN and ExpressRoute gateways; /27 or larger recommended) and <b>AzureBastionSubnet</b> (/26 or larger). Others use <b>subnet delegation</b> (for example App Service VNet integration or Azure Container Instances).</p>
<div class="viz" id="viz-subnetplan"></div>
<h3>IP addresses</h3>
<ul><li><b>Private IPs</b> come from the subnet, assigned <b>dynamically</b> (the next free address; kept until the NIC is deleted) or <b>statically</b> (one you choose).</li>
<li><b>Public IPs</b> are separate resources. The <b>Standard SKU</b> is static, zone-redundant or zonal, and <b>secure by default</b> (closed until an NSG allows traffic). The Basic SKU was retired in September 2025.</li>
<li>Public IP <b>prefixes</b> give you a contiguous block of public addresses.</li>
<li>Resources in a VNet get outbound internet access through a <b>NAT gateway</b> (recommended), a load balancer outbound rule or an instance-level public IP. Default outbound access for new VNets is being retired, so plan explicit outbound.</li></ul>`},
{id:"peering",num:"4.2",title:"Virtual network peering",html:`
<p><b>VNet peering</b> connects two VNets so their resources talk over private IPs on the Microsoft backbone, with low latency and no gateway.</p>
<ul><li><b>Regional</b> peering (same region) and <b>global</b> peering (different regions). Peerings can cross subscriptions and even tenants.</li>
<li>A peering is created on <b>both sides</b>. One side alone shows <b>Initiated</b>; when both exist they show <b>Connected</b>.</li>
<li>Address spaces <b>can't overlap</b>. After you change a peered VNet's address space, <b>sync</b> the peering.</li>
<li>Peering is <b>not transitive</b>: if A peers with Hub and Hub peers with B, A can't reach B. Fix it with a direct A↔B peering, or route through a firewall or NVA in the hub with user-defined routes (and <b>Allow forwarded traffic</b> on the peerings), or use Azure Virtual WAN.</li>
<li><b>Gateway transit</b>: spokes can use the hub's VPN or ExpressRoute gateway. Turn on <b>Allow gateway transit</b> on the hub side and <b>Use remote gateways</b> on the spoke side.</li></ul>
<div class="viz" id="viz-peer"></div>
<div class="viz" id="viz-peersettings"></div>
<p>To connect a VNet to <b>on-premises</b>, use a <b>VPN gateway</b> (site-to-site IPsec over the internet, or point-to-site for single clients) or <b>ExpressRoute</b> (a private circuit through a connectivity provider). VNet-to-VNet VPN connections are an alternative to peering when you need encryption.</p>`},
{id:"routes",num:"4.3",title:"User-defined routes",html:`
<p>Azure creates <b>system routes</b> for every subnet: traffic within the VNet, to peered VNets, to the internet (<code>0.0.0.0/0</code> → Internet) and drops for some private ranges. <b>User-defined routes</b> (UDRs) in a <b>route table</b> override them.</p>
<ul><li>A route has an <b>address prefix</b> and a <b>next hop type</b>: <b>Virtual appliance</b> (with an IP, such as Azure Firewall or a third-party NVA), <b>Virtual network gateway</b>, <b>Virtual network</b>, <b>Internet</b> or <b>None</b> (drop).</li>
<li>Associate a route table with one or more <b>subnets</b> (each subnet has at most one route table). It applies to traffic <b>leaving</b> that subnet.</li>
<li>Azure picks the route with the <b>longest prefix match</b>. If prefixes tie, UDRs beat BGP routes, which beat system routes.</li>
<li>An NVA VM must have <b>IP forwarding</b> enabled on its NIC (and in its OS) to pass traffic that isn't addressed to it.</li>
<li><b>Disable gateway route propagation</b> stops on-premises routes learned by BGP from reaching the subnet.</li></ul>
<div class="viz" id="viz-lpm"></div>
<p>Classic pattern: a <b>forced tunneling</b> route <code>0.0.0.0/0 → VirtualAppliance 10.0.100.4</code> on every spoke subnet sends all internet-bound traffic through a firewall in the hub. Use <b>Network Watcher → Next hop</b> or the NIC's <b>Effective routes</b> to check what really applies.</p>
<div class="viz" id="viz-udrq"></div>`},
{id:"nsg",num:"4.4",title:"Network security groups and application security groups",html:`
<p>A <b>network security group</b> (NSG) filters traffic with ordered rules. Associate an NSG with a <b>subnet</b>, a <b>NIC</b>, or both.</p>
<ul><li>Each rule has a <b>priority</b> (100–4096; lower is evaluated first), source and destination (IP ranges, <b>service tags</b> such as <code>Internet</code>, <code>VirtualNetwork</code>, <code>AzureLoadBalancer</code>, <code>Storage</code>, or ASGs), ports, protocol, direction and <b>Allow</b> or <b>Deny</b>.</li>
<li>Processing <b>stops at the first match</b>.</li>
<li><b>Default rules</b> (priority 65000+) can't be deleted but can be overridden: inbound allows VNet and load balancer traffic and denies everything else; outbound allows VNet and internet traffic.</li>
<li>NSGs are <b>stateful</b>: return traffic for an allowed flow is allowed automatically.</li>
<li>With NSGs on both: <b>inbound</b> traffic is checked by the <b>subnet</b> NSG first, then the <b>NIC</b> NSG; <b>outbound</b> by the NIC NSG first, then the subnet NSG. Traffic must be allowed by <b>both</b>.</li></ul>
<div class="viz" id="viz-nsgeval"></div>
<h3>Application security groups</h3>
<p><b>Application security groups</b> (ASGs) let you group VM NICs by role (asg-web, asg-db) and write rules like "allow asg-web → asg-db on 1433" without tracking IP addresses. NICs in an ASG must be in the same VNet as the ASG.</p>
<div class="viz" id="viz-asg"></div>
<h3>Checking effective rules</h3>
<p><b>Effective security rules</b> on a NIC show the combined result of every NSG. <b>IP flow verify</b> (Network Watcher) tests whether a specific packet would be allowed and names the rule that decided it.</p>`},
{id:"secure",num:"4.5",title:"Azure Bastion, service endpoints and private endpoints",html:`
<h3>Azure Bastion</h3>
<p><b>Azure Bastion</b> gives browser-based (or native client) <b>RDP and SSH</b> over TLS 443 to VMs that have <b>no public IP</b>. Deploy it into a subnet named <b>AzureBastionSubnet</b> (/26 or larger) with a Standard public IP. Bastion works for VMs in its VNet and in <b>peered</b> VNets.</p>
<ul><li><b>Developer</b>: free, shared, one connection at a time, no subnet needed.</li>
<li><b>Basic</b>: dedicated, fixed 2 instances.</li>
<li><b>Standard</b>: scale units, <b>native client</b> support (az network bastion ssh/rdp), file transfer, IP-based connection, shareable links.</li>
<li><b>Premium</b>: adds session recording and private-only deployment.</li></ul>
<div class="viz" id="viz-bastion"></div>
<h3>Service endpoints and private endpoints</h3>
<p><b>Service endpoints</b> extend a subnet's identity to a PaaS service (Storage, SQL, Key Vault…) so you can allow that subnet in the service's firewall. Traffic stays on the backbone but still goes to the service's <b>public</b> endpoint. <b>Service endpoint policies</b> restrict which storage accounts a subnet can reach.</p>
<p><b>Private endpoints</b> (Azure Private Link) put a <b>NIC with a private IP</b> for a specific resource in your subnet. Clients in the VNet, in peered VNets and on-premises reach the resource privately, and you can disable public access. You need DNS so the service's usual name resolves to the private IP: a <b>private DNS zone</b> such as <code>privatelink.blob.core.windows.net</code> linked to the VNet.</p>
<div class="viz" id="viz-pedns"></div>`},
{id:"dns",num:"4.6",title:"Azure DNS",html:`
<p><b>Azure DNS</b> hosts DNS zones on Microsoft's global name servers.</p>
<h3>Public DNS zones</h3>
<ul><li>Create a zone (for example <code>contoso.com</code>), then <b>delegate</b> it: at your domain registrar, replace the name servers with the four Azure DNS name servers (<code>ns1-0x.azure-dns.com</code>…) shown on the zone.</li>
<li>Record types: <b>A</b> (IPv4), <b>AAAA</b> (IPv6), <b>CNAME</b> (alias to another name; not at the zone apex), <b>MX</b> (mail), <b>TXT</b> (verification, SPF), <b>NS</b>, <b>SOA</b>, <b>SRV</b>, <b>CAA</b>, <b>PTR</b>.</li>
<li><b>Alias records</b> point to an Azure resource (public IP, Traffic Manager, Front Door), even at the apex, and update automatically if its IP changes.</li>
<li>Child domains can be delegated to another zone with NS records.</li></ul>
<div class="viz" id="viz-dnsrec"></div>
<h3>Private DNS zones</h3>
<ul><li>A <b>private DNS zone</b> (for example <code>contoso.internal</code>) resolves names only inside the VNets you <b>link</b> to it.</li>
<li>Turn on <b>auto-registration</b> on a link and VMs in that VNet register their own A records automatically. A VNet can have only <b>one</b> registration zone but can link to up to 1,000 resolution zones.</li>
<li>Without custom DNS, VMs use <b>Azure-provided DNS</b> (168.63.129.16). For hybrid name resolution, use the <b>Azure DNS Private Resolver</b> or your own DNS servers set on the VNet.</li></ul>
<div class="viz" id="viz-pdnsdrill"></div>`},
{id:"lb",num:"4.7",title:"Load balancing and network troubleshooting",html:`
<h3>Azure Load Balancer</h3>
<p><b>Azure Load Balancer</b> works at <b>layer 4</b> (TCP/UDP). It can be <b>public</b> (internet-facing, with a public IP frontend) or <b>internal</b> (private IP frontend).</p>
<ul><li><b>Frontend IP configuration</b>: the address clients connect to.</li>
<li><b>Backend pool</b>: the VM NICs or scale set instances (in one VNet).</li>
<li><b>Health probe</b>: TCP, HTTP or HTTPS check; unhealthy instances stop getting new flows. Probes come from <code>168.63.129.16</code> (service tag AzureLoadBalancer), so NSGs must allow it.</li>
<li><b>Load-balancing rule</b>: frontend port → backend port, with a probe. Distribution: 5-tuple hash (default), or <b>session persistence</b> by client IP (2-tuple) or client IP and protocol (3-tuple).</li>
<li><b>Inbound NAT rules</b>: map a frontend port to one VM (for example 50001 → vm1:22).</li>
<li><b>Outbound rules</b> give backend VMs outbound internet through the frontend IP (SNAT).</li>
<li><b>Standard SKU</b> (the Basic SKU retired in September 2025): zone-redundant, up to 1,000 instances, secure by default (an NSG must allow traffic), <b>HA ports</b> on internal load balancers.</li></ul>
<div class="viz" id="viz-lbflow"></div>
<div class="viz" id="viz-lbpick"></div>
<h3>Troubleshooting with Network Watcher</h3>
<ul><li><b>IP flow verify</b>: is a packet allowed or denied, and by which NSG rule?</li>
<li><b>Next hop</b>: where does traffic from a VM go, and which route table decided it?</li>
<li><b>Effective security rules</b> and <b>effective routes</b> on a NIC.</li>
<li><b>Connection troubleshoot</b>: end-to-end test from a VM to an address and port, showing hops and issues.</li>
<li><b>Packet capture</b>, <b>VPN troubleshoot</b>, <b>topology</b>, and <b>flow logs</b> (VNet flow logs to a storage account, analyzed with Traffic Analytics).</li></ul>
<div class="viz" id="viz-nwpick"></div>`}

const ip2n=s=>{const p=String(s).trim().split(".").map(Number);return p.length===4&&p.every(n=>Number.isInteger(n)&&n>=0&&n<=255)?((p[0]<<24)>>>0)+(p[1]<<16)+(p[2]<<8)+p[3]:null};
const n2ip=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join(".");
const parseC=s=>{const m=/^\s*([\d.]+)\/(\d{1,2})\s*$/.exec(s||"");if(!m)return null;const b=+m[2],a=ip2n(m[1]);if(a==null||b>32)return null;const mask=b?(~0<<(32-b))>>>0:0;return {net:(a&mask)>>>0,bits:b,size:2**(32-b),ok:((a&mask)>>>0)===a}};
