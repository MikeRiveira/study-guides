<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Free interactive Microsoft Azure Fundamentals (AZ-900) study guide with simulations, flashcards, practice exams and a level-up system.">
<title>AZ-900 Study Guide</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="theme-color" content="#060a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IT Study">
<script src="../pwa.js" defer></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Sora:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>

/* Layout: a holographic study console. Hash-routed: a home dashboard of module cards, then per-module tabs. Glass HUD header with rank, XP and streak; tabs; single reading column on a deep-space grid.
   Single dark theme by design: ice-cyan and violet light on ink, gold reserved for XP, ember orange for outages and warnings (AZ-900). */
:root{
  color-scheme:dark;
  --bg:#060a14; --surface:rgba(17,25,46,.62); --surface-solid:#0f172b; --fg:#e9eefb; --muted:#8f9bbb; --line:rgba(150,175,255,.15);
  --accent:#56e0ff; --accent-soft:rgba(86,224,255,.10); --blue:#a495ff; --blue-soft:rgba(164,149,255,.12);
  --good:#5fe3a1; --good-soft:rgba(95,227,161,.11); --bad:#ff7393; --bad-soft:rgba(255,115,147,.12);
  --gold:#ffd27a; --gold-soft:rgba(255,210,122,.12); --threat:#ff9a5c; --threat-soft:rgba(255,154,92,.12); --on-accent:#03141c;
  --glow:0 0 0 1px rgba(86,224,255,.22),0 10px 34px -12px rgba(86,224,255,.45);
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"Sora","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.65;margin:0;font-weight:300;
  background:
    radial-gradient(1100px 560px at 85% -10%,rgba(164,149,255,.18),transparent 60%),
    radial-gradient(900px 520px at -10% 5%,rgba(86,224,255,.13),transparent 60%),
    linear-gradient(rgba(150,175,255,.035) 1px,transparent 1px) 0 0/44px 44px,
    linear-gradient(90deg,rgba(150,175,255,.035) 1px,transparent 1px) 0 0/44px 44px,
    var(--bg);
  background-attachment:fixed}
b,strong{font-weight:600}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0}
code,.mono{font-family:var(--mono);font-size:.88em}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(6,10,20,.74);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--line)}
header .wrap{padding-block:14px 0;display:grid;gap:10px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(24px,5vw,32px);font-weight:700;letter-spacing:.01em;background:linear-gradient(90deg,var(--fg) 40%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--muted)}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--blue));transition:width .3s}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;color:var(--muted);font-family:var(--display);font-weight:700;font-size:15px;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--accent);border-color:var(--accent);text-shadow:0 0 14px rgba(86,224,255,.55)}

main .wrap{padding-block:24px 64px}
.intro{color:var(--muted);margin:0 0 20px}

/* Lessons */
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px}
.toc a{font-size:14px;text-decoration:none;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface)}
.toc a.done{border-color:var(--good);color:var(--good)}
.lesson{border-top:1px solid var(--line);padding-block:28px;scroll-margin-top:170px}
.lesson-head{display:flex;gap:12px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.lesson h2{font-size:22px}
.lesson h2 .num{font-family:var(--mono);color:var(--accent);font-size:15px;margin-right:8px}
.lesson h3{font-size:16px;margin:18px 0 6px}
.lesson p{margin:8px 0;max-width:65ch}
.lesson ul,.lesson ol{padding-left:22px;margin:8px 0}
.lesson li{margin:3px 0}
.check{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:var(--surface)}
.check input{accent-color:var(--good);width:16px;height:16px}
.check:has(input:checked){color:var(--good);border-color:var(--good);background:var(--good-soft)}
.tip{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 6px 6px 0;margin:14px 0;font-size:15.5px}
.tip b{font-family:var(--display)}
.scroll{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
tr:last-child td{border-bottom:0}
td.port{font-family:var(--mono);font-weight:600;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{font-family:var(--mono);font-size:12px;padding:1px 6px;border-radius:4px;background:var(--blue-soft);color:var(--blue)}
.pins{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;max-width:420px;margin:12px 0}
.pin{display:grid;gap:4px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.pin i{display:block;height:44px;border-radius:3px;border:1px solid var(--line)}

/* Flashcards */
.deckbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);margin-left:auto}
.card{perspective:1200px;height:240px;margin:0 0 14px}
.card-inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:grid;place-items:center;text-align:center;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.face .label{position:absolute;top:12px;left:16px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.face .count{position:absolute;top:12px;right:16px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.front .q{font-family:var(--display);font-weight:800;font-size:clamp(22px,5vw,30px)}
.back{transform:rotateY(180deg);background:var(--blue-soft)}
.back .a{font-size:18px;max-width:46ch}
.card-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:9px 16px;font-weight:700}
.btn.primary{background:linear-gradient(120deg,var(--accent),var(--blue));border-color:transparent;color:var(--on-accent);box-shadow:var(--glow)}
.btn.good{border-color:var(--good);color:var(--good)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.hint{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
.empty{text-align:center;padding:40px 16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}

/* Quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.qmeta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:10px;gap:10px;flex-wrap:wrap}
.qtext{font-size:18px;font-weight:700;margin:0 0 14px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:10px 14px}
.opt .k{font-family:var(--mono);font-weight:600;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.explain{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--blue-soft);font-size:15.5px}
.explain b{font-family:var(--display)}
.qnav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;flex-wrap:wrap}
.result{text-align:center;display:grid;gap:12px;justify-items:center}
.score{font-family:var(--display);font-weight:800;font-size:56px;font-variant-numeric:tabular-nums;line-height:1}
.review{text-align:left;width:100%;display:grid;gap:8px;margin-top:8px}
.review div{font-size:15px;padding:8px 12px;border-radius:6px;background:var(--bad-soft)}
/* Interactive diagrams */
.viz{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px;margin:18px 0;display:grid;gap:12px;min-width:0}
.viz-title{font-family:var(--display);font-weight:700;font-size:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.viz-title::before{content:"Try it";font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:linear-gradient(120deg,var(--accent),var(--blue));color:var(--on-accent);padding:2px 7px;border-radius:4px}
.viz-scroll{overflow-x:auto;min-width:0}
.viz svg{width:100%;height:auto;display:block}
.viz .caption{font-size:15.5px;min-height:3.2em;background:var(--bg);border-radius:8px;padding:10px 14px}
.viz .caption b{font-family:var(--display)}
.viz-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.viz-controls .grow{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.viz svg text{fill:var(--fg);font-family:var(--body);font-size:14px}
.viz svg .s-b{font-weight:700}
.viz svg .s-small{font-size:11.5px;fill:var(--muted)}
.s-node{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.s-life{stroke:var(--line);stroke-width:2;stroke-dasharray:4 5}
.s-arrow line{stroke:var(--muted);stroke-width:2.5}
.s-arrow polygon{fill:var(--muted)}
.s-arrow.cur line{stroke:var(--accent)}
.s-arrow.cur polygon{fill:var(--accent)}
.viz svg .s-arrow.cur text{fill:var(--accent)}
.m-link{stroke:var(--line);stroke-width:3;fill:none}
.m-link.wifi{stroke-dasharray:3 6;stroke-linecap:round}
.m-link.on{stroke:var(--accent)}
.m-node{cursor:pointer}
.m-node rect{fill:var(--bg);stroke:var(--line);stroke-width:1.5;transition:fill .2s,stroke .2s}
.m-node:hover rect,.m-node.sel rect{stroke:var(--blue);stroke-width:2.5}
.m-node.on rect{fill:var(--accent-soft);stroke:var(--accent)}
.m-node:focus{outline:none}
.m-node:focus-visible rect{stroke:var(--blue);stroke-width:3}
.m-zone{fill:none;stroke:var(--line);stroke-dasharray:6 6}
.m-dot{fill:var(--accent);stroke:var(--surface);stroke-width:3}
.ch-axis{stroke:var(--muted);stroke-width:1.5}
.ch-hump{stroke-width:2}
.ch-h0{fill:var(--accent);stroke:var(--accent);fill-opacity:.22}
.ch-h1{fill:var(--blue);stroke:var(--blue);fill-opacity:.22}
.ch-h2{fill:var(--good);stroke:var(--good);fill-opacity:.22}
.ch-bad{stroke:var(--bad);stroke-dasharray:5 4}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{min-width:40px;font-family:var(--mono);padding:5px 10px}
.status-good{color:var(--good);font-weight:700}
.status-bad{color:var(--bad);font-weight:700}
.sn-top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.sn-top input[type=range]{flex:1 1 220px;accent-color:var(--accent)}
.sn-prefix{font-family:var(--mono);font-weight:600;font-size:28px;color:var(--accent);min-width:3.2ch}
.bits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.octet{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px}
.bit{font-family:var(--mono);font-size:12px;text-align:center;border-radius:3px;padding:4px 0;background:var(--accent-soft);color:var(--accent)}
.bit.n{background:var(--blue);color:var(--on-accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.sn-grid div{background:var(--bg);border-radius:8px;padding:8px 12px}
.sn-grid span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sn-grid b{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;word-break:break-all}
.rj-plug{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;max-width:440px;padding:10px;border:2px solid var(--line);border-radius:10px 10px 4px 4px;background:var(--bg)}
.rj-slot{display:grid;gap:4px;justify-items:center;background:none;border:0;padding:0;color:var(--muted);font-family:var(--mono);font-size:11px}
.rj-slot i{display:block;width:100%;height:64px;border-radius:3px;border:2px dashed var(--line)}
.rj-slot.filled i{border-style:solid}
.rj-slot.ok i{border-color:var(--good);box-shadow:0 0 0 2px var(--good)}
.rj-slot.no i{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad)}
.rj-pal{display:flex;flex-wrap:wrap;gap:8px}
.rj-wire{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 10px;font-size:14px}
.rj-wire i{display:inline-block;width:26px;height:14px;border-radius:3px;border:1px solid var(--line)}
.rj-wire:disabled{opacity:.35;cursor:default}
/* Simulations */
.sim{border-top:1px solid var(--line);padding-block:24px;display:grid;gap:14px}
.sim:first-of-type{border-top:0;padding-top:4px}
.sim-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.sim-head h2{font-size:22px}
.sim-tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:2px 7px}
.pill-good{font-size:13px;font-weight:700;color:var(--good);background:var(--good-soft);border-radius:999px;padding:2px 10px}
.scenario{background:var(--blue-soft);border-radius:10px;padding:12px 16px;margin:0;max-width:none}
.scenario p{margin:0 0 6px}.scenario ol{margin:0;padding-left:22px}
.sim-pool .chip{font-family:var(--body);font-weight:700}
.sim-pool .chip:disabled{opacity:.3;cursor:default}
.fw{display:grid;gap:6px}
.fw-row{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) minmax(0,8em);gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:9px 12px}
.fw-port{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:14px}
.fw-desc{font-size:14px;color:var(--muted)}
.fw-svc{font-weight:700;border:1px dashed var(--line);border-radius:6px;padding:3px 8px;text-align:center;font-size:14px;color:var(--muted)}
.fw-row.filled .fw-svc{border-style:solid;color:var(--fg);background:var(--bg)}
.fw-row.ok{border-color:var(--good);background:var(--good-soft)}
.fw-row.no{border-color:var(--bad);background:var(--bad-soft)}
@media (max-width:560px){.fw-row{grid-template-columns:minmax(0,1fr) auto}.fw-desc{grid-column:1/-1;order:3}}
.router{border:2px solid var(--fg);border-radius:10px;overflow:hidden;background:var(--surface)}
.router-bar{display:flex;justify-content:space-between;gap:10px;background:var(--fg);color:var(--bg);padding:6px 12px;font-size:13px;font-weight:700}
.router-tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--bg)}
.router-tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;color:var(--muted);font-weight:700;font-size:14px;white-space:nowrap}
.router-tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--blue);background:var(--surface)}
.router-body{padding:14px 16px;display:grid;gap:10px}
.router-body h4{margin:8px 0 0;font-family:var(--display);font-size:14px}
.rf{display:grid;grid-template-columns:minmax(0,12em) minmax(0,1fr);gap:10px;align-items:center;font-size:14px}
.rf>span{color:var(--muted)}
.rf input:not([type=checkbox]),.rf select{font:inherit;font-family:var(--mono);font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:100%;min-width:0}
.rf-tog input{justify-self:start;width:20px;height:20px;accent-color:var(--blue)}
.fwline{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
@media (max-width:480px){.rf{grid-template-columns:1fr;gap:4px}}
.grade{display:grid;gap:6px}
.grade div{border-radius:8px;padding:8px 12px;font-size:15px;display:grid;gap:2px}
.grade .g-ok{background:var(--good-soft);color:var(--good)}
.grade .g-no{background:var(--bad-soft)}
.grade .g-no b{color:var(--bad)}
.grade span{font-size:14px}
.levels{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin-bottom:6px}
.lv0{background:var(--line)}.lv1{background:var(--bad)}.lv2{background:var(--accent)}.lv3{background:var(--blue)}.lv4{background:var(--good)}
.levels-legend{margin-bottom:14px}
/* Console polish */
h2,h3,.qtext{font-weight:600}
.btn{background:rgba(255,255,255,.03);transition:border-color .2s,box-shadow .2s,transform .1s}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:active:not(:disabled){transform:translateY(1px)}
.chip{background:rgba(255,255,255,.03)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);box-shadow:var(--glow)}
.viz,.qcard,.router,.scenario,.fw-row,.toc a,.check{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.viz,.qcard{box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 50px -30px rgba(0,0,0,.8)}
.face{background:var(--surface-solid);box-shadow:var(--glow)}
.back{background:linear-gradient(160deg,#151d3d,#0f172b)}
.front .q{font-weight:700;letter-spacing:.01em}
th{background:rgba(255,255,255,.03)}
.tip{background:var(--accent-soft)}
.router{border:1px solid var(--line)}
.router-bar{background:var(--accent-soft);color:var(--accent)}
.opt{background:rgba(255,255,255,.02)}
.score{background:linear-gradient(90deg,var(--accent),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.lesson h2 .num{text-shadow:0 0 12px rgba(86,224,255,.5)}
.m-dot{filter:drop-shadow(0 0 6px var(--accent))}
::selection{background:rgba(86,224,255,.3)}

/* HUD */
.hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.rank-hex{width:52px;height:58px;display:block;cursor:pointer;background:none;border:0;padding:0}
.rank-hex svg{width:100%;height:100%;overflow:visible}
.hex-shape{fill:rgba(86,224,255,.08);stroke:url(#hexgrad);stroke-width:2.5;filter:drop-shadow(0 0 8px rgba(86,224,255,.5))}
.hex-num{fill:var(--fg);font-family:var(--display);font-weight:700;font-size:22px}
.hex-lv{fill:var(--accent);font-family:var(--mono);font-size:7.5px;letter-spacing:.12em}
.hud-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.rank-name{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.02em}
.xp-num{font-family:var(--mono);font-size:12.5px;color:var(--gold);font-variant-numeric:tabular-nums}
.xpbar{height:8px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden;margin:5px 0 3px;box-shadow:inset 0 0 0 1px var(--line)}
.xpbar span{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--gold));box-shadow:0 0 12px rgba(86,224,255,.6);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.hud-sub{font-size:12px;color:var(--muted)}
.streak{display:grid;justify-items:center;line-height:1.1;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--gold-soft)}
.streak svg{width:18px;height:18px}
.streak b{font-family:var(--display);font-size:18px;color:var(--gold)}
.streak span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.streak.off{background:rgba(255,255,255,.03)}.streak.off b{color:var(--muted)}
@media (max-width:520px){.stats{display:none}.rank-hex{width:44px;height:50px}}

/* Toasts and level up */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:grid;gap:8px;justify-items:center;pointer-events:none;width:min(92vw,380px)}
.toast{display:flex;gap:10px;align-items:center;background:rgba(10,16,32,.92);border:1px solid rgba(255,210,122,.35);border-radius:999px;padding:8px 16px;font-size:14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.8),0 0 18px -6px rgba(255,210,122,.5);animation:toastIn .35s ease-out,toastOut .4s ease-in 2.4s forwards}
.toast b{font-family:var(--mono);color:var(--gold)}
.toast.badge{border-color:rgba(164,149,255,.5)}.toast.badge b{color:var(--blue)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-8px)}}
.levelup{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(3,6,14,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.lu-card{position:relative;text-align:center;display:grid;gap:10px;justify-items:center;padding:34px 30px 26px;border-radius:20px;border:1px solid rgba(86,224,255,.35);background:radial-gradient(400px 220px at 50% 0%,rgba(86,224,255,.18),transparent 70%),var(--surface-solid);box-shadow:0 0 60px -10px rgba(86,224,255,.5);max-width:360px;width:100%;animation:luIn .6s cubic-bezier(.2,1.4,.3,1)}
.lu-card .rank-hex{width:96px;height:106px;animation:spinIn .9s ease-out}
.lu-card .hex-num{font-size:24px}
.lu-kicker{font-family:var(--mono);font-size:12px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.lu-rank{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.1}
.lu-card p{margin:0;color:var(--muted);font-size:14px}
@keyframes luIn{from{opacity:0;transform:scale(.85)}}
@keyframes spinIn{from{transform:rotateY(180deg) scale(.6);opacity:0}}

/* Progress tab */
.ladder{display:grid;gap:6px;margin:0 0 28px;padding:0;list-style:none}
.ladder li{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.ladder .lvn{font-family:var(--mono);color:var(--muted)}
.ladder .xpreq{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.ladder li.done .lvn,.ladder li.done .xpreq{color:var(--good)}
.ladder li.cur{border-color:var(--accent);box-shadow:var(--glow);background:var(--accent-soft)}
.ladder li.cur .lvn{color:var(--accent)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bdg{display:grid;justify-items:center;text-align:center;gap:6px;padding:16px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.bdg svg{width:58px;height:64px;overflow:visible}
.bdg .bh{fill:rgba(255,255,255,.03);stroke:var(--line);stroke-width:2}
.bdg .bt{fill:var(--muted);font-family:var(--display);font-weight:700;font-size:18px}
.bdg.on{border-color:rgba(164,149,255,.45);background:linear-gradient(180deg,var(--blue-soft),transparent)}
.bdg.on .bh{fill:rgba(164,149,255,.12);stroke:url(#hexgrad);filter:drop-shadow(0 0 8px rgba(164,149,255,.6))}
.bdg.on .bt{fill:var(--fg)}
.bdg b{font-family:var(--display);font-size:15px}
.bdg span{font-size:12.5px;color:var(--muted);line-height:1.4}
.bdg:not(.on) b{color:var(--muted)}
.xp-guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:0 0 28px}
.xp-guide div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);font-size:14px}
.xp-guide b{display:block;font-family:var(--mono);color:var(--gold);font-weight:600}
h2.sec{font-size:18px;margin:0 0 12px;letter-spacing:.02em}
@media (prefers-reduced-motion: reduce){.toast,.lu-card,.lu-card .rank-hex{animation:none}.xpbar span{transition:none}}
@media (prefers-reduced-motion: reduce){.card-inner,.bar span{transition:none}}

/* Guide shell: dashboard, breadcrumbs, order sims */
.crumbs{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}
.crumbs a{color:var(--accent);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
#head{display:grid;gap:4px}
.resume{display:grid;gap:2px;text-decoration:none;color:var(--fg);border:1px solid rgba(86,224,255,.4);border-radius:14px;padding:14px 18px;margin-bottom:22px;background:linear-gradient(120deg,var(--accent-soft),var(--blue-soft));box-shadow:var(--glow)}
.resume span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.resume b{font-family:var(--display);font-size:19px}
.resume em{font-style:normal;font-size:13px;color:var(--muted)}
h2.sec .mono{color:var(--muted);font-size:12px;margin-left:6px;font-weight:400}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:26px}
.mod-card{display:grid;gap:6px;align-content:start;text-decoration:none;color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .2s,box-shadow .2s,transform .2s}
a.mod-card:hover{border-color:var(--accent);box-shadow:var(--glow);transform:translateY(-2px)}
.mod-card b{font-family:var(--display);font-size:17px;font-weight:600;line-height:1.25}
.mc-top{display:flex;justify-content:space-between;align-items:center}
.mc-num{font-family:var(--mono);font-size:26px;color:var(--accent);text-shadow:0 0 14px rgba(86,224,255,.45)}
.mc-meta{font-size:12.5px;color:var(--muted)}
.mc-bar{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.06)}
.mc-bar i{display:block;height:100%;border-radius:2px;background:var(--blue)}
.mod-card.locked{opacity:.55}
.mod-card.locked .mc-num{color:var(--muted);text-shadow:none}
.soon{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:2px 8px}
.ring{width:52px;height:52px}
.ring-bg{fill:none;stroke:rgba(255,255,255,.07);stroke-width:5}
.ring-fg{fill:none;stroke:url(#hexgrad);stroke-width:5;stroke-linecap:round}
.ring text{fill:var(--fg);font-family:var(--mono);font-size:13px}
.hint.left{text-align:left}
.ranks-link{display:inline-block;text-decoration:none;margin-top:6px}
.bdg em{font-style:normal;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.rank-hex{text-decoration:none}
.ord{display:grid;gap:6px}
.ord-row{display:grid;grid-template-columns:2em minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:1px dashed var(--line);background:rgba(255,255,255,.02);color:var(--muted);border-radius:8px;padding:9px 12px;font-size:15px}
.ord-row.filled{border-style:solid;color:var(--fg);background:var(--surface)}
.ord-row.ok{border-color:var(--good);background:var(--good-soft)}
.ord-row.no{border-color:var(--bad);background:var(--bad-soft)}
.ord-n{font-family:var(--mono);color:var(--accent);font-weight:600}
.ord-pool{display:grid;gap:6px}
.ord-pool .opt:disabled{opacity:.3}

/* Hardware module diagrams */
.pt-plate{fill:rgba(255,255,255,.03);stroke:var(--line);stroke-width:1.5}
.pt-body{fill:#c9d2e6;stroke:#8d9ab8}
.pt-in{fill:#141c30}
.pt-vga{fill:#3f6fd1;stroke:#2c55a8}
.pt-dvi{fill:#e8ecf5;stroke:#9aa6c0}
.pt-pin{fill:#141c30}
.pt-hit{fill:transparent;stroke:transparent;stroke-width:2}
.pt{cursor:pointer}
.pt:hover .pt-hit,.pt:focus-visible .pt-hit{stroke:var(--blue)}
.pt.seen .pt-hit{stroke:var(--good);stroke-dasharray:3 3}
.pt.sel .pt-hit{stroke:var(--accent);stroke-dasharray:none;filter:drop-shadow(0 0 6px var(--accent))}
.pt:focus{outline:none}
.ram-board{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:10px;background:rgba(95,227,161,.04)}
.ram-cpu{width:70px;height:70px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;font-family:var(--mono);color:var(--muted);background:var(--surface)}
.ram-slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ram-slot{display:grid;gap:6px;justify-items:center;background:none;border:0;color:var(--muted);font-family:var(--mono);font-size:12px;padding:0}
.ram-slot .ram-stick{display:grid;place-items:center;width:100%;height:110px;border-radius:4px;border:2px dashed var(--line);font-size:11px;writing-mode:vertical-rl;color:var(--on-accent);font-weight:600}
.ram-slot.chA .ram-stick{background:rgba(86,224,255,.05)}.ram-slot.chB .ram-stick{background:rgba(164,149,255,.05)}
.ram-slot.on .ram-stick{border-style:solid;border-color:transparent}
.ram-slot.on.chA .ram-stick{background:linear-gradient(90deg,#3cc9e8,#56e0ff);box-shadow:0 0 14px -2px rgba(86,224,255,.6)}
.ram-slot.on.chB .ram-stick{background:linear-gradient(90deg,#8f7ff0,#a495ff);box-shadow:0 0 14px -2px rgba(164,149,255,.6)}
.ram-slot b{color:var(--fg)}
.race{display:grid;gap:10px}
.race-row{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr) 4.5em;gap:10px;align-items:center}
.race-name{font-size:14px;display:grid}.race-name em{font-style:normal;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.race-track{height:14px;border-radius:7px;background:rgba(255,255,255,.05);overflow:hidden}
.race-track i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,var(--accent),var(--blue))}
.race-time{text-align:right;font-size:13px}
@media (max-width:520px){.race-row{grid-template-columns:minmax(0,1fr) 4.5em}.race-track{grid-column:1/-1;grid-row:2}}
.raid-drives{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.drive{display:grid;gap:2px;justify-items:start;text-align:left;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01));color:var(--fg);font-size:13px}
.drive b{font-family:var(--display);font-weight:600}
.drive em{font-style:normal;font-size:11px;color:var(--muted);font-family:var(--mono)}
.drive .led{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}
.drive.pair-a{border-left:3px solid var(--accent)}.drive.pair-b{border-left:3px solid var(--blue)}
.drive.failed{border-color:var(--bad);background:var(--bad-soft)}
.drive.failed .led{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.drive.failed em{color:var(--bad)}
.mb-pcb{fill:rgba(40,90,70,.18);stroke:rgba(95,227,161,.25);stroke-width:1.5}
.mb rect,.mb circle{fill:rgba(255,255,255,.05);stroke:var(--line);stroke-width:1.5;transition:fill .2s,stroke .2s}
.mb:hover rect,.mb:hover circle,.mb.sel rect,.mb.sel circle{stroke:var(--accent);stroke-width:2.5}
.mb.on rect,.mb.on circle{fill:var(--accent-soft)}
.viz svg .mb-label{font-size:11px}
.psu-form{display:grid;gap:10px}
.psu-form input[type=range]{accent-color:var(--accent);width:100%}
.psu-meter{height:12px;border-radius:6px;background:rgba(255,255,255,.05);overflow:hidden}
.psu-load{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--good),var(--gold));transition:width .3s}
.drum{fill:rgba(95,227,161,.10);stroke:var(--good);stroke-width:2}
.paper{stroke:var(--fg);stroke-width:3;opacity:.5}
.spin{fill:none;stroke:var(--muted);stroke-width:2}.spin-h{fill:var(--muted)}
.beam{stroke:var(--bad);stroke-width:3;stroke-dasharray:4 4;opacity:.25}
.beam.on{opacity:1;filter:drop-shadow(0 0 6px var(--bad))}
.fuser{fill:rgba(255,210,122,.15);stroke:var(--gold);stroke-width:2}
.station rect{fill:var(--surface-solid);stroke:var(--line);stroke-width:1.5;transition:all .25s}
.station.done rect{stroke:var(--good)}
.station.on rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.5;filter:drop-shadow(0 0 8px rgba(86,224,255,.6))}
.viz svg .station.on text{fill:var(--accent);font-weight:700}

/* Mobile module diagrams */
.lt-case{fill:rgba(255,255,255,.025);stroke:var(--line);stroke-width:2}
.disp{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:560px){.disp{grid-template-columns:1fr}}
.disp-stack{display:grid;gap:4px;perspective:600px}
.layer{position:relative;padding:8px 12px;border-radius:6px;font-size:13.5px;border:1px solid color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 16%,transparent);transform:rotateX(18deg);animation:layerIn .4s ease-out both;animation-delay:calc(var(--i)*60ms)}
@keyframes layerIn{from{opacity:0;transform:rotateX(18deg) translateY(-8px)}}
.disp-demo{display:grid;gap:6px;justify-items:center}
.disp-demo em{font-style:normal;font-size:12px;color:var(--muted)}
.disp-screen{position:relative;width:100%;max-width:220px;aspect-ratio:16/10;border-radius:8px;border:6px solid #1b2236;overflow:hidden}
.disp-screen .moon{position:absolute;width:26%;aspect-ratio:1;border-radius:50%;background:#f4f6ff;top:28%;left:37%}
.black-gray{background:#2a2f3a}
.black-zones{background:radial-gradient(circle at 50% 46%,#3a3f4c 0 26%,#07080b 40%)}
.black-off{background:#000}
.rg-bar{fill:rgba(255,255,255,.05);stroke:var(--line)}
.rg-bar.ok{fill:var(--accent-soft);stroke:var(--accent)}
.rg-mark{stroke:var(--gold);stroke-width:2;stroke-dasharray:4 3}
.s-note{display:block;font-size:12px;color:var(--muted);margin-top:4px}
@media (prefers-reduced-motion: reduce){.layer{animation:none}}

/* Virtualization and cloud diagrams */
.alloc{display:grid;gap:8px}
.al-row{display:grid;grid-template-columns:6em minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.al-track{display:flex;height:14px;border-radius:7px;background:rgba(255,255,255,.05);overflow:hidden}
.al-host{background:rgba(143,155,187,.45)}
.al-vm{background:linear-gradient(90deg,var(--accent),var(--blue))}
.al-vm.over{background:var(--bad)}
.vm-list{display:flex;flex-wrap:wrap;gap:6px}
.vm-chip{display:grid;grid-template-columns:auto auto;gap:0 8px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 10px;font-size:13px}
.vm-chip span{grid-column:1;font-family:var(--mono);font-size:11px;color:var(--muted)}
.vm-chip em{grid-column:2;grid-row:1/3;align-self:center;font-style:normal;color:var(--muted)}
.vm-chip:hover{border-color:var(--bad)}
.stack{display:grid;gap:6px}
.st-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.st-col{display:grid;gap:6px;align-content:end}
.st-blk{border-radius:8px;padding:9px 10px;text-align:center;font-size:13.5px;border:1px solid var(--line);animation:layerIn .35s ease-out both}
.st-blk.app{background:var(--accent-soft);border-color:rgba(86,224,255,.4)}
.st-blk.guest{background:var(--blue-soft);border-color:rgba(164,149,255,.4)}
.st-blk.hv{background:var(--gold-soft);border-color:rgba(255,210,122,.45);font-weight:600}
.st-blk.os{background:var(--good-soft);border-color:rgba(95,227,161,.4)}
.st-blk.hw{background:rgba(255,255,255,.05)}
.cloud-g ellipse{fill:var(--blue-soft);stroke:var(--blue);stroke-width:2}
.cloud-g.priv ellipse{fill:var(--good-soft);stroke:var(--good)}
.cloud-g.comm ellipse{fill:var(--gold-soft);stroke:var(--gold)}
table.resp td,table.resp th{text-align:center}
table.resp td:first-child{text-align:left;white-space:nowrap}
table.resp td.you{color:var(--accent)}
table.resp td.prov{color:var(--muted)}
table.resp td.cur.you{background:var(--accent-soft);font-weight:600}
table.resp td.cur.prov{background:rgba(255,255,255,.04)}
.legend i.you{background:var(--accent)}.legend i.prov{background:var(--muted)}
.el-cap{fill:none;stroke:var(--good);stroke-width:2.5}
.el-load{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round}
.viz svg .el-cap-t{fill:var(--good)}
/* ---- Module 5: Troubleshooting ---- */
.ah{fill:var(--line)}
.loop{stroke:var(--line);stroke-width:2;fill:none;stroke-dasharray:5 5;transition:stroke .25s}
.loop.on{stroke:var(--gold);filter:drop-shadow(0 0 6px rgba(255,210,122,.6))}
.esc{stroke:var(--line);stroke-width:1.5;fill:none;stroke-dasharray:2 4}
.station text{fill:var(--fg)}
.boot{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px;margin:14px 0}
.bt-st{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.02);font-size:13px;line-height:1.25;color:var(--muted);transition:all .25s}
.bt-st .mono{font-family:var(--mono);font-size:12px;opacity:.7}
.bt-st.ok{border-color:var(--good);color:var(--fg);background:rgba(95,227,161,.08)}
.bt-st.fail{border-color:var(--bad);color:var(--bad);background:rgba(255,115,147,.1);box-shadow:0 0 14px rgba(255,115,147,.35)}
.term{font-family:var(--mono);font-size:13px;line-height:1.55;background:#05080f;border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto;white-space:pre;min-height:120px;margin:12px 0}
.term .t-c{color:var(--accent)}.term .t-n{color:var(--muted)}.term .t-ok{color:var(--good)}.term .t-bad{color:var(--bad)}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;margin:12px 0}
.pg{background:none;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--fg);cursor:pointer;transition:all .2s}
.pg:hover,.pg.sel{border-color:var(--accent);box-shadow:var(--glow)}
.pg em{font-style:normal;font-size:13px}
.pg-sheet{position:relative;width:78px;height:100px;background:#f4f6fa;border-radius:3px;padding:10px 8px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.pg-sheet i{display:block;height:4px;background:#2a2f3a;border-radius:2px}
.pg-sheet i:nth-child(2n){width:80%}

<script>
/* ================= AZ-900 Study Guide engine =================
   Adapted from the Security+ guide engine. One page, hash-routed: #home, #ranks, #exam-1 and one route per module slug.
   Progress lives in this browser only (separate from the other guides). XP is shared across every module. */
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
const $=(sel,root=document)=>root.querySelector(sel);
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const fmt=n=>n.toLocaleString("en-US");

/* ---------- module registry (modules call registerModule) ---------- */
const MODULES=[];
const OUTLINE=[
  {core:1,domain:1,slug:"cloud",title:"Cloud Concepts",weight:27.5,wl:"25–30%"},
  {core:1,domain:2,slug:"architecture",title:"Azure Architecture and Services",weight:37.5,wl:"35–40%"},
  {core:1,domain:3,slug:"governance",title:"Azure Management and Governance",weight:32.5,wl:"30–35%"}
];
const MAXW=40;
const modNum=o=>o.domain;
function registerModule(m){MODULES.push(m)}
const modBySlug=s=>MODULES.find(m=>m.slug===s);

/* ---------- storage ---------- */
const KEY="az900-guide-v1";
let S={earned:{},streak:{n:0,last:null},badges:{},mods:{},tabs:{},last:null,flags:{},days:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&typeof s==="object")S=Object.assign(S,s)}catch(e){}
/* Repair any field that isn't the shape we expect (old, edited or damaged saves), so the page always loads. */
(function(){const D={earned:{},streak:{n:0,last:null},badges:{},mods:{},tabs:{},flags:{},days:{}};
  for(const k in D)if(!S[k]||typeof S[k]!=="object"||Array.isArray(S[k]))S[k]=D[k];
  if(typeof S.streak.n!=="number")S.streak={n:0,last:null};
  for(const k in S.earned)if(typeof S.earned[k]!=="number")delete S.earned[k];
  for(const id in S.mods){const m=S.mods[id];if(!m||typeof m!=="object"){delete S.mods[id];continue}["studied","box","due","sims"].forEach(f=>{if(!m[f]||typeof m[f]!=="object")m[f]={}});if(typeof m.best!=="number")m.best=null}
  if(S.exams&&typeof S.exams!=="object")delete S.exams;
  for(const c in S.exams||{}){const e=S.exams[c];if(!e||typeof e!=="object"){delete S.exams[c];continue}
    e.attempts=Array.isArray(e.attempts)?e.attempts.filter(a=>a&&typeof a.score==="number"):[];if(typeof e.best!=="number")e.best=null}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const MS=id=>S.mods[id]||(S.mods[id]={studied:{},box:{},due:{},best:null,sims:{}});

/* ---------- XP, ranks, streak ---------- */
const RANKS=[[0,"Cloud Trainee"],[120,"Cloud Explorer"],[320,"Cloud Support Associate"],[650,"Cloud Administrator"],[1100,"Cloud Engineer"],[1700,"DevOps Engineer"],[2500,"Solutions Architect"],[3500,"Cloud Architect"],[4800,"Cloud Director"],[6400,"Azure Fundamentals Master"]];
const xpTotal=()=>Object.values(S.earned).reduce((a,b)=>a+b,0);
const xpFor=id=>Object.entries(S.earned).filter(([k])=>k.startsWith(id+":")).reduce((a,[,v])=>a+v,0);
const levelOf=xp=>{let i=0;while(i<RANKS.length-1&&xp>=RANKS[i+1][0])i++;return i};
let gameReady=false,CUR=null;
/* Each reward has a key and pays once, so XP reflects real progress and can't be farmed. */
function awardRaw(key,xp,label){
  if(S.earned[key]!==undefined)return;
  const before=levelOf(xpTotal());S.earned[key]=xp;
  if(!gameReady)return;
  const today=new Date().toDateString();
  if(S.streak.last!==today){const y=new Date(Date.now()-864e5).toDateString();S.streak.n=S.streak.last===y?S.streak.n+1:1;S.streak.last=today}
  const mid=key.split(":")[0],d=(S.days||(S.days={}))[today]||(S.days[today]=[]);if(MODULES.some(m=>m.id===mid)&&!d.includes(mid))d.push(mid);
  const now=new Date();if(now.getHours()<5)S.flags.night=1;if(now.getDay()===0||now.getDay()===6)S.flags.weekend=1;

function ctxFor(m){
  const st=MS(m.id),box=id=>st.box[id]||0;
  return {st,box,
    allStudied:()=>m.lessons.every(l=>st.studied[l.id]),
    earned:k=>S.earned[m.id+":"+k]!==undefined,
    vizAll:()=>(m.vizKeys||[]).every(k=>S.earned[m.id+":viz:"+k]!==undefined),
    passed:id=>!!st.sims[id],
    deckAtLeast:(deck,lv)=>m.cards.filter(c=>!deck||c.deck===deck).every(c=>box(c.id)>=lv),
    countAtLeast:lv=>m.cards.filter(c=>box(c.id)>=lv).length};
}
function completion(m){
  const st=MS(m.id),l=m.lessons.filter(x=>st.studied[x.id]).length/m.lessons.length,
    k=m.cards.filter(c=>(st.box[c.id]||0)>=2).length/m.cards.length,
    s=(m.sims||[]).length?Object.values(st.sims).filter(Boolean).length/m.sims.length:1,b=(st.best??0)/100;
  return Math.round((l+k+s+b)/4*100);
}

/* Match: tap an item, then tap the slot it belongs in. */
function matchSim(el,sim,api){
  const items=shuffleArr(sim.items.map(i=>i[0])),answer=Object.fromEntries(sim.items.map(([a,b])=>[b,a]));
  let place={},picked=null,checked=false;
  function draw(msg){
    const used=Object.values(place);
    el.innerHTML=`${simHead(sim,api)}<p class="scenario">${sim.scenario}</p>
    <div class="chips sim-pool">${items.map(s=>`<button class="chip" data-svc="${s}" aria-pressed="${picked===s}" ${used.includes(s)?"disabled":""}>${s}</button>`).join("")}</div>
    <div class="fw">${sim.slots.map(([k,label,desc])=>{const s=place[k],ok=checked&&s&&answer[k]===s;
      return `<button class="fw-row${s?" filled":""}${checked&&s?(ok?" ok":" no"):""}" data-slot="${k}"><span class="fw-port">${label}</span><span class="fw-desc">${desc||""}</span><span class="fw-svc">${s||"Tap to place"}</span></button>`}).join("")}</div>
    <div class="caption" aria-live="polite">${msg||"Tap a filled row to clear it."}</div>
    <div class="viz-controls"><button class="btn primary" data-a="check">Check answers</button><button class="btn" data-a="reset">Reset</button></div>`;
  }
  el.addEventListener("click",e=>{
    const s=e.target.closest("[data-svc]"),r=e.target.closest("[data-slot]"),a=e.target.closest("[data-a]")?.dataset.a;
    if(s){picked=picked===s.dataset.svc?null:s.dataset.svc;draw();return}
    if(r){const k=r.dataset.slot;checked=false;if(picked){place[k]=picked;picked=null}else delete place[k];draw();return}
    if(a==="reset"){place={};picked=null;checked=false;draw()}
    if(a==="check"){checked=true;const n=sim.slots.length,right=sim.slots.filter(([k])=>place[k]===answer[k]).length;
      if(right===n)api.pass();
      draw(Object.keys(place).length<n?`Fill every row first. ${right} correct so far.`:right===n?`<span class="status-good">All ${n} correct.</span> ${sim.success||""}`:`<span class="status-bad">${n-right} wrong.</span> Fix the rows outlined in red, then check again.`)}
  });
  draw();
}
/* Order: tap steps in the order they happen. */
function orderSim(el,sim,api){
  const pool=shuffleArr(sim.steps.map((s,i)=>i));let seq=[],checked=false;
  function draw(msg){
    el.innerHTML=`${simHead(sim,api)}<p class="scenario">${sim.scenario}</p>
    <div class="ord">${sim.steps.map((_,pos)=>{const i=seq[pos];const ok=checked&&i!==undefined&&i===pos;
      return `<button class="ord-row${i!==undefined?" filled":""}${checked&&i!==undefined?(ok?" ok":" no"):""}" data-pos="${pos}"><span class="ord-n">${pos+1}</span><span>${i!==undefined?sim.steps[i]:"…"}</span></button>`}).join("")}</div>
    <div class="ord-pool">${pool.map(i=>`<button class="opt" data-step="${i}" ${seq.includes(i)?"disabled":""}>${sim.steps[i]}</button>`).join("")}</div>
    <div class="caption" aria-live="polite">${msg||"Tap the steps in order. Tap a placed step to remove it and everything after it."}</div>
    <div class="viz-controls"><button class="btn primary" data-a="check">Check order</button><button class="btn" data-a="reset">Reset</button></div>`;
  }
  el.addEventListener("click",e=>{
    const st=e.target.closest("[data-step]"),p=e.target.closest("[data-pos]"),a=e.target.closest("[data-a]")?.dataset.a;
    if(st&&!st.disabled){seq.push(+st.dataset.step);checked=false;draw();return}
    if(p&&seq[+p.dataset.pos]!==undefined){seq=seq.slice(0,+p.dataset.pos);checked=false;draw();return}
    if(a==="reset"){seq=[];checked=false;draw()}
    if(a==="check"){checked=true;const n=sim.steps.length,right=seq.filter((i,pos)=>i===pos).length;
      if(right===n)api.pass();
      draw(seq.length<n?`Place every step first. ${right} in the right spot so far.`:right===n?`<span class="status-good">Perfect order.</span> ${sim.success||""}`:`<span class="status-bad">${n-right} out of place.</span> Steps outlined in red are in the wrong position.`)}
  });
  draw();
}

      if(right===o.qs.length)award("viz:"+vkey(el),20,o.done||"Aced the scenario drill");return}
    const q=o.qs[i];
    el.innerHTML=`<div class="viz-title">${o.title} <span class="s-small">${i+1} / ${o.qs.length}</span></div><p class="scenario">${q[0]}</p><div class="opts">${P[i].map((k,pos)=>`<button class="opt ${ans!==null&&k===q[2]?"right":""} ${ans===k&&k!==q[2]?"wrong":""}" data-k="${k}" ${ans!==null?"disabled":""}><span class="k">${"ABCDEF"[pos]}</span><span>${q[1][k]}</span></button>`).join("")}</div>
    ${ans!==null?`<div class="explain"><b>${ans===q[2]?"Correct.":"Not quite."}</b> ${q[3]}</div><div class="viz-controls"><button class="btn primary" data-a="next">${i===o.qs.length-1?"Finish":"Next"}</button></div>`:""}`;
  }

}
/* checkSim: select every correct option and none of the wrong ones. sim={scenario,opts:[[text,correct]],success} */
function checkSim(el,sim,api){
  const order=shuffleArr(sim.opts.map((_,i)=>i));let on=new Set(),g=null;
  function d(){el.innerHTML=`${simHead(sim,api)}<p class="scenario">${sim.scenario}</p>
    <div class="hd-list">${order.map(i=>`<label class="hd-i ${g?(sim.opts[i][1]?(on.has(i)?"ok":"miss"):(on.has(i)?"no":"")):""}"><input type="checkbox" data-i="${i}" ${on.has(i)?"checked":""}><span>${sim.opts[i][0]}</span></label>`).join("")}</div>
    <div class="caption" aria-live="polite">${g?(g.ok?`<span class="status-good">Exactly right.</span> ${sim.success||""}`:`${g.miss?`<b>${g.miss}</b> correct choice${g.miss>1?"s":""} missing (amber). `:""}${g.bad?`<span class="status-bad">${g.bad} wrong choice${g.bad>1?"s":""} selected</span> (red).`:""}`):"Select every option that applies, then check."}</div>
    <div class="viz-controls"><button class="btn primary" data-a="check">Check</button></div>`}
  el.addEventListener("change",e=>{const c=e.target.closest("[data-i]");if(!c)return;c.checked?on.add(+c.dataset.i):on.delete(+c.dataset.i);g=null});
  el.addEventListener("click",e=>{if(!e.target.closest("[data-a]"))return;const miss=sim.opts.filter((o,i)=>o[1]&&!on.has(i)).length,bad=sim.opts.filter((o,i)=>!o[1]&&on.has(i)).length;g={miss,bad,ok:!miss&&!bad};if(g.ok)api.pass();d()});
  d();
}
/* choiceSim: a sequence of decisions, each must be right. sim={scenario,steps:[[prompt,[opts],answer,why]],success} */
function choiceSim(el,sim,api){
  let i=0,ans=null,miss=0;const P=sim.steps.map(q=>shuffleArr(q[1].map((_,k)=>k)));
  function d(){
    if(i>=sim.steps.length){el.innerHTML=`${simHead(sim,api)}<p class="scenario">${sim.scenario}</p><div class="caption">${miss?`<span class="status-bad">${miss} wrong call${miss>1?"s":""}.</span> Run it again and get every decision right to pass.`:`<span class="status-good">Every decision correct.</span> ${sim.success||""}`}</div><div class="viz-controls"><button class="btn primary" data-a="again">Run again</button></div>`;if(!miss)api.pass();return}
    const q=sim.steps[i];

    <div class="opts">${P[i].map((k,pos)=>`<button class="opt ${ans!==null&&k===q[2]?"right":""} ${ans===k&&k!==q[2]?"wrong":""}" data-k="${k}" ${ans!==null?"disabled":""}><span class="k">${"ABCDEF"[pos]}</span><span>${q[1][k]}</span></button>`).join("")}</div>
    ${ans!==null?`<div class="explain"><b>${ans===q[2]?"Correct.":"Not the best call."}</b> ${q[3]}</div><div class="viz-controls"><button class="btn primary" data-a="next">${i===sim.steps.length-1?"Finish":"Next step"}</button></div>`:""}`;
  }
  el.addEventListener("click",e=>{const k=e.target.closest("[data-k]"),a=e.target.closest("[data-a]")?.dataset.a;
    if(k&&ans===null){ans=+k.dataset.k;if(ans!==sim.steps[i][2])miss++;d()}
    if(a==="next"){i++;ans=null;d()}if(a==="again"){i=0;miss=0;ans=null;d()}});
  d();
}

/* ---------- flashcards (spaced repetition) ---------- */
const isDue=(st,id)=>(st.due[id]||0)<=Date.now();
function buildOrder(m){
  const st=MS(m.id),box=id=>st.box[id]||0;
  V.order=shuffleArr(m.cards.filter(c=>(V.deck==="all"||c.deck===V.deck)&&(!V.dueOnly||isDue(st,c.id)))).sort((a,b)=>box(a.id)-box(b.id));
  V.pos=0;V.flipped=false;
}
function fmtWait(ms){const mm=Math.ceil(ms/60e3);return mm<60?mm+" min":mm<1440?Math.round(mm/60)+" h":Math.round(mm/1440)+" days"}
function renderCards(m){
  const st=MS(m.id),box=id=>st.box[id]||0,el=$("#cards");
  const inDeck=m.cards.filter(c=>V.deck==="all"||c.deck===V.deck),due=inDeck.filter(c=>isDue(st,c.id)).length;
  const decks=[["all","All ("+m.cards.length+")"],...m.decks.map(([k,l])=>[k,`${l} (${m.cards.filter(c=>c.deck===k).length})`])];
  const lc=LEVELS.map((_,i)=>inDeck.filter(c=>box(c.id)===i).length);
  let body;
  if(!V.order.length){
    const next=Math.min(...inDeck.map(c=>st.due[c.id]||0).filter(t=>t>Date.now()));
    body=`<div class="empty"><b>All caught up.</b><br>${isFinite(next)?`The next card in this deck is due in ${fmtWait(next-Date.now())}.`:""} Switch to <b>Review all</b> to keep practicing anyway.</div>`;
  }else{const c=V.order[V.pos],b=box(c.id),dl=(m.decks.find(d=>d[0]===c.deck)||[,""])[1];
    body=`<div class="card ${V.flipped?"flipped":""}" id="card" tabindex="0" role="button" aria-label="Flashcard. Press to flip.">
      <div class="card-inner">
        <div class="face front"><span class="label">${dl} · ${LEVELS[b]}</span><span class="count">${V.pos+1} / ${V.order.length}</span><div class="q">${c.q}</div></div>
        <div class="face back"><span class="label">Answer</span><span class="count">${LEVELS[b]}</span><div class="a">${c.a}</div></div>
      </div></div>
      <div class="card-actions"><button class="btn" id="prev">Previous</button><button class="btn primary" id="flip">${V.flipped?"Show question":"Show answer"}</button>
        <button class="btn bad" id="again">Still learning</button><button class="btn good" id="knowit">I know this</button></div>
      <p class="hint">Press Space to flip and the arrow keys to move. Cards you miss come back this session. Cards you know come back later: 10 minutes, then 1, 3 and 7 days.</p>`}
  el.innerHTML=`<p class="intro">Cards you miss come back soon, and cards you know come back less often, so your time goes to what you haven't learned yet.</p>
  <div class="levels" aria-label="Cards by level">${LEVELS.map((l,i)=>`<div class="lv lv${i}" style="flex:${Math.max(lc[i],0.0001)}" title="${l}: ${lc[i]}"></div>`).join("")}</div>
  <div class="legend levels-legend">${LEVELS.map((l,i)=>`<span><i class="lv${i}"></i>${l} ${lc[i]}</span>`).join("")}</div>
  <div class="deckbar">${decks.map(d=>`<button class="chip" data-deck="${d[0]}" aria-pressed="${V.deck===d[0]}">${d[1]}</button>`).join("")}
  <span class="toggle"><button class="chip" data-mode="due" aria-pressed="${V.dueOnly}">Due now (${due})</button><button class="chip" data-mode="all" aria-pressed="${!V.dueOnly}">Review all</button></span></div>${body}`;
  el.querySelectorAll("[data-deck]").forEach(b=>b.onclick=()=>{V.deck=b.dataset.deck;buildOrder(m);renderCards(m)});
  el.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{V.dueOnly=b.dataset.mode==="due";buildOrder(m);renderCards(m)});
  if(!V.order.length)return;

  $("#again").onclick=()=>{const c=V.order[V.pos];st.box[c.id]=0;st.due[c.id]=Date.now();save();updateStats(m);
    V.order.splice(V.pos,1);V.order.push(c);if(V.pos>=V.order.length)V.pos=0;V.flipped=false;renderCards(m)};

}

const QUICK=15;
function startQuiz(m){V.qOrder=shuffleArr(m.quiz.map((_,i)=>i));if(V.qMode==="quick")V.qOrder=V.qOrder.slice(0,QUICK);V.qPerm=V.qOrder.map(qn=>shuffleArr(m.quiz[qn].o.map((_,k)=>k)));V.qi=0;V.answers=[]}
function renderQuiz(m){
  const st=MS(m.id),el=$("#quiz"),N=V.qOrder.length,Q=m.quiz;
  const intro=`<p class="intro">${Q.length} exam-style questions, each with an explanation.${st.best!==null?` Your best score so far is <b>${st.best}%</b>.`:""}</p>
  <div class="deckbar"><button class="chip" data-qm="quick" aria-pressed="${V.qMode==="quick"}">Quick quiz (${QUICK} random)</button><button class="chip" data-qm="full" aria-pressed="${V.qMode==="full"}">Full bank (${Q.length})</button></div>`;
  const bindMode=()=>el.querySelectorAll("[data-qm]").forEach(b=>b.onclick=()=>{V.qMode=b.dataset.qm;startQuiz(m);renderQuiz(m)});

  if(V.qi>=N){
    const score=correct(),pct=Math.round(score/N*100);
    if(st.best===null||pct>st.best){st.best=pct;save();updateStats(m)}
    if(pct>=80)award("quiz80",50,"Quiz score of 80% or better");if(V.qMode==="full"&&pct>=90)award("fullbank",100,"Full question bank at 90%+");if(pct===100&&N>=QUICK)award("quiz100",100,"Perfect quiz score");
    const missed=V.qOrder.map((qn,i)=>V.answers[i]!==Q[qn].a?Q[qn]:null).filter(Boolean);
    el.innerHTML=intro+`<div class="qcard result"><div class="eyebrow">Your score</div><div class="score">${score} / ${N}</div><div class="mono">${pct}%</div>
      <div>${pct>=80?"Strong result. You're ready to move on.":pct>=60?"Close. Review the questions below and try again.":"Go back over the lessons, then try again."}</div>
      <button class="btn primary" id="retry">Try again</button>
      ${missed.length?`<div class="review"><b>Review what you missed</b>${missed.map(q=>`<div><b>${q.q}</b><br>Answer: ${q.o[q.a]}. ${q.e}</div>`).join("")}</div>`:""}</div>`;
    bindMode();$("#retry").onclick=()=>{startQuiz(m);renderQuiz(m)};return;
  }
  const qn=V.qOrder[V.qi],q=Q[qn],ans=V.answers[V.qi],done=ans!==undefined;
  el.innerHTML=intro+`<div class="qcard">
    <div class="qmeta"><span>Question ${V.qi+1} of ${N}</span><span>${correct()} correct so far</span></div>
    <p class="qtext">${q.q}</p>
    <div class="opts">${V.qPerm[V.qi].map((i,k)=>`<button class="opt ${done&&i===q.a?"right":""} ${done&&i===ans&&ans!==q.a?"wrong":""}" data-i="${i}" ${done?"disabled":""}><span class="k">${"ABCD"[k]}</span><span>${q.o[i]}</span></button>`).join("")}</div>
    ${done?`<div class="explain"><b>${ans===q.a?"Correct.":"Not quite."}</b> ${q.e}</div>`:""}
    <div class="qnav"><button class="btn" id="restart">Start over</button>${done?`<button class="btn primary" id="next">${V.qi===N-1?"See results":"Next question"}</button>`:""}</div></div>`;
  bindMode();
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{V.answers[V.qi]=+b.dataset.i;if(V.answers[V.qi]===q.a)award("q:"+(q.id||qn),10,"Correct answer");renderQuiz(m)});
  $("#restart").onclick=()=>{startQuiz(m);renderQuiz(m)};
  const nx=$("#next");if(nx)nx.onclick=()=>{V.qi++;renderQuiz(m);el.scrollIntoView({block:"start"})};
}

  <div class="badges">${G.map(b=>{const on=!!S.badges[b.id],hid=b.cat==="Secret"&&!on;return `<div class="bdg${on?" on":""}${b.cat==="Secret"?" secret":""}"><svg viewBox="0 0 100 112" aria-hidden="true"><polygon class="bh" points="${HEX}"/><text x="50" y="66" text-anchor="middle" class="bt">${on?b.mono:"?"}</text></svg><b>${hid?"Hidden achievement":b.name}</b><span>${hid?"Keep exploring the diagrams to find it.":b.desc.replace(/^Secret: /,"")}</span>${!on&&b.prog?`<em class="mono">${b.prog()}</em>`:""}</div>`}).join("")}</div>`}).join("")}`;
}

/* ---------- timed practice exams ----------
   Questions come from every module's bank in the same proportions as the real exam domains.
   No feedback until you submit. The clock keeps running if you leave and come back. */
const EXAM={1:{code:"AZ-900",pass:700}};
const EXAM_LEN={full:[50,45],half:[25,23]};/* [questions, minutes] */
let examTimer=null;

/* ---------- exam-only question bank and practice upgrades ----------
   src/modules/99-exam-bank.js adds questions that only appear in practice exams.
   A question ref is {mid,i} for a module quiz question or {mid,i,b:1} for a bank question. */
const EXAM_BANK={};
function registerExamBank(mid,qs){(EXAM_BANK[mid]||(EXAM_BANK[mid]=[])).push(...qs)}
function qRef(x){if(!x)return null;const m=MODULES.find(m=>m.id===x.mid);if(!m)return null;return (x.b?(EXAM_BANK[x.mid]||[]):m.quiz)[x.i]||null}
const qKey=x=>x.mid+(x.b?"b":"q")+x.i;
function poolQs(m){return m.quiz.map((q,i)=>({mid:m.id,i})).concat((EXAM_BANK[m.id]||[]).map((q,i)=>({mid:m.id,i,b:1})))}
/* Questions you haven't met in a practice exam come first (exam-only ones before quiz ones), then the ones you saw longest ago. */
function freshFirst(ex,qs){const sn=ex.seen||{};return shuffleArr(qs.slice()).map(q=>({q,k:sn[qKey(q)]||(q.b?-1:0)})).sort((a,b)=>a.k-b.k).map(o=>o.q)}
function markSeen(ex,qs){const sn=ex.seen||(ex.seen={});let n=ex.seenN||0;qs.forEach(x=>{sn[qKey(x)]=++n});ex.seenN=n}
const perQ=()=>EXAM_LEN.full[1]*60/EXAM_LEN.full[0];
function paceTxt(r){const N=r.qs.length,used=(Date.now()-r.start)/1000,done=Object.keys(r.ans).length;
  if(used<60&&!done)return `${mmss(Math.round(r.mins*60/N))} per question`;
  const d=Math.round((done*r.mins*60/N-used)/60);
  return Math.abs(d)<1?"On pace":d>0?`${d} min ahead`:`${-d} min behind`}
function paceCls(r){const N=r.qs.length,used=(Date.now()-r.start)/1000,done=Object.keys(r.ans).length;return done*r.mins*60/N-used<=-60?"bad":"ok"}
function poolInfo(c,ex){const p=examPool(c),all=p.flatMap(d=>d.qs),bank=all.filter(x=>x.b).length,sn=ex.seen||{},un=all.filter(x=>!sn[qKey(x)]).length;
  return `<p class="ex-pool"><b class="mono">${all.length}</b> questions in the pool, <b class="mono">${bank}</b> of them exam-only. <b class="mono">${un}</b> you haven't met in a practice exam yet, and those come first.</p>`}
function drillPicker(c){const p=examPool(c);
  return `<h2 class="sec">Domain drill</h2><p class="hint left">A timed 20-question check on one domain at real exam pace. Drills don't count toward your best score or badges.</p>
  <div class="ex-drills">${p.map(d=>`<button class="ex-drill" data-drill="${d.o.slug}"><span class="mono">${d.o.domain}.0</span><b>${d.o.title}</b><em class="mono">${Math.min(20,d.qs.length)} q · ${Math.round(Math.min(20,d.qs.length)*perQ()/60)} min</em></button>`).join("")}</div>`}
function startPractice(c,kind,label,qs){const ex=EXS(c);
  ex.run={qs:qs.map(q=>({mid:q.mid,i:q.i,...(q.b?{b:1}:{}),o:shuffleArr([0,1,2,3])})),ans:{},flag:{},pos:0,start:Date.now(),mins:Math.max(5,Math.round(qs.length*perQ()/60)),kind,label};save();examQuestion(c)}
function wireDrill(c,ex){$("#view").querySelectorAll("[data-drill]").forEach(b=>b.onclick=()=>{
  const d=examPool(c).find(d=>d.o.slug===b.dataset.drill);startPractice(c,"drill",`Domain drill: ${d.o.title}`,freshFirst(ex,d.qs).slice(0,20))})}
function finishPractice(c,ex,r,res,score,used,timeUp){
  ex.run=null;ex.last={res:res.map(o=>({mid:o.x.mid,i:o.x.i,b:o.x.b,pick:o.pick??null})),score,used,timeUp,n:res.length,kind:r.kind,label:r.label};save();
  const target="#exam-"+c+"-result";if(location.hash!==target)location.hash=target;else showExamResult(c)}
function wireRetry(c,L,res){const b=$("#ex-retry");if(b)b.onclick=()=>startPractice(c,"retry","Retry of missed questions",shuffleArr(res.filter(o=>!o.ok).map(o=>({mid:o.mid,i:o.i,b:o.b}))))}
const EXS=c=>{const e=(S.exams||(S.exams={}))["c"+c]||(S.exams["c"+c]={best:null,attempts:[],run:null});
  if(!Array.isArray(e.attempts))e.attempts=[];
  const okQ=x=>!!qRef(x);
  if(e.run&&!(Array.isArray(e.run.qs)&&e.run.qs.length&&e.run.qs.every(okQ)&&e.run.ans&&e.run.flag))e.run=null;
  if(e.last&&!(Array.isArray(e.last.res)&&e.last.res.every(okQ)))e.last=null;
  return e};
function examPool(c){
  return OUTLINE.filter(o=>o.core===c).map(o=>{const m=modBySlug(o.slug);return {o,m,qs:m?poolQs(m):[]}}).filter(d=>d.m);
}
function buildExam(c,n){
  const pool=examPool(c),tw=pool.reduce((a,d)=>a+d.o.weight,0);
  let take=pool.map(d=>Math.min(d.qs.length,Math.round(n*d.o.weight/tw)));
  let diff=n-take.reduce((a,b)=>a+b,0),k=0;
  while(diff!==0&&k<200){const j=k%pool.length;if(diff>0&&take[j]<pool[j].qs.length){take[j]++;diff--}else if(diff<0&&take[j]>0){take[j]--;diff++}k++}
  return shuffleArr(pool.flatMap((d,j)=>freshFirst(EXS(c),d.qs).slice(0,take[j])).map(q=>({...q,o:shuffleArr([0,1,2,3])})));
}
const examQ=x=>qRef(x);
const scaled=pct=>Math.round(10*pct);
const mmss=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
function examLeft(r){return Math.max(0,Math.round((r.start+r.mins*60000-Date.now())/1000))}

function renderExam(c){
  CUR=null;clearInterval(examTimer);
  const ex=EXS(c),r=ex.run;
  $("#nav").hidden=true;$("#stats").hidden=true;
  if(r&&examLeft(r)===0)return finishExam(c,true);
  if(r)return examQuestion(c);
  $("#head").innerHTML=`<div class="crumbs"><a href="../">Roadmap</a><span>/</span><a href="#home">All modules</a><span>/</span>Practice exam</div><h1>AZ-900 practice exam <span class="mono h-code">${EXAM[c].code}</span></h1>`;
  const last=ex.attempts.slice(-5).reverse();
  $("#view").innerHTML=`
  <p class="intro">Questions are drawn from all three modules, weighted like the real exam's domains. There's no feedback until you submit, and the clock keeps running if you leave the page.</p>
  <div class="ex-start">
    <button class="ex-opt" data-len="full"><b>Full exam</b><span class="mono">50 questions · 45 minutes</span><em>About the real exam length (40–60 questions in 45 minutes).</em></button>
    <button class="ex-opt" data-len="half"><b>Half exam</b><span class="mono">25 questions · 23 minutes</span><em>A shorter timed check-in.</em></button>
  </div>
  ${poolInfo(c,ex)}<div class="ex-facts"><div><span class="s-small">PASSING SCORE</span><b class="mono">${EXAM[c].pass} / 1000</b></div><div><span class="s-small">YOUR BEST</span><b class="mono">${ex.best??"—"}</b></div><div><span class="s-small">ATTEMPTS</span><b class="mono">${ex.attempts.length}</b></div></div>
  ${drillPicker(c)}
  ${last.length?`<h2 class="sec">Recent attempts</h2><div class="ex-hist">${last.map(a=>`<div class="${a.score>=EXAM[c].pass?"pass":"fail"}"><b class="mono">${a.score}</b><span>${a.n} questions · ${new Date(a.at).toLocaleDateString()}</span><em>${a.score>=EXAM[c].pass?"Pass":"Below passing"}</em></div>`).join("")}</div>`:""}
  <p class="hint left">The real exam also uses drag-and-drop, yes/no and hot-area items. Practice those with the simulations in each module.</p>`;
  $("#view").querySelectorAll("[data-len]").forEach(b=>b.onclick=()=>{
    const [n,mins]=EXAM_LEN[b.dataset.len];
    ex.run={qs:buildExam(c,n),ans:{},flag:{},pos:0,start:Date.now(),mins};save();examQuestion(c)});
  wireDrill(c,ex);
}
function examQuestion(c){
  const ex=EXS(c),r=ex.run,N=r.qs.length,x=r.qs[r.pos],q=examQ(x),done=Object.keys(r.ans).length;
  $("#head").innerHTML=`<div class="ex-bar"><span class="mono">AZ-900 · Q${r.pos+1}/${N}</span><span class="ex-clockwrap"><span class="ex-clock mono" id="ex-clock">${mmss(examLeft(r))}</span><small class="ex-pace mono ${paceCls(r)}" id="ex-pace">${paceTxt(r)}</small></span><span class="mono">${done} answered</span></div>`;
  $("#view").innerHTML=`<div class="qcard ex-q">
    <div class="qmeta"><span>Question ${r.pos+1} of ${N}</span><button class="chip ex-flag" aria-pressed="${!!r.flag[r.pos]}" id="ex-flag">${r.flag[r.pos]?"⚑ Flagged":"⚐ Flag for review"}</button></div>
    <p class="qtext">${q.q}</p>
    <div class="opts">${x.o.map((oi,k)=>`<button class="opt ${r.ans[r.pos]===oi?"sel":""}" data-oi="${oi}"><span class="k">${"ABCD"[k]}</span><span>${q.o[oi]}</span></button>`).join("")}</div>
    <div class="qnav"><button class="btn" id="ex-prev" ${r.pos===0?"disabled":""}>Previous</button><button class="btn primary" id="ex-next">${r.pos===N-1?"Review and submit":"Next"}</button></div></div>
  <details class="ex-nav-wrap" ${N<=45?"open":""}><summary>Question map <span class="s-small">(${Object.values(r.flag).filter(Boolean).length} flagged)</span></summary>
  <div class="ex-map">${r.qs.map((_,i)=>`<button class="${r.ans[i]!==undefined?"a":""} ${r.flag[i]?"f":""} ${i===r.pos?"cur":""}" data-go="${i}">${i+1}</button>`).join("")}</div></details>
  <div class="viz-controls ex-end"><button class="btn" id="ex-quit">Abandon exam</button><button class="btn" id="ex-submit">Submit now</button></div>`;
  const V2=$("#view");
  V2.querySelectorAll("[data-oi]").forEach(b=>b.onclick=()=>{r.ans[r.pos]=+b.dataset.oi;save();examQuestion(c)});
  V2.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{r.pos=+b.dataset.go;save();examQuestion(c)});
  $("#ex-flag").onclick=()=>{r.flag[r.pos]=!r.flag[r.pos];save();examQuestion(c)};
  $("#ex-prev").onclick=()=>{r.pos--;save();examQuestion(c)};
  $("#ex-next").onclick=()=>{if(r.pos<N-1){r.pos++;save();examQuestion(c);window.scrollTo(0,0)}else examReview(c)};
  $("#ex-submit").onclick=()=>examReview(c);
  $("#ex-quit").onclick=()=>{if(confirm("Abandon this exam? Your answers will be discarded.")){ex.run=null;save();renderExam(c)}};
  tick(c);
}
function tick(c){
  clearInterval(examTimer);
  examTimer=setInterval(()=>{const r=EXS(c).run;if(!r||!location.hash.startsWith("#exam-")){clearInterval(examTimer);return}
    const left=examLeft(r),el=$("#ex-clock");if(el){el.textContent=mmss(left);el.classList.toggle("low",left<300)}
    const pe=$("#ex-pace");if(pe){pe.textContent=paceTxt(r);pe.className="ex-pace mono "+paceCls(r)}
    if(left===0){clearInterval(examTimer);finishExam(c,true)}},1000);
}
function examReview(c){
  const r=EXS(c).run,N=r.qs.length,un=N-Object.keys(r.ans).length,fl=Object.values(r.flag).filter(Boolean).length;
  $("#view").innerHTML=`<div class="qcard"><h2 class="sec">Ready to submit?</h2>
    <p>${un?`<b class="status-bad">${un} unanswered.</b> Unanswered questions are marked wrong. `:"Every question is answered. "}${fl?`${fl} flagged for review.`:""}</p>
    <div class="ex-map">${r.qs.map((_,i)=>`<button class="${r.ans[i]!==undefined?"a":""} ${r.flag[i]?"f":""}" data-go="${i}">${i+1}</button>`).join("")}</div>
    <div class="qnav"><button class="btn" id="ex-back">Keep working</button><button class="btn primary" id="ex-final">Submit exam</button></div></div>`;
  $("#view").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{r.pos=+b.dataset.go;save();examQuestion(c)});
  $("#ex-back").onclick=()=>examQuestion(c);$("#ex-final").onclick=()=>finishExam(c,false);
}
function finishExam(c,timeUp){
  clearInterval(examTimer);
  const ex=EXS(c),r=ex.run;if(!r)return renderExam(c);
  const N=r.qs.length,res=r.qs.map((x,i)=>({x,q:examQ(x),pick:r.ans[i]})).map(o=>({...o,ok:o.pick===o.q.a}));
  const right=res.filter(o=>o.ok).length,pct=right/N*100,score=scaled(pct),pass=score>=EXAM[c].pass;
  const used=Math.min(r.mins*60,Math.round((Date.now()-r.start)/1000));
  markSeen(ex,r.qs);if(r.kind)return finishPractice(c,ex,r,res,score,used,timeUp);
  ex.attempts.push({score,n:N,at:Date.now(),left:r.mins*60-used});if(ex.best===null||score>ex.best)ex.best=score;ex.run=null;ex.last={res:res.map(o=>({mid:o.x.mid,i:o.x.i,b:o.x.b,pick:o.pick??null})),score,used,timeUp,n:N};save();
  awardRaw(`exam:c${c}:done`,100,"Completed a practice exam");if(pass)awardRaw(`exam:c${c}:pass`,250,"Passed a practice exam");
  const target="#exam-"+c+"-result";
  if(location.hash!==target)location.hash=target;else showExamResult(c);
}
function showExamResult(c){
  const ex=EXS(c),L=ex.last;if(!L)return renderExam(c);
  const res=L.res.map(o=>{const q=qRef(o);return {...o,q,ok:o.pick===q.a}});
  const pass=L.score>=EXAM[c].pass,right=res.filter(o=>o.ok).length;
  const doms=OUTLINE.filter(o=>o.core===c).map(o=>{const m=modBySlug(o.slug);const rs=res.filter(x=>m&&x.mid===m.id);return {o,n:rs.length,ok:rs.filter(x=>x.ok).length}}).filter(d=>d.n);
  $("#head").innerHTML=`<div class="crumbs"><a href="../">Roadmap</a><span>/</span><a href="#home">All modules</a><span>/</span><a href="#exam-${c}">Practice exam</a><span>/</span>Results</div><h1>Exam results</h1>`;
  const pos=Math.max(0,Math.min(100,L.score/10));
  $("#view").innerHTML=`<div class="qcard result ex-res ${pass?"pass":"fail"}">
    <div class="eyebrow">${L.timeUp?"Time's up · ":""}${L.kind?L.label+" · ":""}Azure Fundamentals · ${EXAM[c].code}</div>
    <div class="score">${L.score}<span class="mono"> / 1000</span></div>
    <div class="ex-gauge"><i style="left:${EXAM[c].pass/10}%"></i><b style="width:${pos}%"></b></div>
    <div><b class="${pass?"status-good":"status-bad"}">${pass?"Pass":"Below the passing score of "+EXAM[c].pass}</b> · ${right} of ${L.n} correct · ${mmss(L.used)} used</div>
    <div class="qnav" style="justify-content:center"><a class="btn primary" href="#exam-${c}">Back to exam start</a>${right<L.n?`<button class="btn" id="ex-retry">Retry the ${L.n-right} missed</button>`:""}</div></div>
  <h2 class="sec">By domain</h2>
  <div class="ex-doms">${doms.map(d=>{const p=Math.round(d.ok/d.n*100);return `<a href="#${d.o.slug}" class="ex-dom"><span>Domain ${d.o.domain}: ${d.o.title}</span><span class="ex-dbar"><i class="${p>=80?"g":p>=65?"m":"b"}" style="width:${p}%"></i></span><b class="mono">${d.ok}/${d.n}</b></a>`}).join("")}</div>
  <p class="hint left">Weak domains are below 65%. Click one to study it. The 1–1000 score is an estimate: Microsoft doesn't publish how it scales raw scores.</p>
  <h2 class="sec">Review <span class="s-small">${L.n-right} missed</span></h2>
  <div class="deckbar"><button class="chip" data-rv="miss" aria-pressed="true">Missed only</button><button class="chip" data-rv="all" aria-pressed="false">All questions</button></div>

/* ---------- router and boot ---------- */
function route(){
