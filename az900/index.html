<script>
/* ================= Module 1: Cloud Concepts (AZ-900 Domain 1, 25–30%) ================= */
(function(){
const LESSONS=[
{id:"what",num:"1.1",title:"What cloud computing is",html:`
<p><b>Cloud computing</b> is the delivery of computing services over the internet: servers, storage, databases, networking, software, analytics and intelligence. Instead of buying and running your own datacenter, you rent what you need from a <b>cloud provider</b> like Microsoft Azure and pay only for what you use.</p>
<h3>What changes when you move to the cloud</h3>
<ul><li>You don't buy hardware up front or wait weeks for it to arrive. You create resources in minutes.</li>
<li>The provider runs the buildings, power, cooling, physical security and hardware.</li>
<li>You can grow or shrink in minutes, and you're billed for actual use.</li>
<li>Services are reached over a network, usually the internet, through a portal, command line or API.</li></ul>
<div class="viz" id="viz-onprem"></div>
<div class="tip"><b>Exam tip.</b> Cloud computing is about <b>renting compute power and storage from someone else's datacenter</b> and treating it as a service. You still own your data and how you configure things.</div>`},
{id:"shared",num:"1.2",title:"The shared responsibility model",html:`
<p>In a traditional datacenter, your company is responsible for everything: the building, power, network, servers, operating systems, apps and data. In the cloud, those responsibilities are <b>shared</b> between you and the provider.</p>
<ul><li>The <b>cloud provider</b> is always responsible for the <b>physical datacenter</b>, <b>physical network</b> and <b>physical hosts</b>.</li>
<li><b>You</b> are always responsible for your <b>information and data</b>, the <b>devices</b> allowed to connect (phones and PCs), and the <b>accounts and identities</b> of your people.</li>
<li>Everything in between (operating system, network controls, applications, identity and directory infrastructure) depends on the service type.</li></ul>
<p>The more the provider manages, the less you manage: <b>IaaS</b> puts the most responsibility on you, <b>PaaS</b> splits it, and <b>SaaS</b> puts the most on the provider.</p>
<div class="viz" id="viz-shared"></div>
<div class="viz" id="viz-srq"></div>`},
{id:"models",num:"1.3",title:"Cloud models: public, private and hybrid",html:`
<ul><li><b>Public cloud</b>: built, controlled and maintained by a third-party provider. Anyone can buy services. No up-front capital cost, and you can scale quickly. You don't control the hardware.</li>
<li><b>Private cloud</b>: cloud resources used by a single organization. It can be in your own datacenter or hosted by a third party. You get full control, but you pay for and maintain the hardware.</li>
<li><b>Hybrid cloud</b>: public and private clouds connected so they work together. You decide where each workload runs: keep sensitive or legacy systems private, and burst to the public cloud for extra capacity.</li>
<li><b>Multi-cloud</b>: using more than one public cloud provider, such as Azure and another provider, either for different features or during a migration.</li></ul>
<p><b>Azure Arc</b> helps manage hybrid and multi-cloud environments from Azure. <b>Azure VMware Solution</b> lets you run VMware workloads in Azure.</p>
<div class="viz" id="viz-models"></div>
<div class="viz" id="viz-modelcmp"></div>`},
{id:"consume",num:"1.4",title:"The consumption-based model",html:`
<h3>CapEx vs OpEx</h3>
<ul><li><b>Capital expenditure (CapEx)</b>: a one-time, up-front spend on physical infrastructure, like servers and a building. The value is deducted (depreciated) over time.</li>
<li><b>Operational expenditure (OpEx)</b>: spending on services or products over time, billed as you go. You can deduct it in the same year.</li></ul>
<p>Cloud computing is <b>OpEx</b>. It runs on a <b>consumption-based model</b>: you pay only for the resources you use, with no up-front costs, no need to buy and manage infrastructure you might not use, and the ability to add or remove resources as needed.</p>
<div class="viz" id="viz-capex"></div>
<div class="viz" id="viz-cxsort"></div>`},
{id:"pricing",num:"1.5",title:"Cloud pricing models",html:`
<ul><li><b>Pay-as-you-go</b>: the default. Pay per second, hour or transaction with no commitment. Best for short-term, unpredictable or new workloads.</li>
<li><b>Reserved instances</b>: commit to a specific VM size and region for <b>1 or 3 years</b>, and save <b>up to 72%</b> compared with pay-as-you-go. Best for steady workloads that run all the time.</li>
<li><b>Azure savings plan for compute</b>: commit to spending a fixed hourly amount on compute for 1 or 3 years, across sizes and regions. Savings of <b>up to 65%</b>, with more flexibility than reservations.</li>
<li><b>Spot pricing</b>: use Azure's unused capacity at a <b>deep discount (up to 90%)</b>. Azure can <b>evict</b> spot VMs at short notice when it needs the capacity back, so use them only for interruptible work like batch jobs, testing and rendering.</li>
<li><b>Azure Hybrid Benefit</b>: reuse existing Windows Server and SQL Server licenses (with Software Assurance) in Azure to cut costs.</li></ul>
<div class="viz" id="viz-pricecalc"></div>
<div class="viz" id="viz-pickprice"></div>`},
{id:"serverless",num:"1.6",title:"Serverless",html:`
<p>With <b>serverless</b> computing, the provider manages the servers entirely. You write the code or define the workflow, and the platform runs it when it's needed. Servers still exist; you just never see or manage them.</p>
<ul><li><b>Event-driven</b>: code runs in response to a trigger, such as an HTTP request, a timer, a new file or a queue message.</li>
<li><b>Automatic scaling</b>: the platform adds instances as events increase, and scales back down, even <b>to zero</b>, when idle.</li>
<li><b>Pay per execution</b>: you're billed for the time and resources your code actually uses, not for idle servers.</li></ul>
<p>Azure examples: <b>Azure Functions</b> (run code) and <b>Azure Logic Apps</b> (run low-code workflows). Serverless is a kind of PaaS.</p>
<div class="viz" id="viz-serverless"></div>`},
{id:"ha",num:"1.7",title:"High availability and scalability",html:`
<h3>High availability</h3>
<p>A highly available system stays up even when something fails. Availability is measured as a percentage of uptime and promised in a <b>service-level agreement (SLA)</b>. Each extra "nine" cuts allowed downtime by 90%.</p>
<div class="viz" id="viz-sla"></div>
<h3>Scalability</h3>
<p><b>Scalability</b> is the ability to adjust resources to meet demand. Because you pay for what you use, you can add resources when demand rises and remove them when it falls.</p>
<ul><li><b>Vertical scaling</b> (scale up or down): give one resource more or less power, such as more CPUs or RAM for a VM.</li>
<li><b>Horizontal scaling</b> (scale out or in): add or remove instances, such as more VMs behind a load balancer.</li>
<li><b>Elasticity</b>: scaling automatically as demand changes (autoscale).</li></ul>
<div class="viz" id="viz-scale"></div>`},
{id:"benefits",num:"1.8",title:"Reliability, predictability, security, governance and manageability",html:`
<h3>Reliability and predictability</h3>
<ul><li><b>Reliability</b>: the ability to recover from failures and keep working. The cloud's decentralized design lets you spread resources across zones and regions, so an outage in one place doesn't take you down.</li>
<li><b>Performance predictability</b>: knowing the resources you need for a good customer experience. Autoscaling, load balancing and high availability help.</li>
<li><b>Cost predictability</b>: forecasting what you'll spend. Tools like the <b>pricing calculator</b>, <b>TCO calculator</b> and <b>Cost Management</b> help you plan and track.</li></ul>
<h3>Security and governance</h3>
<ul><li>Templates and policies help you follow corporate standards and regulatory requirements.</li>
<li>Audits flag resources that aren't compliant.</li>
<li>IaaS gives you maximum control of security; with PaaS and SaaS, the provider handles patching and maintenance for you.</li>
<li>The provider has strong protection against network attacks such as <b>DDoS</b> and secures the physical datacenters.</li></ul>
<h3>Manageability</h3>
<ul><li><b>Management of the cloud</b>: scale automatically, deploy from templates, monitor health and replace failing resources automatically, and get alerts.</li>
<li><b>Management in the cloud</b>: manage your resources through a web portal, a command line (CLI or PowerShell) or APIs.</li></ul>
<div class="viz" id="viz-benefits"></div>`},
{id:"svc",num:"1.9",title:"Cloud service types: IaaS, PaaS and SaaS",html:`
<ul><li><b>Infrastructure as a service (IaaS)</b>: the most flexible. You rent the hardware (servers, storage, networking) and manage the operating system and everything on top. Use cases: <b>lift-and-shift migrations</b>, testing and development environments, and workloads that need full OS control. Azure example: <b>Azure Virtual Machines</b>.</li>
<li><b>Platform as a service (PaaS)</b>: the provider runs the infrastructure <i>and</i> the operating system, middleware, development tools and databases. You focus on your app and data. Use cases: <b>development frameworks</b>, <b>analytics and business intelligence</b>. Azure examples: <b>Azure App Service</b>, <b>Azure SQL Database</b>, <b>Azure Functions</b>.</li>
<li><b>Software as a service (SaaS)</b>: a complete, finished application you rent and use. The provider manages almost everything; you manage your data, users and devices. Use cases: <b>email and messaging</b>, <b>business productivity apps</b>, <b>finance and expense tracking</b>. Examples: <b>Microsoft 365</b>, Outlook, Teams.</li></ul>
<div class="viz" id="viz-svc"></div>
<div class="viz" id="viz-svccmp"></div>
<div class="tip"><b>Exam tip.</b> If the question mentions <b>full control of the OS</b> or <b>lift-and-shift</b>, think IaaS. If it says <b>developers just deploy code</b>, think PaaS. If it's a <b>ready-to-use app</b>, think SaaS.</div>`}
];

function vizSla(){

  function draw(){let comp=a,txt="";
    if(mode==="chain"){comp=a*b/100;txt=`App Service (${a}%) <b>and</b> its database (${b}%) must both be up: ${a}% × ${b}% = <b>${comp.toFixed(3)}%</b>. Chaining services lowers the combined SLA.`}
    else if(mode==="pair"){comp=100-(100-a)*(100-a)/100;txt=`Two independent copies in different regions: the app is down only if both fail. 1 − (${(100-a).toFixed(3)}%)² = <b>${comp.toFixed(5)}%</b>. Redundancy raises availability.`}

(function(){
const LESSONS=[
{id:"regions",num:"2.1",title:"Regions, region pairs and sovereign regions",html:`
<p>An <b>Azure region</b> is a geographical area containing at least one, and often several, datacenters connected by a low-latency network. Azure has more than 60 regions. When you deploy a resource, you usually choose its region.</p>
<ul><li>Pick a region close to your users for lower latency, and one that meets your <b>data residency</b> rules.</li>
<li>Some services or VM sizes are available only in certain regions. A few services are <b>global</b> and don't need a region, such as Microsoft Entra ID, Azure Traffic Manager and Azure DNS.</li></ul>
<h3>Region pairs</h3>
<p>Most regions are paired with another region in the same <b>geography</b> (such as the US, Europe or Asia), usually at least <b>300 miles apart</b>. If a disaster hits one region, the other can take over.</p>
<ul><li>Platform updates roll out to <b>one region in a pair at a time</b>, to reduce the risk of both going down.</li>
<li>In a broad outage, one region from every pair is <b>prioritized for recovery</b>.</li>
<li>Data stays in the same geography as its pair for tax and legal reasons. <b>Brazil South</b> is the exception: it pairs with South Central US, outside its geography.</li>
<li>Most pairs are two-way. Some are one-way: Brazil South's secondary is South Central US, but South Central US's secondary is North Central US.</li>
<li>Some newer regions have no pair and use availability zones for resilience instead.</li></ul>
<h3>Sovereign regions</h3>
<p><b>Sovereign regions</b> are Azure instances isolated from the main Azure cloud for legal or compliance reasons.</p>
<ul><li><b>Azure Government</b> (US DoD Central, US Gov Virginia, US Gov Iowa and others): for US government agencies and partners. Operated by screened US personnel and physically isolated.</li>
<li><b>Azure in China</b> (China East, China North): operated by <b>21Vianet</b>, not directly by Microsoft. Physically separated from the rest of Azure.</li></ul>
<div class="viz" id="viz-map"></div>`},
{id:"zones",num:"2.2",title:"Availability zones and datacenters",html:`
<p>Azure <b>datacenters</b> are facilities full of racks of servers, with their own power, cooling and networking. You don't choose a datacenter directly; they're grouped into availability zones and regions.</p>
<p><b>Availability zones</b> are physically separate datacenters within one region. Each zone has <b>independent power, cooling and networking</b>, and is connected to the others by high-speed private fiber. If one zone goes down, the others keep working. Every zone-enabled region has a <b>minimum of three zones</b>.</p>
<ul><li><b>Zonal services</b>: you pin the resource to a specific zone, such as a VM, managed disk or IP address.</li>
<li><b>Zone-redundant services</b>: the platform replicates across zones automatically, such as zone-redundant storage and Azure SQL Database.</li>
<li><b>Non-regional services</b>: always available, even if a whole region fails.</li></ul>
<p>Running copies in multiple zones may cost more (extra VMs and data transfer between zones), but it protects you from a datacenter-level failure. For protection against a whole-region outage, use the <b>paired region</b>.</p>
<div class="viz" id="viz-az"></div>
<div class="viz" id="viz-azsort"></div>`},
{id:"hier",num:"2.3",title:"Resources, resource groups, subscriptions and management groups",html:`
<ul><li><b>Resource</b>: the basic building block. Anything you create: a VM, virtual network, database, storage account.</li>
<li><b>Resource group</b>: a logical container for resources that share a lifecycle, such as one app's VMs, network and database.
<ul><li>Each resource is in <b>exactly one</b> resource group. You can move resources between groups.</li>
<li>Resource groups <b>can't be nested</b>.</li>
<li><b>Deleting a resource group deletes everything in it.</b></li>
<li>Access and policy applied to a resource group apply to every resource inside it.</li></ul></li>
<li><b>Subscription</b>: a unit of management, billing and scale. You need an <b>Azure account</b> to create subscriptions. A subscription is both a <b>billing boundary</b> (each gets its own invoice and cost reports) and an <b>access control boundary</b>. Companies often create separate subscriptions for environments (dev, test, production), departments or billing needs.</li>
<li><b>Management group</b>: a container for subscriptions (and other management groups). Policies and access assigned to a management group are <b>inherited</b> by every subscription under it.
<ul><li>Up to <b>10,000</b> management groups in a single directory.</li>
<li>The tree can be up to <b>six levels deep</b>, not counting the root level or the subscription level.</li>
<li>Each management group and subscription has <b>one parent</b>.</li></ul></li></ul>
<p>The hierarchy, top to bottom: <b>management groups → subscriptions → resource groups → resources</b>. Settings flow down.</p>
<div class="viz" id="viz-hier"></div>
<div class="viz" id="viz-inherit"></div>`},
{id:"compute",num:"2.4",title:"Compute types: VMs, containers and functions",html:`
<ul><li><b>Virtual machines</b> (IaaS): full control of the OS and software. Best for lift-and-shift, custom software, or when you need total control. You manage patches and configuration.</li>
<li><b>Containers</b>: a lightweight, portable way to run apps. A container packages the app and its dependencies but shares the host's OS kernel, so it starts in seconds and many fit on one host. Azure options:
<ul><li><b>Azure Container Instances (ACI)</b>: the fastest, simplest way to run a container. PaaS, no VMs to manage.</li>
<li><b>Azure Container Apps</b>: serverless containers with built-in load balancing and scaling.</li>
<li><b>Azure Kubernetes Service (AKS)</b>: a managed Kubernetes service to orchestrate many containers.</li></ul></li>
<li><b>Azure Functions</b>: serverless, event-driven code. No servers to manage; you pay only while the code runs. Functions can be <b>stateless</b> (the default) or <b>stateful</b> (Durable Functions).</li></ul>
<div class="viz" id="viz-compute"></div>
<div class="viz" id="viz-pickcomp"></div>`},
{id:"vmopts",num:"2.5",title:"VM options: scale sets, availability sets and Azure Virtual Desktop",html:`
<h3>Virtual Machine Scale Sets</h3>
<p>Create and manage a group of <b>identical, load-balanced VMs</b>. The number of instances can grow or shrink automatically with demand or on a schedule. Great for large-scale services like web front ends and big compute.</p>
<h3>Availability sets</h3>
<p>Spread VMs so a single hardware failure or update doesn't take them all down. There's no extra charge; you pay only for the VMs.</p>
<ul><li><b>Fault domains</b>: groups of VMs that share power and networking, like a server rack. Up to <b>3</b> fault domains.</li>
<li><b>Update domains</b>: groups of VMs that can be rebooted at the same time during planned maintenance. Only one update domain is updated at a time. <b>5 by default</b>, up to <b>20</b>.</li></ul>
<div class="viz" id="viz-avset"></div>
<h3>Azure Virtual Desktop</h3>
<p><b>Azure Virtual Desktop</b> is desktop and app virtualization in the cloud. Users get a full Windows desktop (including <b>Windows 11 or 10 multi-session</b>) from any device, and data stays in the cloud, not on the device. It uses Microsoft Entra ID and supports MFA and Conditional Access.</p>
<div class="viz" id="viz-vmopt"></div>`},
{id:"vmres",num:"2.6",title:"VM resources and application hosting",html:`
<h3>What a VM needs</h3>
<ul><li><b>Size</b>: the CPU, memory and GPU.</li>
<li><b>Image</b>: the operating system, such as Windows Server or Ubuntu.</li>
<li><b>Storage disks</b>: an OS disk and optional data disks (managed disks).</li>
<li><b>Networking</b>: a <b>virtual network</b> and <b>subnet</b>, a <b>network interface (NIC)</b>, optionally a <b>public IP address</b>, and a <b>network security group (NSG)</b> to filter traffic.</li></ul>
<div class="viz" id="viz-vmparts"></div>
<h3>Application hosting options</h3>
<ul><li><b>Azure App Service</b>: an HTTP-based PaaS for hosting <b>web apps</b>, <b>API apps</b>, <b>WebJobs</b> (background tasks) and <b>mobile back ends</b>. Supports .NET, Java, Node.js, Python and PHP on Windows or Linux, with built-in autoscale, load balancing and deployment from GitHub or Azure DevOps.</li>
<li><b>Containers</b>: ACI, Container Apps or AKS, when you've packaged your app in containers.</li>
<li><b>Virtual machines</b>: when you need full control of the server.</li></ul>
<div class="viz" id="viz-host"></div>`},
{id:"vnet",num:"2.7",title:"Virtual networking",html:`
<p>An <b>Azure virtual network (VNet)</b> lets Azure resources talk to each other, to the internet and to your on-premises networks. VNets provide <b>isolation and segmentation</b>, <b>internet communication</b>, communication between Azure resources, communication with on-premises resources, and <b>routing</b> and <b>filtering</b> of traffic.</p>
<ul><li><b>Subnets</b> divide a VNet's address space into segments, such as a web tier and a data tier. Resources in subnets of the same VNet can communicate by default.</li>
<li><b>Virtual network peering</b> connects two VNets directly. Traffic is private and stays on the <b>Microsoft backbone</b>, never the public internet. <b>Global peering</b> connects VNets in different regions. Peering isn't transitive.</li>
<li><b>Network security groups</b> filter traffic in and out of subnets and NICs by IP, port and protocol.</li>
<li><b>Azure DNS</b> hosts your DNS domains on Azure's global name servers, so you manage records with the same credentials, billing and tools as your other Azure resources. You can't buy domain names with Azure DNS, but you can host them. It supports <b>private DNS zones</b> for names inside your VNets.</li></ul>
<h3>Connecting to on-premises</h3>
<ul><li><b>Azure VPN Gateway</b>: sends <b>encrypted traffic over the public internet</b>.
<ul><li><b>Site-to-site</b>: connect an office network to Azure.</li>
<li><b>Point-to-site</b>: connect a single device, such as a laptop at home.</li>
<li><b>Network-to-network</b>: connect two Azure VNets through gateways.</li>
<li>Gateways can be <b>policy-based</b> or <b>route-based</b> (more common), and deployed active/standby, active/active or zone-redundant for high availability.</li></ul></li>
<li><b>Azure ExpressRoute</b>: a <b>private connection</b> through a connectivity provider that <b>doesn't go over the public internet</b>. More reliable, faster, lower latency and more secure than VPN. It connects to Azure and Microsoft 365. Models include colocation at a cloud exchange, point-to-point Ethernet, any-to-any (IPVPN) networks and ExpressRoute Direct. <b>ExpressRoute Global Reach</b> links your on-premises sites to each other through Microsoft's network.</li></ul>
<div class="viz" id="viz-net"></div>
<div class="viz" id="viz-netq"></div>`},
{id:"endp",num:"2.8",title:"Public and private endpoints",html:`
<p>An <b>endpoint</b> is the address a service is reached at.</p>
<ul><li><b>Public endpoint</b>: a public IP address or DNS name reachable from the internet. Many PaaS services, like Azure Storage and Azure SQL Database, have one by default. You can still limit it with firewall rules.</li>
<li><b>Private endpoint</b>: a network interface with a <b>private IP address from your virtual network</b>, connected to a PaaS service through <b>Azure Private Link</b>. Traffic travels over the Microsoft backbone, never the public internet, and you can turn off the public endpoint completely. Your on-premises network can also reach it through VPN or ExpressRoute.</li></ul>
<div class="viz" id="viz-endp"></div>`},
{id:"storage",num:"2.9",title:"Storage services and storage accounts",html:`
<h3>Azure Storage services</h3>
<ul><li><b>Azure Blobs</b>: massively scalable object storage for <b>unstructured data</b> such as text, images, video, logs and backups. Reached over HTTP/HTTPS from anywhere. Also the base of Azure Data Lake Storage for big data analytics.</li>
<li><b>Azure Files</b>: fully managed <b>file shares</b> using <b>SMB</b> or <b>NFS</b>. Mount them at the same time from cloud or on-premises machines running Windows, Linux or macOS.</li>
<li><b>Azure Queues</b>: store large numbers of <b>messages</b> (up to 64 KB each) for asynchronous processing between app components.</li>
<li><b>Azure Tables</b>: a <b>NoSQL</b> store for structured, schemaless key/attribute data.</li>
<li><b>Azure Disks</b>: block-level storage volumes (managed disks) for Azure VMs.</li></ul>
<div class="viz" id="viz-stor"></div>
<h3>Storage accounts</h3>
<p>A <b>storage account</b> holds your data objects and gives them a unique namespace. The name must be <b>globally unique</b>, 3 to 24 characters, lowercase letters and numbers only. Each service gets its own endpoint, such as <code>https://mystorage.blob.core.windows.net</code>, <code>.file.</code>, <code>.queue.</code>, <code>.table.</code> and <code>.dfs.</code> (Data Lake).</p>
<ul><li><b>Standard general-purpose v2</b>: the default for most scenarios. Supports Blob (including Data Lake), Queue, Table and Azure Files, and every redundancy option.</li>
<li><b>Premium block blobs</b>: high transaction rates or low latency. LRS or ZRS.</li>
<li><b>Premium file shares</b>: enterprise or high-performance file shares. LRS or ZRS.</li>
<li><b>Premium page blobs</b>: page blobs only (the format behind VM disks). LRS only.</li></ul>
<div class="viz" id="viz-acct"></div>`},
{id:"tiers",num:"2.10",title:"Storage tiers",html:`
<p>Blob storage has <b>access tiers</b> that trade storage cost against access cost:</p>
<ul><li><b>Hot</b>: data accessed frequently, like website images. Highest storage cost, lowest access cost.</li>
<li><b>Cool</b>: infrequently accessed data stored for at least <b>30 days</b>, like short-term backups.</li>
<li><b>Cold</b>: rarely accessed data stored for at least <b>90 days</b>.</li>
<li><b>Archive</b>: rarely accessed data stored for at least <b>180 days</b>, with flexible latency of <b>hours</b>. Archived blobs are offline: you must <b>rehydrate</b> them to an online tier before reading, which can take up to 15 hours. Lowest storage cost, highest access cost.</li></ul>
<p>Only hot, cool and cold can be set at the account level. Archive is set on individual blobs. Deleting or moving data out of cool, cold or archive before the minimum period incurs an early deletion charge.</p>
<div class="viz" id="viz-tier"></div>`},
{id:"redund",num:"2.11",title:"Redundancy options",html:`
<p>Azure Storage always keeps multiple copies of your data. You choose how far apart they are:</p>
<h3>In the primary region</h3>
<ul><li><b>Locally redundant storage (LRS)</b>: <b>three copies in a single datacenter</b>. Cheapest. Protects against server rack and drive failures, but not a datacenter disaster. At least 11 nines (99.999999999%) durability.</li>
<li><b>Zone-redundant storage (ZRS)</b>: three copies across <b>three availability zones</b>. Data stays readable and writable if a zone goes down. At least 12 nines.</li></ul>
<h3>Also in a secondary region</h3>
<ul><li><b>Geo-redundant storage (GRS)</b>: LRS in the primary region, plus an <b>asynchronous</b> copy to LRS in the paired secondary region. At least 16 nines.</li>
<li><b>Geo-zone-redundant storage (GZRS)</b>: ZRS in the primary region, plus LRS in the secondary. The most protection for both availability and durability.</li>
<li>With GRS and GZRS, the secondary copy <b>can't be read until a failover</b>. Add <b>read access</b> with <b>RA-GRS</b> or <b>RA-GZRS</b> to read from the secondary region at any time.</li></ul>
<div class="viz" id="viz-redund"></div>`},
{id:"move",num:"2.12",title:"Moving files and migrating to Azure",html:`
<h3>Moving files</h3>
<ul><li><b>AzCopy</b>: a <b>command-line</b> tool to copy blobs or files to, from or between storage accounts. It can sync in <b>one direction only</b>.</li>
<li><b>Azure Storage Explorer</b>: a free <b>graphical app</b> for Windows, macOS and Linux to manage storage accounts. It uses AzCopy behind the scenes.</li>
<li><b>Azure File Sync</b>: centralizes file shares in Azure Files while keeping a <b>local cache on Windows file servers</b>. Use any protocol Windows Server supports (SMB, NFS, FTPS), keep as many caches as you need worldwide, replace a failed server by installing File Sync on a new one, and use <b>cloud tiering</b> so frequently used files stay local.</li></ul>
<h3>Migrating</h3>
<ul><li><b>Azure Migrate</b>: a central <b>hub</b> to discover, assess and migrate on-premises servers, databases, web apps and virtual desktops to Azure. Integrated tools include <b>Discovery and assessment</b>, <b>Migration and modernization</b> (for servers), <b>Data Migration Assistant</b>, <b>Azure Database Migration Service</b> and the <b>Web app migration assistant</b>.</li>
<li><b>Azure Data Box</b>: a rugged <b>physical device</b> (up to 80 TB usable) that Microsoft ships to you. You load your data, ship it back, and Microsoft uploads it. Use it when you have <b>large amounts of data and little or no network bandwidth</b>: one-time migrations, initial bulk transfers, or exporting data out of Azure for disaster recovery. Data is AES-256 encrypted and the device is wiped to NIST 800-88 standards after upload.</li></ul>
<div class="viz" id="viz-move"></div>
<div class="viz" id="viz-movesort"></div>`},
{id:"identity",num:"2.13",title:"Identity: Microsoft Entra ID and authentication",html:`
<h3>Directory services</h3>
<ul><li><b>Microsoft Entra ID</b> (formerly Azure Active Directory): Microsoft's cloud-based identity and access management service. It provides <b>authentication</b>, <b>single sign-on</b>, <b>application management</b>, <b>device management</b>, and <b>identity protection</b> that flags risky sign-ins. Use <b>Microsoft Entra Connect</b> to sync users from on-premises Active Directory, so people use one identity everywhere (hybrid identity).</li>
<li><b>Microsoft Entra Domain Services</b>: managed domain services such as <b>domain join</b>, <b>Group Policy</b>, <b>LDAP</b> and <b>Kerberos/NTLM</b> authentication, without deploying or patching domain controllers. Use it to run legacy apps in the cloud that can't use modern authentication. It syncs one way from Entra ID.</li></ul>
<div class="viz" id="viz-entra"></div>
<h3>Authentication methods</h3>
<ul><li><b>Single sign-on (SSO)</b>: sign in once and reach many apps. Fewer passwords means fewer forgotten and reused passwords.</li>
<li><b>Multifactor authentication (MFA)</b>: prove identity with two or more kinds of factor: <b>something you know</b> (password), <b>something you have</b> (phone, security key), <b>something you are</b> (fingerprint, face).</li>
<li><b>Passwordless</b>: remove the password and use something you have plus something you are or know: <b>Windows Hello for Business</b>, the <b>Microsoft Authenticator app</b>, or <b>FIDO2 security keys</b>.</li></ul>
<div class="viz" id="viz-auth"></div>
<h3>External identities</h3>
<p><b>External identities</b> let people outside your organization use their own credentials:</p>
<ul><li><b>B2B collaboration</b>: partners sign in with their own work, school or social account and appear as <b>guest users</b> in your directory.</li>
<li><b>B2B direct connect</b>: a mutual, two-way trust with another Entra organization, used for Teams shared channels.</li>
<li><b>Customer identity (Azure AD B2C, now Microsoft Entra External ID)</b>: sign-up and sign-in for customers of your public-facing apps.</li></ul>
<div class="viz" id="viz-ext"></div>`},
{id:"access",num:"2.14",title:"Conditional Access and Azure RBAC",html:`
<h3>Microsoft Entra Conditional Access</h3>
<p>Conditional Access uses <b>signals</b> to make an access <b>decision</b> and <b>enforce</b> it, like an if-then policy engine.</p>
<ul><li><b>Signals</b>: who the user is and their group, the location (IP address), the device and its compliance, the app being accessed, and real-time sign-in risk.</li>
<li><b>Decisions</b>: <b>allow</b> access, <b>require extra steps</b> such as MFA or a compliant device, or <b>block</b> access.</li></ul>
<p>Examples: require MFA for admins, block sign-ins from certain countries, or only allow a sensitive app from managed devices.</p>
<div class="viz" id="viz-ca"></div>
<h3>Azure role-based access control (RBAC)</h3>
<p>Azure RBAC controls <b>what people can do</b> with Azure resources. You assign a <b>role</b> to a <b>security principal</b> (a user, group or app) at a <b>scope</b>.</p>
<ul><li>Built-in roles include <b>Owner</b> (full access, including granting access to others), <b>Contributor</b> (create and manage everything, but can't grant access), <b>Reader</b> (view only) and <b>User Access Administrator</b> (manage access only).</li>
<li>Scopes: <b>management group</b>, <b>subscription</b>, <b>resource group</b> or a single <b>resource</b>.</li>
<li>Roles are <b>inherited</b>: a role at a resource group applies to every resource in it.</li>
<li>RBAC is an <b>allow</b> model and permissions are <b>additive</b>: two roles give the union of their permissions.</li>
<li>It's enforced on every action that goes through <b>Azure Resource Manager</b>.</li>
<li>Follow <b>least privilege</b>: give the smallest role at the narrowest scope that does the job.</li></ul>
<div class="viz" id="viz-rbac"></div>`},
{id:"defense",num:"2.15",title:"Zero Trust, defense in depth and Microsoft Defender for Cloud",html:`
<h3>Zero Trust</h3>
<p><b>Zero Trust</b> assumes the worst and verifies every request as though it came from an uncontrolled network. Its three principles:</p>
<ul><li><b>Verify explicitly</b>: authenticate and authorize using every available signal.</li>
<li><b>Use least privilege access</b>: just-in-time and just-enough access.</li>
<li><b>Assume breach</b>: segment access, encrypt end to end, and use analytics to detect threats.</li></ul>
<p>Instead of trusting everything inside the corporate network, Zero Trust checks the user, device and context on each request.</p>
<div class="viz" id="viz-zt"></div>
<h3>Defense in depth</h3>
<p>Defense in depth uses <b>layers</b> of protection so that if one layer is breached, the next one slows the attack. From the outside in:</p>
<ol><li><b>Physical security</b>: controlling access to the datacenter buildings.</li>
<li><b>Identity and access</b>: SSO, MFA, auditing sign-ins.</li>
<li><b>Perimeter</b>: DDoS protection and perimeter firewalls.</li>
<li><b>Network</b>: segmentation and deny-by-default rules, limiting traffic between resources.</li>
<li><b>Compute</b>: securing VMs, patching, endpoint protection.</li>
<li><b>Application</b>: secure code, no secrets stored in code.</li>
<li><b>Data</b>: protecting the data itself, the attacker's real target.</li></ol>
<div class="viz" id="viz-did"></div>
<h3>Microsoft Defender for Cloud</h3>
<p><b>Microsoft Defender for Cloud</b> is a monitoring tool for <b>security posture management</b> and <b>threat protection</b>. It covers Azure, <b>on-premises</b> (through Azure Arc) and <b>other clouds</b> such as AWS and Google Cloud. It does three things:</p>
<ul><li><b>Assess</b>: continuously scans your resources for vulnerabilities and misconfigurations.</li>

const LESSONS=[
{id:"costs",num:"3.1",title:"Factors that affect cost",html:`
<p>Azure moves your spending from CapEx to OpEx, but the bill still depends on choices you make:</p>
<ul><li><b>Resource type</b>: each service, tier and size has its own price. A storage account's type, access tier and redundancy all change its cost.</li>
<li><b>Consumption</b>: pay-as-you-go bills for what you use. <b>Reservations</b> and savings plans cut the price in exchange for a 1- or 3-year commitment.</li>
<li><b>Maintenance</b>: unused resources still cost money. Deleting a VM can leave its <b>disks, network interface and public IP</b> behind, and they keep billing. Clean them up.</li>
<li><b>Geography</b>: prices vary by <b>region</b>, because power, labor and taxes differ around the world.</li>
<li><b>Network traffic</b>: data coming <b>into</b> Azure (ingress) is generally free. Data going <b>out</b> (egress) and between regions is billed, priced by geographic zone.</li>
<li><b>Subscription type</b>: some subscriptions, such as the free account, include usage allowances.</li>
<li><b>Azure Marketplace</b>: third-party solutions you buy through Azure are billed with your Azure usage.</li></ul>
<div class="tip"><b>Exam tip.</b> A VM <b>stopped from inside the OS</b> is still allocated and still billed for compute. A VM that's <b>Stopped (deallocated)</b> in Azure stops compute billing, but its disks are still billed.</div>
<div class="viz" id="viz-costdrv"></div>
<div class="viz" id="viz-costq"></div>`},
{id:"calc",num:"3.2",title:"The pricing calculator and TCO calculator",html:`
<ul><li><b>Pricing calculator</b>: estimates the cost of <b>provisioning resources in Azure</b>. Pick services, then set the region, tier, size, hours, redundancy and support options to see an estimated monthly cost. It's for estimates only; nothing is created and you aren't charged.</li>
<li><b>TCO (total cost of ownership) calculator</b>: <b>compares</b> the cost of running your <b>on-premises</b> infrastructure with running it in Azure. You enter your servers, databases, storage and networking, adjust assumptions like power and IT labor costs, and get a side-by-side report.</li></ul>
<div class="viz" id="viz-calc"></div>
<div class="viz" id="viz-calcsort"></div>`},
{id:"costmgmt",num:"3.3",title:"Cost Management and tags",html:`
<h3>Microsoft Cost Management</h3>
<p><b>Cost Management</b> lets you check resource costs, set up alerts based on spending, and create budgets.</p>
<ul><li><b>Cost analysis</b>: explore costs by billing cycle, region, resource, service and more, with charts.</li>
<li><b>Cost alerts</b>: <b>budget alerts</b> (when spending hits a threshold you set), <b>credit alerts</b> (when Azure credit commitments are used up) and <b>department spending quota alerts</b> (when a department reaches its quota).</li>
<li><b>Budgets</b>: a spending limit for a scope such as a subscription or resource group. Budgets trigger alerts; they <b>don't stop spending on their own</b>, but an alert can run automation to suspend or change resources.</li></ul>
<div class="viz" id="viz-budget"></div>
<h3>Tags</h3>
<p><b>Tags</b> are <b>name/value pairs</b> of metadata you add to resources, resource groups and subscriptions, such as <code>env = prod</code> or <code>costcenter = 4410</code>. Use them for:</p>
<ul><li><b>Cost management and optimization</b>: group costs by department or project.</li>
<li><b>Resource management</b>: find resources by owner or app.</li>
<li><b>Operations management</b>: group resources by how critical they are.</li>
<li><b>Security</b>: mark resources by data classification.</li>
<li><b>Governance and regulatory compliance</b>: identify resources that must meet rules such as ISO 27001.</li>
<li><b>Workload optimization and automation</b>: find all resources in a workload, or automate tasks on them.</li></ul>
<p>Tags are <b>not inherited</b> from resource groups by default. Use <b>Azure Policy</b> to require tags or copy them down. You can add tags in the portal, PowerShell, the CLI, ARM templates or the REST API.</p>
<div class="viz" id="viz-tags"></div>`},
{id:"purview",num:"3.4",title:"Microsoft Purview",html:`
<p><b>Microsoft Purview</b> is a family of <b>data governance, risk and compliance</b> solutions that gives you a single, unified view of your data, wherever it lives: on-premises, in multiple clouds, and in SaaS apps.</p>
<ul><li><b>Risk and compliance</b>: protect sensitive data across Microsoft 365 (Teams, OneDrive, Exchange), identify data risks, and manage regulatory compliance requirements.</li>
<li><b>Unified data governance</b>: build a <b>data map</b> by scanning sources like Azure SQL Database, Azure Data Lake, Amazon S3, on-premises SQL Server and Power BI. Purview automatically <b>classifies</b> sensitive data, tracks <b>data lineage</b>, and lets people discover trustworthy data in a catalog.</li></ul>
<div class="viz" id="viz-purview"></div>`},
{id:"policy",num:"3.5",title:"Azure Policy",html:`
<p><b>Azure Policy</b> helps you create, assign and manage rules that enforce your organization's standards and assess compliance at scale.</p>
<ul><li>A <b>policy definition</b> is a rule, such as "only allow these VM sizes" or "every resource must have an env tag".</li>
<li>An <b>initiative</b> is a group of related policy definitions assigned together, such as "Enable monitoring in Microsoft Defender for Cloud".</li>
<li>Azure Policy has many <b>built-in definitions</b> for storage, networking, compute and security.</li>
<li>Assign policies at a management group, subscription or resource group. They're <b>inherited</b> by everything below.</li>
<li><b>Effects</b> decide what happens: <b>Deny</b> blocks non-compliant resources from being created or changed; <b>Audit</b> allows them but flags them as non-compliant; other effects can <b>modify</b> or add settings, or deploy missing configurations.</li>
<li>Azure Policy evaluates existing resources too, shows a <b>compliance</b> dashboard, and can <b>remediate</b> many non-compliant resources automatically.</li></ul>
<p>RBAC controls <b>who</b> can do something. Azure Policy controls <b>what</b> can be deployed and how it must be configured.</p>
<div class="viz" id="viz-policy"></div>`},
{id:"locks",num:"3.6",title:"Resource locks",html:`
<p>A <b>resource lock</b> prevents resources from being accidentally deleted or changed. Locks apply to <b>everyone</b>, even users with the Owner role.</p>
<ul><li><b>Delete</b> (shown as CanNotDelete): users can still read and modify the resource, but <b>can't delete</b> it.</li>
<li><b>ReadOnly</b>: users can read the resource, but <b>can't modify or delete</b> it. It's like giving everyone the Reader role for that resource.</li></ul>
<p>Apply locks to a subscription, resource group or individual resource. They're <b>inherited</b>: a lock on a resource group protects everything in it. To change or delete a locked resource, you must <b>remove the lock first</b>, which requires permission to manage locks (such as the Owner or User Access Administrator role).</p>
<div class="viz" id="viz-lock"></div>
<div class="viz" id="viz-govsort"></div>`},
{id:"tools",num:"3.7",title:"The Azure portal, Cloud Shell, Azure CLI and Azure PowerShell",html:`
<ul><li><b>Azure portal</b>: a web-based, unified console. Build, manage and monitor everything from simple web apps to complex deployments, create <b>custom dashboards</b>, and set accessibility options. It's updated continually and needs no downtime for maintenance.</li>
<li><b>Azure Cloud Shell</b>: a browser-based shell you open from the portal. Choose <b>Bash</b> or <b>PowerShell</b>. You're already authenticated with your Azure account, nothing is installed on your computer, and an Azure Files share keeps your files between sessions.</li>
<li><b>Azure CLI</b>: a command-line tool with commands that start with <code>az</code>, using Bash-style syntax. Runs on Windows, macOS and Linux, and in Cloud Shell.</li>
<li><b>Azure PowerShell</b>: a set of <b>cmdlets</b> (the Az module) with verb-noun names such as <code>New-AzVM</code>. Runs on Windows, macOS and Linux, and in Cloud Shell.</li></ul>
<p>The CLI and PowerShell can do the same tasks; pick the syntax you prefer. Both are great for <b>scripting</b> repeatable tasks so they're done the same way every time.</p>
<div class="viz" id="viz-shell"></div>
<div class="viz" id="viz-clisort"></div>`},
{id:"arc",num:"3.8",title:"Azure Arc",html:`
<p><b>Azure Arc</b> extends Azure management to resources <b>outside Azure</b>: on-premises, in other clouds, and at the edge. Connected resources show up in the Azure portal as if they were Azure resources, so you manage everything from one place.</p>
<p>With Arc you can manage:</p>
<ul><li><b>Servers</b> (Windows and Linux, physical or virtual)</li>
<li><b>Kubernetes clusters</b></li>
<li><b>Azure data services</b>, such as SQL Managed Instance and PostgreSQL</li>
<li><b>SQL Server</b> instances</li>
<li><b>Virtual machines</b> in VMware vSphere or System Center Virtual Machine Manager</li></ul>
<p>Once connected, you can apply <b>Azure Policy</b>, <b>RBAC</b>, <b>tags</b>, <b>Azure Monitor</b> and <b>Microsoft Defender for Cloud</b> to them, just like native Azure resources.</p>
<div class="viz" id="viz-arc"></div>`},
{id:"arm",num:"3.9",title:"Infrastructure as code, ARM and ARM templates",html:`
<h3>Infrastructure as code</h3>
<p><b>Infrastructure as code (IaC)</b> means managing infrastructure with code files instead of clicking through a portal. The files can be versioned, reviewed and reused, so every environment is built the same way.</p>
<h3>Azure Resource Manager (ARM)</h3>
<p><b>Azure Resource Manager</b> is the deployment and management service for Azure. <b>Every request</b>, whether from the portal, PowerShell, the CLI, REST APIs or SDKs, goes through ARM. It authenticates and authorizes the request, then sends it to the right Azure service. Because everything goes through one layer, results are consistent. ARM lets you:</p>
<ul><li>Manage infrastructure through <b>declarative templates</b> instead of scripts.</li>
<li>Deploy, manage and monitor resources <b>as a group</b>.</li>
<li><b>Redeploy</b> consistently throughout the development lifecycle.</li>
<li>Define <b>dependencies</b> so resources deploy in the right order.</li>
<li>Apply access control (RBAC), locks and <b>tags</b> to resources.</li></ul>
<div class="viz" id="viz-armflow"></div>
<h3>ARM templates and Bicep</h3>
<p>An <b>ARM template</b> is a <b>JSON</b> file that describes the resources you want. Its key benefits:</p>
<ul><li><b>Declarative syntax</b>: you state <i>what</i> you want, not the steps to create it.</li>
<li><b>Repeatable results</b>: deploy the same template many times and get the same result. Deployments are <b>idempotent</b>; redeploying an unchanged template changes nothing.</li>
<li><b>Orchestration</b>: ARM works out the order and deploys independent resources in parallel.</li>
<li><b>Modular files</b>: split templates into smaller, reusable ones and link them.</li>
<li><b>Extensibility</b>: add deployment scripts in Bash or PowerShell.</li></ul>
<p><b>Bicep</b> is a simpler language that compiles to ARM JSON, with the same capabilities.</p>
<div class="viz" id="viz-arm"></div>`},
{id:"advisor",num:"3.10",title:"Azure Advisor",html:`
<p><b>Azure Advisor</b> evaluates your Azure resources and makes <b>personalized recommendations</b> to improve them. Recommendations appear on a dashboard in the portal, and you can set up alerts for new ones. Advisor groups them into five categories:</p>
<ul><li><b>Reliability</b>: keep business-critical apps running (for example, add redundancy).</li>
<li><b>Security</b>: detect threats and vulnerabilities (fed by Microsoft Defender for Cloud).</li>
<li><b>Performance</b>: improve the speed of your apps.</li>
<li><b>Operational excellence</b>: improve process and workflow efficiency, resource manageability and deployment best practices.</li>
<li><b>Cost</b>: reduce overall spending, such as by resizing or shutting down underused VMs, or buying reservations.</li></ul>
<div class="viz" id="viz-advisor"></div>`},
{id:"health",num:"3.11",title:"Azure Service Health",html:`
<p><b>Azure Service Health</b> tracks the health of Azure services and your resources. It combines three views, from broad to narrow:</p>
<ul><li><b>Azure status</b>: a public page showing service outages <b>across all Azure regions</b>. Good for the big picture.</li>
<li><b>Service Health</b>: a personalized view of the <b>services and regions you use</b>. It shows <b>service issues</b>, <b>planned maintenance</b>, <b>health advisories</b> and security advisories, and you can set up alerts.</li>
<li><b>Resource Health</b>: the health of <b>your individual resources</b>, such as one specific VM, and whether a problem is caused by the platform.</li></ul>
<p>Service Health keeps historical information so you can review past incidents, and it provides documentation for any SLA claims.</p>
<div class="viz" id="viz-health"></div>`},
{id:"monitor",num:"3.12",title:"Azure Monitor, Log Analytics, alerts and Application Insights",html:`
<p><b>Azure Monitor</b> collects, analyzes and acts on <b>metrics and logs</b> from Azure, on-premises and other clouds: from apps, operating systems, resources, subscriptions and your tenant. It can display the data in dashboards and workbooks, analyze it, and respond automatically.</p>
<ul><li><b>Log Analytics</b>: the tool in the portal for writing and running <b>log queries</b> on the data Azure Monitor collects, using the <b>Kusto Query Language (KQL)</b>.</li>
<li><b>Azure Monitor alerts</b>: notify you when a condition is met, such as CPU above 90% or an error in the logs. Alert types include <b>metric</b>, <b>log</b> and <b>activity log</b> alerts. Alerts use <b>action groups</b> to email, text, call a webhook, or run automation.</li>
<li><b>Application Insights</b>: application performance monitoring (APM) for web apps, whether in Azure, on-premises or in another cloud. It tracks <b>request rates, response times and failure rates</b>, <b>dependency</b> calls, page views and load performance, user and session counts, and performance counters. It can also send synthetic requests to check that your app is available (availability tests).</li></ul>
<div class="viz" id="viz-kql"></div>
<div class="viz" id="viz-alert"></div>
<div class="viz" id="viz-monsort"></div>`}

function vizCostdrv(){
  const el=$("#viz-costdrv");const used=new Set();
  const s={state:"run",reg:"eus",commit:"payg",ahb:false,egress:50};
  const REG={eus:["East US",1],weu:["West Europe",1.12],brs:["Brazil South",1.45]};
  el.innerHTML=`<div class="viz-title">What drives this VM's bill?</div><div class="s-small">ILLUSTRATIVE WINDOWS VM · NOT CURRENT AZURE RATES</div>
    <div class="sel-row"><span>Power state</span><div class="seg-row" data-g="state"><button class="chip" data-v="run">Running</button><button class="chip" data-v="os">Stopped inside the OS</button><button class="chip" data-v="dealloc">Stopped (deallocated)</button></div></div>
    <div class="sel-row"><span>Region</span><div class="seg-row" data-g="reg">${Object.keys(REG).map(k=>`<button class="chip" data-v="${k}">${REG[k][0]}</button>`).join("")}</div></div>
    <div class="sel-row"><span>Pricing</span><div class="seg-row" data-g="commit"><button class="chip" data-v="payg">Pay-as-you-go</button><button class="chip" data-v="res">3-year reservation</button></div></div>
    <label class="check"><input type="checkbox" data-k="ahb"> Use Azure Hybrid Benefit (we own Windows Server licenses)</label>
    <div class="rng-row"><span>Data out (egress)</span><input type="range" min="0" max="2000" step="50" value="${s.egress}" data-k="egress" aria-label="Egress in GB"><b data-o="eg"></b></div>
    <div class="out"></div>`;
  function draw(){el.querySelectorAll("[data-g]").forEach(g=>g.querySelectorAll("[data-v]").forEach(b=>b.setAttribute("aria-pressed",s[g.dataset.g]===b.dataset.v)));$('[data-o="eg"]',el).textContent=fmt(s.egress)+" GB";
    const m=REG[s.reg][1],billed=s.state!=="dealloc";
    const compute=billed?100*m*(s.commit==="res"?0.38:1):0,lic=billed&&!s.ahb?45*m:0,disk=18*m,eg=Math.max(0,s.egress-100)*0.087,tot=compute+lic+disk+eg;
    $(".out",el).innerHTML=`<div class="tbl-wrap"><table class="tbl"><tr><th>Item</th><th class="num">Per month</th></tr>
      <tr><td>Compute (vCPUs and memory)</td><td class="num ${compute?"":"ok"}">$${compute.toFixed(2)}</td></tr><tr><td>Windows license</td><td class="num ${lic?"":"ok"}">$${lic.toFixed(2)}</td></tr>
      <tr><td>Managed OS disk</td><td class="num">$${disk.toFixed(2)}</td></tr><tr><td>Egress (first 100 GB free)</td><td class="num">$${eg.toFixed(2)}</td></tr>
      <tr><th>Total</th><th class="num">$${tot.toFixed(2)}</th></tr></table></div>
      <div class="caption" aria-live="polite">${s.state==="os"?"<span class=\"status-bad\">Still billed.</span> Shutting down inside Windows leaves the VM allocated, so compute keeps charging.":s.state==="dealloc"?"<span class=\"status-good\">Compute billing stopped.</span> The disk is still billed because the data still exists.":s.commit==="res"?"A 3-year reservation cuts the compute price sharply for an always-on VM.":"Change each setting to see how it moves the bill."}</div>
      <div class="rv-prog s-small">${used.size} of 5 cost factors explored</div>`;
    if(used.size>=5)award("viz:costdrv",30,"Explored every cost factor")}
  el.addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(!b)return;const g=b.closest("[data-g]").dataset.g;s[g]=b.dataset.v;if(g==="state"&&s.state==="dealloc")used.add("state");if(g==="reg"&&s.reg!=="eus")used.add("reg");if(g==="commit"&&s.commit==="res")used.add("commit");draw()});
  el.addEventListener("change",e=>{if(e.target.dataset.k==="ahb"){s.ahb=e.target.checked;if(s.ahb)used.add("ahb");draw()}});
  el.addEventListener("input",e=>{if(e.target.dataset.k==="egress"){s.egress=+e.target.value;if(s.egress>100)used.add("egress");draw()}});draw();
}

<script>
/* ================= Exam-only question bank =================
   These questions appear only in the timed practice exams and domain drills, never in the module quizzes,
   so a full exam always has fresh material. Scenario-style, one best answer, each with an explanation. */

/* ---------- 1. Cloud Concepts (17) ---------- */
registerExamBank("cld",[
 {q:"A startup wants to avoid buying servers up front and pay only for what it uses each month. Which cloud benefit is this?",o:["Consumption-based (OpEx) pricing","Capital expenditure","Data sovereignty","Vertical scaling only"],a:0,e:"Cloud shifts spending from up-front CapEx to pay-as-you-go OpEx."},
 {q:"An app needs more memory, so an admin resizes its VM to a larger SKU. What type of scaling is this?",o:["Horizontal scaling (scale out)","Vertical scaling (scale up)","Geo-replication","Load balancing"],a:1,e:"Vertical scaling adds CPU or RAM to an existing instance. Horizontal scaling adds more instances."},
 {q:"A web tier adds two more VM instances automatically during peak traffic. What is this?",o:["Vertical scaling","Disaster recovery","Horizontal scaling based on demand (elasticity)","Fault tolerance only"],a:2,e:"Adding instances is scaling out. Doing it automatically with demand is elasticity."},
 {q:"In the shared responsibility model, which item is always the customer's responsibility, regardless of service type?",o:["Physical datacenter security","Physical network","Hypervisor patching","Information and data, devices, and accounts and identities"],a:3,e:"Customers always own their data, endpoints, accounts and identities. Microsoft always owns the physical layers."},
 {q:"Which cloud model gives the customer the most control over the operating system?",o:["IaaS","PaaS","SaaS","Serverless"],a:0,e:"IaaS hands the customer the OS and everything above it."},
 {q:"A company runs workloads in its own datacenter and in Azure, with connectivity between them. Which model is this?",o:["Public cloud","Hybrid cloud","Private cloud","Multicloud only"],a:1,e:"Hybrid cloud combines on-premises (private) infrastructure with a public cloud."},
 {q:"A company uses both Azure and another public cloud provider for different workloads. What is this called?",o:["Hybrid cloud","Private cloud","Multicloud","Community cloud"],a:2,e:"Multicloud means using more than one public cloud provider. Azure Arc can help manage it."},
 {q:"What does 'high availability' in the cloud refer to?",o:["Encrypting all data","Paying only for usage","Running only in one datacenter","Keeping services up with minimal downtime, often backed by an SLA such as 99.99%"],a:3,e:"High availability means designing for continuous uptime, measured by SLA percentages."},
 {q:"Which cloud benefit ensures a company can recover from a regional outage by replicating to another region?",o:["Reliability through disaster recovery and geo-distribution","Elasticity","Manageability","Predictability"],a:0,e:"Reliability includes recovering from failures, for example with region pairs and replication."},
 {q:"Which benefit lets IT forecast costs using tools such as the pricing calculator and TCO calculator?",o:["Elasticity","Predictability (cost)","Agility","Security"],a:1,e:"Cost predictability comes from known pricing and forecasting tools."},
 {q:"Which pricing benefit applies to serverless services such as Azure Functions on the Consumption plan?",o:["A fixed monthly server fee","You buy hardware up front","You pay only when code runs, per execution and resource use","Unlimited free compute"],a:2,e:"Serverless bills per execution and duration, and you pay nothing when idle."},
 {q:"A developer wants to build an app without managing VMs, OS patches or runtime updates. Which model fits?",o:["IaaS","On-premises","Colocation","PaaS"],a:3,e:"PaaS (for example App Service) manages the OS and runtime for you."},
 {q:"Which is an example of SaaS?",o:["Microsoft 365","Azure Virtual Machines","Azure Virtual Network","Azure Disk Storage"],a:0,e:"Microsoft 365 is a finished app delivered as a service."},
 {q:"Which cloud characteristic means Azure manages security patching of the physical hosts and datacenter?",o:["Customer responsibility","Shared responsibility (provider's part)","Data classification","Tagging"],a:1,e:"Physical hosts, network and datacenter are always Microsoft's responsibility."},
 {q:"What is an advantage of the cloud for global reach?",o:["All data must stay in one country","Requires shipping servers","Deploy apps in regions close to users worldwide within minutes","No latency at all"],a:2,e:"Azure regions worldwide let you place workloads near users quickly."},
 {q:"Which cloud benefit describes using templates and policies to deploy and govern resources consistently?",o:["Elasticity","Durability","CapEx","Manageability / governance"],a:3,e:"Manageability of the cloud includes templates, automation and policy-based governance."},
 {q:"A company wants to stop maintaining physical servers but keep its existing app unchanged. Which migration approach and model fit?",o:["Lift and shift to IaaS VMs","Rewrite as SaaS","Buy more on-premises hardware","Move to a cold site"],a:0,e:"Rehosting (lift and shift) moves the app as-is onto IaaS virtual machines."}
]);

/* ---------- 2. Azure Architecture and Services (23) ---------- */
registerExamBank("arc",[
 {q:"An app must survive the failure of a single datacenter within a region. What should be used?",o:["A single availability set in one rack","Availability zones","A resource group","A management group"],a:1,e:"Availability zones are physically separate datacenters within a region, each with its own power, cooling and network."},
 {q:"What is a region pair in Azure?",o:["Two availability zones","Two subscriptions","Two regions in the same geography paired for disaster recovery and staggered updates","Two resource groups"],a:2,e:"Paired regions are at least 300 miles apart where possible and receive updates one at a time."},
 {q:"Which Azure construct is a logical container that holds related resources for an app and shares a lifecycle?",o:["Management group","Region","Tenant","Resource group"],a:3,e:"Resource groups group resources that you deploy, manage and delete together."},
 {q:"Which hierarchy order is correct, from broadest to narrowest?",o:["Management groups, subscriptions, resource groups, resources","Subscriptions, management groups, resources, resource groups","Resource groups, subscriptions, resources, management groups","Resources, resource groups, subscriptions, management groups"],a:0,e:"Management groups contain subscriptions, which contain resource groups, which contain resources."},
 {q:"Which Azure compute service runs containers without managing any VMs or orchestrator, ideal for simple tasks?",o:["Azure Kubernetes Service","Azure Container Instances","Azure Virtual Machine Scale Sets","Azure Batch"],a:1,e:"ACI runs individual containers on demand with no infrastructure to manage."},
 {q:"Which service provides managed Kubernetes for orchestrating many containers?",o:["Azure Functions","Azure App Service","Azure Kubernetes Service (AKS)","Azure Container Instances"],a:2,e:"AKS manages the Kubernetes control plane for you."},
 {q:"Which service lets a company deliver full Windows desktops and apps from Azure to users on any device?",o:["Azure Bastion","Azure Arc","Azure Monitor","Azure Virtual Desktop"],a:3,e:"Azure Virtual Desktop provides virtualized desktops and apps, including multi-session Windows."},
 {q:"Which service hosts web apps and APIs as PaaS with built-in autoscale and deployment slots?",o:["Azure App Service","Azure Virtual Machines","Azure Files","Azure DNS"],a:0,e:"App Service runs web apps on managed infrastructure."},
 {q:"Which service lets VMs in two different VNets communicate privately over the Microsoft backbone?",o:["VPN Gateway to the internet","VNet peering","Azure DNS","Public IP addresses"],a:1,e:"VNet peering connects VNets with low latency through Microsoft's network."},
 {q:"Which connection type gives a private, dedicated link from on-premises to Azure that doesn't go over the public internet?",o:["Site-to-site VPN","Point-to-site VPN","ExpressRoute","Azure Front Door"],a:2,e:"ExpressRoute uses a private circuit through a connectivity provider."},
 {q:"A remote developer needs to connect a single laptop securely to an Azure VNet. Which option fits?",o:["ExpressRoute","Site-to-site VPN","VNet peering","Point-to-site VPN"],a:3,e:"Point-to-site VPN connects individual client devices to a VNet."},
 {q:"Which feature lets resources in a VNet reach an Azure PaaS service through a private IP address in the VNet?",o:["Private endpoint (Azure Private Link)","Public endpoint","Service tag","Network Watcher"],a:0,e:"A private endpoint gives the PaaS resource a private IP in your VNet."},
 {q:"Which Azure Storage redundancy option copies data three times within one datacenter only?",o:["ZRS","LRS","GRS","GZRS"],a:1,e:"Locally redundant storage keeps three copies in one datacenter. ZRS spreads them across zones."},
 {q:"Which redundancy option replicates across availability zones in the primary region and also to a secondary region?",o:["LRS","ZRS","GZRS","GRS"],a:2,e:"Geo-zone-redundant storage combines ZRS in the primary region with geo-replication to the paired region."},
 {q:"Which blob access tier is cheapest to store but has hours of rehydration latency?",o:["Hot","Cool","Cold","Archive"],a:3,e:"Archive is offline storage with the lowest cost and the highest retrieval time."},
 {q:"Which Azure Storage service provides SMB file shares that can be mounted by Windows and Linux?",o:["Azure Files","Azure Blob Storage","Azure Queue Storage","Azure Table Storage"],a:0,e:"Azure Files offers managed SMB and NFS shares."},
 {q:"Which tool moves large amounts of data offline to Azure by shipping a physical device?",o:["AzCopy","Azure Data Box","Azure Storage Explorer","Azure File Sync"],a:1,e:"Data Box is a rugged appliance for transferring terabytes when the network is too slow."},
 {q:"Which command-line tool copies blobs and files to and from Azure Storage?",o:["Azure Data Box","Azure Migrate","AzCopy","Azure Advisor"],a:2,e:"AzCopy is a command-line utility for high-speed storage copies."},
 {q:"Which service syncs on-premises Windows file servers with Azure Files and caches hot files locally?",o:["Azure Data Box","Azure Backup","Azure Site Recovery","Azure File Sync"],a:3,e:"Azure File Sync tiers files between on-premises servers and Azure Files."},
 {q:"Which identity service gives users single sign-on to Microsoft 365, Azure and thousands of SaaS apps?",o:["Microsoft Entra ID","Azure Key Vault","Azure Policy","Microsoft Defender for Cloud"],a:0,e:"Microsoft Entra ID (formerly Azure AD) is the cloud identity provider."},
 {q:"A company wants external partner users to access a shared app using their own identities. Which feature fits?",o:["Creating local VM accounts","Microsoft Entra External ID (B2B collaboration)","Sharing one admin password","Azure Bastion"],a:1,e:"B2B collaboration invites guest users who sign in with their own organization's credentials."},
 {q:"Which feature requires MFA only when users sign in from outside the corporate network?",o:["Azure RBAC","Resource locks","Conditional Access","Azure Policy"],a:2,e:"Conditional Access applies if-then policies based on signals such as location and device."},
 {q:"Which security model assumes breach and verifies every request explicitly?",o:["Perimeter trust","Implicit trust","Open access","Zero Trust"],a:3,e:"Zero Trust's principles are verify explicitly, use least privilege and assume breach."}
]);

/* ---------- 3. Azure Management and Governance (20) ---------- */
registerExamBank("gov",[
 {q:"A finance team wants an email when monthly Azure spending reaches 80% of a set amount. What should be configured?",o:["A budget with alerts in Microsoft Cost Management","Azure Policy","A resource lock","Azure Advisor score"],a:0,e:"Cost Management budgets send alerts at thresholds you set."},
 {q:"Which factor most affects the cost of an Azure VM?",o:["The resource group name","VM size, region and how long it runs","The number of tags","The subscription's display name"],a:1,e:"Size (SKU), region, OS license and runtime drive compute cost."},
 {q:"Which tool estimates the cost of Azure services before deployment?",o:["TCO calculator","Azure Advisor","Pricing calculator","Service Health"],a:2,e:"The pricing calculator estimates costs for a planned set of services. The TCO calculator compares on-premises with Azure."},
 {q:"Which tool compares the cost of running workloads on-premises versus in Azure?",o:["Pricing calculator","Cost Management","Azure Monitor","TCO calculator"],a:3,e:"The total cost of ownership calculator models on-premises costs against Azure."},
 {q:"Which feature labels resources with name/value pairs such as CostCenter=Finance for reporting?",o:["Tags","Locks","Blueprints","Management groups"],a:0,e:"Tags organize resources and appear in cost reports."},
 {q:"An admin must prevent anyone from deleting a production database, even owners, without first removing a setting. What should be used?",o:["Azure Policy audit","A CanNotDelete (Delete) resource lock","A tag","RBAC Reader role"],a:1,e:"Resource locks override permissions. A delete lock blocks deletion until it's removed."},
 {q:"Which service enforces rules such as 'only allow VMs in East US and West Europe'?",o:["Azure RBAC","Resource locks","Azure Policy","Azure Advisor"],a:2,e:"Azure Policy evaluates and enforces resource properties, such as allowed locations."},
 {q:"What does Azure RBAC control?",o:["Which regions resources can be deployed to","The cost of resources","The availability of resources","Who can perform which actions on which resources"],a:3,e:"RBAC assigns roles (sets of permissions) to security principals at a scope."},
 {q:"Which built-in role lets a user manage everything except granting access to others?",o:["Contributor","Owner","Reader","User Access Administrator"],a:0,e:"Contributor can create and manage resources but can't assign roles. Owner can."},
 {q:"Which service provides a unified view of data governance, classification and lineage across on-premises and cloud?",o:["Azure Arc","Microsoft Purview","Azure Monitor","Azure Bastion"],a:1,e:"Microsoft Purview discovers, classifies and governs data across environments."},
 {q:"Which service extends Azure management, policy and RBAC to servers running in other clouds or on-premises?",o:["Azure Migrate","ExpressRoute","Azure Arc","Azure Lighthouse only"],a:2,e:"Azure Arc projects non-Azure resources into Azure Resource Manager."},
 {q:"Which tool lets an admin run Azure CLI or PowerShell commands from a browser without installing anything?",o:["Azure Storage Explorer","Azure Advisor","Azure Data Box","Azure Cloud Shell"],a:3,e:"Cloud Shell is a browser-based shell with the tools preinstalled."},
 {q:"Which format do ARM templates use to define infrastructure declaratively?",o:["JSON","YAML only","CSV","XML"],a:0,e:"ARM templates are JSON. Bicep is a simpler language that compiles to ARM JSON."},
 {q:"What is a benefit of infrastructure as code with ARM templates or Bicep?",o:["Lower VM prices","Repeatable, consistent deployments that can be versioned","Automatic data backups","Removing the need for identity"],a:1,e:"Declarative templates deploy the same way every time and can be source-controlled."},
 {q:"Which service gives personalized recommendations to improve cost, security, reliability and performance?",o:["Azure Service Health","Azure Policy","Azure Advisor","Azure Arc"],a:2,e:"Advisor analyzes your resources and suggests improvements across the Well-Architected pillars."},
 {q:"Which service notifies you about Azure outages and planned maintenance affecting your resources?",o:["Azure Advisor","Log Analytics","Microsoft Purview","Azure Service Health"],a:3,e:"Service Health shows service issues, planned maintenance and health advisories for your regions and services."},
 {q:"Which service collects metrics and logs and supports alerts and dashboards across Azure resources?",o:["Azure Monitor","Azure Policy","Azure DNS","Microsoft Entra ID"],a:0,e:"Azure Monitor is the platform for metrics, logs (Log Analytics), alerts and Application Insights."},
 {q:"Which Azure Monitor feature monitors live web application performance, failures and usage?",o:["Service Health","Application Insights","Cost Management","Azure Arc"],a:1,e:"Application Insights is the application performance monitoring feature of Azure Monitor."},
 {q:"Which document describes Microsoft's uptime commitment and service credits for an Azure service?",o:["Azure Policy","Terms of the free account","Service Level Agreement (SLA)","Microsoft Purview report"],a:2,e:"Each service's SLA defines the uptime commitment and the credits if it's missed."},
 {q:"How can an organization apply the same policies and RBAC to many subscriptions at once?",o:["Assign them at each resource","Use tags only","Use resource locks only","Assign them at a management group above those subscriptions"],a:3,e:"Assignments at a management group are inherited by all subscriptions beneath it."}
]);
