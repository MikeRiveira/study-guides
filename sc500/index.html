<script>
/* ================= Module 1: Manage identity, access, and governance (SC-500 Domain 1, 20–25%) ================= */
(function(){
const LESSONS=[
{id:"zt",num:"1.1",title:"Microsoft Entra ID and Zero Trust",html:`
<p><b>Microsoft Entra ID</b> (formerly Azure Active Directory) is the cloud identity service behind every Azure subscription, Microsoft 365 tenant and thousands of SaaS apps. A <b>tenant</b> is one dedicated instance of Entra ID for an organization. Every subscription trusts exactly one tenant for sign-in.</p>
<h3>The identities you secure</h3>
<ul><li><b>Users</b>: members of your organization, and <b>guests</b> invited through Entra External ID (B2B collaboration).</li>
<li><b>Groups</b>: security groups (assign access) and Microsoft 365 groups (collaboration). Membership can be <b>assigned</b> or <b>dynamic</b> (rule-based).</li>
<li><b>Workload identities</b>: service principals, app registrations and managed identities that let code sign in.</li>
<li><b>Agent identities</b>: Entra Agent ID gives AI agents their own identity so you can govern them like any other principal (lesson 3.3).</li>
<li><b>Devices</b>: registered, joined or hybrid joined, and checked for compliance by Intune.</li></ul>
<h3>Zero Trust in three lines</h3>
<ul><li><b>Verify explicitly</b>: authenticate and authorize on every signal (user, location, device, app, risk).</li>
<li><b>Use least privilege</b>: just-in-time and just-enough access (PIM, custom roles, narrow scopes).</li>
<li><b>Assume breach</b>: segment, encrypt end to end, and monitor everything (Defender, Sentinel).</li></ul>
<div class="viz" id="viz-ztsort"></div>
<div class="viz" id="viz-ids"></div>
<div class="tip"><b>Exam tip.</b> Entra roles control the <b>directory</b> (users, apps, tenant settings). Azure RBAC roles control <b>Azure resources</b> (VMs, storage, vaults). The exam loves asking which one a scenario needs.</div>`},
{id:"auth",num:"1.2",title:"Authentication methods: MFA and passwordless",html:`
<p>Passwords alone are the root of most account compromises. Entra ID supports many <b>authentication methods</b>, managed centrally in the <b>Authentication methods policy</b> (the legacy per-user MFA and SSPR policies were migrated into it).</p>
<h3>Methods from weakest to strongest</h3>
<ul><li><b>Password</b>: something you know. Never enough on its own.</li>
<li><b>SMS and voice call</b>: better than nothing, but vulnerable to SIM swapping and interception.</li>
<li><b>Microsoft Authenticator push</b> with <b>number matching</b> (always on) and additional context: resists MFA fatigue attacks.</li>
<li><b>OATH tokens</b> (TOTP software or hardware tokens).</li>
<li><b>Phishing-resistant</b>: <b>passkeys (FIDO2)</b> on security keys or in Microsoft Authenticator, <b>Windows Hello for Business</b>, and <b>certificate-based authentication</b> (CBA). These bind the sign-in to the real site, so a fake login page can't replay them.</li></ul>
<h3>Making it stick</h3>
<ul><li><b>Security defaults</b>: a free, one-switch baseline (MFA registration for everyone, block legacy auth). Turn it off when you move to Conditional Access.</li>
<li><b>Authentication strengths</b>: a Conditional Access grant control that requires a specific set of methods, such as "Phishing-resistant MFA" for admins.</li>
<li><b>Temporary Access Pass</b>: a time-limited passcode so a new user can register a passkey without ever having a password.</li>
<li><b>Self-service password reset (SSPR)</b> and <b>password protection</b> (global and custom banned password lists, including on-premises AD through the agent).</li></ul>
<div class="viz" id="viz-methods"></div>
<div class="viz" id="viz-mfaq"></div>
<div class="tip"><b>Exam tip.</b> "Phishing-resistant" means FIDO2/passkeys, Windows Hello for Business or certificate-based authentication. Push notifications and SMS are MFA, but not phishing-resistant.</div>`},
{id:"ca",num:"1.3",title:"Conditional Access policies",html:`
<p><b>Conditional Access</b> (CA) is the Zero Trust policy engine of Entra ID. It needs <b>Microsoft Entra ID P1</b> (risk-based conditions need <b>P2</b>). Every policy reads like an if-then statement: <b>if</b> these assignments and conditions match, <b>then</b> apply these access controls.</p>
<h3>Parts of a policy</h3>
<ul><li><b>Assignments</b>: users, groups, roles, guests, workload identities and agents (include and exclude). Always exclude <b>break-glass</b> (emergency access) accounts.</li>
<li><b>Target resources</b>: cloud apps (such as "Windows Azure Service Management API" for the portal, CLI and PowerShell), user actions (register security info) or authentication context.</li>
<li><b>Conditions</b>: user risk, sign-in risk, device platform, locations (named locations, compliant network), client apps (legacy authentication), filter for devices.</li>
<li><b>Grant</b>: block, or grant while requiring MFA, an authentication strength, a compliant or hybrid joined device, an approved client app, an app protection policy or a password change.</li>
<li><b>Session</b>: sign-in frequency, persistent browser session, app enforced restrictions, Conditional Access App Control (Defender for Cloud Apps), continuous access evaluation.</li></ul>
<h3>How policies combine</h3>
<p>All matching policies apply together. <b>Block wins</b> over every grant. If two policies require different controls, the user must satisfy all of them. New policies should start in <b>report-only</b> mode; use the <b>What If</b> tool and sign-in logs to see the effect before turning them on.</p>
<div class="viz" id="viz-cabuild"></div>
<div class="viz" id="viz-caq"></div>
<div class="tip"><b>Exam tip.</b> CA is evaluated <b>after</b> first-factor authentication. That's why it can use the user's identity and risk, and why it can't stop a password spray from hitting the sign-in page.</div>`},
{id:"pim",num:"1.4",title:"Privileged Identity Management (PIM)",html:`
<p>Standing admin access is a gift to attackers. <b>Privileged Identity Management</b> (Entra ID P2 or Entra ID Governance) replaces it with <b>just-in-time</b>, time-bound and approved access.</p>
<h3>Assignment types</h3>
<ul><li><b>Eligible</b>: the user can activate the role when needed. Nothing is granted until they do.</li>
<li><b>Active</b>: the role is granted now, either permanently or until an end date.</li></ul>
<h3>What PIM manages</h3>
<ul><li><b>Microsoft Entra roles</b> (Global Administrator, Security Administrator and so on).</li>
<li><b>Azure resource roles</b> (Owner, Contributor, User Access Administrator) at management group, subscription, resource group or resource scope.</li>
<li><b>PIM for Groups</b>: just-in-time membership or ownership of a security group, which can carry both kinds of roles.</li></ul>
<h3>Role settings you configure</h3>
<ul><li>Maximum activation duration (1 to 24 hours), require MFA or an authentication context on activation, require justification and a ticket number, require approval and pick approvers.</li>
<li>Allow permanent eligible or active assignments, or force an expiry.</li>
<li>Notifications when roles are assigned or activated.</li></ul>
<p><b>Access reviews</b> ask owners, managers or the users themselves to confirm that access is still needed, and can remove it automatically if nobody answers.</p>
<div class="viz" id="viz-pimflow"></div>
<div class="viz" id="viz-pimq"></div>
<div class="tip"><b>Exam tip.</b> "Require approval to activate the Owner role on the production subscription" is a PIM <b>Azure resource</b> role setting, not an Entra role setting. And PIM needs P2 or Entra ID Governance licenses for the users who benefit.</div>`},
{id:"apps",num:"1.5",title:"Identity for applications",html:`
<p>When an application needs to sign in users or call APIs, it needs an identity in Entra ID. Two objects make that happen, and mixing them up is a classic exam trap.</p>
<h3>App registration vs enterprise application</h3>
<ul><li><b>App registration</b> (the <b>application object</b>): the global definition of the app, living in its <b>home tenant</b>. It holds the client ID, redirect URIs, credentials (client secrets, certificates, federated credentials), exposed API scopes and app roles, and the API permissions it requests.</li>
<li><b>Enterprise application</b> (the <b>service principal</b>): the local instance of the app in <b>each tenant</b> that uses it. Assignments, consent grants, Conditional Access and sign-in logs all attach to the service principal.</li></ul>
<p>A multitenant app has one application object and one service principal in every customer tenant.</p>
<h3>Securing app identities</h3>
<ul><li>Prefer <b>certificates</b> or <b>federated identity credentials</b> (workload identity federation for GitHub Actions, Kubernetes, other clouds) over client secrets. If you must use secrets, keep them short-lived and in Key Vault.</li>
<li>Turn on <b>Assignment required</b> on the enterprise app so only assigned users and groups can sign in.</li>
<li>Assign <b>owners</b>, and use app management policies to restrict credential types and lifetimes.</li>
<li>Protect workload identities with Conditional Access for workload identities and Entra ID Protection risk detections (Workload ID Premium).</li></ul>
<div class="viz" id="viz-appobj"></div>
<div class="viz" id="viz-oauthflow"></div>
<div class="tip"><b>Exam tip.</b> "Users from another tenant must sign in to your app" means a multitenant app registration. "Only the HR group should be able to sign in" means Assignment required on the enterprise application.</div>`},
{id:"consent",num:"1.6",title:"OAuth permission grants and consent",html:`
<p>Apps don't get access to data just by existing. They request <b>permissions</b> (scopes) on an API such as Microsoft Graph, and someone has to <b>consent</b>.</p>
<h3>Two kinds of permissions</h3>
<ul><li><b>Delegated permissions</b>: the app acts <b>on behalf of a signed-in user</b>. Effective access is the overlap of what the app was granted and what the user can do. Some low-risk scopes can be consented by users; others need an admin.</li>
<li><b>Application permissions</b> (app roles): the app acts <b>as itself</b>, with no user, such as a background service reading every mailbox. These <b>always require admin consent</b>.</li></ul>
<h3>Consent settings</h3>
<ul><li><b>User consent settings</b>: do not allow user consent, allow it only for apps from <b>verified publishers</b> requesting <b>low-impact</b> permissions you classify, or allow it for everything (not recommended).</li>
<li><b>Admin consent workflow</b>: users request access, and designated reviewers approve or deny it.</li>
<li><b>Grant admin consent</b> on behalf of the whole organization from the app registration or enterprise app.</li>
<li>Review and revoke existing grants in <b>Enterprise applications &gt; Permissions</b>, and investigate <b>illicit consent grant</b> (consent phishing) attacks where users were tricked into approving a malicious app.</li></ul>
<div class="viz" id="viz-permsort"></div>
<div class="viz" id="viz-consentq"></div>
<div class="tip"><b>Exam tip.</b> A daemon with no signed-in user needs <b>application</b> permissions plus <b>admin consent</b>. A web app reading the signed-in user's calendar needs a <b>delegated</b> permission.</div>`},
{id:"mi",num:"1.7",title:"Managed identities for Azure resources",html:`
<p>The best secret is the one nobody has to store. A <b>managed identity</b> is a service principal that Azure creates and rotates for you, so code running on an Azure resource can get tokens for Entra-protected services (Key Vault, Storage, SQL, Microsoft Graph) without any credential in code or config.</p>
<h3>Two types</h3>
<ul><li><b>System-assigned</b>: enabled on one resource, shares its lifecycle, and is deleted with it. One resource, one identity.</li>
<li><b>User-assigned</b>: a standalone Azure resource you create, then attach to one or many resources. It survives when they're deleted. Good for scale sets, pre-provisioning access, or many resources needing the same permissions.</li></ul>
<h3>How it works</h3>
<p>Code on a VM asks the local <b>Instance Metadata Service</b> endpoint (169.254.169.254) for a token for a resource. Azure returns an Entra access token for the managed identity, and the code presents it to the target service. The target checks its RBAC role assignments to decide what the identity can do. App Service and Functions expose an equivalent local identity endpoint.</p>
<div class="viz" id="viz-miflow"></div>
<div class="viz" id="viz-misort"></div>
<div class="tip"><b>Exam tip.</b> Enabling a managed identity grants nothing by itself. You still need a <b>role assignment</b> on the target, such as Key Vault Secrets User or Storage Blob Data Reader.</div>`},
{id:"kv",num:"1.8",title:"Azure Key Vault",html:`
<p><b>Azure Key Vault</b> stores <b>secrets</b> (passwords, connection strings), <b>keys</b> (RSA and EC keys for encryption and signing) and <b>certificates</b> (with automatic renewal from integrated CAs).</p>
<h3>Deploying and configuring a vault</h3>
<ul><li><b>Standard</b> tier uses software-protected keys; <b>Premium</b> adds HSM-protected keys (FIPS 140 Level 3). <b>Managed HSM</b> is a dedicated, single-tenant HSM pool for the strictest needs.</li>
<li><b>Soft delete</b> is always on: deleted vaults and objects are kept for 7 to 90 days (default 90) and can be recovered.</li>
<li><b>Purge protection</b>: once on, nobody (not even Microsoft) can permanently delete the vault or its objects until the retention period ends. It can't be turned off. Required for customer-managed keys in many services.</li></ul>
<h3>Access control</h3>
<ul><li><b>Control plane</b> (manage the vault itself) is always Azure RBAC.</li>
<li><b>Data plane</b> (read a secret, use a key) uses either <b>Azure RBAC</b> (recommended: Key Vault Administrator, Secrets Officer, Secrets User, Crypto Officer, Crypto User, Crypto Service Encryption User, Certificates Officer, Reader) or legacy <b>vault access policies</b>.</li>
<li>With access policies, anyone with Contributor on the vault can grant themselves data access. That's a key reason to switch to RBAC.</li></ul>
<h3>Network and protection</h3>
<ul><li><b>Firewall</b>: allow only selected virtual networks and IP ranges, optionally allow trusted Microsoft services, or disable public access and use a <b>private endpoint</b>.</li>
<li><b>Rotation</b>: key rotation policies rotate keys on a schedule; Event Grid "near expiry" events can trigger secret rotation functions.</li>
<li><b>Microsoft Defender for Key Vault</b> alerts on unusual access, such as access from a Tor exit node or a suspicious spike in secret reads.</li>
<li><b>Defender CSPM</b> scans VMs, code repositories and cloud deployments for <b>exposed secrets</b> and recommends moving them into Key Vault.</li></ul>
<div class="viz" id="viz-purge"></div>
<div class="viz" id="viz-kvroles"></div>
<div class="tip"><b>Exam tip.</b> "An app must read secrets but not change them" is <b>Key Vault Secrets User</b>. "Storage needs to wrap and unwrap a customer-managed key" is <b>Key Vault Crypto Service Encryption User</b>.</div>`},
{id:"rbac",num:"1.9",title:"Azure RBAC: built-in and custom roles",html:`
<p><b>Azure role-based access control</b> answers three questions: <b>who</b> (security principal), <b>what</b> (role definition) and <b>where</b> (scope). A role assignment ties the three together.</p>
<h3>Scope and inheritance</h3>
<p>Scopes nest: <b>management group &gt; subscription &gt; resource group &gt; resource</b>. Assignments are inherited downward. Assign at the narrowest scope that does the job.</p>
<h3>Built-in roles to know</h3>
<ul><li><b>Owner</b>: full access including assigning roles. <b>Contributor</b>: full management but no role assignments. <b>Reader</b>: view only.</li>
<li><b>User Access Administrator</b>: manage access only. <b>Role Based Access Control Administrator</b>: assign roles, optionally limited by <b>conditions</b> (for example, only allow assigning Reader).</li>
<li>Data roles such as <b>Storage Blob Data Contributor</b> work on the <b>data plane</b> (DataActions), not the control plane (Actions).</li></ul>
<h3>Custom roles</h3>
<ul><li><b>Azure custom roles</b> are JSON with Actions, NotActions, DataActions, NotDataActions and AssignableScopes. NotActions subtracts from Actions; it is not a deny.</li>
<li><b>Entra custom roles</b> (P1) use directory permissions such as <code>microsoft.directory/<wbr>applications/<wbr>credentials/<wbr>update</code> and can be scoped to an administrative unit or a single app.</li>
<li><b>Deny assignments</b> block actions even when a role allows them. You can't create them directly; Azure creates them for managed apps and deployment stack deny settings.</li></ul>
<h3>Remediating overprivileged access</h3>
<p>Review <b>Access control (IAM) &gt; Role assignments</b>, find Owners and Contributors that don't need it, replace them with narrower roles, and move standing access to PIM eligible assignments. Defender CSPM's <b>permissions management</b> recommendations and Entra access reviews highlight unused permissions.</p>
<div class="viz" id="viz-scope"></div>
<div class="viz" id="viz-roleq"></div>
<div class="tip"><b>Exam tip.</b> A user can read a storage account's settings but gets "not authorized" opening a blob with Entra auth? They have a control-plane role (Reader) but no data-plane role (Storage Blob Data Reader).</div>`},
{id:"gov",num:"1.10",title:"Governance: Azure Policy, locks, backup and IaC",html:`
<p>Governance makes the secure configuration the default, and keeps it that way.</p>
<h3>Azure Policy</h3>
<ul><li>A <b>policy definition</b> is a JSON rule (if a condition, then an effect). An <b>initiative</b> (policy set) groups definitions, such as the <b>Microsoft cloud security benchmark</b>.</li>
<li><b>Effects</b>: <b>Deny</b> (block the request), <b>Audit</b> (log non-compliance), <b>AuditIfNotExists</b>, <b>DeployIfNotExists</b> (deploy a missing setting, such as diagnostic settings), <b>Modify</b> (add or change tags and properties), <b>Append</b>, <b>Disabled</b>, and <b>DenyAction</b> (block delete calls).</li>
<li>DeployIfNotExists and Modify need a <b>managed identity</b> on the assignment and a <b>remediation task</b> to fix existing resources.</li>
<li>Assign at management group, subscription or resource group, with <b>exclusions</b> and <b>exemptions</b> (waiver or mitigated).</li></ul>
<h3>Defender for Cloud regulatory compliance</h3>
<p>Defender for Cloud maps policy results to <b>security standards</b> (MCSB by default; add NIST SP 800-53, PCI DSS, ISO 27001, CIS and more) and shows a compliance dashboard per control. More in module 4.</p>
<h3>Resource locks</h3>
<ul><li><b>CanNotDelete</b> (Delete): read and modify, but not delete. <b>ReadOnly</b>: read only, no changes.</li>
<li>Locks apply to everyone, including Owners, and are inherited by child resources. A ReadOnly lock can break things, such as listing storage keys (a POST action).</li></ul>
<h3>Backup security</h3>
<ul><li><b>Soft delete</b> for backups (with always-on option), <b>immutable vaults</b> (locked immutability can't be undone), <b>multi-user authorization</b> (MUA) through a Resource Guard so one admin can't disable protection alone, and <b>encryption with customer-managed keys</b>.</li></ul>
<h3>Infrastructure as code</h3>
<p>Define security in Bicep, ARM or Terraform templates, scan templates in pipelines (Defender for Cloud DevOps security, IaC scanning), and use <b>deployment stacks</b> with deny settings to stop drift.</p>
<div class="viz" id="viz-effects"></div>
<div class="viz" id="viz-lock"></div>
<div class="viz" id="viz-backup"></div>
<div class="tip"><b>Exam tip.</b> "Prevent storage accounts without HTTPS from being created" is <b>Deny</b>. "Automatically configure diagnostic settings on every new key vault" is <b>DeployIfNotExists</b> with a managed identity.</div>`}

function vizCaBuild(){
  const el=$("#viz-cabuild");const tried=new Set();
  const USERS={all:"All users",admins:"Directory roles: admins",guests:"Guests"},APPS={all:"All cloud apps",azure:"Azure management",m365:"Office 365"};
  const GR={block:"Block access",mfa:"Require MFA",phr:"Require phishing-resistant MFA",dev:"Require compliant device"};
  let u="admins",a="azure",g="phr",excl=true;
  const S=[["Dana","admin","Portal, from a hotel with Authenticator push","azure",{push:1}],["Lee","admin","Portal, with a FIDO2 security key","azure",{fido:1}],["Sam","user","Outlook, from a managed laptop","m365",{push:1,dev:1}],["Ava","guest","Teams, from a personal phone","m365",{push:1}],["Break-glass","bg","Portal, emergency account","azure",{fido:1}]];
  const inU=s=>s[1]==="bg"?(!excl&&u==="all"):u==="all"||u==="admins"&&s[1]==="admin"||u==="guests"&&s[1]==="guest";
  const inA=s=>a==="all"||a===s[3];
  const res=s=>{if(!(inU(s)&&inA(s)))return ["Not in scope","dim"];
    if(g==="block")return ["Blocked","no"];
    if(g==="mfa")return ["Allowed after MFA","ok"];
    if(g==="phr")return s[4].fido?["Allowed (passkey)","ok"]:["Blocked: method too weak","no"];
    return s[4].dev?["Allowed (compliant)","ok"]:["Blocked: unmanaged device","no"]};
  function draw(){tried.add(u+a+g);
    const locked=g==="block"&&u==="all"&&!excl;if(locked)flag("lockedout");
    el.innerHTML=`<div class="viz-title">Conditional Access policy builder</div>
    <div class="sel-row"><span>Users</span><div class="seg-row">${Object.keys(USERS).map(k=>`<button class="chip" data-u="${k}" aria-pressed="${k===u}">${USERS[k]}</button>`).join("")}</div></div>
    <div class="sel-row"><span>Exclude</span><div class="seg-row"><button class="chip" data-x="1" aria-pressed="${excl}">${excl?"✓ ":""}Break-glass account</button></div></div>
    <div class="sel-row"><span>Target apps</span><div class="seg-row">${Object.keys(APPS).map(k=>`<button class="chip" data-a="${k}" aria-pressed="${k===a}">${APPS[k]}</button>`).join("")}</div></div>
    <div class="sel-row"><span>Grant</span><div class="seg-row">${Object.keys(GR).map(k=>`<button class="chip" data-g="${k}" aria-pressed="${k===g}">${GR[k]}</button>`).join("")}</div></div>
    <div class="tbl-wrap"><table class="tbl"><tr><th>Sign-in</th><th>Result</th></tr>${S.map(s=>{const r=res(s);return `<tr><td><b>${s[0]}</b> <span class="s-small">${s[2]}</span></td><td class="${r[1]}">${r[0]}</td></tr>`}).join("")}</table></div>
    <div class="caption" aria-live="polite">${locked?'<span class="status-bad">You just locked out every account, including the emergency one.</span> This is why every block policy excludes break-glass accounts and starts in report-only mode.':g==="phr"?"Authentication strength: push notifications are MFA, but only passkeys, Windows Hello and certificates count as phishing-resistant.":g==="block"?"Block wins over every other policy. Scope block policies tightly.":"Change the users, apps and grant to see who gets in."}</div>
    <div class="rv-prog s-small">${Math.min(tried.size,8)} of 8 policy combinations tried</div>`;
    if(tried.size>=8)award("viz:cabuild",30,"Built Conditional Access policies")}
  el.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;if(d.u)u=d.u;if(d.a)a=d.a;if(d.g)g=d.g;if(d.x)excl=!excl;draw()});draw();
}
function vizPurge(){
  const el=$("#viz-purge");let pp=false,state="live",msg="",seen=new Set();
  function draw(){
    el.innerHTML=`<div class="viz-title">Key vault lifecycle: soft delete and purge protection</div>
    <div class="sel-row"><span>Purge protection</span><div class="seg-row"><button class="chip" data-p="0" aria-pressed="${!pp}" ${state!=="live"&&pp?"disabled":""}>Off</button><button class="chip" data-p="1" aria-pressed="${pp}">On</button></div></div>
    <div class="two-col"><div class="panel ${state==="live"?"good":state==="gone"?"bad":""}"><b>kv-contoso-prod</b><span class="s-small">${state==="live"?"Active · 14 secrets, 3 keys":state==="deleted"?"Soft-deleted · recoverable for 90 days":"Permanently purged"}</span></div>
    <div class="panel"><b>Actions</b><div class="dep-row"><button class="btn" data-a="del" ${state!=="live"?"disabled":""}>Delete vault</button><button class="btn" data-a="rec" ${state!=="deleted"?"disabled":""}>Recover</button><button class="btn" data-a="purge" ${state!=="deleted"?"disabled":""}>Purge</button><button class="btn" data-a="reset">Start over</button></div></div></div>
    <div class="caption" aria-live="polite">${msg||"Soft delete is always on. Try deleting, recovering and purging with purge protection off and on."}</div>
    <div class="rv-prog s-small">${seen.size} of 4 outcomes seen</div>`;
    if(seen.size>=4)award("viz:purge",30,"Tested soft delete and purge protection")}
  el.addEventListener("click",e=>{const p=e.target.closest("[data-p]"),a=e.target.closest("[data-a]")?.dataset.a;
    if(p){if(p.dataset.p==="1"){pp=true;msg="Purge protection is on. Note there's no way to switch it back off."}else if(!pp)msg="";else msg="<span class=\"status-bad\">Can't turn it off.</span> Once enabled, purge protection is permanent."}
    if(a==="del"){state="deleted";msg="Deleted. The vault and its objects stay in a soft-deleted state and the name stays reserved.";seen.add("del")}
    if(a==="rec"){state="live";msg="<span class=\"status-good\">Recovered</span> with every secret, key and access setting intact.";seen.add("rec")}
    if(a==="purge"){if(pp){msg="<span class=\"status-bad\">Purge blocked.</span> With purge protection, nobody can purge until the retention period ends, not even a subscription Owner. Your keys survive a rogue admin or ransomware actor.";seen.add("block");flag("purge")}else{state="gone";msg="<span class=\"status-bad\">Gone for good.</span> Anything encrypted with those keys is now unreadable. That's why services using customer-managed keys require purge protection.";seen.add("gone")}}
    if(a==="reset"){state="live";pp=false;msg=""}
    if(p||a)draw()});draw();
}

function vizLock(){
  const el=$("#viz-lock");const tried=new Set();let lock="none",last=null;
  const A=[["read","View settings",1],["tag","Add a tag",2],["keys","List access keys (POST)",2],["delete","Delete the account",3]];
  const LK={none:"No lock",del:"CanNotDelete",ro:"ReadOnly"};
  const ok=(k,a)=>k==="none"||a[2]===1||k==="del"&&a[2]===2;
  function draw(){
    el.innerHTML=`<div class="viz-title">Resource lock tester · you are an Owner of stpayments</div>
    <div class="sel-row"><span>Lock</span><div class="seg-row">${Object.keys(LK).map(k=>`<button class="chip" data-l="${k}" aria-pressed="${k===lock}">${LK[k]}</button>`).join("")}</div></div>
    <div class="viz-controls">${A.map(a=>`<button class="btn" data-a="${a[0]}">${a[1]}</button>`).join("")}</div>
    <div class="tbl-wrap"><table class="tbl"><tr><th>Action</th>${Object.keys(LK).map(k=>`<th class="${k===lock?"cur":""}">${LK[k]}</th>`).join("")}</tr>${A.map(a=>`<tr><td>${a[1]}</td>${Object.keys(LK).map(k=>`<td class="${tried.has(k+a[0])?(ok(k,a)?"ok":"no"):"dim"}">${tried.has(k+a[0])?(ok(k,a)?"✓ Allowed":"✗ Blocked"):"?"}</td>`).join("")}</tr>`).join("")}</table></div>
    <div class="caption" aria-live="polite">${last?(ok(lock,last)?`<span class="status-good">Allowed.</span>`:`<span class="status-bad">Blocked by the ${LK[lock]} lock.</span> Locks apply to everyone, Owners included.`)+(last[0]==="keys"&&lock==="ro"?" Listing keys is a POST action, so ReadOnly breaks apps that fetch keys.":""):"Pick a lock, then try each action."}</div>
    <div class="rv-prog s-small">${tried.size} of 12 combinations tried</div>`;
    if(tried.size>=10)award("viz:lock",30,"Tested every resource lock")}
  el.addEventListener("click",e=>{const l=e.target.closest("[data-l]"),a=e.target.closest("[data-a]");if(l){lock=l.dataset.l;last=null}
    if(a){last=A.find(x=>x[0]===a.dataset.a);tried.add(lock+last[0])}if(l||a)draw()});draw();
}

<script>
/* ================= Module 2: Secure storage, databases, and networking (SC-500 Domain 2, 25–30%) ================= */
(function(){
const LESSONS=[
{id:"stsec",num:"2.1",title:"Securing storage accounts",html:`
<p>A storage account is one of the most attacked resources in Azure because a single misconfiguration can expose millions of files. Harden every account with these settings.</p>
<h3>Baseline settings</h3>
<ul><li><b>Secure transfer required</b> (HTTPS only) and <b>minimum TLS version 1.2</b>.</li>
<li><b>Allow Blob anonymous access: disabled</b>. With it off, no container can be made public.</li>
<li><b>Allow storage account key access: disabled</b> where possible, forcing Microsoft Entra authorization for blobs, queues and tables. This also blocks SAS tokens signed with account keys.</li>
<li><b>Default to Microsoft Entra authorization</b> in the Azure portal.</li>
<li><b>Permitted scope for copy operations</b>: limit copies to accounts in the same tenant or with private links.</li></ul>
<h3>Encryption</h3>
<ul><li>All data is encrypted at rest with <b>Storage Service Encryption</b> (AES-256), using <b>Microsoft-managed keys</b> by default.</li>
<li><b>Customer-managed keys</b> (CMK, also called bring your own key) live in Key Vault or Managed HSM. The account's managed identity needs wrap and unwrap rights, and the vault needs soft delete and purge protection.</li>
<li><b>Infrastructure encryption</b> adds a second layer of encryption with a different algorithm and key (double encryption). It must be set when the account is created.</li>
<li><b>Encryption scopes</b> let you use different keys for different containers or blobs.</li></ul>
<div class="viz" id="viz-sthard"></div>
<div class="viz" id="viz-enclayers"></div>
<div class="tip"><b>Exam tip.</b> Infrastructure (double) encryption can't be turned on later. If a question says "existing account," the answer is to create a new account with it enabled and copy the data.</div>`},
{id:"staccess",num:"2.2",title:"Managing access to storage",html:`
<p>There are four ways to authorize a request to Azure Storage. Know when each one fits.</p>
<h3>Authorization options</h3>
<ul><li><b>Microsoft Entra ID with Azure RBAC</b> (recommended): data roles such as <b>Storage Blob Data Reader</b>, <b>Contributor</b> and <b>Owner</b>, <b>Storage Queue Data Contributor</b>, and for Azure Files, <b>Storage File Data SMB Share Reader / Contributor / Elevated Contributor</b>. You can add <b>attribute-based conditions</b> (ABAC) such as "only blobs with tag project=alpine".</li>
<li><b>Shared Key</b> (account access keys): two 512-bit keys that grant full access to everything. Rotate them regularly (Key Vault or manual rotation with key expiration policies), or disable Shared Key entirely.</li>
<li><b>Shared access signatures (SAS)</b>: a signed URL with permissions, start and expiry time, allowed IPs and protocol.</li>
<li><b>Anonymous public read</b> for containers. Disable it at the account level.</li></ul>
<h3>Three kinds of SAS</h3>
<ul><li><b>User delegation SAS</b>: signed with an Entra user delegation key. Blob and Data Lake only. The most secure SAS, and it's audited to an identity.</li>
<li><b>Service SAS</b>: signed with an account key, for one service (blob, queue, table or file).</li>
<li><b>Account SAS</b>: signed with an account key, can cover several services and service-level operations.</li></ul>
<p>A <b>stored access policy</b> on a container defines the permissions and expiry for service SAS tokens that reference it. Change or delete the policy and every SAS that uses it changes or is revoked at once. The only other way to revoke an account-key SAS is to rotate the key.</p>
<h3>Azure Files access</h3>
<p>SMB shares can use identity-based authentication with <b>on-premises AD DS</b>, <b>Microsoft Entra Domain Services</b> or <b>Microsoft Entra Kerberos</b> (hybrid identities), with share-level RBAC roles plus Windows ACLs at the directory and file level.</p>
<div class="viz" id="viz-sas"></div>
<div class="viz" id="viz-sassort"></div>
<div class="tip"><b>Exam tip.</b> "Revoke a SAS without rotating keys" means a <b>stored access policy</b>. "SAS that doesn't depend on account keys" means a <b>user delegation SAS</b>.</div>`},
{id:"stfw",num:"2.3",title:"Storage firewall, Defender for Storage and data protection",html:`
<h3>Storage firewall rules</h3>
<ul><li><b>Public network access</b>: enabled from all networks, enabled from selected virtual networks and IP addresses, or disabled.</li>
<li><b>Virtual network rules</b> rely on <b>service endpoints</b> for Microsoft.Storage on the subnet.</li>
<li><b>IP network rules</b> allow public IP ranges (not private RFC 1918 ranges).</li>
<li><b>Resource instance rules</b> allow a specific Azure resource (such as one Synapse workspace) by its managed identity.</li>
<li><b>Exceptions</b>: allow trusted Microsoft services, allow reading logs and metrics from anywhere.</li>
<li>For fully private access, use <b>private endpoints</b> and disable public access (lesson 2.9).</li></ul>
<h3>Microsoft Defender for Storage</h3>
<ul><li><b>Activity monitoring</b>: detects unusual access, such as from a suspicious IP, unusual data extraction, or access from a Tor exit node.</li>
<li><b>Malware scanning</b>: scans blobs on upload (or on demand) with Microsoft Defender Antivirus, and can tag, soft delete or quarantine infected files.</li>
<li><b>Sensitive data threat detection</b>: uses sensitive information types to prioritize alerts on accounts holding sensitive data.</li>
<li>Enabled per subscription (with overrides per account), billed per storage account and per GB scanned.</li></ul>
<h3>Protecting data against loss and ransomware</h3>
<ul><li><b>Soft delete</b> for blobs, containers and file shares. <b>Versioning</b> keeps previous versions on overwrite. <b>Point-in-time restore</b> for block blobs. <b>Change feed</b> logs every change.</li>
<li><b>Immutable storage</b> (WORM): <b>time-based retention</b> policies or <b>legal holds</b> at container or version level. A <b>locked</b> time-based policy can't be shortened or deleted.</li>
<li><b>Azure Backup</b> for blobs and Azure Files, and a <b>CanNotDelete</b> lock on the account.</li></ul>
<div class="viz" id="viz-stfwtest"></div>
<div class="viz" id="viz-protsort"></div>
<div class="tip"><b>Exam tip.</b> "Files must not be modified or deleted for 7 years for compliance" means immutable storage with a locked time-based retention policy, not soft delete.</div>`},
{id:"sql",num:"2.4",title:"Platform security for Azure SQL",html:`
<p>Azure SQL Database and Azure SQL Managed Instance share a set of layered protections. Think of them from the outside in.</p>
<h3>Network</h3>
<ul><li><b>Server-level and database-level IP firewall rules</b> (SQL Database). "Allow Azure services and resources to access this server" opens it to all of Azure, including other customers. Avoid it.</li>
<li><b>Virtual network rules</b> (service endpoints), <b>private endpoints</b> and <b>Deny public network access</b>.</li>
<li><b>SQL Managed Instance</b> lives inside your VNet in a delegated subnet. Its <b>public endpoint</b> (port 3342) is off by default; the private endpoint uses port 1433. NSG rules on the subnet control access.</li>
<li><b>Connection policy</b>: Redirect (clients connect directly to the node, ports 11000–11999) or Proxy (through the gateway, port 1433).</li></ul>
<h3>Identity</h3>
<ul><li><b>Microsoft Entra authentication</b>: set an <b>Entra admin</b> for the server, create contained users from Entra identities (<code>CREATE USER [name] FROM EXTERNAL PROVIDER</code>), and use managed identities for apps.</li>
<li><b>Microsoft Entra-only authentication</b> disables SQL authentication completely.</li></ul>
<h3>Data protection</h3>
<ul><li><b>Transparent Data Encryption</b> (TDE): encrypts data and log files at rest, on by default. The protector can be <b>service-managed</b> or a <b>customer-managed key</b> in Key Vault (needs soft delete and purge protection).</li>
<li><b>Always Encrypted</b>: columns are encrypted in the client driver, so the database engine and its admins never see plaintext. <b>Deterministic</b> encryption allows equality lookups; <b>randomized</b> is stronger but can't be searched. <b>Secure enclaves</b> allow richer queries.</li>
<li><b>Dynamic data masking</b>: hides data in query results for non-privileged users (for example, XXXX-XXXX-XXXX-1234). Not encryption; users with UNMASK see real data.</li>
<li><b>Row-level security</b>, <b>ledger</b> tables (tamper evidence), and TLS 1.2 minimum for data in transit.</li></ul>
<div class="viz" id="viz-sqlpick"></div>
<div class="viz" id="viz-ddm"></div>
<div class="tip"><b>Exam tip.</b> "Even DBAs must not see the credit card numbers" means <b>Always Encrypted</b>. "Support staff should see only the last four digits" means <b>dynamic data masking</b>.</div>`},
{id:"dbmon",num:"2.5",title:"Database auditing and Defender for Databases",html:`
<h3>Auditing for Azure SQL Database and SQL Managed Instance</h3>
<ul><li>Auditing tracks database events and writes them to a <b>storage account</b>, a <b>Log Analytics workspace</b> or <b>Event Hubs</b>.</li>
<li>A <b>server-level</b> audit policy applies to every database on the server. A database-level policy adds to it; it doesn't replace it.</li>
<li>Default action groups capture successful and failed logins and all batches. Audit <b>Microsoft support operations</b> separately.</li>
<li>For SQL Managed Instance, auditing is configured with T-SQL (<code>CREATE SERVER AUDIT ... TO URL</code> or <code>TO EXTERNAL_MONITOR</code>) and targets storage, Log Analytics or Event Hubs.</li>
<li>Storage targets should use a managed identity and immutable storage if logs must be tamper-proof.</li></ul>
<h3>Microsoft Defender for Databases</h3>
<p>One plan family that covers:</p>
<ul><li><b>Defender for Azure SQL</b> (SQL Database, Managed Instance, Synapse dedicated pools) and <b>SQL servers on machines</b> (on Azure VMs, on-premises and other clouds via Arc).</li>
<li><b>Open-source relational databases</b>: Azure Database for PostgreSQL, MySQL and MariaDB.</li>
<li><b>Azure Cosmos DB</b>.</li></ul>
<p>It provides <b>vulnerability assessment</b> (misconfigurations, excessive permissions, unprotected sensitive data, with a baseline you approve) and <b>Advanced Threat Protection</b> alerts: SQL injection, potential SQL injection, brute force, access from an unusual location or a suspicious application, and unusual data export.</p>
<div class="viz" id="viz-auditflow"></div>
<div class="viz" id="viz-dbalerts"></div>
<div class="tip"><b>Exam tip.</b> If both server and database auditing are on, events are audited <b>twice</b>. Microsoft recommends server-level auditing only, unless one database needs a different destination or event set.</div>`},
{id:"nsg",num:"2.6",title:"Network security groups and application security groups",html:`
<p>A <b>network security group</b> (NSG) is a stateful layer 3–4 filter attached to a <b>subnet</b>, a <b>network interface</b> or both.</p>
<h3>How rules work</h3>
<ul><li>Each rule has a <b>priority</b> (100–4096; lower numbers win), source, source port, destination, destination port, protocol and action (Allow or Deny).</li>
<li>Processing stops at the first match. Return traffic is allowed automatically (stateful).</li>
<li><b>Default rules</b> (65000+) allow VNet-to-VNet traffic and Azure Load Balancer probes, allow all outbound to the internet, and deny everything else inbound.</li>
<li>Inbound: the <b>subnet NSG</b> is evaluated first, then the <b>NIC NSG</b>. Outbound: NIC first, then subnet. Traffic must be allowed by both.</li>
<li><b>Service tags</b> (Internet, VirtualNetwork, AzureLoadBalancer, Storage.EastUS, AzureCloud, Sql) stand in for Microsoft-maintained IP ranges.</li></ul>
<h3>Application security groups</h3>
<p>An <b>ASG</b> groups NICs by role (asg-web, asg-app, asg-db). Rules then say "allow asg-web to asg-app on 8080" instead of listing IP addresses. All NICs in an ASG must be in the same VNet.</p>
<h3>Checking what's really applied</h3>
<p><b>Effective security rules</b> on a NIC show the merged result of the subnet and NIC NSGs (and Virtual Network Manager admin rules). <b>IP flow verify</b> tells you which rule allows or denies a specific packet.</p>
<div class="viz" id="viz-nsgeval"></div>
<div class="viz" id="viz-asg"></div>
<div class="tip"><b>Exam tip.</b> A rule at priority 200 that allows 3389 from the internet beats a rule at 300 that denies it. Watch the numbers, not the order they're listed in.</div>`},
{id:"avnm",num:"2.7",title:"Virtual Network Manager and Virtual WAN security",html:`
<h3>Azure Virtual Network Manager (AVNM)</h3>
<p>AVNM manages connectivity and security for many VNets across subscriptions from one place.</p>
<ul><li><b>Network groups</b>: static members or dynamic membership through Azure Policy (for example, every VNet tagged env=prod).</li>
<li><b>Security admin rules</b>: organization-wide rules applied to network groups and evaluated <b>before</b> NSGs. Actions are <b>Allow</b> (then NSGs still evaluate), <b>Deny</b> (dropped, NSGs can't override) and <b>Always allow</b> (allowed, NSGs skipped).</li>
<li>Use them to block high-risk ports (such as 3389 and 22 from the internet) everywhere, or to guarantee monitoring traffic always gets through.</li>
<li>Configurations take effect only after you <b>deploy</b> them to target regions.</li>
<li>Connectivity configurations build hub-and-spoke or mesh topologies; <b>routing configurations</b> push UDRs at scale.</li></ul>
<h3>Securing Azure Virtual WAN</h3>
<ul><li>A <b>secured virtual hub</b> is a Virtual WAN hub with <b>Azure Firewall</b> (or a supported third-party security provider) deployed in it, managed by <b>Azure Firewall Manager</b>.</li>
<li><b>Routing intent</b> sends internet traffic, private traffic (branch-to-branch, VNet-to-VNet) or both through the hub firewall.</li>
<li>Firewall policies are created in Firewall Manager and can be hierarchical (a parent policy for the org, child policies per region).</li>
<li>Virtual WAN Standard supports site-to-site VPN, point-to-site VPN, ExpressRoute and any-to-any transit.</li></ul>
<div class="viz" id="viz-avnm"></div>
<div class="viz" id="viz-vwan"></div>
<div class="tip"><b>Exam tip.</b> "Developers own their NSGs, but the security team must block RDP from the internet across 300 VNets, and devs must not be able to override it" is an AVNM <b>security admin rule</b> with <b>Deny</b>.</div>`},
{id:"vpn",num:"2.8",title:"VPN connections and Microsoft Entra Private Access",html:`
<h3>Site-to-site and point-to-site VPN security</h3>
<ul><li><b>Site-to-site (S2S)</b>: IPsec/IKE tunnels between an on-premises VPN device and an Azure <b>VPN gateway</b> (route-based). Use IKEv2, and a strong pre-shared key or certificates.</li>
<li><b>Custom IPsec/IKE policy</b>: choose the encryption (GCMAES256), integrity, DH group and PFS group instead of defaults, to meet compliance requirements.</li>
<li><b>Point-to-site (P2S)</b>: individual clients connect to the gateway with <b>OpenVPN</b>, <b>IKEv2</b> or <b>SSTP</b>.</li>
<li>P2S authentication: <b>Azure certificate</b>, <b>RADIUS</b>, or <b>Microsoft Entra ID</b> (OpenVPN only). Entra ID lets you apply <b>Conditional Access and MFA</b> to VPN sign-ins.</li>
<li>Use <b>generation 2</b>, zone-redundant gateway SKUs (VpnGw2AZ and up), and consider <b>active-active</b> for resilience.</li>
<li><b>ExpressRoute</b> is private but <b>not encrypted</b> by default. Add <b>MACsec</b> (ExpressRoute Direct, layer 2) or an <b>IPsec VPN over ExpressRoute private peering</b> for end-to-end encryption.</li></ul>
<h3>Microsoft Entra Private Access</h3>
<p>Part of Microsoft's <b>Global Secure Access</b> security service edge, Entra Private Access is a <b>zero trust network access</b> (ZTNA) replacement for traditional VPN.</p>
<ul><li>Users run the <b>Global Secure Access client</b>. Traffic to private apps travels through Microsoft's edge to a <b>private network connector</b> installed near the app, which makes only outbound connections.</li>
<li>Define <b>Quick Access</b> (broad replacement for VPN) or per-app <b>enterprise applications</b> by FQDN, IP and port.</li>
<li>Apply <b>Conditional Access</b> (MFA, compliant device, risk) to each private app, and assign only the users who need it.</li>
<li>Users reach only the apps they're allowed to, not the whole network: no lateral movement.</li></ul>
<div class="viz" id="viz-vpnsort"></div>
<div class="viz" id="viz-epa"></div>
<div class="tip"><b>Exam tip.</b> P2S with Microsoft Entra authentication requires the <b>OpenVPN</b> tunnel type and the Azure VPN Client. "MFA for VPN users" points to Entra auth plus Conditional Access.</div>`},
{id:"pe",num:"2.9",title:"Private endpoints, Private Link and service endpoints",html:`
<p>PaaS services such as Storage, SQL and Key Vault have public endpoints by default. Three features bring them closer to your network.</p>
<h3>Service endpoints</h3>
<ul><li>Enabled per <b>subnet</b> per service (Microsoft.Storage, Microsoft.Sql, Microsoft.KeyVault).</li>
<li>Traffic leaves the subnet over the Azure backbone with the subnet's identity, so the service's firewall can allow "only this subnet".</li>
<li>The service still uses its <b>public IP</b>. Doesn't work from on-premises. Free. <b>Service endpoint policies</b> can limit Storage traffic to specific accounts.</li></ul>
<h3>Private endpoints</h3>
<ul><li>A <b>network interface with a private IP</b> in your subnet, connected to one specific resource (one storage account's blob sub-resource, one SQL server).</li>
<li>Works from peered VNets and on-premises over VPN or ExpressRoute. Prevents <b>data exfiltration</b> because it maps to one resource only.</li>
<li>Needs <b>DNS</b>: a private DNS zone such as <b>privatelink.blob.core.windows.net</b> linked to the VNet, so the public name resolves to the private IP. On-premises needs a conditional forwarder to an Azure DNS Private Resolver inbound endpoint.</li>
<li>After it works, <b>disable public network access</b> on the resource.</li>
<li>Private endpoints bypass NSGs and UDRs unless you enable <b>network policies</b> for private endpoints on the subnet.</li></ul>
<h3>Private Link service</h3>
<p>Your own service behind a <b>Standard Load Balancer</b> exposed privately to other VNets or tenants. Consumers create a private endpoint to it, and you approve the connection. Traffic is NATed, so overlapping address spaces work.</p>
<h3>App Service and Functions networking</h3>
<p>Inbound: <b>private endpoints</b> and <b>access restrictions</b>. Outbound: <b>VNet integration</b> lets the app reach private resources. An <b>App Service Environment</b> runs fully inside your VNet.</p>
<div class="viz" id="viz-pechoose"></div>
<div class="viz" id="viz-dns"></div>
<div class="tip"><b>Exam tip.</b> Private endpoint created but the app still connects to the public IP? The DNS isn't resolving to the private address. Check the private DNS zone and its VNet link.</div>`},
{id:"afw",num:"2.10",title:"Azure Firewall and Network Watcher diagnostics",html:`
<h3>Azure Firewall</h3>
<p>A managed, stateful, highly available firewall usually placed in a <b>hub</b> VNet (subnet named <b>AzureFirewallSubnet</b>), with <b>UDRs</b> sending spoke traffic (0.0.0.0/0) to its private IP.</p>
<ul><li><b>SKUs</b>: <b>Basic</b> (small businesses, up to 250 Mbps), <b>Standard</b> (threat intelligence, FQDN filtering, DNS proxy), <b>Premium</b> (adds <b>TLS inspection</b>, signature-based <b>IDPS</b>, <b>URL filtering</b> and <b>web categories</b>).</li>
<li><b>Rule types</b>, processed in this order: <b>DNAT</b> rules (inbound port forwarding), then <b>network</b> rules (IP, port, protocol), then <b>application</b> rules (FQDNs, FQDN tags, HTTP/S). Within each, rule collection groups and collections are processed by priority.</li>
<li><b>Firewall policy</b>: the recommended way to manage rules, reusable across firewalls, with <b>parent and child</b> policies and settings like threat intelligence mode (Alert, or Alert and deny) and DNS proxy.</li>
<li><b>Forced tunneling</b> sends internet-bound traffic on to an on-premises device (needs a management subnet).</li>
<li>Logs: structured logs to Log Analytics, and the <b>Policy Analytics</b> and workbook views.</li></ul>
<h3>Network Watcher diagnostics</h3>
<ul><li><b>IP flow verify</b>: will a packet (5-tuple) to or from a VM be allowed or denied, and by which NSG rule?</li>
<li><b>Effective security rules</b>: every rule applied to a NIC after merging subnet and NIC NSGs.</li>
<li><b>Next hop</b>: where a VM's traffic goes (internet, virtual appliance, gateway) and which route table caused it.</li>
<li><b>Connection troubleshoot</b>: tests reachability end to end and reports where it fails.</li>
<li><b>VNet flow logs</b> (successor to NSG flow logs): records allowed and denied flows to storage, optionally with <b>traffic analytics</b> in Log Analytics.</li>
<li><b>Packet capture</b>: capture traffic on a VM for deep analysis.</li></ul>
<div class="viz" id="viz-fwtrace"></div>
<div class="viz" id="viz-nwtools"></div>
<div class="tip"><b>Exam tip.</b> "Outbound HTTPS must be decrypted and inspected for malware" is Azure Firewall <b>Premium</b> with TLS inspection (and an intermediate CA certificate in Key Vault).</div>`}

function vizSas(){

  function risk(){let r=0;const n=[];if(type!=="ud"){r+=2;n.push("signed with an account key")}if(perm.has("w")||perm.has("d")){r+=2;n.push("write or delete rights")}if(exp>24){r+=exp>24*7?3:1;n.push("long expiry")}if(!ip){r+=1;n.push("any IP")}if(!https){r+=2;n.push("HTTP allowed")}return [r,n]}

    const st=new Date(),en=new Date(st.getTime()+exp*36e5);

    el.innerHTML=`<div class="viz-title">SAS token builder: share one invoice with a partner</div>
    <div class="sel-row"><span>Signed by</span><div class="seg-row">${Object.keys(T).map(k=>`<button class="chip" data-t="${k}" aria-pressed="${k===type}">${T[k]}</button>`).join("")}</div></div>

    <div class="caption" aria-live="polite">Risk: <b class="${lvl==="Low"?"status-good":"status-bad"}">${lvl}</b>. ${n.length?"Concerns: "+n.join(", ")+".":"Short-lived, read-only, IP-restricted, HTTPS, and tied to an Entra identity. This is the gold standard."}${type!=="ud"?" To revoke a key-signed SAS you'd need a stored access policy or a key rotation.":" Revoke by revoking the user delegation key."}</div>
    <div class="rv-prog s-small">${seen.size} of 3 risk levels seen</div>`;
    if(seen.size===3)award("viz:sas",30,"Built SAS tokens at every risk level")}

    if(d.t)type=d.t;if(d.p){perm.has(d.p)?perm.delete(d.p):perm.add(d.p);if(!perm.size)perm.add("r")}if(d.e)exp=+d.e;if(d.i)ip=!ip;if(d.h)https=!https;draw()});draw();
}

    <div class="seg-row">${F.map((y,i)=>`<button class="chip" data-f="${i}" aria-pressed="${i===f}">${y[0]}</button>`).join("")}</div>

    <div class="rv-prog s-small">${seen.size} of ${F.length} flows traced</div>`;

  el.addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(b){f=+b.dataset.f;draw()}});draw();

<script>
/* ================= Module 3: Secure compute (SC-500 Domain 3, 20–25%) ================= */
(function(){
const LESSONS=[
{id:"aidata",num:"3.1",title:"AI data risk: SharePoint oversharing and Purview DSPM for AI",html:`
<p>Microsoft 365 Copilot and other AI assistants answer with whatever the signed-in user can access. If a site is shared with "Everyone except external users", Copilot will happily summarize it for everyone. Securing AI starts with securing the data it can reach.</p>
<h3>Finding overexposed SharePoint data</h3>
<ul><li><b>Data access governance reports</b> (SharePoint Advanced Management) list sites shared with large groups such as "Everyone except external users", sites with many sharing links, and sites with sensitive content.</li>
<li><b>Site access reviews</b> ask site owners to confirm who should have access.</li>
<li><b>Restricted content discovery</b> hides a site from Copilot and organization-wide search without changing permissions. <b>Restricted access control</b> limits a site to members of specific groups.</li>
<li><b>Sensitivity labels</b> and <b>oversharing assessments</b> in Purview highlight unlabeled sensitive files.</li></ul>
<h3>Microsoft Purview Data Security Posture Management (DSPM) for AI</h3>
<ul><li>Discovers AI use across your organization: Microsoft 365 Copilot, Copilot Studio agents, Microsoft Foundry apps and <b>third-party AI apps</b> in the browser (with the Purview browser extension and device onboarding).</li>
<li>Shows <b>reports</b> on sensitive data in prompts and responses, risky AI usage and unethical behavior.</li>
<li>Runs <b>data risk assessments</b> on the top sites Copilot uses, to find oversharing.</li>
<li>Offers <b>one-click policies</b>: DLP to stop sensitive data being pasted into AI sites, insider risk policies for risky AI usage, and collection policies that capture prompts and responses for audit and eDiscovery.</li></ul>
<div class="viz" id="viz-overshare"></div>
<div class="viz" id="viz-dspm"></div>
<div class="tip"><b>Exam tip.</b> "Hide this site from Copilot without changing its permissions" is <b>restricted content discovery</b>. "Find which AI apps users paste sensitive data into" is <b>DSPM for AI</b>.</div>`},
{id:"agents",num:"3.2",title:"Securing Copilot Studio and Microsoft 365 agents",html:`
<p>Makers across the business can now build <b>agents</b> in Copilot Studio that call tools, read knowledge sources and take actions. Each one is a new attack surface.</p>
<h3>Real-time protection for Copilot Studio agents</h3>
<ul><li>Built-in protection blocks <b>user prompt injection</b> (jailbreaks) and <b>cross-prompt injection</b> (malicious instructions hidden in documents or emails the agent reads).</li>
<li><b>Microsoft Defender</b> (through Defender for Cloud Apps and the AI agent protection integration) can inspect the agent's planned tool calls <b>at runtime</b> and block suspicious actions before they run. Connect it from the Power Platform admin center's threat detection settings and Defender's Copilot Studio connector.</li>
<li>Alerts and incidents for blocked agent actions appear in the Microsoft Defender portal.</li>
<li>Agent <b>authentication</b> settings: require users to sign in (Authenticate with Microsoft or manual Entra ID), and avoid "No authentication" for agents with access to internal data.</li>
<li><b>Data policies</b> (DLP for Power Platform) control which connectors agents may use and block risky ones such as HTTP or unmanaged channels.</li></ul>
<h3>Managing agents in the Microsoft 365 admin center</h3>
<ul><li>The <b>Agents</b> page (Copilot &gt; Agents, the agent registry) inventories every agent available in the tenant: Microsoft, partner-built and custom.</li>
<li>Admins can <b>allow, block, deploy or remove</b> agents for all users or specific groups, review the permissions and data each agent uses, and assign owners.</li>
<li>Settings control who can create and share agents and whether users can install agents from the store.</li></ul>
<div class="viz" id="viz-agentflow"></div>
<div class="viz" id="viz-agentq"></div>
<div class="tip"><b>Exam tip.</b> Cross-prompt injection (XPIA) hides instructions in content the agent reads, not in the user's prompt. Real-time protection and Defender runtime inspection are your controls.</div>`},
{id:"agentid",num:"3.3",title:"Microsoft Entra Agent ID",html:`
<p>AI agents act on their own, often around the clock, and need access to data and APIs. <b>Microsoft Entra Agent ID</b> gives each agent a first-class identity in Entra ID so you can see, govern and protect it like any other identity.</p>
<h3>What Agent ID provides</h3>
<ul><li><b>Agent identities</b>: agents built in Copilot Studio, Microsoft Foundry and supported third-party platforms get an Entra identity automatically, listed under <b>Agent ID</b> in the Entra admin center with a sponsor (an accountable human owner).</li>
<li><b>Agent identity blueprints</b> define the template, permissions and credentials for a family of agents.</li>
<li><b>Access management</b>: grant agents permissions and role assignments with least privilege, give them access packages through entitlement management, and run access reviews. Assign <b>sponsors</b> so every agent has a responsible person.</li>
<li><b>Conditional Access for agents</b>: target agent identities in Conditional Access to block agents from risky conditions, restrict which resources they reach, or block agents flagged as risky by ID Protection.</li>
<li><b>ID Protection for agents</b>: detects anomalous agent behavior and raises agent risk.</li>
<li>Sign-in and audit logs show what each agent did.</li></ul>
<h3>Blast radius analysis in Defender XDR</h3>
<p>In the <b>Microsoft Defender portal</b>, exposure management's <b>attack paths</b> and the identity's <b>blast radius</b> view show what an agent could reach if compromised: which data, apps and other identities sit downstream of its permissions. Use it to strip unneeded access before an attacker finds it.</p>
<div class="viz" id="viz-agentctl"></div>
<div class="viz" id="viz-blast"></div>
<div class="tip"><b>Exam tip.</b> Treat agents like workload identities with extra governance: a sponsor, least privilege, Conditional Access and access reviews. "Who is accountable for this agent?" is its <b>sponsor</b>.</div>`},
{id:"foundry",num:"3.4",title:"Securing AI apps: Foundry guardrails, AI Gateway and Defender for AI",html:`
<h3>Guardrails in Microsoft Foundry</h3>
<p>Foundry (formerly Azure AI Foundry) lets you attach <b>guardrails</b> (content filters and safety controls, powered by Azure AI Content Safety) to model deployments and agents.</p>
<ul><li><b>Content filters</b> for hate, sexual, violence and self-harm, each with a severity threshold, on both prompts and completions.</li>
<li><b>Prompt Shields</b>: detect <b>jailbreak</b> attempts in user prompts and <b>indirect prompt injection</b> in documents and tool results.</li>
<li><b>Protected material</b> detection for copyrighted text and code, <b>groundedness detection</b> for answers not supported by the sources, and custom <b>blocklists</b>.</li>
<li>For agents, guardrails can also apply to <b>tool calls and tool responses</b>, and agents should use managed identities and least-privileged tools.</li></ul>
<h3>AI Gateway in Azure API Management</h3>
<p>Put API Management in front of Foundry and Azure OpenAI endpoints:</p>
<ul><li><b>Managed identity</b> authentication from APIM to the model, so apps never hold model API keys.</li>
<li><b>Token rate limiting</b> (azure-openai-token-limit / llm-token-limit) per app or subscription key, and <b>token metrics</b> for chargeback.</li>
<li><b>Content safety policy</b> (llm-content-safety) to screen prompts, <b>semantic caching</b>, load balancing and circuit breakers across back ends.</li></ul>
<h3>Defender for AI Services and the Data and AI security dashboard</h3>
<ul><li><b>Defender for AI Services</b> is a workload protection plan in Defender for Cloud. It raises <b>threat alerts</b> for jailbreak attempts, credential theft, data leakage, wallet abuse and suspicious access to AI endpoints, using Prompt Shields signals and Microsoft threat intelligence. <b>User prompt evidence</b> can be enabled to include the suspicious prompt in alerts.</li>
<li><b>AI security posture management</b> (in Defender CSPM) builds an AI bill of materials and shows attack paths to AI workloads.</li>
<li>The <b>Data and AI security dashboard</b> in Defender for Cloud brings together sensitive data stores, AI resources, their exposure and recommendations in one view.</li></ul>
<div class="viz" id="viz-guard"></div>
<div class="viz" id="viz-aisort"></div>
<div class="tip"><b>Exam tip.</b> "Stop one app from using up the whole model quota" is a <b>token limit policy</b> in the APIM AI Gateway. "Alert on jailbreak attempts against our Azure OpenAI deployment" is <b>Defender for AI Services</b>.</div>`},
{id:"vm",num:"3.5",title:"VM security features and disk encryption",html:`
<h3>Security type and Trusted Launch</h3>
<ul><li><b>Standard</b>: no extra protections. <b>Trusted Launch</b> (default for new Gen2 VMs): <b>Secure Boot</b> (only signed boot loaders and kernels), <b>vTPM</b> (a virtual TPM 2.0 for measured boot and keys) and <b>boot integrity monitoring</b> through the Guest Attestation extension and Defender for Cloud.</li>
<li><b>Confidential VMs</b> (AMD SEV-SNP, Intel TDX) encrypt memory with hardware keys so even the host can't read it, and support <b>confidential disk encryption</b> bound to the vTPM.</li></ul>
<h3>Disk encryption options</h3>
<ul><li><b>Server-side encryption</b> (SSE): all managed disks are encrypted at rest with platform-managed keys, or with <b>customer-managed keys</b> through a <b>disk encryption set</b> pointing to Key Vault.</li>
<li><b>Encryption at host</b>: extends encryption to temp disks and OS/data disk caches on the host, with PMK or CMK. Enable the feature on the subscription, then on the VM.</li>
<li><b>Azure Disk Encryption</b> (ADE): BitLocker (Windows) or DM-Crypt (Linux) inside the guest, keys in Key Vault. Scheduled for retirement in September 2028, so new deployments should use encryption at host instead.</li>
<li><b>Confidential disk encryption</b>: for confidential VMs, the OS disk is encrypted with keys bound to the VM's vTPM.</li></ul>
<h3>Azure Machine Configuration</h3>
<p>Formerly Guest Configuration, it audits and (with <b>ApplyAndAutoCorrect</b>) enforces settings <b>inside</b> the OS, such as password policies or installed software, through Azure Policy. It works on Azure VMs and Arc-enabled servers.</p>
<div class="viz" id="viz-diskenc"></div>
<div class="viz" id="viz-tl"></div>
<div class="tip"><b>Exam tip.</b> "Encrypt temp disks and caches too, with no guest agent" is <b>encryption at host</b>. "Protect data in use from the hypervisor" is a <b>confidential VM</b>.</div>`},
{id:"jit",num:"3.6",title:"Azure Bastion and just-in-time VM access",html:`
<h3>Azure Bastion</h3>
<p>Bastion gives RDP and SSH to VMs <b>through the Azure portal or native client</b> over TLS 443, so VMs need no public IP and management ports stay closed to the internet.</p>
<ul><li>Deployed into a subnet named <b>AzureBastionSubnet</b> (/26 or larger) in the VNet, and reaches peered VNets too.</li>
<li><b>SKUs</b>: <b>Developer</b> (free, shared, one connection, portal only), <b>Basic</b>, <b>Standard</b> (native client, host scaling, IP-based connection, shareable links, file transfer) and <b>Premium</b> (adds <b>session recording</b> and <b>private-only</b> deployment).</li>
<li>Combine with Entra ID sign-in for VMs and Conditional Access for the portal.</li></ul>
<h3>Just-in-time (JIT) VM access</h3>
<p>Part of <b>Defender for Servers Plan 2</b>. JIT keeps management ports <b>closed by default</b> and opens them only when someone requests access.</p>
<ul><li>Enabling JIT adds NSG (or Azure Firewall) deny rules for the selected ports (22, 3389, 5985, 5986 by default).</li>
<li>A user with permission (<code>Microsoft.Security/<wbr>locations/<wbr>jitNetworkAccessPolicies/<wbr>initiate/<wbr>action</code>) requests access for their IP for a limited time (up to the configured maximum, default 3 hours).</li>
<li>JIT inserts a temporary allow rule with higher priority, then removes it when the time is up.</li>
<li>Every request is recorded in the Activity log.</li>
<li>Enforce it with the recommendation "Management ports of virtual machines should be protected with just-in-time network access control".</li></ul>
<div class="viz" id="viz-jit"></div>
<div class="viz" id="viz-bastion"></div>
<div class="tip"><b>Exam tip.</b> JIT needs <b>Defender for Servers Plan 2</b> and works by editing NSG or Azure Firewall rules. Bastion needs no public IP on the VM at all. They work well together.</div>`},
{id:"dfs",num:"3.7",title:"Defender for Servers, Azure Arc and vulnerability management",html:`
<h3>Defender for Servers plans</h3>
<ul><li><b>Plan 1</b>: Microsoft Defender for Endpoint integration (EDR, next-gen antivirus), Defender Vulnerability Management core features, and automatic onboarding.</li>
<li><b>Plan 2</b>: everything in Plan 1, plus <b>agentless scanning</b>, <b>JIT VM access</b>, <b>file integrity monitoring</b>, Defender Vulnerability Management premium, OS configuration assessment, 500 MB/day free data ingestion to Log Analytics, and regulatory compliance.</li></ul>
<h3>Agentless scanning</h3>
<p>Defender for Cloud takes a <b>snapshot of the VM's disks</b>, scans it out of band for vulnerabilities, software inventory, secrets and malware, then deletes the snapshot. No agent, no performance impact. It also works for AWS and GCP machines through connectors. You can exclude machines by tag.</p>
<h3>Vulnerability scanning and EDR</h3>
<ul><li><b>Microsoft Defender Vulnerability Management</b> (MDVM) is the built-in scanner: it finds CVEs and misconfigurations through the Defender for Endpoint sensor or agentless scanning.</li>
<li><b>Endpoint detection and response</b> comes from Defender for Endpoint. Turn on the <b>EDR solution</b> setting so Defender for Cloud deploys and checks it, and fix the recommendations "EDR solution should be installed" and "EDR configuration issues should be resolved".</li></ul>
<h3>Hybrid and multicloud servers</h3>
<ul><li><b>Azure Arc-enabled servers</b> project on-premises, AWS and GCP machines into Azure with the Connected Machine agent, so you can apply Azure Policy, Machine Configuration, Defender for Servers, Update Manager and RBAC to them.</li>
<li>For <b>AWS</b> and <b>GCP</b>, Defender for Cloud's multicloud connectors can auto-provision Arc on EC2 instances and Compute Engine VMs.</li></ul>
<div class="viz" id="viz-plans"></div>
<div class="viz" id="viz-agentless"></div>
<div class="tip"><b>Exam tip.</b> Agentless scanning, JIT and file integrity monitoring are <b>Plan 2</b>. If the scenario says "we only want EDR on our servers, at the lowest cost," that's Plan 1.</div>`},
{id:"cont",num:"3.8",title:"Containers: Defender for Containers, AKS, ACR, ACI and Container Apps",html:`
<h3>Defender for Containers</h3>
<ul><li><b>Posture</b>: agentless discovery of clusters, Kubernetes misconfigurations and <b>attack paths</b>.</li>
<li><b>Vulnerability assessment</b> of images in ACR (and ECR, GAR) and of running containers, powered by MDVM.</li>
<li><b>Runtime protection</b> with the Defender sensor (DaemonSet) and Kubernetes audit logs: alerts for crypto miners, privileged containers, exposed dashboards and suspicious processes.</li>
<li><b>Azure Policy for Kubernetes</b> (Gatekeeper) enforces admission rules such as "no privileged containers" or "only images from approved registries". <b>Gated deployment</b> can block images with critical vulnerabilities.</li></ul>
<h3>AKS security controls</h3>
<ul><li><b>Authentication</b>: Microsoft Entra ID integration with <b>Azure RBAC for Kubernetes authorization</b> or Kubernetes RBAC bound to Entra groups. <b>Disable local accounts</b> so the admin kubeconfig can't bypass Entra.</li>
<li><b>Workload identity</b>: pods get Entra tokens through federated credentials, no secrets.</li>
<li><b>Network isolation</b>: <b>private cluster</b> (API server on a private IP) or <b>authorized IP ranges</b>, <b>network policies</b> (Azure, Calico or Cilium) between pods, and egress through Azure Firewall with a UDR.</li>
<li><b>Secrets</b>: Key Vault provider for Secrets Store CSI Driver. <b>Node images</b> and Kubernetes versions kept current with auto-upgrade channels.</li></ul>
<h3>Azure Container Registry</h3>
<ul><li>Use Entra identities and roles: <b>AcrPull</b> (pull), <b>AcrPush</b> (push and pull), <b>AcrDelete</b>, <b>AcrImageSigner</b>. Attach ACR to AKS so the kubelet identity gets AcrPull.</li>
<li><b>Disable the admin user</b>, use repository-scoped tokens only when needed, add <b>private endpoints</b> (Premium SKU) and disable public access.</li>
<li>Sign images (Notation) and quarantine new images until scanned.</li></ul>
<h3>Azure Container Instances and Azure Container Apps</h3>
<ul><li>Deploy into a <b>VNet</b> (ACI subnet delegation, Container Apps workload profiles environment with internal ingress), use <b>managed identities</b> to pull images and read Key Vault secrets, and store secrets as references, not plaintext environment variables.</li>
<li>Container Apps supports <b>built-in authentication</b> (Easy Auth), IP restrictions on ingress, and mTLS between apps. Send console and system logs to Log Analytics.</li></ul>
<div class="viz" id="viz-aks"></div>
<div class="viz" id="viz-acr"></div>
<div class="tip"><b>Exam tip.</b> "Ensure nobody can use the cluster admin certificate to bypass Entra ID" means <b>disable local accounts</b>. "AKS must pull from ACR without credentials" means attach ACR to give the kubelet identity <b>AcrPull</b>.</div>`},
{id:"apps",num:"3.9",title:"App Service, Functions and Logic Apps security",html:`
<h3>Azure App Service</h3>
<ul><li><b>HTTPS Only</b>, <b>minimum TLS 1.2</b> (1.3 supported), end-to-end TLS, and managed or Key Vault certificates for custom domains.</li>
<li><b>Built-in authentication</b> (Easy Auth) with Microsoft Entra ID or other providers, so unauthenticated requests never reach your code.</li>
<li><b>Managed identity</b> to reach Key Vault, SQL and Storage. Use <b>Key Vault references</b> in app settings (<code>@Microsoft.KeyVault(SecretUri=...)</code>).</li>
<li>Network: <b>access restrictions</b> (allow or deny by IP, service tag such as AzureFrontDoor.Backend with X-Azure-FDID header filter, or subnet), <b>private endpoints</b> for inbound, <b>VNet integration</b> for outbound. Separate rules for the <b>SCM (Kudu) site</b>.</li>
<li>Disable <b>FTP and basic auth</b> publishing credentials, turn off remote debugging, and enable <b>Defender for App Service</b>.</li></ul>
<h3>Azure Functions</h3>
<ul><li><b>Authorization levels</b> for HTTP triggers: anonymous, <b>function</b> (function key) and <b>admin</b> (master key). Keys are shared secrets; prefer Easy Auth or APIM in front for real identity.</li>
<li>Use managed identities for <b>identity-based connections</b> to triggers and bindings (storage, Service Bus, Event Hubs), and identity-based access to the host storage account.</li>
<li>Network access: Flex Consumption, Premium and Dedicated plans support VNet integration and private endpoints; inbound access restrictions work as in App Service.</li></ul>
<h3>Azure Logic Apps</h3>
<ul><li>Restrict who can call request triggers: <b>SAS</b> in the trigger URL by default, add <b>OAuth with Entra ID</b> authorization policies, and <b>IP restrictions</b> for triggers and for viewing run history.</li>
<li><b>Secure inputs and outputs</b> to hide sensitive data from run history, and <b>managed identities</b> for connectors and HTTP actions.</li>
<li>Logic Apps Standard runs on the App Service platform, so it gains VNet integration and private endpoints.</li></ul>
<div class="viz" id="viz-appsec"></div>
<div class="viz" id="viz-funcq"></div>
<div class="tip"><b>Exam tip.</b> "Only traffic through our Front Door should reach the web app" means an access restriction with the <b>AzureFrontDoor.Backend</b> service tag <b>and</b> an X-Azure-FDID header check for your Front Door's ID.</div>`},
{id:"waf",num:"3.10",title:"Web Application Firewall and API Management protection",html:`
<h3>Azure Web Application Firewall</h3>
<p>WAF protects HTTP(S) apps from common exploits such as SQL injection, cross-site scripting and bad bots. It runs on:</p>
<ul><li><b>Azure Front Door</b> (global, at the edge, with CDN): best for global apps, and blocks attacks before they reach your region.</li>
<li><b>Azure Application Gateway</b> (regional, layer 7 load balancer in your VNet): best for regional apps and internal apps.</li>
<li><b>Azure Container Apps / Application Gateway for Containers</b> integration for container workloads.</li></ul>
<h3>WAF policy settings</h3>
<ul><li><b>Managed rule sets</b>: the Microsoft <b>Default Rule Set</b> (DRS 2.x), or OWASP CRS 3.x on Application Gateway, plus the <b>Bot Manager</b> rule set.</li>
<li><b>Modes</b>: <b>Detection</b> logs matches without blocking (use first to tune), <b>Prevention</b> blocks them.</li>
<li><b>Anomaly scoring</b>: each matched rule adds to a score, and the request is blocked when it crosses the threshold.</li>
<li><b>Custom rules</b> are evaluated <b>before</b> managed rules: geo-filtering, IP allow and block lists, <b>rate limiting</b>, and header or query string matches.</li>
<li><b>Exclusions</b> and per-rule overrides fix false positives without disabling a whole rule set.</li></ul>
<h3>Protecting back-end APIs with API Management</h3>
<ul><li><b>validate-jwt</b> (or validate-azure-ad-token) policy to require a valid Entra token with the right audience and claims.</li>
<li><b>rate-limit-by-key</b> and <b>quota-by-key</b> to throttle abuse, <b>ip-filter</b> to restrict callers.</li>
<li><b>Client certificate</b> (mTLS) validation, and <b>authentication-managed-identity</b> so APIM calls the back end with its own identity.</li>
<li>Lock the back end so only APIM can reach it (private endpoint, VNet injection, or an access restriction), put WAF (Front Door or Application Gateway) in front of APIM, and enable <b>Defender for APIs</b>.</li></ul>
<div class="viz" id="viz-wafsim"></div>
<div class="viz" id="viz-apimpol"></div>
<div class="tip"><b>Exam tip.</b> New WAF? Start in <b>Detection</b> mode, review logs, add exclusions, then switch to <b>Prevention</b>. And custom rules always run before managed rules.</div>`}
];
